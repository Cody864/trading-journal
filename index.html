  // Bereits verwendete Confluence-Tags (für Mehrfachauswahl im Formular & Forward Test)
  const existingConfluences = useMemo(() => {
    const set = new Set();
    trades.forEach((t) => {
      (Array.isArray(t.confluences) ? t.confluences : []).forEach((c) => set.add(c));
    });
    return Array.from(set).sort();
  }, [trades]);

  // Confluence-Vorschläge im Formular: die vordefinierten Fib-/Zonen-Tags zuerst,
  // danach zusätzlich alle bereits manuell vergebenen Tags aus der Historie.
  const confluenceOptions = useMemo(() => {
    const combined = [...DEFAULT_CONFLUENCES];
    existingConfluences.forEach((c) => { if (!combined.includes(c)) combined.push(c); });
    return combined;
  }, [existingConfluences]);


  // Realisierter RR-Wert eines Trades (Win = geplantes RR, Loss = immer -1, BE = 0)
  const realizedRRForTrade = useCallback((t) => {
    if (t.result === "be") return 0;
    if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
    if (t.result === "loss") return -1;
    if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
    return null;
  }, []);

  // Realisierte Punkte eines Trades (Win = TP-Punkte, Loss = -SL-Punkte, BE = 0)
  const realizedPointsForTrade = useCallback((t) => {
    if (t.result === "win") return t.take_profit !== null && t.take_profit !== undefined ? Number(t.take_profit) : null;
    if (t.result === "loss") return t.stop_loss !== null && t.stop_loss !== undefined ? -Math.abs(Number(t.stop_loss)) : null;
    if (t.result === "be") return 0;
    return null;
  }, []);

  // ── Setup-Auswertung ──
  // Gruppiert nach dem (einzelnen) Setup-Feld.
  // Respektiert ebenfalls die Symbol-/Ergebnis-Filter aus der Filterleiste.
  const setupStats = useMemo(() => {
    const map = new Map();
    filteredTrades.forEach((t) => {
      if (!t.setup) return;
      if (!map.has(t.setup)) {
        map.set(t.setup, { setup: t.setup, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0, pnlSum: 0 });
      }
      const e = map.get(t.setup);
      e.count += 1;
      e.pnlSum += Number(t.pnl || 0);
      if (t.result === "win") e.wins += 1;
      else if (t.result === "loss") e.losses += 1;
      else if (t.result === "be") e.bes += 1;
      const rr = realizedRRForTrade(t);
      if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
    });
    return Array.from(map.values())
      .map((e) => {
        const decided = e.wins + e.losses;
        return { ...e, winrate: decided ? (e.wins / decided) * 100 : 0, avgRR: e.rrCount ? e.rrSum / e.rrCount : 0 };
      })
      .sort((a, b) => b.count - a.count);
  }, [filteredTrades, realizedRRForTrade]);
  const maxSetupCount = Math.max(1, ...setupStats.map((s) => s.count));

  // ── Plan-Analyse: Trades "mit Plan" vs. "ohne Plan" (respektiert die Filter der Filterleiste) ──
  const planStats = useMemo(() => {
    const mk = () => ({ count: 0, wins: 0, losses: 0, rrSum: 0, rrCount: 0, pnl: 0, grossProfit: 0, grossLoss: 0, decidedPnl: 0 });
    const yes = mk();
    const no = mk();
    let unknown = 0;
    filteredTrades.forEach((t) => {
      const g = t.plan_followed === true ? yes : t.plan_followed === false ? no : null;
      if (!g) { unknown += 1; return; }
      const pnl = Number(t.pnl || 0);
      g.count += 1;
      g.pnl += pnl;
      if (t.result === "win") { g.wins += 1; g.grossProfit += pnl; g.decidedPnl += pnl; }
      else if (t.result === "loss") { g.losses += 1; g.grossLoss += Math.abs(pnl); g.decidedPnl += pnl; }
      const rr = realizedRRForTrade(t);
      if (rr !== null && !Number.isNaN(rr)) { g.rrSum += rr; g.rrCount += 1; }
    });
    const fin = (g) => {
      const decided = g.wins + g.losses;
      return {
        ...g,
        winrate: decided ? (g.wins / decided) * 100 : 0,
        avgRR: g.rrCount ? g.rrSum / g.rrCount : 0,
        expectancy: decided ? g.decidedPnl / decided : 0,
        profitFactor: g.grossLoss > 0 ? g.grossProfit / g.grossLoss : g.grossProfit > 0 ? Infinity : 0,
      };
    };
    return { yes: fin(yes), no: fin(no), unknown, withInfo: yes.count + no.count };
  }, [filteredTrades, realizedRRForTrade]);

  // ── Top Confluence-Kombinationen ──
  // Berechnet für jede 2er- und 3er-Kombination von Confluences, die in mindestens
  // MIN_COMBO_SAMPLE Trades gemeinsam vorkamen, Winrate und Ø RR — auf Basis der
  // KOMPLETTEN Historie (nicht gefiltert), damit z. B. ein blind genommener Einzel-Trigger
  // (nur 1 von mehreren Confluences) das Ranking der vollständigen Kombination nicht verwässert.
  const comboStats = useMemo(() => {
    const map = new Map();
    trades.forEach((t) => {
      const tags = Array.isArray(t.confluences) ? Array.from(new Set(t.confluences)).sort() : [];
      if (tags.length < 2) return;
      const combos = [];
      for (let i = 0; i < tags.length; i++) {
        for (let j = i + 1; j < tags.length; j++) {
          combos.push([tags[i], tags[j]]);
          for (let k = j + 1; k < tags.length; k++) {
            combos.push([tags[i], tags[j], tags[k]]);
          }
        }
      }
      combos.forEach((combo) => {
        const key = combo.join(" + ");
        if (!map.has(key)) {
          map.set(key, { key, size: combo.length, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0 });
        }
        const e = map.get(key);
        e.count += 1;
        if (t.result === "win") e.wins += 1;
        else if (t.result === "loss") e.losses += 1;
        else if (t.result === "be") e.bes += 1;
        const rr = realizedRRForTrade(t);
        if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
      });
    });
    return Array.from(map.values())
      .filter((e) => e.count >= MIN_COMBO_SAMPLE)
      .map((e) => {
        const decided = e.wins + e.losses;
        return { ...e, winrate: decided ? (e.wins / decided) * 100 : 0, avgRR: e.rrCount ? e.rrSum / e.rrCount : 0 };
      })
      .sort((a, b) => b.winrate - a.winrate || b.avgRR - a.avgRR)
      .slice(0, 8);
  }, [trades, realizedRRForTrade]);

  const dayDetailData = useMemo(() => {
    if (!dayDetail) return null;
    const dayTrades = filteredTrades.filter((t) => t.trade_date === dayDetail);
    const pnl = dayTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const isHistoric = fundedCut
      ? dayTrades.length > 0 && dayTrades.every((t) => !t.created_at || t.created_at < fundedCut)
      : false;
    return { iso: dayDetail, trades: dayTrades, pnl, isHistoric };
  }, [dayDetail, filteredTrades, fundedCut]);

  const loadTrades = useCallback(async () => {
    if (!isConfigured) {
      setLoading(false);
      return;
    }
    setError(null);
    try {
      const res = await fetch(`${REST_URL}?select=*&order=trade_date.asc`, {
        headers: sbHeaders,
      });
      if (!res.ok) throw new Error(T(`Supabase Fehler ${res.status}`, `Supabase error ${res.status}`));
      const data = await res.json();
      setTrades(data);
      try { localStorage.setItem(`journal_trades_cache__${ACTIVE_PROFILE ? ACTIVE_PROFILE.id : "x"}`, JSON.stringify(data.map(({ screenshot, ...rest }) => rest))); } catch {}
    } catch (e) {
      setError(e.message || T("Verbindung zu Supabase fehlgeschlagen", "Connection to Supabase failed"));
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    loadTrades();
  }, [loadTrades]);

  const stats = useMemo(() => {
    const sorted = [...filteredTrades].sort(
      (a, b) => new Date(a.trade_date) - new Date(b.trade_date) || a.id - b.id
    );

    // In der Funded Stage zaehlen nur Trades die NACH dem Aktivierungs-Zeitpunkt
    // gespeichert wurden. So werden Eval-Trades vom selben Tag korrekt ausgeschlossen.
    const fundedTrades = fundedCut
      ? sorted.filter((t) => t.created_at && t.created_at >= fundedCut)
      : sorted;
    const evalHistoricTrades = fundedCut
      ? sorted.filter((t) => !t.created_at || t.created_at < fundedCut)
      : [];

    // Alte-Strategie-Cutoff: fuer die Performance-Stats zaehlen nur Trades ab
    // STATS_CUTOFF_DATE. totalPnl/balance bleiben unten bewusst auf Basis ALLER
    // fundedTrades, damit sie (falls je referenziert) konsistent zum echten Konto bleiben.
    const statsTrades = fundedTrades.filter((t) => t.trade_date >= STATS_CUTOFF_DATE);

    const totalPnl = fundedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const balance = STARTING_BALANCE + totalPnl;

    const wins = statsTrades.filter((t) => t.result === "win" || (t.result !== "loss" && t.result !== "be" && Number(t.pnl) > 0));
    const losses = statsTrades.filter((t) => t.result === "loss" || (t.result !== "win" && t.result !== "be" && Number(t.pnl) < 0));
    const bes = statsTrades.filter((t) => t.result === "be");
    const decidedTrades = statsTrades.filter((t) => t.result !== "be");
    // Trades ohne Plan (plan_followed === false) zaehlen NICHT in die Winrate; PnL/Profit Factor bleiben unveraendert
    const wrDecided = decidedTrades.filter((t) => t.plan_followed !== false);
    const wrWins = wins.filter((t) => t.plan_followed !== false);
    const winrate = wrDecided.length ? (wrWins.length / wrDecided.length) * 100 : 0;

    const grossProfit = wins.reduce((s, t) => s + Number(t.pnl), 0);
    const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl), 0));
    const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;

    // Avg. RR auf Basis des REALISIERTEN RR: Win = geplantes reward/risk, Loss = immer exakt -1
    const realizedRRValues = statsTrades
      .map((t) => {
        if (t.result === "be") return 0;
        if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
        if (t.result === "loss") return -1;
        if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
        return null;
      })
      .filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
    const avgRR = realizedRRValues.length
      ? realizedRRValues.reduce((s, r) => s + r, 0) / realizedRRValues.length
      : 0;

    // Expectancy: durchschnittlicher $-Ertrag pro entschiedenem Trade (Win/Loss, ohne BE).
    // Mathematisch identisch zu (Winrate * Ø-Gewinn) - (Verlustrate * Ø-Verlust), aber einfacher
    // zu berechnen: einfach der Netto-PnL aller entschiedenen Trades geteilt durch ihre Anzahl.
    const expectancy = decidedTrades.length
      ? decidedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0) / decidedTrades.length
      : 0;

    let running = STARTING_BALANCE;
    let peak = STARTING_BALANCE;
    let maxDrawdown = 0;
    let maxDrawdownPct = 0;
    const equityCurve = [{ x: 0, y: running }];
    statsTrades.forEach((t, i) => {
      running += Number(t.pnl || 0);
      equityCurve.push({ x: i + 1, y: running });
      if (running > peak) peak = running;
      const dd = peak - running;
      const ddPct = peak > 0 ? (dd / peak) * 100 : 0;
      if (dd > maxDrawdown) {
        maxDrawdown = dd;
        maxDrawdownPct = ddPct;
      }
    });

    // ── EOD-Trading-Tage (für Drawdown, Streaks pro Tag, Payout-Regeln) ──
    // Trades werden zu Kalendertagen aggregiert, dann chronologisch sortiert.
    const dayMap = new Map();
    statsTrades.forEach((t) => {
      const d = t.trade_date;
      if (!dayMap.has(d)) dayMap.set(d, { date: d, pnl: 0, count: 0 });
      const entry = dayMap.get(d);
      entry.pnl += Number(t.pnl || 0);
      entry.count += 1;
    });
    const tradingDays = Array.from(dayMap.values()).sort((a, b) => new Date(a.date) - new Date(b.date));

    // ── EOD Trailing Drawdown mit Equity-Cap ──
    // Die MLL (Minimum Loss Line) folgt dem höchsten je erreichten EOD-Stand,
    // deckelt aber bei DD_PEAK_CAP (52.000) — danach bleibt sie fix bei 50.000,
    // auch wenn die Equity weiter über den Cap steigt. Das bedeutet: der reale
    // Puffer (eodBalance - mll) kann dann größer als DD_BUFFER (2.000) werden.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = STARTING_BALANCE;
    tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const cappedPeak = Math.min(eodPeak, DD_PEAK_CAP);
    const mll = cappedPeak - DD_BUFFER;
    const ddBufferRemaining = balance - mll; // wie viel Puffer noch bis zur MLL übrig ist
    // Für die Balken-Visualisierung: wie nah ist die Equity an der MLL, bezogen auf die
    // größte sinnvolle Spanne (eodPeak - mll). Am Peak = 0% Risiko, an der MLL = 100%.
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    // ── Distanz zum Account-Pass-Ziel (53.000) ──
    const distanceToPass = Math.max(0, ACCOUNT_PASS_TARGET - balance);
    const passProgressPct = Math.max(0, Math.min(100, (balance / ACCOUNT_PASS_TARGET) * 100));
    const accountPassed = balance >= ACCOUNT_PASS_TARGET;

    // Streaks (aktuell & längste)
    let currentStreak = 0;
    let currentStreakType = null;
    let longestWinStreak = 0;
    let longestLossStreak = 0;
    let curWin = 0;
    let curLoss = 0;
    statsTrades.forEach((t) => {
      const pnl = Number(t.pnl || 0);
      if (pnl > 0) {
        curWin += 1;
        curLoss = 0;
        if (curWin > longestWinStreak) longestWinStreak = curWin;
      } else if (pnl < 0) {
        curLoss += 1;
        curWin = 0;
        if (curLoss > longestLossStreak) longestLossStreak = curLoss;
      }
    });
    if (statsTrades.length) {
      const lastPnl = Number(statsTrades[statsTrades.length - 1].pnl || 0);
      currentStreakType = lastPnl > 0 ? "win" : lastPnl < 0 ? "loss" : null;
      for (let i = statsTrades.length - 1; i >= 0; i--) {
        const p = Number(statsTrades[i].pnl || 0);
        if (currentStreakType === "win" && p > 0) currentStreak++;
        else if (currentStreakType === "loss" && p < 0) currentStreak++;
        else break;
      }
    }

    const bestTrade = wins.length ? wins.reduce((a, b) => (Number(a.pnl) > Number(b.pnl) ? a : b)) : null;
    const worstTrade = losses.length ? losses.reduce((a, b) => (Number(a.pnl) < Number(b.pnl) ? a : b)) : null;

    // Breakdown nach Symbol
    const bySymbol = {};
    statsTrades.forEach((t) => {
      const key = t.symbol ? marketOf(t.symbol) : "—";
      if (!bySymbol[key]) bySymbol[key] = { pnl: 0, count: 0 };
      bySymbol[key].pnl += Number(t.pnl || 0);
      bySymbol[key].count += 1;
    });

    // Breakdown nach Wochentag
    const byWeekday = WEEKDAY_FULL.map((label) => ({ label, pnl: 0, count: 0 }));
    statsTrades.forEach((t) => {
      const d = new Date(t.trade_date + "T00:00:00");
      const idx = (d.getDay() + 6) % 7;
      byWeekday[idx].pnl += Number(t.pnl || 0);
      byWeekday[idx].count += 1;
    });

    const maxAbsSymbolPnl = Math.max(1, ...Object.values(bySymbol).map((v) => Math.abs(v.pnl)));
    const maxAbsWeekdayPnl = Math.max(1, ...byWeekday.map((v) => Math.abs(v.pnl)));

    return {
      totalPnl, balance, winrate, profitFactor, avgRR, expectancy, equityCurve, count: statsTrades.length,
      decidedTrades, bes,
      evalHistoricTrades,
      maxDrawdown, maxDrawdownPct, currentStreak, currentStreakType,
      longestWinStreak, longestLossStreak, bestTrade, worstTrade,
      bySymbol, byWeekday, maxAbsSymbolPnl, maxAbsWeekdayPnl,
      tradingDays, eodPeak, eodBalance, mll, ddBufferRemaining, ddRiskPct,
      distanceToPass, passProgressPct, accountPassed,
    };
  }, [filteredTrades, fundedCut]);

  // ── Account-Stats (IMMER auf Basis ALLER Trades, unabhängig von Symbol-/Ergebnis-Filtern) ──
  // Balance, Equity-Kurve, Drawdown/MLL und Pass-Status sind reale Kontokennzahlen.
  // Sie dürfen sich NICHT ändern, nur weil der Nutzer die Filterleiste (Symbol/Ergebnis)
  // zum Browsen des Kalenders/der Insights benutzt — sonst könnte z. B. ein aktiver
  // "Losses"-Filter fälschlich einen bestandenen Drawdown-Breach verstecken.
  const accountStats = useMemo(() => {
    const sorted = [...accountTrades].sort(
      (a, b) => new Date(a.trade_date) - new Date(b.trade_date) || a.id - b.id
    );

    const fundedTrades = fundedStage && fundedActivatedAt
      ? sorted.filter((t) => t.created_at && t.created_at >= fundedActivatedAt)
      : sorted;

    // In der Funded Stage startet die Balance-/Drawdown-Rechnung ab FUNDED_BALANCE_OVERRIDE
    // (bekannter realer Kontostand zum Aktivierungszeitpunkt) statt STARTING_BALANCE, damit
    // vorherige (nicht einzeln erfasste) Funded-Trades die aktuelle Balance nicht verfaelschen.
    const fundedBase = fundedStage ? FUNDED_BALANCE_OVERRIDE : STARTING_BALANCE;

    const totalPnl = fundedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const balance = fundedBase + totalPnl - (fundedStage ? payoutTotal : 0); // Auszahlungen verringern das Konto

    let running = fundedBase;
    let peak = fundedBase;
    let maxDrawdown = 0;
    let maxDrawdownPct = 0;
    const equityCurve = [{ x: 0, y: running }];
    fundedTrades.forEach((t, i) => {
      running += Number(t.pnl || 0);
      equityCurve.push({ x: i + 1, y: running });
      if (running > peak) peak = running;
      const dd = peak - running;
      const ddPct = peak > 0 ? (dd / peak) * 100 : 0;
      if (dd > maxDrawdown) {
        maxDrawdown = dd;
        maxDrawdownPct = ddPct;
      }
    });

    const dayMap = new Map();
    fundedTrades.forEach((t) => {
      const d = t.trade_date;
      if (!dayMap.has(d)) dayMap.set(d, { date: d, pnl: 0, count: 0 });
      const entry = dayMap.get(d);
      entry.pnl += Number(t.pnl || 0);
      entry.count += 1;
    });
    const tradingDays = Array.from(dayMap.values()).sort((a, b) => new Date(a.date) - new Date(b.date));

    // eodPeak startet bewusst bei STARTING_BALANCE (50.000) statt fundedBase: das
    // reale Konto ist tatsaechlich dort gestartet, der Peak fuer die MLL-Regel bleibt
    // also unveraendert, auch wenn die aktuelle Balance ueber FUNDED_BALANCE_OVERRIDE
    // (48.224) weiterlaeuft. eodBalance dagegen startet bei fundedBase, weil das der
    // bekannte reale Kontostand zum Aktivierungszeitpunkt ist.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = fundedBase;
    tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const activeDdBuffer = fundedStage ? DD_BUFFER : EVAL_DD_BUFFER;
    const activeDdPeakCap = fundedStage ? DD_PEAK_CAP : EVAL_DD_PEAK_CAP;
    const cappedPeak = Math.min(eodPeak, activeDdPeakCap);
    // Nach dem ersten Payout ist die MLL statisch (Start + 100$)
    const mll = fundedStage && payoutCount > 0 && PAYOUT_STATIC_AFTER ? MLL_AFTER_FIRST_PAYOUT : cappedPeak - activeDdBuffer;
    const ddBufferRemaining = balance - mll;
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    const distanceToPass = Math.max(0, ACCOUNT_PASS_TARGET - balance);
    const passProgressPct = Math.max(0, Math.min(100, (balance / ACCOUNT_PASS_TARGET) * 100));
    const accountPassed = balance >= ACCOUNT_PASS_TARGET;

    return {
      totalPnl, balance, equityCurve, maxDrawdown, maxDrawdownPct,
      tradingDays, eodPeak, eodBalance, mll, ddBufferRemaining, ddRiskPct,
      distanceToPass, passProgressPct, accountPassed,
    };
  }, [accountTrades, fundedStage, fundedActivatedAt, payoutTotal, payoutCount]);

  // ── Payout-Phase Stats ──
  // Aktiv sobald "Eval Passed" gesetzt ist. Zählt nur Trading-Tage ab dem
  // Pass-Datum und prüft die Payout-Regeln: 5 Tage à min. 250$, 50%-Consistency,
  // eigener DD-Cap (52.100) und Payout-Schwellen (ab 52.600 / 500$).
  const payoutStats = useMemo(() => {
    if (!evalPassed) return null;

    const baseDays = evalPassedDate
      ? accountStats.tradingDays.filter((d) => d.date >= evalPassedDate)
      : accountStats.tradingDays;
    // Payout-Zyklus: nur Tage NACH dem letzten Payout zaehlen
    const relevantDays = lastPayoutDate ? baseDays.filter((d) => d.date > lastPayoutDate) : baseDays;


    // Min. Handelstage pro Zyklus (Builder 50K): mind. 2 Tage mit Trades seit Start bzw. letztem Payout.
    // Je nach Plan zaehlt jeder Handelstag, nur Tage ab einem Mindestgewinn (Benchmark-/Qualifying-Tage)
    // oder die vergangenen Kalendertage seit Zyklus-Start (z. B. MFFU Pro: 14 Tage).
    const qualifyingDays = PAYOUT_MIN_DAY_PROFIT > 0 ? relevantDays.filter((d) => d.pnl >= PAYOUT_MIN_DAY_PROFIT) : relevantDays;
    let effectiveQualifyingCount = qualifyingDays.length;
    if (PAYOUT_CAL_DAYS > 0) {
      const cycleStartIso = lastPayoutDate || (relevantDays.length ? relevantDays[0].date : null);
      effectiveQualifyingCount = cycleStartIso
        ? Math.max(0, Math.floor((Date.now() - new Date(`${cycleStartIso}T00:00:00`).getTime()) / 86400000))
        : 0;
    }
    const neededDays = PAYOUT_CAL_DAYS > 0 ? PAYOUT_CAL_DAYS : PAYOUT_MIN_DAYS;
    const daysHit = Math.min(effectiveQualifyingCount, neededDays);
    const daysPassed = effectiveQualifyingCount >= neededDays;

    // Erster Payout: Gewinn ueber dem Buffer (Start + 1.600$). Danach: Netto-Gewinn seit letztem Payout.
    const cycleNetProfit = relevantDays.reduce((s, d) => s + d.pnl, 0);
    const profitAboveBuffer = lastPayoutDate ? cycleNetProfit : accountStats.balance - (STARTING_BALANCE + PAYOUT_BUFFER);
    const profitPassed = profitAboveBuffer > 0 && profitAboveBuffer >= PAYOUT_MIN_NET_PROFIT;
    // Auszahlbar: PAYOUT_PCT vom Profit (z. B. 50 % bei Flex/Legacy), gedeckelt durch das Cap (1. Payout ggf. eigenes Cap)
    const payoutCapNow = payoutCount > 0 ? PAYOUT_MAX_AMOUNT : PAYOUT_MAX_FIRST;
    const payoutAmount = Math.max(0, Math.min(profitAboveBuffer * PAYOUT_PCT, payoutCapNow));

    // 50%-Consistency-Regel: kein einzelner Tag darf mehr als 50% des
    // gesamten Nettogewinns seit Eval-Passed ausmachen
    const netProfitSincePass = relevantDays.reduce((s, d) => s + d.pnl, 0);
    const biggestDay = relevantDays.length ? Math.max(...relevantDays.map((d) => d.pnl)) : 0;
    const consistencyPct = netProfitSincePass > 0 ? (biggestDay / netProfitSincePass) * 100 : 0;
    const consistencyPassed = PAYOUT_CONSISTENCY_PCT <= 0 || netProfitSincePass <= 0 || consistencyPct <= PAYOUT_CONSISTENCY_PCT;

    // Payout-eigener Drawdown-Cap: identische Logik wie die Eval-MLL, aber
    // der Cap-Peak endet bereits bei 52.100 statt 52.000. eodPeak startet bei
    // STARTING_BALANCE (realer Kontostart), eodBalance bei FUNDED_BALANCE_OVERRIDE
    // (bekannter realer Stand zum Aktivierungszeitpunkt) — siehe accountStats.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = FUNDED_BALANCE_OVERRIDE;
    accountStats.tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const cappedPeak = Math.min(eodPeak, PAYOUT_DD_PEAK_CAP);
    const mll = payoutCount > 0 && PAYOUT_STATIC_AFTER ? MLL_AFTER_FIRST_PAYOUT : cappedPeak - DD_BUFFER;
    const balance = accountStats.balance;
    const ddBufferRemaining = balance - mll;
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    const allRulesPassed = daysPassed && consistencyPassed && profitPassed;

    return {
      relevantDays, qualifyingDays, effectiveQualifyingCount, neededDays, daysHit, daysPassed,
      netProfitSincePass, biggestDay, consistencyPct, consistencyPassed,
      eodPeak, mll, ddBufferRemaining, ddRiskPct,
      allRulesPassed, cycleNetProfit, profitAboveBuffer, profitPassed, payoutAmount,
    };
  }, [evalPassed, evalPassedDate, lastPayoutDate, payoutCount, accountStats.tradingDays, accountStats.balance, trades]);

  const calendar = useMemo(() => {
    const { year, month } = cursor;
    const byDay = new Map();
    filteredTrades.forEach((t) => {
      const d = t.trade_date;
      const [ty, tm] = d.split("-").map(Number);
      if (ty === year && tm - 1 === month) {
        if (!byDay.has(d)) byDay.set(d, []);
        byDay.get(d).push(t);
      }
    });

    const nDays = daysInMonth(year, month);
    const firstOffset = mondayIndex(startOfMonth(year, month));
    const cells = [];
    for (let i = 0; i < firstOffset; i++) cells.push(null);
    for (let day = 1; day <= nDays; day++) {
      const iso = isoDate(year, month, day);
      const dayTrades = byDay.get(iso) || [];
      // In funded stage: Eval-Trades (created_at vor Aktivierung) sind "historic"
      const isHistoric = fundedCut && iso < (fundedStartDate || "9999");
      // Ein Tag gilt als historic wenn ALLE seine Trades historic sind
      const allHistoric = isHistoric && dayTrades.every((t) => !t.created_at || t.created_at < fundedCut);
      const activeTrades = fundedCut
        ? dayTrades.filter((t) => t.created_at && t.created_at >= fundedCut)
        : dayTrades;
      const hasHistoricTrades = fundedCut
        ? dayTrades.some((t) => !t.created_at || t.created_at < fundedCut)
        : false;
      // All-time-Ansicht: Tage, an denen ausschliesslich Trades anderer Accounts liegen, werden markiert
      const isOther = scopeMode === "all" && dayTrades.length > 0 && dayTrades.every((t) => accountOf(t) !== ACTIVE_ACCOUNT_ID);
      const otherName = isOther ? ((accounts.find((a) => a.id === accountOf(dayTrades[0])) || {}).name || "") : "";
      const pnl = activeTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
      const rawPnl = dayTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
      cells.push({ day, iso, trades: dayTrades, pnl, rawPnl, isHistoric: allHistoric && activeTrades.length === 0, hasHistoricTrades, isOther, otherName });
    }
    while (cells.length % 7 !== 0) cells.push(null);

    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) {
      const weekCells = cells.slice(i, i + 7);
      const realDates = weekCells.filter(Boolean);
      const weekPnl = realDates.reduce((s, c) => s + c.pnl, 0);
      const weekTradeCount = realDates.reduce((s, c) => s + c.trades.length, 0);
      const weekNum = realDates.length
        ? isoWeek(new Date(year, month, realDates[0].day))
        : null;
      weeks.push({ cells: weekCells, weekPnl, weekTradeCount, weekNum });
    }

    const monthTotal = Array.from(byDay.values())
      .flat()
      .filter((t) => !fundedCut || (t.created_at && t.created_at >= fundedCut))
      .reduce((s, t) => s + Number(t.pnl || 0), 0);
    const monthTradeCount = Array.from(byDay.values()).flat().length;

    // Wochenenden werden ausgeblendet, ausser in diesem Monat wurde an einem Sa/So getradet
    const showWeekend = weeks.some((w) => w.cells.slice(5).some((c) => c && c.trades.length > 0));

    return { weeks, monthTotal, monthTradeCount, showWeekend };
  }, [filteredTrades, cursor, fundedCut, fundedStartDate, scopeMode, accounts]);

  // Postet einen Trade zu Supabase; fällt automatisch auf ein Payload ohne
  // "realized_rr" zurück, falls diese Spalte in der Tabelle noch nicht existiert
  // (z. B. bei einer Datenbank, die vor diesem Feature angelegt wurde).
  const postTradeWithFallback = async (trade) => {
    let payload = trade;
    let res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
    if (!res.ok) {
      let body = await res.text();
      if (/account_id/i.test(body) && payload.account_id !== undefined) {
        // Spalte fehlt: fuer den Hauptaccount unkritisch (Trades ohne account_id gehoeren dazu), fuer weitere Accounts nicht.
        if (payload.account_id !== MAIN_ACCOUNT_ID) throw new Error(ACCOUNT_COLUMN_ERROR);
        const { account_id, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (/realized_rr/i.test(body) && payload.realized_rr !== undefined) {
        const { realized_rr, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok && /setup/i.test(body) && payload.setup !== undefined) {
        const { setup, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok && /confluences/i.test(body) && payload.confluences !== undefined) {
        const { confluences, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok && /plan_followed/i.test(body) && payload.plan_followed !== undefined) {
        const { plan_followed, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
        else if (plan_followed !== null) pushToast(PLAN_COLUMN_WARNING, "error");
      }
      if (!res.ok) throw new Error(T(`Speichern fehlgeschlagen (${res.status}): ${body}`, `Saving failed (${res.status}): ${body}`));
    }
    return res;
  };

  const handleAddTrade = useCallback(
    async (tradeIn) => {
      const trade = { ...tradeIn, account_id: ACTIVE_ACCOUNT_ID };
      setSaving(true);
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => [
            ...prev,
            { ...trade, id: Math.max(0, ...prev.map((t) => t.id || 0)) + 1, created_at: new Date().toISOString() },
          ]);
          setPanelOpen(false);
          pushToast(T("Trade gespeichert (Demo-Modus)", "Trade saved (demo mode)"));
          return;
        }
        const res = await postTradeWithFallback(trade);
        if (!res.ok) {
          const body = await res.text();
          throw new Error(T(`Speichern fehlgeschlagen (${res.status}): ${body}`, `Saving failed (${res.status}): ${body}`));
        }
        const inserted = await res.json();
        setTrades((prev) => [...prev, ...inserted]);
        setPanelOpen(false);
        pushToast(T("Trade gespeichert", "Trade saved"));
      } catch (e) {
        setError(e.message || T("Trade konnte nicht gespeichert werden", "Trade could not be saved"));
        pushToast(e.message || T("Trade konnte nicht gespeichert werden", "Trade could not be saved"), "error");
      } finally {
        setSaving(false);
      }

  const handleUpdateTrade = useCallback(

            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,

            });
            if (!res.ok) body = await res.text();

          if (!res.ok && /setup/i.test(body) && patchPayload.setup !== undefined) {

            res = await fetch(`${REST_URL}?id=eq.${id}`, {

            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok && /confluences/i.test(body) && patchPayload.confluences !== undefined) {
            const { confluences, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok && /plan_followed/i.test(body) && patchPayload.plan_followed !== undefined) {
            const { plan_followed, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
            else if (plan_followed !== null) pushToast(PLAN_COLUMN_WARNING, "error");
          }
          if (!res.ok) throw new Error(T(`Aktualisieren fehlgeschlagen (${res.status}): ${body}`, `Update failed (${res.status}): ${body}`));
        }
        const updated = await res.json();
        setTrades((prev) => prev.map((t) => (t.id === id ? { ...t, ...updated[0] } : t)));
        setEditingTrade(null);
        pushToast(T("Trade aktualisiert", "Trade updated"));
      } catch (e) {
        setError(e.message || T("Trade konnte nicht aktualisiert werden", "Trade could not be updated"));
        pushToast(e.message || T("Trade konnte nicht aktualisiert werden", "Trade could not be updated"), "error");
      } finally {
        setSaving(false);

    },
    [pushToast]
  );

  const handleDeleteTrade = useCallback(
    async (tradeId) => {
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => prev.filter((t) => t.id !== tradeId));
          pushToast(T("Trade gelöscht (Demo-Modus)", "Trade deleted (demo mode)"));

        const res = await fetch(`${REST_URL}?id=eq.${tradeId}`, {

        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(T(`Löschen fehlgeschlagen (${res.status}): ${body}`, `Delete failed (${res.status}): ${body}`));

        setTrades((prev) => prev.filter((t) => t.id !== tradeId));

      } catch (e) {
        setError(e.message || T("Trade konnte nicht gelöscht werden", "Trade could not be deleted"));
        pushToast(e.message || T("Trade konnte nicht gelöscht werden", "Trade could not be deleted"), "error");

    [pushToast]

  // ── Benachrichtigungen: neue Trades der Freunde ──
  // Solange das Journal im Browser offen ist (auch im Hintergrund-Tab), wird alle 45 s bei den
  // Datenbanken der Freunde nachgefragt (nur lesend, wie im Freunde-Fenster). Kommt ein Trade mit
  // hoeherer ID als beim letzten Mal dazu, gibt es eine Browser-Benachrichtigung + Toast.
  // Beim ersten Durchlauf pro Freund wird nur der aktuelle Stand gemerkt (keine Flut alter Meldungen).
  /* ===== ALERTS (vorübergehend deaktiviert – zum Reaktivieren dieses Kommentar-Ende und die Platzhalter unten entfernen) =====
  const notifProfileId = ACTIVE_PROFILE ? ACTIVE_PROFILE.id : "x";
  const notifKey = `journal_notif__${notifProfileId}`;
  const notifSeenKey = `journal_notif_seen__${notifProfileId}`;
  const notifSupported = typeof window !== "undefined" && "Notification" in window;
  const [notifOn, setNotifOn] = useState(() => {
    try { return notifSupported && Notification.permission === "granted" && localStorage.getItem(notifKey) === "1"; } catch { return false; }
  });

  const toggleNotifications = useCallback(async () => {
    if (!notifSupported) {
      pushToast(T("Dein Browser unterstützt keine Benachrichtigungen.", "Your browser does not support notifications."), "error");
      return;
    }
    if (notifOn) {
      try { localStorage.setItem(notifKey, "0"); } catch {}
      setNotifOn(false);
      pushToast(T("Benachrichtigungen ausgeschaltet", "Notifications turned off"));
      return;
    }
    if (!window.isSecureContext) {
      pushToast(T("Benachrichtigungen funktionieren nur über https:// (z. B. GitHub Pages), nicht über eine lokal geöffnete Datei.", "Notifications only work over https:// (e.g. GitHub Pages), not from a locally opened file."), "error");
      return;
    }
    let perm = Notification.permission;
    if (perm === "default") {
      try { perm = await Notification.requestPermission(); } catch { perm = "denied"; }
    }
    if (perm === "granted") {
      try { localStorage.setItem(notifKey, "1"); } catch {}
      setNotifOn(true);
      pushToast(T("Benachrichtigungen aktiv — du siehst neue Trades deiner Freunde", "Notifications on — you will see your friends' new trades"));
    } else {
      pushToast(T("Benachrichtigungen sind im Browser blockiert — erlaube sie in den Seiteneinstellungen (Schloss-Symbol neben der URL).", "Notifications are blocked in the browser — allow them in the site settings (lock icon next to the URL)."), "error");
    }
  }, [notifOn, notifSupported, notifKey, pushToast]);

  useEffect(() => {
    if (!notifOn) return undefined;
    let stopped = false;
    let running = false;
    const readSeen = () => { try { return JSON.parse(localStorage.getItem(notifSeenKey) || "{}") || {}; } catch { return {}; } };
    const writeSeen = (o) => { try { localStorage.setItem(notifSeenKey, JSON.stringify(o)); } catch {} };
    const tradeLine = (r) =>
      `${r.symbol || ""} ${r.direction === "long" ? "Long" : r.direction === "short" ? "Short" : ""} · ${String(r.result || "").toUpperCase()} · ${fmtMoneyShort(Number(r.pnl || 0))}`
        .replace(/\s+/g, " ").trim();
    const notify = (friend, fresh, tagId) => {
      const title = fresh.length === 1
        ? T(`Neuer Trade von ${friend.name}`, `New trade from ${friend.name}`)
        : T(`${fresh.length} neue Trades von ${friend.name}`, `${fresh.length} new trades from ${friend.name}`);
      const body = fresh.slice(-3).map(tradeLine).join("\n");
      try { new Notification(title, { body, tag: `journal-${tagId}`, icon: "sharingan.png" }); } catch {}
      pushToast(`${title}: ${tradeLine(fresh[fresh.length - 1])}`);
    };
    const poll = async () => {
      if (stopped || running) return;
      running = true;
      try {
        const seen = readSeen();
        let changed = false;
        for (const f of loadFriendsLS()) {
          try {
            const res = await fetch(`${f.url}/rest/v1/Trades?select=id,trade_date,symbol,direction,result,pnl&order=id.desc&limit=15`, {
              method: "GET",
              headers: { apikey: f.key, Authorization: `Bearer ${f.key}` },
            });
            if (!res.ok) continue;
            const rows = await res.json();
            if (!Array.isArray(rows)) continue;
            const maxId = rows.reduce((m, r) => Math.max(m, Number(r.id) || 0), 0);
            const key = normalizeSupabaseUrl(f.url);
            if (seen[key] === undefined || maxId < seen[key]) { seen[key] = maxId; changed = true; continue; }
            const fresh = rows.filter((r) => Number(r.id) > seen[key]).sort((a, b) => Number(a.id) - Number(b.id));
            if (fresh.length) {
              seen[key] = maxId;
              changed = true;
              notify(f, fresh, `${f.id}-${maxId}`);
            }
          } catch {}
        }
        if (changed) writeSeen(seen);
      } finally {
        running = false;
      }
    };
    poll();
    const timer = setInterval(poll, 45000);
    const onVisible = () => { if (document.visibilityState === "visible") poll(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => { stopped = true; clearInterval(timer); document.removeEventListener("visibilitychange", onVisible); };
  }, [notifOn, notifSeenKey, pushToast]);
  ===== ENDE ALERTS ===== */
  // Platzhalter, solange Alerts auskommentiert sind (beim Reaktivieren löschen)
  const notifOn = false;

  // ── Automatische Datenbank-Pruefung ──
  // Fehlt in der Supabase-Datenbank etwas (Tabelle/Spalte/Policy), erscheint oben ein Hinweis mit einem
  // Knopf "SQL kopieren". Das Skript ist idempotent (beliebig oft ausfuehrbar). Neue Features, die eine
  // Datenbank-Aenderung brauchen: Zeile ins SETUP_SQL + Probe unten ergaenzen -> alle sehen den Hinweis automatisch.
  const SETUP_SQL = `-- Journal Setup (darf beliebig oft ausgeführt werden)
create table if not exists "Trades" (
  id bigint generated always as identity primary key,
  created_at timestamptz not null default now(),
  trade_date date not null,
  symbol text not null,

);
alter table "Trades" add column if not exists stop_loss float8;
alter table "Trades" add column if not exists take_profit float8;
alter table "Trades" add column if not exists rr float8;
alter table "Trades" add column if not exists realized_rr float8;
alter table "Trades" add column if not exists risk_amount float8;
alter table "Trades" add column if not exists pnl float8;
alter table "Trades" add column if not exists note text;
alter table "Trades" add column if not exists screenshot text;
alter table "Trades" add column if not exists setup text;
alter table "Trades" add column if not exists confluences text[];
alter table "Trades" add column if not exists plan_followed boolean;
alter table "Trades" add column if not exists account_id text;
create table if not exists "Settings" (key text primary key, value text, updated_at timestamptz not null default now());
alter table "Trades" enable row level security;
alter table "Settings" enable row level security;
drop policy if exists "journal anon all" on "Trades";
create policy "journal anon all" on "Trades" for all to anon using (true) with check (true);
drop policy if exists "journal anon all" on "Settings";
create policy "journal anon all" on "Settings" for all to anon using (true) with check (true);
notify pgrst, 'reload schema';`;
  const [setupIssue, setSetupIssue] = useState(false);
  const [setupHidden, setSetupHidden] = useState(false);
  useEffect(() => {
    if (!isConfigured) return undefined;
    let dead = false;
    (async () => {
      try {
        const probes = [
          `${REST_URL}?select=risk_amount,realized_rr,setup,confluences,plan_followed,account_id&limit=1`,
          `${String(SUPABASE_URL).replace(/\/+$/, "")}/rest/v1/Settings?select=key&limit=1`,
        ];
        const rs = await Promise.all(probes.map((u) => fetch(u, { headers: sbHeaders })));
        if (!dead && rs.some((r) => !r.ok)) setSetupIssue(true);
      } catch {}
    })();
    return () => { dead = true; };
  }, []);
  const copySetupSql = async () => {
    try { await navigator.clipboard.writeText(SETUP_SQL); pushToast(T("SQL kopiert — jetzt im SQL Editor einfügen und „Run“ klicken", "SQL copied — now paste it into the SQL editor and click “Run”")); }
    catch { pushToast(T("Kopieren nicht möglich — SQL unten markieren und kopieren", "Copy not possible — select and copy the SQL below"), "error"); }
  };
  const sqlEditorUrl = `https://supabase.com/dashboard/project/${String(SUPABASE_URL).replace(/^https?:\/\//, "").split(".")[0]}/sql/new`;
  /* ALERTS-Hinweis (deaktiviert)
  // Einmaliger Hinweis auf die Benachrichtigungen (Browser verlangen einen eigenen Klick fuer die Erlaubnis)
  useEffect(() => {
    try {
      if (notifSupported && Notification.permission === "default" && localStorage.getItem("journal_notif_hint") !== "1") {
        localStorage.setItem("journal_notif_hint", "1");
        pushToast(T("Tipp: Tippe oben auf „Alerts“, um Meldungen bei neuen Trades deiner Freunde zu bekommen.", "Tip: tap “Alerts” at the top to get notified about your friends' new trades."));
      }
    } catch {}
  }, []);
  ENDE ALERTS-Hinweis */

  const today = new Date();
  const isCurrentMonthNow = cursor.year === today.getFullYear() && cursor.month === today.getMonth();

  useEffect(() => {
    if (dayDetailData && dayDetailData.trades.length === 0 && !hasDayNote(dayDetailData.iso)) {

  // ── Tastatur-Shortcuts: N = neuer Trade, Esc = Modal schließen ──
  useEffect(() => {
    const handler = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();

  return (

                if (window.confirm(T("Eval bestanden — Funded Stage starten? Der Account wird auf $50.000 zurueckgesetzt. Deine bisherigen Trades bleiben im Kalender sichtbar.", "Eval passed — start funded stage? The account will be reset to $50,000. Your previous trades stay visible in the calendar."))) {

                : ""}

              {planStats.yes.count < 10 || planStats.no.count < 10 ? T("Achtung: kleine Stichprobe (unter 10 Trades in einer Gruppe), mit Vorsicht interpretieren.", "Warning: small sample (under 10 trades in one group), interpret with caution.") : ""}

      {pfOpen && <PortfolioPanel onClose={() => setPfOpen(false)} />}

    </div>
  );

/* ============================================================
   ANALYSE-PANEL
   Edge-Kennzahlen, R-Verteilung, Verhaltensanalyse, Monte-Carlo-Chance,
   Perioden-Report und Jahres-Heatmap. Es wird nur der aktive Tab berechnet.
   ============================================================ */
const fmtPct = (x, d = 0) => (Number.isFinite(x) ? `${(x * 100).toFixed(d)}%` : "—");
const fmtR = (x) => (Number.isFinite(x) ? `${x >= 0 ? "+" : ""}${x.toFixed(2)}R` : "—");
const toneOf = (v) => (v > 0 ? "pos" : v < 0 ? "neg" : "");
const SMALL_SAMPLE = 30;

/* ============================================================
   Tages-Briefing: wertet ALLE bisherigen Trades (alle Konten) aus und sagt, worauf heute zu achten ist.
   Heute zaehlt nicht mit. Aussagen entstehen nur bei ausreichender Stichprobe.
   ============================================================ */
const WEEKDAY_NAMES = [
  [T("Sonntag", "Sunday"), T("sonntags", "Sundays")],
  [T("Montag", "Monday"), T("montags", "Mondays")],
  [T("Dienstag", "Tuesday"), T("dienstags", "Tuesdays")],
  [T("Mittwoch", "Wednesday"), T("mittwochs", "Wednesdays")],
  [T("Donnerstag", "Thursday"), T("donnerstags", "Thursdays")],
  [T("Freitag", "Friday"), T("freitags", "Fridays")],
  [T("Samstag", "Saturday"), T("samstags", "Saturdays")],
];
const dayOfWeekOf = (s) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getDay() : null;
};
const localDateStr = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const num1 = (x) => (IS_EN ? x.toFixed(1) : x.toFixed(1).replace(".", ","));
const capFirst = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function dailyBriefing(list, today = new Date()) {
  const dow = today.getDay();
  const todayStr = localDateStr(today);
  const [dayName, dayPl] = WEEKDAY_NAMES[dow];
  const past = sortChrono(list.filter((t) => t.trade_date && t.trade_date < todayStr));
  const byDate = new Map();
  past.forEach((t) => {
    if (!byDate.has(t.trade_date)) byDate.set(t.trade_date, []);
    byDate.get(t.trade_date).push(t);
  });
  const days = Array.from(byDate.entries()).map(([date, arr]) => {
    const known = arr.filter((t) => t.plan_followed === true || t.plan_followed === false);
    return {
      date,
      dow: dayOfWeekOf(date),
      n: arr.length,
      pnl: arr.reduce((s, t) => s + Number(t.pnl || 0), 0),
      noPlan: known.filter((t) => t.plan_followed === false).length,
      known: known.length,
    };
  });
  const base = { dayName, dayPl, dayCount: days.length, tradeCount: past.length };
  if (days.length < 5) return { ...base, enough: false, sameCount: 0, items: [] };

  const same = days.filter((d) => d.dow === dow);
  const recent = same.slice(-4);
  const avgN = (arr) => mean(arr.map((d) => d.n));
  const avgPnl = (arr) => mean(arr.map((d) => d.pnl));
  const greenShare = (arr) => (arr.length ? arr.filter((d) => d.pnl > 0).length / arr.length : 0);
  const noPlanShare = (arr, minKnown) => {
    const k = arr.reduce((s, d) => s + d.known, 0);
    return k >= minKnown ? arr.reduce((s, d) => s + d.noPlan, 0) / k : null;
  };
  const items = [];
  const push = (tone, score, short, detail) => items.push({ tone, score, short, detail });
  const sameOk = same.length >= 2;

  if (sameOk) {
    // 1) Zu viele Trades an diesem Wochentag
    const nAll = avgN(days), nSame = avgN(same), nRec = avgN(recent);
    if (nSame >= nAll * 1.25 && nSame - nAll >= 0.7) {
      const rising = recent.length >= 3 && nRec >= nSame * 1.15;
      push("warn", 90 + (nSame - nAll),
        T(`${capFirst(dayPl)} nimmst du tendenziell zu viele Trades.`, `You tend to take too many trades on ${dayPl}.`),
        T(
          `Ø ${num1(nSame)} Trades pro ${dayName} gegen Ø ${num1(nAll)} an allen Tagen (${same.length} Handelstage ausgewertet)${rising ? `, zuletzt sogar Ø ${num1(nRec)}` : ""}.`,
          `Avg ${num1(nSame)} trades per ${dayName} versus avg ${num1(nAll)} across all days (${same.length} trading days)${rising ? `, recently even avg ${num1(nRec)}` : ""}.`
        ));
    }
    // 2) Trades ohne Plan an diesem Wochentag
    const sAll = noPlanShare(days, 5), sSame = noPlanShare(same, 5), sRec = noPlanShare(recent, 3);
    const recentWorse = sRec !== null && sRec >= 0.4 && sRec > (sAll ?? 0) + 0.1;
    const sameWorse = sSame !== null && sSame >= 0.2 && sSame >= (sAll ?? 0) + 0.08;
    if (recentWorse || sameWorse) {
      const partsDe = [sSame !== null && `${fmtPct(sSame)} ${dayPl}`, sAll !== null && `${fmtPct(sAll)} insgesamt`, sRec !== null && `zuletzt ${fmtPct(sRec)}`].filter(Boolean).join(", ");
      const partsEn = [sSame !== null && `${fmtPct(sSame)} on ${dayPl}`, sAll !== null && `${fmtPct(sAll)} overall`, sRec !== null && `recently ${fmtPct(sRec)}`].filter(Boolean).join(", ");
      push("warn", 95,
        T(`${capFirst(dayPl)} kommen öfter Trades ohne Plan vor${recentWorse ? " – zuletzt verstärkt" : ""}.`, `Trades without a plan happen more often on ${dayPl}${recentWorse ? " – more so lately" : ""}.`),
        T(`Anteil ohne Plan: ${partsDe}.`, `Share without a plan: ${partsEn}.`));
    } else if (sSame !== null && sAll !== null && sSame <= 0.1 && sAll - sSame >= 0.1) {
      push("good", 40,
        T(`${capFirst(dayPl)} hältst du dich gut an deinen Plan.`, `You stick to your plan well on ${dayPl}.`),
        T(`Nur ${fmtPct(sSame)} ohne Plan ${dayPl} gegen ${fmtPct(sAll)} insgesamt.`, `Only ${fmtPct(sSame)} without a plan on ${dayPl} versus ${fmtPct(sAll)} overall.`));
    }
    // 3) Ergebnis an diesem Wochentag
    if (same.length >= 3) {
      const gS = greenShare(same), gA = greenShare(days), pS = avgPnl(same), pA = avgPnl(days);
      const plus = same.filter((d) => d.pnl > 0).length;
      if (pS < 0 && gS <= 0.4 && gS < gA) {
        push("warn", 85,
          T(`${dayName} lief bisher schwach – lieber selektiv bleiben.`, `${dayName} has been weak so far – stay selective.`),
          T(`${plus} von ${same.length} Tagen im Plus (insgesamt ${fmtPct(gA)}), Ø ${fmtMoneyShort(pS)} pro Tag.`, `${plus} of ${same.length} days in profit (${fmtPct(gA)} overall), avg ${fmtMoneyShort(pS)} per day.`));
      } else if (pS > 0 && pS > pA && gS >= 0.6 && gS > gA) {
        push("good", 50,
          T(`${dayName} läuft bei dir überdurchschnittlich – bleib bei deinem Ablauf.`, `${dayName} runs above average for you – stick to your routine.`),
          T(`${plus} von ${same.length} Tagen im Plus (insgesamt ${fmtPct(gA)}), Ø ${fmtMoneyShort(pS)} pro Tag.`, `${plus} of ${same.length} days in profit (${fmtPct(gA)} overall), avg ${fmtMoneyShort(pS)} per day.`));
      }
    }
  }

  // 4) Folgen der letzten Tage (unabhängig vom Wochentag)
  const last = days[days.length - 1];
  let redRun = 0;
  for (let i = days.length - 1; i >= 0 && days[i].pnl < 0; i--) redRun++;
  let lossRun = 0;
  for (let i = past.length - 1; i >= 0 && past[i].result === "loss"; i--) lossRun++;
  if (redRun >= 2) {
    push("warn", 88,
      T(`Du kommst von ${redRun} roten Tagen in Folge – heute kleiner und selektiver starten.`, `You come off ${redRun} red days in a row – start smaller and more selective today.`),
      T(`Letzter Handelstag: ${last.date}, ${fmtMoneyShort(last.pnl)}.`, `Last trading day: ${last.date}, ${fmtMoneyShort(last.pnl)}.`));
  } else if (lossRun >= 3) {
    push("warn", 80,
      T(`Deine letzten ${lossRun} Trades waren Verluste – nicht versuchen, es sofort zurückzuholen.`, `Your last ${lossRun} trades were losses – don't try to win it back right away.`),
      T(`Letzter Handelstag: ${last.date}, ${fmtMoneyShort(last.pnl)}.`, `Last trading day: ${last.date}, ${fmtMoneyShort(last.pnl)}.`));
  }
  if (last.pnl < 0) {
    const afterRed = [], afterGreen = [];
    for (let i = 1; i < days.length; i++) (days[i - 1].pnl < 0 ? afterRed : afterGreen).push(days[i]);
    if (afterRed.length >= 4 && afterGreen.length >= 4) {
      const nR = avgN(afterRed), nG = avgN(afterGreen);
      if (nR >= nG * 1.25 && nR - nG >= 0.7) {
        push("warn", 87,
          T("Nach roten Tagen nimmst du mehr Trades – heute bewusst bremsen.", "After red days you take more trades – deliberately slow down today."),
          T(
            `Ø ${num1(nR)} Trades nach roten gegen Ø ${num1(nG)} nach grünen Tagen; Ø Tages-PnL ${fmtMoneyShort(avgPnl(afterRed))} gegen ${fmtMoneyShort(avgPnl(afterGreen))}.`,
            `Avg ${num1(nR)} trades after red versus avg ${num1(nG)} after green days; avg daily PnL ${fmtMoneyShort(avgPnl(afterRed))} versus ${fmtMoneyShort(avgPnl(afterGreen))}.`
          ));
      }
    }
  }

  // 5) Aufstocken nach Verlust, 6) Tageslimit, 7) schwächste Uhrzeit (allgemein)
  const b = behaviorStats(past);
  if (b.bigger.n >= 4 && b.notBigger.n >= 4 && b.bigger.avgPnl < b.notBigger.avgPnl) {
    push("warn", 75,
      T("Nach einem Verlust nicht aufstocken.", "Don't size up after a loss."),
      T(`Mit mehr Contracts nach Verlust: Ø ${fmtMoneyShort(b.bigger.avgPnl)} (${b.bigger.n} Trades) gegen Ø ${fmtMoneyShort(b.notBigger.avgPnl)} bei gleicher oder kleinerer Größe (${b.notBigger.n}).`,
        `Sizing up after a loss: avg ${fmtMoneyShort(b.bigger.avgPnl)} (${b.bigger.n} trades) versus avg ${fmtMoneyShort(b.notBigger.avgPnl)} with same or smaller size (${b.notBigger.n}).`));
  }
  const few = days.filter((d) => d.n <= 2), many = days.filter((d) => d.n >= 3);
  if (few.length >= 3 && many.length >= 3 && avgPnl(many) < avgPnl(few)) {
    push("warn", 70,
      T("Ab dem 3. Trade kippt dein Tag häufig.", "Your day often tips after the 3rd trade."),
      T(`Ø ${fmtMoneyShort(avgPnl(many))} an Tagen mit 3+ Trades (${many.length} Tage) gegen Ø ${fmtMoneyShort(avgPnl(few))} bei 1–2 Trades (${few.length} Tage).`,
        `Avg ${fmtMoneyShort(avgPnl(many))} on days with 3+ trades (${many.length} days) versus avg ${fmtMoneyShort(avgPnl(few))} with 1–2 trades (${few.length} days).`));
  }
  const worstHour = b.byHour.filter((h) => h.n >= 5 && h.pnl < 0).sort((x, y) => x.pnl / x.n - y.pnl / y.n)[0];
  if (worstHour) {
    const hh = String(worstHour.hour).padStart(2, "0");
    push("info", 60,
      T(`Deine schwächste Einstiegszeit ist ${hh}:00 Uhr.`, `Your weakest entry time is ${hh}:00.`),
      T(`Ø ${fmtMoneyShort(worstHour.pnl / worstHour.n)} pro Trade bei ${worstHour.n} Trades in dieser Stunde.`, `Avg ${fmtMoneyShort(worstHour.pnl / worstHour.n)} per trade over ${worstHour.n} trades in that hour.`));
  }

  if (!items.length) {
    push("good", 10,
      T("Keine Auffälligkeiten in deinen bisherigen Daten – bleib bei deinem Plan.", "Nothing stands out in your data so far – stick to your plan."),
      T("Weder Overtrading noch Plan-Brüche oder Tilt-Muster überschreiten die Schwellen.", "No overtrading, plan breaks or tilt patterns cross the thresholds."));
  }
  const rank = { warn: 0, good: 1, info: 2 };
  items.sort((x, y) => rank[x.tone] - rank[y.tone] || y.score - x.score);
  return { ...base, enough: true, sameCount: same.length, items };
}

function DailyBriefing({ trades }) {
  const [open, setOpen] = useState(false);
  const todayKey = localDateStr();
  const b = useMemo(() => dailyBriefing(trades), [trades, todayKey]);
  if (!trades.length) return null;
  const shown = open ? b.items : b.items.slice(0, 2);
  const hidden = b.items.length - shown.length;
  return (
    <section className="brief-card">
      <div className="brief-head">
        <span className="brief-title">{T("Tages-Briefing", "Daily briefing")}</span>
        <span className="brief-day">{b.dayName}</span>
      </div>
      {!b.enough ? (
        <span className="brief-detail">
          {T(
            `Noch zu wenig Daten (${b.dayCount} Handelstage). Ab 5 Handelstagen kommen hier persönliche Hinweise aus deinen Trades.`,
            `Not enough data yet (${b.dayCount} trading days). Personal hints from your trades appear after 5 trading days.`
          )}
        </span>
      ) : (
        <>
          <div className="brief-list">
            {shown.map((it) => (
              <div className={`brief-item ${it.tone}`} key={it.short}>
                <span className="brief-short">{it.short}</span>
                {open && <span className="brief-detail">{it.detail}</span>}
              </div>
            ))}
          </div>
          <button className="brief-toggle" aria-expanded={open} onClick={() => setOpen((v) => !v)}>
            {open ? T("Weniger anzeigen", "Show less") : hidden > 0 ? T(`Mehr anzeigen (+${hidden})`, `Show more (+${hidden})`) : T("Details anzeigen", "Show details")}
          </button>
          {open && (
            <span className="brief-foot">
              {T(
                `Basis: ${b.tradeCount} Trades an ${b.dayCount} Handelstagen (alle Konten, ohne heute)${b.sameCount >= 2 ? ` · ${b.sameCount} ${b.dayName}-Handelstage` : ` · für ${b.dayName} erst ${b.sameCount} Handelstage, daher allgemeine Hinweise`}.`,
                `Based on ${b.tradeCount} trades across ${b.dayCount} trading days (all accounts, excluding today)${b.sameCount >= 2 ? ` · ${b.sameCount} ${b.dayName} trading days` : ` · only ${b.sameCount} ${b.dayName} trading days so far, so general hints`}.`
              )}
            </span>
          )}
        </>
      )}
    </section>
  );
}

const loadDayNotes = () => {
  try {
    const o = JSON.parse(localStorage.getItem(NOTES_LS_KEY) || "{}");
    return o && typeof o === "object" && !Array.isArray(o) ? o : {};
  } catch { return {}; }
};
// Tagesnotiz: optionaler Kurz-Recap pro Tag, wird im Tag-Fenster (Klick auf einen Kalendertag) bearbeitet.
// Liegt im Browser und wird (wie Konten und Payouts) ueber die Settings-Tabelle in Supabase gesichert, sofern es diese Tabelle gibt.
function DayNote({ date, note, onSave }) {
  const [draft, setDraft] = useState(note || "");
  const [saved, setSaved] = useState(true);
  const timer = React.useRef(null);
  const pending = React.useRef(null);
  const touched = React.useRef(false);
  const onSaveRef = React.useRef(onSave);
  onSaveRef.current = onSave;

  const flush = useCallback(() => {
    clearTimeout(timer.current);
    if (pending.current !== null) {
      const text = pending.current;
      pending.current = null;
      onSaveRef.current(date, text);
      setSaved(true);
    }
  }, [date]);

  // Notiz nach dem Sync mit der Datenbank uebernehmen, solange noch nichts getippt wurde.
  useEffect(() => { if (!touched.current) setDraft(note || ""); }, [note]);
  // Beim Schliessen des Fensters oder Verlassen der Seite sofort speichern.
  useEffect(() => {
    window.addEventListener("pagehide", flush);
    return () => { window.removeEventListener("pagehide", flush); flush(); };
  }, [flush]);

  const onChange = (e) => {
    const text = e.target.value;
    touched.current = true;
    setDraft(text);
    setSaved(false);
    pending.current = text;
    clearTimeout(timer.current);
    timer.current = setTimeout(flush, 700);
  };

  return (
    <div className="daydetail-note">
      <span className="notes-title">{T("Tagesnotiz", "Daily note")}</span>
      <textarea
        className="notes-area"
        value={draft}
        onChange={onChange}
        onBlur={flush}
        placeholder={T("Kurzer Recap zum Tag: Was lief gut, was würde ich anders machen?", "Short recap of the day: what went well, what would I do differently?")}
      />
      <span className="notes-foot">
        {!saved ? T("Speichert …", "Saving …") : draft.trim() ? T("Gespeichert", "Saved") : T("Optional, nur wenn du magst", "Optional, only if you like")}
      </span>
    </div>
  );
}

function ChanceTab({ list, accountStats, fundedStage, payoutCount }) {
  const [maxDays, setMaxDays] = useState(40);
  const scenario = useMemo(() => {
    if (!fundedStage) {
      return {
        title: T("Eval bestehen", "Pass the eval"),
        target: ACCOUNT_PASS_TARGET,
        ddBuffer: EVAL_DD_BUFFER,
        peakCap: EVAL_DD_PEAK_CAP,
        staticMll: null,
      };
    }
    return {
      title: T("Nächsten Payout erreichen", "Reach the next payout"),
      target: payoutCount > 0
        ? accountStats.balance + PAYOUT_MIN_NET_PROFIT
        : STARTING_BALANCE + PAYOUT_BUFFER + PAYOUT_MIN_NET_PROFIT,
      ddBuffer: DD_BUFFER,
      peakCap: DD_PEAK_CAP,
      staticMll: payoutCount > 0 && PAYOUT_STATIC_AFTER ? MLL_AFTER_FIRST_PAYOUT : null,
    };
  }, [fundedStage, payoutCount, accountStats.balance]);

  const pnls = useMemo(() => list.filter((t) => t.result).map((t) => Number(t.pnl || 0)), [list]);
  const dayLens = useMemo(() => Array.from(dailyPnlMap(list).values()).map((d) => d.n), [list]);
  const sim = useMemo(
    () => monteCarlo({
      pnls, dayLens, balance: accountStats.balance, eodPeak: accountStats.eodPeak,
      target: scenario.target, ddBuffer: scenario.ddBuffer, peakCap: scenario.peakCap,
      staticMll: scenario.staticMll, maxDays,
    }),
    [pnls, dayLens, accountStats.balance, accountStats.eodPeak, scenario, maxDays]
  );

  if (!sim) return <EmptyNote>{T("Für die Simulation braucht es mindestens einen Trade.", "The simulation needs at least one trade.")}</EmptyNote>;
  const range = (a, b) => (a === null ? "—" : `${Math.round(a)}–${Math.round(b)}`);
  return (
    <>
      <div className="an-head" style={{ marginBottom: 14 }}>
        <span className="insight-sub">{scenario.title}: {fmtMoney(scenario.target)}</span>
        <div className="filter-group">
          {[20, 40, 60, 90].map((d) => (
            <button key={d} type="button" className={`filter-chip ${maxDays === d ? "active" : ""}`} onClick={() => setMaxDays(d)}>
              {d} {T("Tage", "days")}
            </button>
          ))}
        </div>
      </div>
      <div className="insights-grid">
        <Metric label={T("Chance Ziel", "Chance to hit")} value={fmtPct(sim.pass, 1)} tone={sim.pass >= 0.5 ? "pos" : ""} sub={T(`in ${sim.maxDays} Handelstagen`, `within ${sim.maxDays} trading days`)} />
        <Metric label={T("Chance Bust", "Chance to bust")} value={fmtPct(sim.bust, 1)} tone={sim.bust >= 0.25 ? "neg" : ""} sub={T("MLL wird gerissen", "MLL is breached")} />
        <Metric label={T("Noch offen", "Still open")} value={fmtPct(sim.open, 1)} sub={T("weder noch nach Ablauf", "neither by the end")} />
        <Metric label={T("Dauer bis Ziel", "Time to target")} value={sim.medianDays === null ? "—" : `${Math.round(sim.medianDays)} ${T("Tage", "days")}`} sub={T(`Mitte 50%: ${range(sim.p25Days, sim.p75Days)} Tage`, `Middle 50%: ${range(sim.p25Days, sim.p75Days)} days`)} />
        <Metric label={T("Endstand schlecht", "End balance, bad")} value={fmtMoney(sim.p10Final)} sub={T("10%-Quantil", "10th percentile")} />
        <Metric label={T("Endstand typisch", "End balance, typical")} value={fmtMoney(sim.p50Final)} sub={T("Median", "Median")} />
        <Metric label={T("Endstand gut", "End balance, good")} value={fmtMoney(sim.p90Final)} sub={T("90%-Quantil", "90th percentile")} />
        <Metric label={T("Datenbasis", "Data basis")} value={`${pnls.length}`} sub={T(`Trades, ${sim.sims.toLocaleString(LOCALE)} Simulationen`, `trades, ${sim.sims.toLocaleString(LOCALE)} simulations`)} />
      </div>
      <span className="an-note">
        {T(
          "Schätzung aus deiner eigenen Historie (Ziehen mit Zurücklegen), keine Prognose. Sie nimmt an, dass deine künftigen Trades so verteilt sind wie bisher.",
          "An estimate from your own history (sampling with replacement), not a forecast. It assumes your future trades are distributed like your past ones."
        )}
      </span>
      <SampleNote n={pnls.length} />
    </>
  );
}

function HeatTab({ list }) {
  const years = useMemo(() => {
    const set = new Set(list.map((t) => (t.trade_date || "").slice(0, 4)).filter(Boolean));
    set.add(String(new Date().getFullYear()));
    return Array.from(set).sort();
  }, [list]);
  const [year, setYear] = useState(() => years[years.length - 1]);
  const data = useMemo(() => {
    const map = dailyPnlMap(list);
    const y = Number(year);
    const first = new Date(y, 0, 1);
    const offset = mondayIndex(first);
    const total = daysInMonth(y, 1) === 29 ? 366 : 365;
    const cells = Array.from({ length: offset }, () => null);
    const monthStarts = [];
    let maxAbs = 0, net = 0, green = 0, red = 0, best = null;
    for (let i = 0; i < total; i++) {
      const dt = new Date(y, 0, 1 + i);
      const iso = isoDate(y, dt.getMonth(), dt.getDate());
      const e = map.get(iso) || null;
      if (dt.getDate() === 1) monthStarts.push({ month: dt.getMonth(), col: Math.floor((offset + i) / 7) });
      if (e) {
        maxAbs = Math.max(maxAbs, Math.abs(e.pnl));
        net += e.pnl;
        if (e.pnl > 0) green += 1; else if (e.pnl < 0) red += 1;
        if (!best || e.pnl > best.pnl) best = { iso, pnl: e.pnl };
      }
      cells.push({ iso, e });
    }
    return { cells, monthStarts, maxAbs, net, green, red, best, weeks: Math.ceil(cells.length / 7) };
  }, [list, year]);
  const color = (e) => {
    if (!e || e.pnl === 0) return e ? "rgba(255,255,255,0.08)" : null;
    const a = 0.18 + 0.82 * (Math.abs(e.pnl) / (data.maxAbs || 1));
    return e.pnl > 0 ? `rgba(255,255,255,${a.toFixed(2)})` : `rgba(224,0,26,${a.toFixed(2)})`;
  };
  return (
    <>
      <div className="an-head" style={{ marginBottom: 14 }}>
        <span className={`insight-sub ${toneOf(data.net)}`}>
          {T(`${year}: ${fmtMoneyShort(data.net)} · ${data.green} grüne / ${data.red} rote Tage`, `${year}: ${fmtMoneyShort(data.net)} · ${data.green} green / ${data.red} red days`)}
          {data.best ? T(` · bester Tag ${fmtMoneyShort(data.best.pnl)}`, ` · best day ${fmtMoneyShort(data.best.pnl)}`) : ""}
        </span>
        <div className="filter-group">
          {years.map((y) => (
            <button key={y} type="button" className={`filter-chip ${year === y ? "active" : ""}`} onClick={() => setYear(y)}>{y}</button>
          ))}
        </div>
      </div>
      <div className="an-scroll">
        <div className="heat-months" style={{ gridTemplateColumns: `repeat(${data.weeks}, 13px)` }}>
          {data.monthStarts.map((m) => (
            <span key={m.month} style={{ gridColumnStart: m.col + 1 }}>{MONTHS[m.month].slice(0, 3)}</span>
          ))}
        </div>
        <div className="heat-grid" style={{ gridTemplateColumns: `repeat(${data.weeks}, 13px)` }}>
          {data.cells.map((c, i) => c === null
            ? <span key={`o${i}`} />
            : (
              <span
                key={c.iso}
                className={`heat-cell ${c.e ? "has" : ""}`}
                style={color(c.e) ? { background: color(c.e) } : undefined}
                title={c.e ? `${c.iso}: ${fmtMoneyShort(c.e.pnl)} (${c.e.n} Trades)` : c.iso}
              />
            ))}
        </div>
      </div>
    </>
  );
}

    return out;
  }, []);
  const [presetKey, setPresetKey] = useState(`${DEFAULT_PRESET.firm}|${DEFAULT_PRESET.plan}`);
  const [nameTouched, setNameTouched] = useState(false);
  const sel = presetOptions.find((o) => o.key === presetKey) || presetOptions[0];

  const submit = (e) => {
    e.preventDefault();
    if (canSubmit) onConfirm({ name: name.trim(), type, preset: { firm: sel.firm.id, plan: sel.plan.id, size: sel.size }, rules: sel.rules });

    <div className="overlay" onClick={onClose}>

          <label>{T("Name", "Name")}</label>
          <input type="text" value={name} onChange={(e) => { setName(e.target.value); setNameTouched(true); }} autoFocus />

        <div className="field">

          {PRESET_FIRMS.map((firm) => (

              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>

                  <button key={o.key} type="button" style={{ flex: "1 1 auto" }} className={`dir-btn res-win ${presetKey === o.key ? "active" : ""}`} onClick={() => pickPreset(o)}>
                    {o.plan.name} · {sizeK(o.size)}

          {sel && (
            <div className="notice" style={{ marginTop: "6px" }}>
              <b>{presetLabel(sel.firm, sel.plan, sel.size)}</b>
              <div style={{ marginTop: "4px" }}>{sel.plan.note}</div>

        </div>
        <div className="field">
          <label>{isReset ? T("Typ des neuen Accounts", "Type of the new account") : T("Typ", "Type")}</label>
          <div className="dir-toggle">
            <button type="button" className={`dir-btn res-win ${type === "eval" ? "active" : ""}`} onClick={() => setType("eval")}>Eval</button>
            <button type="button" className={`dir-btn res-win ${type === "xfa" ? "active" : ""}`} onClick={() => setType("xfa")}>XFA</button>
          </div>
        </div>
        <button type="submit" className="btn-primary btn-block" disabled={!canSubmit}>
          {busy ? T("Wird angelegt…", "Creating…") : isReset ? T("Reset durchführen", "Reset account") : T("Account anlegen", "Create account")}
        </button>
      </form>
    </div>
  );
}

        {payouts.length > 0 ? ` · ${T(`MLL seit dem 1. Payout statisch bei ${fmtMoney(MLL_AFTER_FIRST_PAYOUT)}`, `MLL static at ${fmtMoney(MLL_AFTER_FIRST_PAYOUT)} since the 1st payout`)}` : ""}

function EquityCurve({ data }) {
  const w = 560;
  const h = 120;
  const pad = 6;

  if (data.length < 2) {
    return (
      <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg">
        <line x1={pad} y1={h / 2} x2={w - pad} y2={h / 2} stroke="var(--line)" strokeWidth="1.5" strokeDasharray="4 6" />
      </svg>
    );
  }

  const ys = data.map((d) => d.y);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const range = maxY - minY || 1;

  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.y - minY) / range) * (h - pad * 2);
    return [x, y];
  });

  const lineD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const areaD = `${lineD} L${points[points.length - 1][0]},${h - pad} L${points[0][0]},${h - pad} Z`;

  const last = data[data.length - 1].y;
  const first = data[0].y;
  const positive = last >= first;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0.22" />
          <stop offset="100%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaD} fill="url(#eqFill)" />
      <path d={lineD} fill="none" stroke={positive ? "var(--green)" : "var(--red)"} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r="3.5" fill={positive ? "var(--green)" : "var(--red)"} />
    </svg>
  );
}

// Feldvalidierung des Trade-Formulars (rein, ohne React). Liefert { feld: Fehlertext }.
function validateTradeForm(f, today = localIsoToday()) {
  const err = {};
  const num = (v) => (v === "" || v === null || v === undefined ? NaN : Number(v));
  if (!f.trade_date) err.trade_date = T("Datum fehlt", "Date is missing");
  else if (f.trade_date > today) err.trade_date = T("Datum liegt in der Zukunft", "Date is in the future");
  const c = num(f.contracts);
  if (!Number.isInteger(c) || c < 1) err.contracts = T("Ganze Zahl ab 1", "Whole number from 1");
  const sl = num(f.stop_loss);
  if (!Number.isFinite(sl) || sl === 0) err.stop_loss = T("Stop Loss in Punkten, nicht 0", "Stop loss in points, not 0");
  const tp = num(f.take_profit);
  // Take Profit ist bei Losses optional (Loss = immer -1R, der TP spielt keine Rolle)
  const tpEmpty = f.take_profit === "" || f.take_profit === null || f.take_profit === undefined;
  if (f.result === "loss" && tpEmpty) { /* ok */ }
  else if (!Number.isFinite(tp) || tp === 0) err.take_profit = T("Take Profit in Punkten, nicht 0", "Take profit in points, not 0");
  if (f.manual_pnl !== "") {
    const p = num(f.manual_pnl);
    if (!Number.isFinite(p)) err.manual_pnl = T("Keine gültige Zahl", "Not a valid number");
    else if (f.result === "win" && p < 0) err.manual_pnl = T("Win mit negativem PnL", "Win with negative PnL");
    else if (f.result === "loss" && p > 0) err.manual_pnl = T("Loss mit positivem PnL", "Loss with positive PnL");
  }
  return err;
}

function AddTradePanel({ onClose, onSubmit, saving, initialTrade = null, isEdit = false, existingSetups = [], existingConfluences = [] }) {
  const todayIso = localIsoToday();
  const [form, setForm] = useState(() => {
    if (initialTrade) {
      return {
        trade_date: initialTrade.trade_date,
        symbol: initialTrade.symbol,
        contracts: String(initialTrade.contracts),
        direction: initialTrade.direction,
        result: initialTrade.result,
        stop_loss: String(initialTrade.stop_loss ?? ""),
        take_profit: String(initialTrade.take_profit ?? ""),
        manual_pnl: initialTrade.pnl !== null && initialTrade.pnl !== undefined ? String(initialTrade.pnl) : "",
        note: initialTrade.note || "",
        screenshot: initialTrade.screenshot || "",
        setup: initialTrade.setup || "",
        confluences: Array.isArray(initialTrade.confluences) ? initialTrade.confluences : [],
        plan_followed: initialTrade.plan_followed === true ? "yes" : initialTrade.plan_followed === false ? "no" : "",
      };
    }
    return {
      trade_date: todayIso,
      symbol: "NQ",
      contracts: String(SYMBOLS.NQ.defaultContracts),
      direction: "long",
      result: "win",
      stop_loss: "10",
      take_profit: "",
      manual_pnl: "",
      note: "",
      screenshot: "",
      setup: "",
      confluences: [],
      plan_followed: "yes", // Standard: Mit Plan
    };
  });
  const [touched, setTouched] = useState(false);
  const [newConfluenceInput, setNewConfluenceInput] = useState("");
  const firstFieldRef = React.useRef(null);

  useEffect(() => {
    if (firstFieldRef.current) firstFieldRef.current.focus();
  }, []);

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const selectSymbol = (symbol) =>
    setForm((f) => ({ ...f, symbol, contracts: isEdit ? f.contracts : String(SYMBOLS[symbol].defaultContracts) }));

  // Markt (NQ/ES/GC) waehlen und dabei die aktuelle Variante (Mini/Micro) beibehalten
  const selectMarket = (market) =>
    selectSymbol(isMicroSymbol(form.symbol) ? MARKETS[market].micro : MARKETS[market].mini);
  const selectTier = (tier) => selectSymbol(MARKETS[marketOf(form.symbol)][tier]);

  const bumpContracts = (delta) =>
    setForm((f) => {
      const next = Math.max(1, (Number(f.contracts) || 0) + delta);
      return { ...f, contracts: String(next) };
    });

  const computed = useMemo(() => computeTrade(form), [form.symbol, form.contracts, form.stop_loss, form.take_profit, form.result]);

  // Screenshots vor dem Speichern verkleinern (max. 1600 px, JPEG 82 %): Handy-Fotos haben mehrere MB und
  // wuerden sonst bei jedem Laden mitgeladen. Bei jedem Problem wird das Original verwendet.
  const processFile = (file) => {
    if (!file) return;
    const useOriginal = () => {
      const reader = new FileReader();
      reader.onload = () => setForm((f) => ({ ...f, screenshot: reader.result }));
      reader.readAsDataURL(file);
    };
    const objUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      try {
        const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const out = canvas.toDataURL("image/jpeg", 0.82);
        if (out.length < file.size * 1.37) setForm((f) => ({ ...f, screenshot: out }));
        else useOriginal();
      } catch { useOriginal(); }
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); useOriginal(); };
    img.src = objUrl;
  };
  const handleFile = (e) => processFile(e.target.files && e.target.files[0]);

  // Bild aus der Zwischenablage (STRG+V / CMD+V) uebernehmen, solange das Formular offen ist.
  useEffect(() => {
    const onPaste = (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.kind === "file" && it.type.startsWith("image/")) {
          e.preventDefault();
          processFile(it.getAsFile());
          return;
        }
      }
    };
    document.addEventListener("paste", onPaste);
    return () => document.removeEventListener("paste", onPaste);
  }, []);

  const addNewConfluence = () => {
    const tag = newConfluenceInput.trim();
    if (!tag) return;
    setForm((f) => (f.confluences.includes(tag) ? f : { ...f, confluences: [...f.confluences, tag] }));
    setNewConfluenceInput("");
  };

  const handleConfluenceInputKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      addNewConfluence();
    }
  };

  const fieldErrors = useMemo(() => validateTradeForm(form), [form]);
  const isValid = Object.keys(fieldErrors).length === 0;
  const fieldError = (key) => (touched && fieldErrors[key] ? <span className="field-error">{fieldErrors[key]}</span> : null);

  const effectivePnl = form.manual_pnl !== ""
    ? Number(form.manual_pnl)
    : computed.pnl;

  const buildPayload = () => ({
    trade_date: form.trade_date,
    symbol: form.symbol,
    contracts: Number(form.contracts),
    direction: form.direction,
    result: form.result,
    stop_loss: Number(form.stop_loss),
    take_profit: form.take_profit === "" ? null : Number(form.take_profit),
    rr: computed.rr,
    realized_rr: computed.realized_rr,
    risk_amount: computed.risk_amount,
    pnl: effectivePnl,
    note: form.note || null,
    screenshot: form.screenshot || null,
    setup: form.setup || null,
    confluences: form.confluences && form.confluences.length ? form.confluences : null,
    plan_followed: form.plan_followed === "yes" ? true : form.plan_followed === "no" ? false : null,
  });

  const submit = (e) => {
    e.preventDefault();
    setTouched(true);
    if (!isValid) return;
    onSubmit(buildPayload());
  };

  // Cmd/Ctrl + Enter zum schnellen Speichern, von überall im Formular
  const handleKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      submit(e);

  return (
    <div className="overlay">
      <form className="panel panel-trade-form" onSubmit={submit} onKeyDown={handleKeyDown}>
        <div className="panel-head">
          <span>{isEdit ? T("Trade bearbeiten", "Edit trade") : T("Neuer Trade", "New trade")}</span>

              <label>Symbol</label>
              <div className="symbol-toggle" style={{ gridTemplateColumns: "1fr 1fr 1fr" }}>
                {Object.keys(MARKETS).map((market) => (
                  <button
                    type="button"
                    key={market}
                    className={`symbol-btn ${marketOf(form.symbol) === market ? "active" : ""}`}
                    onClick={() => selectMarket(market)}
                  >
                    <span className="sym-name">{market}</span>
                  </button>
                ))}
              </div>
              <div className="filter-group" style={{ alignSelf: "flex-start", marginTop: "6px" }}>
                {["mini", "micro"].map((tier) => {
                  const active = (tier === "micro") === isMicroSymbol(form.symbol);
                  const sym = MARKETS[marketOf(form.symbol)][tier];
                  return (
