<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<meta name="format-detection" content="telephone=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="sharingan.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<title>Trading Journal</title>
<link rel="icon" type="image/x-icon" href="sharingan.png">
<style>

  :root {
    --bg: #000000;
    --panel: #0d0d0d;
    --panel-2: #141414;
    --line: #222222;
    --text: #ffffff;
    --muted: #555555;
    --muted-light: #888888;
    --green: #ffffff;
    --red: #e0001a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    min-height: 100vh;  
  }
  #root { min-height: 100vh; }

  .journal-shell { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; padding: 36px; font-size: 1.05em; }

  /* ── Topbar ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); }
  .brand-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.22em; font-size: 13px; color: var(--muted-light); text-transform: uppercase; }

  /* ── Buttons ── */
  .btn-primary {
    display: flex; align-items: center; gap: 8px;
    background: var(--red); color: #fff;
    border: none; border-radius: 6px;
    padding: 12px 20px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity .15s ease, transform .1s ease;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-block { width: 100%; justify-content: center; margin-top: 8px; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Notice ── */
  .notice {
    background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--muted);
    border-radius: 4px; padding: 14px 18px; font-size: 13px; color: var(--muted-light); line-height: 1.6;
  }
  .notice-error { border-left-color: var(--red); color: #ff6b78; }

  /* ── Hero ── */
  .hero {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 32px 34px; display: flex; align-items: center; justify-content: space-between; gap: 28px;
    flex-wrap: wrap;
  }
  .hero-balance { display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
  .hero-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; }
  .hero-value { font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .hero-delta { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .hero-delta.pos { color: var(--text); }
  .hero-delta.neg { color: var(--red); }
  .hero-curve { flex: 1; min-width: 280px; max-width: 700px; }
  .equity-svg { width: 100%; height: 130px; display: block; }

  /* ── Stat Row ── */
  .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; }

  /* ── Calendar ── */
  .cal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 26px 28px 18px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .cal-title { font-size: 20px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; letter-spacing: -0.01em; }
  .cal-year { color: var(--muted); font-weight: 400; font-size: 16px; }
  .cal-nav { display: flex; align-items: center; gap: 12px; }
  .cal-month-pnl { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted-light); }
  .cal-month-pnl.pos { color: var(--text); }
  .cal-month-pnl.neg { color: var(--red); }
  .cal-navbtn {
    background: transparent; border: 1px solid var(--line); color: var(--muted-light);
    border-radius: 4px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .cal-navbtn:hover { border-color: var(--muted-light); color: var(--text); }

  .cal-grid-header { display: grid; grid-template-columns: repeat(var(--cols, 7), 1fr) 130px; gap: 6px; margin-bottom: 6px; }
  .cal-dow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; text-align: center; padding-bottom: 8px; }
  .cal-dow-week { text-align: left; padding-left: 4px; }

  .cal-week { display: grid; grid-template-columns: repeat(var(--cols, 7), 1fr) 130px; gap: 6px; margin-bottom: 6px; }
  .cal-cell {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    min-height: 88px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px;
    text-align: left; cursor: default; font-family: inherit; color: var(--text);
  }
  .cal-cell-empty { background: transparent; border: none; }
  .cal-cell { position: relative; }
  .cal-note-dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted-light); }
  .cal-daynum { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .cal-pnl { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; margin-top: auto; }
  .cal-count { font-size: 11px; color: var(--muted); }
  .cal-win { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.03); }
  .cal-win .cal-pnl { color: var(--text); }
  .cal-loss { border-color: rgba(224,0,26,0.4); background: rgba(224,0,26,0.06); }
  .cal-loss .cal-pnl { color: var(--red); }
  .cal-cell:not(.cal-cell-empty):not(:disabled) { cursor: pointer; transition: border-color .1s ease; }
  .cal-cell:not(.cal-cell-empty):not(:disabled):hover { border-color: var(--muted-light); }
  .cal-today { box-shadow: 0 0 0 1px var(--red) inset; }
  .cal-cell-historic { opacity: 0.38; }
  .cal-cell-weekend { opacity: 0.5; }
  .cal-cell-historic .cal-pnl { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.3); }
  .cal-historic-badge { font-size: 9px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 1px; }

  .cal-weeksum { background: transparent; border: 1px solid var(--line); border-style: dashed; justify-content: center; gap: 3px; }
  .cal-weeknum { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }
  .cal-weekpnl { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
  .cal-weekpnl.pos { color: var(--text); }
  .cal-weekpnl.neg { color: var(--red); }
  .cal-weekcount { font-size: 11px; color: var(--muted); }

  .cal-loading { padding: 30px 0; text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }

  /*  Filter Bar  */
  .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
  .filter-chip {
    background: transparent; border: none; color: var(--muted-light); border-radius: 3px;
    padding: 7px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all .12s ease;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
  }
  .filter-chip:hover { color: var(--text); }
  .filter-chip.active { background: var(--line); color: var(--text); }
  .filter-chip.active.win-chip { background: rgba(255,255,255,0.1); }
  .filter-chip.active.loss-chip { background: rgba(224,0,26,0.18); color: var(--red); }
  .filter-chip.active.be-chip { background: rgba(255,176,0,0.15); color: #ffb000; }
  .filter-clear {
    background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px;
    padding: 7px 11px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em; text-transform: uppercase; transition: all .12s ease;
  }
  .filter-clear:hover { color: var(--text); border-color: var(--muted-light); }
  .filter-spacer { flex: 1; }
  .filter-count { font-size: 11.5px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  /* ── Insights Grid ── */
  .insights-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px; }
  .insights-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 16px; }
  .insights-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 720px) { .insights-grid { grid-template-columns: repeat(2, 1fr); } }
  .insight-item { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
  .insight-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .insight-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
  .insight-value.pos { color: var(--text); }
  .insight-value.neg { color: var(--red); }
  .insight-sub { font-size: 11px; color: var(--muted-light); }

  .breakdown-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-label { width: 56px; flex-shrink: 0; font-size: 12.5px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--muted-light); }
  .breakdown-bar-track { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; border-radius: 3px; background: var(--text); }
  .breakdown-bar-fill.neg { background: var(--red); }
  .breakdown-value { width: 84px; flex-shrink: 0; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; }
  .breakdown-value.pos { color: var(--text); }
  .breakdown-value.neg { color: var(--red); }
  .breakdown-count { width: 50px; flex-shrink: 0; text-align: right; font-size: 11px; color: var(--muted); }
  .insights-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 18px; }
  @media (max-width: 720px) { .insights-cols { grid-template-columns: 1fr; } }
  .insights-col-title { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }

  /*  Tages-Briefing  */
  .brief-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
  .brief-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brief-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .brief-day { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: var(--text); }
  .brief-list { display: flex; flex-direction: column; gap: 8px; }
  .brief-item { padding: 10px 14px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 4px; display: flex; flex-direction: column; gap: 4px; }
  .brief-item.warn { border-left-color: var(--red); }
  .brief-item.good { border-left-color: var(--text); }
  .brief-short { font-size: 13.5px; line-height: 1.45; color: var(--text); }
  .brief-detail { font-size: 11.5px; line-height: 1.45; color: var(--muted-light); }
  .brief-toggle { align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--muted-light); font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 7px 12px; border-radius: 4px; cursor: pointer; transition: all .12s ease; }
  .brief-toggle:hover { color: var(--text); border-color: var(--muted-light); }
  .brief-foot { font-size: 11px; color: var(--muted); }

  /*  Tagesnotizen  */
  .notes-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .notes-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .notes-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .notes-date { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; color-scheme: dark; }
  .notes-date:focus { border-color: var(--red); }
  .notes-meta { font-size: 11.5px; color: var(--muted-light); font-family: 'JetBrains Mono', monospace; }
  .notes-pnl.pos { color: var(--text); }
  .notes-pnl.neg { color: var(--red); }
  .notes-area { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; color: var(--text); font-size: 14px; font-family: 'JetBrains Mono', monospace; outline: none; resize: vertical; min-height: 96px; line-height: 1.5; width: 100%; transition: border-color .15s ease; }
  .notes-area:focus { border-color: var(--red); }
  .notes-foot { font-size: 11px; color: var(--muted); }
  .notes-list { display: flex; flex-direction: column; gap: 8px; }
  .notes-item { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font-family: inherit; color: inherit; transition: border-color .12s ease; }
  .notes-item:hover { border-color: var(--muted-light); }
  .notes-item.active { border-left: 3px solid var(--red); }
  .notes-item-head { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted-light); font-family: 'JetBrains Mono', monospace; }
  .notes-item-text { font-size: 13px; line-height: 1.45; color: var(--text); white-space: pre-wrap; display: webkit-box 3; -webkit-box-orient: vertical; overflow: hidden; }

  /*  Toast  */
  .toast-stack { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
  .toast {
    background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--text);
    border-radius: 4px; padding: 12px 18px; font-size: 13px; color: var(--text);
    box-shadow: 0 12px 32px rgba(0,0,0,0.6); animation: toast-in .18s ease; min-width: 200px;
  }
  .toast.toast-error { border-left-color: var(--red); color: #ff6b78; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /*  Edit mode tweaks  */
  .panel-head-actions { display: flex; align-items: center; gap: 14px; }
  .edit-trade-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted-light); border-radius: 4px;
    padding: 5px 11px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; transition: all .12s ease;
  }
  .edit-trade-btn:hover { border-color: var(--muted-light); color: var(--text); }
  .trade-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /*  kbd hint  */
  .kbd-hint { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; margin-left: 8px; font-family: 'JetBrains Mono', monospace; }
  .btn-primary .kbd-hint { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.3); }

  /*  Risk Bars (Drawdown / Target)  */
  .risk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .risk-row { grid-template-columns: 1fr; } }
  .risk-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .risk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .risk-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .risk-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .risk-value.pos { color: var(--text); }
  .risk-value.neg { color: var(--red); }
  .risk-value.warn { color: #ffb020; }
  .risk-track { height: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; position: relative; }
  .risk-fill { height: 100%; border-radius: 5px; transition: width .3s ease; }
  .risk-fill.dd { background: var(--red); }
  .risk-fill.target { background: var(--text); }
  .risk-fill.target.passed { background: #2ecc71; }
  .risk-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-light); }
  .risk-marker { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.35); }

  /*  Eval toggle button  */
  .btn-secondary {
    display: flex; align-items: center; gap: 8px;
    background: transparent; color: var(--muted-light);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 18px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s ease;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .btn-secondary:hover { border-color: var(--muted-light); color: var(--text); }
  .btn-secondary.active { background: rgba(46,204,113,0.12); border-color: #2ecc71; color: #2ecc71; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }

  /*  Payout mode  */
  .payout-banner {
    background: rgba(46,204,113,0.07); border: 1px solid rgba(46,204,113,0.3); border-left: 2px solid #2ecc71;
    border-radius: 4px; padding: 12px 18px; font-size: 12.5px; color: #6fdb9a; line-height: 1.6;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .funded-banner {
    background: rgba(46,204,113,0.05); border: 1px solid rgba(46,204,113,0.25); border-left: 2px solid #2ecc71;
    border-radius: 4px; padding: 12px 18px; font-size: 12.5px; color: #6fdb9a; line-height: 1.6;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .funded-banner-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px rgba(46,204,113,0.7); flex-shrink: 0; }
  .payout-banner-clear {
    background: none; border: 1px solid var(--line); color: var(--muted-light); border-radius: 4px;
    padding: 6px 12px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0;
  }
  .payout-banner-clear:hover { border-color: var(--muted-light); color: var(--text); background: var(--panel-2); }
  .payout-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 720px) { .payout-grid { grid-template-columns: 1fr; } }
  .payout-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .payout-card-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 8px; }
  .payout-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .payout-status-dot.ok { background: #2ecc71; box-shadow: 0 0 8px rgba(46,204,113,0.6); }
  .payout-status-dot.fail { background: var(--red); box-shadow: 0 0 8px rgba(224,0,26,0.5); }
  .payout-main { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
  .payout-sub { font-size: 11.5px; color: var(--muted-light); line-height: 1.5; }
  .payout-days { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .payout-day-pip { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); }
  .payout-day-pip.hit { background: rgba(46,204,113,0.15); border-color: #2ecc71; color: #2ecc71; }

  /* ── Overlay & Panel ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82); backdrop-filter: blur(4px);
    display: flex; justify-content: center; align-items: center; z-index: 50; padding: 24px;
    overscroll-behavior: contain;
  }
  .panel { overscroll-behavior: contain; }
  /* Popup offen → Hintergrund nicht scrollbar */
  html.modal-open, html.modal-open body { overflow: hidden !important; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.8);
    width: 460px; max-width: 92vw; max-height: 88vh; padding: 28px; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 18px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-light); }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex; }
  .icon-btn:hover { color: var(--text); }

  /* ── Trade-Formular: breiteres 2-Spalten-Layout statt schmaler Scroll-Box ── */
  .panel-trade-form { width: 800px; max-width: 95vw; }
  .trade-form-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
  .trade-form-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  @media (max-width: 780px) {
    .trade-form-columns { grid-template-columns: 1fr; gap: 18px; }
  }

  /* ── Form fields ── */
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .field input {
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; color: var(--text); font-size: 15px; font-family: 'JetBrains Mono', monospace;
    outline: none; transition: border-color .15s ease; width: 100%; min-width: 0;
  }
  .field input:focus { border-color: var(--red); }
  .field-error { font-size: 12px; color: var(--red); }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
  .field-grid .field { min-width: 0; }

  /* ── Direction Toggle ── */
  .dir-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dir-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 4px; padding: 13px; font-weight: 700; font-size: 13px; cursor: pointer;
    transition: all .15s ease; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .dir-btn.dir-long.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); color: var(--text); }
  .dir-btn.dir-short.active { background: rgba(224,0,26,0.1); border-color: var(--red); color: var(--red); }
  .dir-btn.res-win.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); color: var(--text); }
  .dir-btn.res-loss.active { background: rgba(224,0,26,0.1); border-color: var(--red); color: var(--red); }
  .dir-btn.res-be.active { background: rgba(255,176,0,0.12); border-color: #ffb000; color: #ffb000; }

  /* ── Symbol Toggle ── */
  .symbol-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .symbol-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 4px; padding: 13px 10px; cursor: pointer;
    transition: all .15s ease; font-family: 'JetBrains Mono', monospace;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .symbol-btn .sym-name { font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
  .symbol-btn .sym-sub { font-size: 10.5px; color: var(--muted); letter-spacing: 0.03em; }
  .symbol-btn.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); color: var(--text); }
  .symbol-btn.active .sym-sub { color: var(--muted-light); }

  /* ── Stepper (contracts) ── */
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); width: 100%; min-width: 0; }
  .stepper button {
    background: var(--panel-2); border: none; color: var(--muted-light); width: 40px; flex-shrink: 0; cursor: pointer;
    font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', monospace; transition: background .15s ease;
  }
  .stepper button:hover { background: var(--line); color: var(--text); }
  .stepper input {
    border: none; background: transparent; text-align: center; flex: 1; min-width: 0; width: auto;
    color: var(--text); font-size: 15px; font-family: 'JetBrains Mono', monospace; outline: none;
  }

  /* ── Computed summary ── */
  .computed-box {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 14px;
  }
  .computed-item { display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
  .computed-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .computed-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }
  .computed-value.pos { color: var(--text); }
  .computed-value.neg { color: var(--red); }

  /* ── Textarea / Notiz ── */
  .field textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; color: var(--text); font-size: 14px; font-family: 'JetBrains Mono', monospace;
    outline: none; transition: border-color .15s ease; resize: vertical; min-height: 70px; line-height: 1.5;
  }
  .field textarea:focus { border-color: var(--red); }

  /* ── Screenshot Upload ── */
  .upload-box {
    border: 1px dashed var(--line); border-radius: 4px; padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--muted-light); font-size: 12px; cursor: pointer; transition: border-color .15s ease;
    text-align: center;
  }
  .upload-box:hover { border-color: var(--muted-light); }
  .upload-box input[type="file"] { display: none; }
  .upload-preview { position: relative; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .upload-preview img { width: 100%; max-height: 220px; object-fit: contain; display: block; background: var(--bg); }
  .upload-remove {
    position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); border: 1px solid var(--line);
    border-radius: 4px; color: var(--text); cursor: pointer; padding: 4px; display: flex;
  }
  .upload-remove:hover { color: var(--red); border-color: var(--red); }

  /* ── Trade row screenshot thumbnail ── */
  .trade-row { flex-wrap: wrap; }
  .trade-shot-btn {
    background: transparent; border: 1px solid var(--line); border-radius: 4px; color: var(--muted-light);
    cursor: pointer; padding: 5px 9px; font-size: 11px; display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; flex-shrink: 0;
  }
  .trade-shot-btn:hover { border-color: var(--muted-light); color: var(--text); }
  .trade-note { width: 100%; color: var(--muted-light); font-size: 12px; line-height: 1.5; padding-top: 4px; border-top: 1px dashed var(--line); margin-top: 6px; }
  .shot-overlay-img { max-width: 100%; max-height: 70vh; display: block; border-radius: 4px; border: 1px solid var(--line); }

  /* ── Day Detail ── */
  .daydetail { width: 480px; }
  .daydetail-note { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .daydetail-summary { display: flex; align-items: baseline; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; }
  .daydetail-summary .pos { color: var(--text); }
  .daydetail-summary .neg { color: var(--red); }
  .daydetail-summary .muted { font-size: 14px; color: var(--muted-light); font-weight: 400; }
  .trade-list { display: flex; flex-direction: column; gap: 8px; }
  .trade-row {
    display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 4px; padding: 12px 14px; font-size: 13.5px;
  }
  .dir-tag { font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 3px; letter-spacing: 0.08em; text-transform: uppercase; }
  .dir-tag.dir-long { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.2); }
  .dir-tag.dir-short { background: rgba(224,0,26,0.12); color: var(--red); border: 1px solid rgba(224,0,26,0.3); }
  .trade-meta { color: var(--muted-light); flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .trade-pnl { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .trade-pnl.pos { color: var(--text); }
  .trade-pnl.neg { color: var(--red); }
  .delete-btn { color: var(--muted); flex-shrink: 0; }
  .delete-btn:hover { color: var(--red); }
  .trade-row-confirm { justify-content: space-between; }
  .confirm-btn {
    border: 1px solid var(--line); border-radius: 4px; padding: 7px 13px;
    font-size: 12px; font-weight: 700; cursor: pointer; background: transparent;
    color: var(--muted-light); flex-shrink: 0; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .confirm-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .confirm-yes { border-color: var(--red); color: var(--red); }
  .confirm-yes:hover { background: rgba(224,0,26,0.12); }
  .confirm-no:hover { background: var(--panel-2); }

  /* ── Confluences ── */
  .confluence-groups { display: flex; flex-direction: column; gap: 9px; }
  .confluence-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .confluence-group-label { width: 172px; flex-shrink: 0; font-size: 11px; color: var(--muted-light); font-weight: 700; letter-spacing: 0.02em; }
  .confluence-group-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  @media (max-width: 720px) {
    .confluence-group { flex-direction: column; align-items: flex-start; gap: 5px; }
    .confluence-group-label { width: auto; }
  }
  .confluence-chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .confluence-chip {
    border: 1px solid var(--line); background: var(--bg); color: var(--muted-light);
    border-radius: 20px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all .12s ease; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.02em;
  }
  .confluence-chip:hover { border-color: var(--muted-light); color: var(--text); }
  .confluence-chip.active { background: rgba(46,204,113,0.12); border-color: #2ecc71; color: #2ecc71; }
  .confluence-chip.implied { border-style: dashed; border-color: rgba(46,204,113,0.5); color: #6fdb9a; background: rgba(46,204,113,0.04); }
  .confluence-add-row { display: flex; gap: 8px; margin-top: 4px; }
  .confluence-add-row input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 12px; color: var(--text); font-size: 13px; font-family: 'JetBrains Mono', monospace;
    outline: none; transition: border-color .15s ease; min-width: 0;
  }
  .confluence-add-row input:focus { border-color: var(--red); }
  .confluence-add-btn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted-light);
    border-radius: 4px; width: 40px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .12s ease;
  }
  .confluence-add-btn:hover { border-color: var(--muted-light); color: var(--text); }
  .confluence-tags { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin-top: 4px; }
  .confluence-chip-sm {
    background: rgba(46,204,113,0.08); border: 1px solid rgba(46,204,113,0.25); color: #6fdb9a;
    border-radius: 12px; padding: 2px 9px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Forward Test Panel ── */
  .ft-panel { width: 640px; }
  .ft-results { display: flex; flex-direction: column; gap: 6px; }
  .ft-section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
  .ft-section-divider { border-top: 1px solid var(--line); margin: 6px 0 2px; }

  @media (max-width: 720px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .cal-grid-header, .cal-week { grid-template-columns: repeat(var(--cols, 7), minmax(0,1fr)); }
    .cal-dow-week, .cal-weeksum { display: none; }
    .journal-shell { padding: 16px; }
    .filter-bar { width: 100%; }
    .filter-group { flex: 1; justify-content: space-between; }
    .breakdown-label { width: 44px; font-size: 11.5px; }
    .breakdown-value { width: 70px; font-size: 11.5px; }
    .toast-stack { left: 16px; right: 16px; bottom: 16px; }
    .toast { min-width: 0; }
    .kbd-hint { display: none; }
    .topbar { flex-wrap: wrap; gap: 14px; }
    .topbar-actions { width: 100%; }
    .btn-secondary, .topbar-actions .btn-primary { flex: 1; justify-content: center; }
  }
  /* ══ Handy / Touch ══
     Bottom-Sheets statt Pop-ups, grosse Tap-Ziele, kein iOS-Zoom beim Tippen in Felder,
     Safe-Areas (Notch/Home-Balken), schwebender "Trade hinzufuegen"-Button in Daumen-Reichweite. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { min-height: 100dvh; overflow-x: hidden; }
  #root { min-height: 100dvh; }
  button, input, select, textarea, label, .cal-cell { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (hover: none) and (pointer: coarse), (max-width: 720px) {
    .btn-primary, .btn-secondary, .filter-chip, .dir-btn, .confluence-chip, .cal-navbtn { min-height: 44px; }
    .icon-btn { padding: 10px; }
    .cal-navbtn { min-width: 44px; }
  }
  @media (max-width: 720px) {
    input, select, textarea { font-size: 16px !important; }
    .journal-shell {
      padding: max(14px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
               calc(92px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      gap: 18px; font-size: 1em;
    }
    .topbar { padding-bottom: 14px; }
    .topbar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .topbar-actions .btn-secondary { padding: 10px 8px; font-size: 12px; }
    .topbar-actions .btn-primary {
      position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 40; border-radius: 999px; padding: 14px 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.14);
    }
    .toast-stack { bottom: calc(84px + env(safe-area-inset-bottom)); }

    .hero { padding: 18px 16px; gap: 14px; flex-direction: column; align-items: stretch; }
    .hero-balance { min-width: 0; }
    .hero-value { font-size: 32px; }
    .hero-curve { min-width: 0; max-width: 100%; width: 100%; flex: none; }
    .equity-svg { height: 110px; }
    .stat-card { padding: 14px; min-width: 0; }
    .insights-card, .risk-card, .payout-card { padding: 16px; }

    .cal-title { font-size: 17px; }
    .cal-grid-header, .cal-week { gap: 3px; }
    .cal-dow { font-size: 10px; letter-spacing: 0; }
    .cal-cell { min-height: 54px; padding: 5px 4px; border-radius: 3px; min-width: 0; }
    .cal-daynum { font-size: 10.5px; }
    .cal-pnl { font-size: 10.5px; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; }
    .cal-count, .cal-historic-badge { font-size: 8.5px; }
    .cal-weeksum {
      display: flex; grid-column: 1 / -1; flex-direction: row; align-items: center;
      justify-content: space-between; min-height: 0; padding: 6px 10px; margin-bottom: 4px;
    }

    /* Panels als Bottom-Sheet (auch das Freunde-Fenster mit seiner festen Breite) */
    .overlay { padding: 0; align-items: flex-end; }
    .overlay > .panel {
      width: 100% !important; max-width: 100% !important; max-height: 94dvh !important;
      border-radius: 16px 16px 0 0; border-bottom: none; gap: 14px;
      padding: 18px 14px calc(20px + env(safe-area-inset-bottom)); overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .overlay > .panel > .panel-head {
      position: sticky; top: 0; z-index: 2; background: var(--panel);
      margin: -18px -14px 0; padding: 18px 14px 10px; border-bottom: 1px solid var(--line);
    }
    .shot-overlay-img { max-width: 100%; height: auto; }

    /* Freunde-Vergleich: Spalten enger bzw. untereinander */
    [style*="repeat(3,"] { grid-template-columns: 1fr !important; }
    [style*="grid-row"] { grid-column: 1 !important; grid-row: auto !important; }
    [style*="190px 1fr 1fr"] { grid-template-columns: 84px 1fr 1fr !important; gap: 8px !important; }
    [style*="180px 1fr 1fr"] { grid-template-columns: 96px 1fr 1fr !important; gap: 8px !important; }
    [style*="112px 1fr 1fr"] { grid-template-columns: 76px 1fr 1fr !important; gap: 8px !important; }
  }

  /* ── Analyse-Panel ── */
  .an-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .an-tabs { flex-wrap: wrap; }
  .an-scroll { overflow-x: auto; }
  .an-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .an-table th { text-align: left; font-size: 10.5px; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 14px 10px 0; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .an-table td { padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
  .an-table tr:last-child td { border-bottom: none; }
  .an-table td.pos { color: var(--text); }
  .an-table td.neg { color: var(--red); }
  .an-note { display: block; margin-top: 14px; font-size: 11px; line-height: 1.6; color: var(--muted-light); }
  .an-note.neg { color: #ff6b78; }
  .insight-sub.pos { color: var(--text); }
  .insight-sub.neg { color: var(--red); }
  .heat-months, .heat-grid { display: grid; gap: 3px; }
  .heat-months { font-size: 10px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.06em; text-transform: uppercase; }
  .heat-grid { grid-template-rows: repeat(7, 13px); grid-auto-flow: column; }
  .heat-cell { width: 13px; height: 13px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--line); }
  .heat-cell.has { border-color: transparent; }

  /* ── Accounts ── */
  .acct-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .acct-bar .btn-secondary { padding: 9px 13px; font-size: 11.5px; }
  .acct-bar .filter-chip { display: inline-flex; align-items: center; }
  .acct-tag { font-size: 9px; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted-light); margin-left: 7px; }
  .acct-tag.xfa { color: #2ecc71; border-color: rgba(46,204,113,0.45); }
  .acct-note { font-size: 11.5px; color: var(--muted-light); line-height: 1.6; margin-top: -10px; }
  .cal-cell-other { opacity: 0.62; }
  @media (max-width: 720px) {
    .acct-bar .filter-group { flex-wrap: wrap; }
    .acct-bar .btn-secondary, .acct-bar .filter-chip { min-height: 40px; }
  }

  /* ═══════════════ MODERN REFRESH (Override-Layer) ═══════════════
     Ueberschreibt nur Optik (Farben, Radien, Schrift, Schatten) — keine Logik, kein Layout.
     Zum Zuruecksetzen alles bis "END MODERN REFRESH" loeschen. */
  :root {
    --bg: #000000;
    --panel: #08080a;
    --panel-2: #0c0c0f;
    --line: rgba(255,255,255,0.06);
    --muted: #62626c;
    --muted-light: #8e8e98;
    --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --r-lg: 16px;
    --r-md: 12px;
    --r-sm: 9px;
    --shadow-card: 0 1px 0 rgba(255,255,255,0.045) inset, 0 10px 30px rgba(0,0,0,0.35);
  }
  html { background: var(--bg); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
  html, body { font-family: var(--font-ui); }
  body { background: var(--bg); }
  /* Logo: verschmilzt mit dem Hintergrund (Schwarz wird durch screen unsichtbar, Raender laufen weich aus) */
  img[alt="Logo"] {
    object-fit: contain; border-radius: 0 !important; mix-blend-mode: screen;
    -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
  }
  ::selection { background: rgba(224,0,26,0.5); color: #fff; }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.18) transparent; }
  button:focus-visible, .cal-cell:focus-visible, a:focus-visible { outline: 2px solid rgba(255,255,255,0.55); outline-offset: 2px; }

  /* Topbar */
  .topbar { border-bottom-color: var(--line); }
  .brand-mark { box-shadow: 0 0 12px rgba(224,0,26,0.55); }
  .brand-name { font-family: var(--font-ui); font-weight: 600; letter-spacing: 0.18em; }

  /* Karten */

  const rawGet = Storage.prototype.getItem;
  const rawSet = Storage.prototype.setItem;
  const nsKey = (k) => {
    if (typeof k !== "string") return k;
    // Account-Liste und aktiver Account gelten fuers ganze Profil.
    if (k === ACCOUNTS_LS_KEY || k === ACTIVE_ACCOUNT_LS_KEY) return `${k}__${ACTIVE_PROFILE.id}`;
    // Tagesnotizen gelten fuers ganze Profil (alle Accounts).
    if (k === NOTES_LS_KEY) return `${k}__${ACTIVE_PROFILE.id}`;
    // Funded-Stage-Einstellungen & Payouts: pro Profil UND pro Account. Der Hauptaccount behaelt die bisherigen Schluessel.
    if (k.startsWith("journal_funded")) {

    }

  // Schluessel in der Settings-Tabelle: Einstellungen eines Zusatz-Accounts bekommen den Account als Suffix.
  const remoteKey = (k) => (k.startsWith("journal_funded") && ACTIVE_ACCOUNT_ID !== MAIN_ACCOUNT_ID ? `${k}__${ACTIVE_ACCOUNT_ID}` : k);
  // Einmalige Uebernahme der bisherigen Werte fuer den urspruenglichen Besitzer.
  if (ACTIVE_PROFILE.legacyOwner && ACTIVE_ACCOUNT_ID === MAIN_ACCOUNT_ID) {
    ["journal_funded_stage", "journal_funded_start_date", "journal_funded_activated_at"].forEach((k) => {

        if (legacy !== null && rawGet.call(localStorage, nsKey(k)) === null) rawSet.call(localStorage, nsKey(k), legacy);
      } catch {}
    });
  }
  // ── Sync ueber Supabase (Tabelle "Settings", SQL siehe unten im Kommentar) ──
  // Funded Stage, Start-Datum, Aktivierungs-Zeitpunkt und Payout-Log lagen bisher nur im Browser des
  // Geraets, auf dem sie gesetzt wurden (Handy startete deshalb immer in der Eval Stage). Jetzt werden
  // sie zusaetzlich in der Datenbank gespeichert und beim Start geladen. Die Datenbank gewinnt; nur wenn
  // dort noch nichts steht, wird der lokale Wert hochgeladen. Fehlt die Tabelle, bleibt alles lokal.
  const SYNC_KEYS = ["journal_funded_stage", "journal_funded_start_date", "journal_funded_activated_at", "journal_funded_payouts", "journal_funded_last_payout", ACCOUNTS_LS_KEY, NOTES_LS_KEY, `journal_backtest__${ACTIVE_PROFILE.id}`];
  const settingsOn = !String(ACTIVE_PROFILE.url).includes("DEIN-PROJEKT") && !String(ACTIVE_PROFILE.key).includes("DEIN-ANON-KEY");
  const SETTINGS_URL = `${String(ACTIVE_PROFILE.url).replace(/\/+$/, "")}/rest/v1/Settings`;
  const sbH = { apikey: ACTIVE_PROFILE.key, Authorization: `Bearer ${ACTIVE_PROFILE.key}`, "Content-Type": "application/json" };
  const pushSetting = (k, v) => {
    if (!settingsOn) return Promise.resolve();
    return fetch(`${SETTINGS_URL}?on_conflict=key`, {
      method: "POST",
      headers: { ...sbH, Prefer: "resolution=merge-duplicates,return=minimal" },

    return r;
  };

    if (!settingsOn) return;
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 4000);
      const res = await fetch(`${SETTINGS_URL}?select=key,value&key=not.like.bt_shot_*`, { headers: sbH, signal: ctrl.signal });
      clearTimeout(to);
      if (!res.ok) return; // Tabelle fehlt -> nur lokal
      const remote = {};
      (await res.json()).forEach((r) => { remote[r.key] = r.value; });
      SYNC_KEYS.forEach((k) => {
        const rk = remoteKey(k);
        if (remote[rk] !== undefined && remote[rk] !== null) rawSet.call(localStorage, nsKey(k), remote[rk]);
        else {

    } catch {}
  })();
}

// Maerkte mit Mini-/Micro-Variante. Gespeichert wird weiterhin das konkrete Symbol
// (NQ, MNQ, ES, MES, GC, MGC), damit bestehende Trades kompatibel bleiben.
const MARKETS = {
  NQ: { mini: "NQ", micro: "MNQ" },
  ES: { mini: "ES", micro: "MES" },
  GC: { mini: "GC", micro: "MGC" },
};
const marketOf = (symbol) =>
  Object.keys(MARKETS).find((m) => MARKETS[m].mini === symbol || MARKETS[m].micro === symbol) || "NQ";
const isMicroSymbol = (symbol) => MARKETS[marketOf(symbol)].micro === symbol;

function computeTrade({ symbol, contracts, stop_loss, take_profit, result }) {
  const cfg = SYMBOLS[symbol] || SYMBOLS.NQ;
  const c = Number(contracts) || 0;
  const sl = stop_loss === "" || stop_loss === null ? null : Number(stop_loss);
  const tp = take_profit === "" || take_profit === null ? null : Number(take_profit);

  const risk_amount = sl !== null ? Math.abs(sl) * cfg.perPoint * c : null;
  const reward_amount = tp !== null ? Math.abs(tp) * cfg.perPoint * c : null;
  const rr = risk_amount && reward_amount ? reward_amount / risk_amount : null;

  let pnl = null;
  if (result === "win" && reward_amount !== null) pnl = reward_amount;
  if (result === "loss" && risk_amount !== null) pnl = -risk_amount;
  if (result === "be") pnl = 0;

  // realized_rr: Der TATSÄCHLICH erzielte RR-Wert für die Statistik.
  // Win  -> geplantes RR (reward/risk), wie gewohnt
  // Loss -> immer exakt -1, unabhängig davon wie groß das geplante RR war
  //         (ein Trade, der für 30RR geplant war aber in den SL läuft, zählt als -1RR, nicht -30RR)
  let realized_rr = null;
  if (result === "win") realized_rr = rr;
  else if (result === "loss") realized_rr = risk_amount !== null ? -1 : null; // Loss ist immer -1R, TP wird nicht gebraucht
  else if (result === "be") realized_rr = 0;

  return { risk_amount, reward_amount, rr, realized_rr, pnl };
}

function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));

  d.setUTCDate(d.getUTCDate() - dayNum + 3);

/* ============================================================
   ANALYTICS — reine Berechnungsfunktionen (ohne React, per #selftest pruefbar)
   Alles hier arbeitet nur auf Trade-Listen und liefert Zahlen/Objekte zurueck.
   ============================================================ */
const mean = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0);
const stdev = (a) => {
  if (a.length < 2) return 0;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1));
};
const finiteNums = (a) => a.filter((v) => v !== null && v !== undefined && Number.isFinite(v));
const median = (a) => {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
const quantile = (a, q) => {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  const pos = (s.length - 1) * q;
  const lo = Math.floor(pos);
  const hi = Math.ceil(pos);
  return s[lo] + (s[hi] - s[lo]) * (pos - lo);
};

// Realisierte Punkte eines Trades (Win = TP, Loss = -SL, BE = 0)
const tradePoints = (t) => {
  if (t.result === "be") return 0;
  if (t.result === "win") return t.take_profit !== null && t.take_profit !== undefined && t.take_profit !== "" ? Number(t.take_profit) : null;
  if (t.result === "loss") return t.stop_loss !== null && t.stop_loss !== undefined && t.stop_loss !== "" ? -Math.abs(Number(t.stop_loss)) : null;
  return null;
};

// Chronologische Reihenfolge: Datum, dann Uhrzeit (falls erfasst), dann ID
const sortChrono = (list) =>
  [...list].sort((a, b) => {
    if (a.trade_date !== b.trade_date) return a.trade_date < b.trade_date ? -1 : 1;
    const ta = a.entry_time || "";
    const tb = b.entry_time || "";
    if (ta !== tb) return ta < tb ? -1 : 1;
    return Number(a.id || 0) - Number(b.id || 0);
  });

// Wilson-Score-Intervall (95 %) fuer eine Trefferquote. Bei kleinen Stichproben ist die nackte
// Winrate irrefuehrend (3 von 3 = 100 %), das Intervall zeigt die echte Unsicherheit.
function wilsonInterval(wins, n, z = 1.96) {
  if (!n) return { p: 0, low: 0, high: 0 };
  const p = wins / n;
  const z2 = z * z;
  const denom = 1 + z2 / n;
  const centre = (p + z2 / (2 * n)) / denom;
  const half = (z * Math.sqrt((p * (1 - p)) / n + z2 / (4 * n * n))) / denom;
  return { p, low: Math.max(0, centre - half), high: Math.min(1, centre + half) };
}
const fmtCI = (wins, n) => {
  if (!n) return "—";
  const w = wilsonInterval(wins, n);
  return `${(w.low * 100).toFixed(0)}–${(w.high * 100).toFixed(0)}%`;
};

// Equity-/Drawdown-Verlauf einer Trade-Liste (relativ zu 0, trade fuer trade)
function equityPath(list) {
  let run = 0;
  let peak = 0;
  let maxDD = 0;
  const pts = [];
  sortChrono(list).forEach((t) => {
    run += Number(t.pnl || 0);
    if (run > peak) peak = run;
    if (peak - run > maxDD) maxDD = peak - run;
    pts.push(run);
  });
  return { pts, maxDD, net: run };
}

// Kennzahlen zur Qualitaet des Edges
function computeEdgeStats(list) {
  const wins = list.filter((t) => t.result === "win");
  const losses = list.filter((t) => t.result === "loss");
  const decided = wins.length + losses.length;
  const winPnl = wins.map((t) => Number(t.pnl || 0));
  const lossPnl = losses.map((t) => Number(t.pnl || 0));
  const avgWin = mean(winPnl);
  const avgLoss = mean(lossPnl); // negativ
  const payoff = avgLoss < 0 ? avgWin / Math.abs(avgLoss) : avgWin > 0 ? Infinity : 0;
  // Trades ohne Plan (plan_followed === false) zaehlen nicht in die Winrate
  const wrWins = wins.filter((t) => t.plan_followed !== false).length;
  const wrLosses = losses.filter((t) => t.plan_followed !== false).length;
  const winrate = wrWins + wrLosses ? wrWins / (wrWins + wrLosses) : 0;
  const rs = finiteNums(list.map(tradeRR));
  const expR = mean(rs);
  const sdR = stdev(rs);
  // SQN nach Van Tharp, Stichprobe auf max. 100 Trades normiert
  const sqn = rs.length >= 5 && sdR > 0 ? (Math.sqrt(Math.min(rs.length, 100)) * expR) / sdR : null;
  // Kelly: f = W - (1 - W) / Payoff. Nur sinnvoll mit endlichem Payoff > 0.
  const kelly = Number.isFinite(payoff) && payoff > 0 && decided >= 10 ? winrate - (1 - winrate) / payoff : null;
  const path = equityPath(list);
  const recovery = path.maxDD > 0 ? path.net / path.maxDD : null;
  const risks = finiteNums(list.map((t) => (t.risk_amount === null || t.risk_amount === undefined ? null : Number(t.risk_amount)))).filter((v) => v > 0);
  const expectancy = decided ? (winPnl.reduce((s, v) => s + v, 0) + lossPnl.reduce((s, v) => s + v, 0)) / decided : 0;
  return {
    n: list.length, decided, winrate, avgWin, avgLoss, payoff, expectancy,
    expR, sdR, sqn, kelly, net: path.net, maxDD: path.maxDD, recovery,
    avgRisk: mean(risks), maxRisk: risks.length ? Math.max(...risks) : 0, riskN: risks.length,
  };
}
const sqnLabel = (s) => {
  if (s === null || s === undefined) return T("zu wenig Daten", "not enough data");
  if (s < 1.6) return T("schwach", "weak");
  if (s < 2) return T("unterdurchschnittlich", "below average");
  if (s < 2.5) return T("durchschnittlich", "average");
  if (s < 3) return T("gut", "good");
  if (s < 5) return T("sehr gut", "very good");
  return T("außergewöhnlich", "excellent");
};

// Verteilung der realisierten Ergebnisse in R-Klassen
const R_BUCKETS = ["Loss", "BE", "0–1R", "1–2R", "2–3R", "3–5R", "5R+"];
function rDistribution(list) {
  const counts = Object.fromEntries(R_BUCKETS.map((b) => [b, 0]));
  list.forEach((t) => {
    if (t.result === "loss") counts.Loss += 1;
    else if (t.result === "be") counts.BE += 1;
    else if (t.result === "win") {
      const r = tradeRR(t);
      if (r === null || Number.isNaN(r)) return;
      counts[r < 1 ? "0–1R" : r < 2 ? "1–2R" : r < 3 ? "2–3R" : r < 5 ? "3–5R" : "5R+"] += 1;
    }
  });
  const total = R_BUCKETS.reduce((s, b) => s + counts[b], 0);
  return { total, rows: R_BUCKETS.map((b) => ({ label: b, count: counts[b], share: total ? counts[b] / total : 0 })) };
}

// Verhaltensanalyse: wie verhaelt sich das Ergebnis nach Gewinn/Verlust, nach Tagesanzahl, nach Uhrzeit?
function behaviorStats(list) {
  const mk = () => ({ n: 0, wins: 0, losses: 0, wrW: 0, wrL: 0, pnl: 0, noPlan: 0, planKnown: 0 });
  const add = (g, t) => {
    g.n += 1;
    g.pnl += Number(t.pnl || 0);
    if (t.result === "win") { g.wins += 1; if (t.plan_followed !== false) g.wrW += 1; }
    else if (t.result === "loss") { g.losses += 1; if (t.plan_followed !== false) g.wrL += 1; }
    if (t.plan_followed === true || t.plan_followed === false) {
      g.planKnown += 1;
      if (t.plan_followed === false) g.noPlan += 1;
    }
  };
  const fin = (g) => {
    const d = g.wins + g.losses;
    return { ...g, winrate: g.wrW + g.wrL ? g.wrW / (g.wrW + g.wrL) : 0, avgPnl: g.n ? g.pnl / g.n : 0, noPlanShare: g.planKnown ? g.noPlan / g.planKnown : 0 };
  };
  const first = mk(), afterWin = mk(), afterLoss = mk(), bigger = mk(), notBigger = mk();
  const byDay = new Map();
  sortChrono(list).forEach((t) => {
    if (!byDay.has(t.trade_date)) byDay.set(t.trade_date, []);
    byDay.get(t.trade_date).push(t);
  });
  const dayRows = [];
  byDay.forEach((arr, date) => {
    let prev = null;
    arr.forEach((t) => {
      if (!prev) add(first, t);
      else if (prev.result === "loss") {
        add(afterLoss, t);
        // Groesser nach Verlust: mehr Contracts als beim verlorenen Trade (klassisches Revenge-Muster)
        if (Number(t.contracts) > Number(prev.contracts)) add(bigger, t);
        else add(notBigger, t);
      } else if (prev.result === "win") add(afterWin, t);
      prev = t;
    });
    dayRows.push({ date, n: arr.length, pnl: arr.reduce((s, t) => s + Number(t.pnl || 0), 0) });
  });
  // Tage nach Anzahl der Trades gruppieren (1, 2, 3, 4+)
  const dayGroups = [1, 2, 3, 4].map((k) => {
    const rows = dayRows.filter((d) => (k === 4 ? d.n >= 4 : d.n === k));
    return {
      label: k === 4 ? "4+" : String(k),
      days: rows.length,
      avgPnl: mean(rows.map((r) => r.pnl)),
      greenShare: rows.length ? rows.filter((r) => r.pnl > 0).length / rows.length : 0,
      pnl: rows.reduce((s, r) => s + r.pnl, 0),
    };
  });
  // Uhrzeit (nur Trades mit erfasster entry_time "HH:MM")
  const hourMap = new Map();
  list.forEach((t) => {
    const m = /^(\d{1,2}):(\d{2})/.exec(t.entry_time || "");
    if (!m) return;
    const h = Number(m[1]);
    if (!hourMap.has(h)) hourMap.set(h, mk());
    add(hourMap.get(h), t);
  });
  const byHour = Array.from(hourMap.entries()).sort((a, b) => a[0] - b[0]).map(([h, g]) => ({ hour: h, ...fin(g) }));
  return {
    first: fin(first), afterWin: fin(afterWin), afterLoss: fin(afterLoss), bigger: fin(bigger), notBigger: fin(notBigger),
    dayGroups, byHour, timedCount: byHour.reduce((s, r) => s + r.n, 0),
    multiTradeDays: dayRows.filter((d) => d.n >= 2).length, dayCount: dayRows.length,
  };
}

// Seedbarer Zufallsgenerator (Mulberry32), damit die Simulation reproduzierbar bleibt
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Monte-Carlo: Ziehen mit Zuruecklegen aus den bisherigen Trade-Ergebnissen. Tage werden mit der
// historischen Trades-pro-Tag-Verteilung gebildet. Die MLL (EOD-Trailing, gedeckelt) wird nur zum
// Tagesende nachgezogen, ein Breach wird aber schon intraday (nach jedem Trade) erkannt.
// Das ist eine Schaetzung auf Basis der eigenen Historie, keine Garantie.
function monteCarlo({ pnls, dayLens, balance, eodPeak, target, ddBuffer, peakCap, staticMll = null, sims = 4000, maxDays = 60, seed = 7 }) {
  if (!pnls.length) return null;
  const rnd = mulberry32(seed);
  const lens = dayLens && dayLens.length ? dayLens : [1];
  const mllFor = (peak) => (staticMll !== null ? staticMll : Math.min(peak, peakCap) - ddBuffer);
  let pass = 0, bust = 0, open = 0;
  const daysToPass = [];
  const finals = [];
  for (let s = 0; s < sims; s++) {
    let bal = balance;
    let peak = Math.max(eodPeak, balance);
    let mll = mllFor(peak);
    let outcome = "open";
    let day = 0;
    while (day < maxDays && outcome === "open") {
      day += 1;
      const k = lens[Math.floor(rnd() * lens.length)];
      for (let i = 0; i < k; i++) {
        bal += pnls[Math.floor(rnd() * pnls.length)];
        if (bal <= mll) { outcome = "bust"; break; }
      }
      if (outcome === "bust") break;
      if (bal > peak) { peak = bal; mll = mllFor(peak); }
      if (bal >= target) outcome = "pass";
    }
    if (outcome === "pass") { pass += 1; daysToPass.push(day); }
    else if (outcome === "bust") bust += 1;
    else open += 1;
    finals.push(bal);
  }
  return {
    sims, pass: pass / sims, bust: bust / sims, open: open / sims,
    medianDays: daysToPass.length ? median(daysToPass) : null,
    p25Days: daysToPass.length ? quantile(daysToPass, 0.25) : null,
    p75Days: daysToPass.length ? quantile(daysToPass, 0.75) : null,
    p10Final: quantile(finals, 0.1), p50Final: quantile(finals, 0.5), p90Final: quantile(finals, 0.9),
    maxDays,
  };
}

// Auswertung nach Monat oder Woche (Woche = Montag als Schluessel)
const weekStartIso = (iso) => {
  const d = new Date(`${iso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
};
function periodReport(list, by = "month") {
  const groups = new Map();
  list.forEach((t) => {
    if (!t.trade_date) return;
    const key = by === "week" ? weekStartIso(t.trade_date) : t.trade_date.slice(0, 7);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  });
  return Array.from(groups.entries())
    .sort((a, b) => (a[0] < b[0] ? 1 : -1))
    .map(([key, arr]) => {
      const wins = arr.filter((t) => t.result === "win");
      const losses = arr.filter((t) => t.result === "loss");
      const gp = wins.reduce((s, t) => s + Number(t.pnl || 0), 0);
      const gl = Math.abs(losses.reduce((s, t) => s + Number(t.pnl || 0), 0));
      const dayMap = new Map();
      arr.forEach((t) => dayMap.set(t.trade_date, (dayMap.get(t.trade_date) || 0) + Number(t.pnl || 0)));
      const dayVals = Array.from(dayMap.values());
      const decided = wins.length + losses.length;
      const rs = finiteNums(arr.map(tradeRR));
      return {
        key, n: arr.length, wins: wins.length, losses: losses.length,
        pnl: arr.reduce((s, t) => s + Number(t.pnl || 0), 0),
        winrate: (() => { const w = wins.filter((t) => t.plan_followed !== false).length, l = losses.filter((t) => t.plan_followed !== false).length; return w + l ? (w / (w + l)) * 100 : 0; })(),
        pf: gl > 0 ? gp / gl : gp > 0 ? Infinity : 0,
        avgR: mean(rs),
        days: dayVals.length, greenDays: dayVals.filter((v) => v > 0).length,
        best: dayVals.length ? Math.max(...dayVals) : 0, worst: dayVals.length ? Math.min(...dayVals) : 0,
      };
    });
}

// Tages-PnL als Map (fuer Heatmap und Kalender-Zusammenfassungen)
function dailyPnlMap(list) {
  const m = new Map();
  list.forEach((t) => {
    if (!t.trade_date) return;
    const e = m.get(t.trade_date) || { pnl: 0, n: 0 };
    e.pnl += Number(t.pnl || 0);
    e.n += 1;
    m.set(t.trade_date, e);
  });
  return m;
}

function TradingJournal() {
  // Stand vom letzten Besuch sofort anzeigen (ohne Screenshots) und im Hintergrund aktualisieren.
  const [cachedTrades] = useState(() => {
    try {
      const c = isConfigured && JSON.parse(localStorage.getItem(`journal_trades_cache__${ACTIVE_PROFILE ? ACTIVE_PROFILE.id : "x"}`));

  const [error, setError] = useState(null);
  const [panelOpen, setPanelOpen] = useState(false);

  // Nach dem Sync mit der Datenbank die Notizen neu laden.
  useEffect(() => {

  }, []);
  const [editingTrade, setEditingTrade] = useState(null);

  const [filterResult, setFilterResult] = useState("all");
  const { toasts, push: pushToast } = useToasts();

  // ── Accounts: mehrere Konten pro Profil (Eval / XFA, beliebig kombinierbar) ──
  // allTrades = alles aus der Datenbank. accountTrades = nur das aktive Konto (Balance, Drawdown, Payout).
  // trades = was Kalender, Stats und Analyse zeigen: aktuelles Konto oder "All time" (alle Konten).
  const [accounts, setAccounts] = useState(() => loadAccounts());
  const [scopeMode, setScopeModeState] = useState(() => {
    try { return localStorage.getItem("journal_scope_mode") === "all" ? "all" : "current"; } catch { return "current"; }
  });
  const setScopeMode = useCallback((m) => {
    setScopeModeState(m);
    try { localStorage.setItem("journal_scope_mode", m); } catch {}
  }, []);
  const [accountPanel, setAccountPanel] = useState(null); // null | "add" | "reset"
  const [accountBusy, setAccountBusy] = useState(false);
  const activeAccount = useMemo(
    () => accounts.find((a) => a.id === ACTIVE_ACCOUNT_ID)
      || { id: ACTIVE_ACCOUNT_ID, name: ACTIVE_ACCOUNT_ID === MAIN_ACCOUNT_ID ? T("Hauptaccount", "Main account") : ACTIVE_ACCOUNT_ID, type: "eval", archived: false },
    [accounts]
  );
  const accountTrades = useMemo(() => allTrades.filter((t) => accountOf(t) === ACTIVE_ACCOUNT_ID), [allTrades]);
  const trades = scopeMode === "all" ? allTrades : accountTrades;
  const otherTradeCount = allTrades.length - accountTrades.length;
  const switchAccount = (id) => {
    if (id === ACTIVE_ACCOUNT_ID) return;
    try { localStorage.setItem(ACTIVE_ACCOUNT_LS_KEY, id); } catch {}
    window.location.reload();
  };

  // ── Funded Stage: wird einmalig aktiviert sobald Balance >= 53k ──
  // Ab diesem Zeitpunkt startet der Account neu auf 50k.
  // Alte (Eval-)Trades bleiben im Kalender sichtbar, aber ihr PnL
  // fliesst nicht mehr in die neue Balance ein.
  // fundedActivatedAt: ISO-datetime des Klicks — Trades mit created_at DAVOR sind Eval.
  const [fundedStage, setFundedStage] = useState(() => {
    try { return localStorage.getItem("journal_funded_stage") === "1"; } catch { return false; }
  });
  const [fundedStartDate, setFundedStartDate] = useState(() => {
    try { return localStorage.getItem("journal_funded_start_date") || null; } catch { return null; }
  });
  const [fundedActivatedAt, setFundedActivatedAt] = useState(() => {
    try { return localStorage.getItem("journal_funded_activated_at") || null; } catch { return null; }
  });

  // Payout-Log (pro Profil im Browser gespeichert, wie die Funded-Stage-Einstellungen):
  // jeder Eintrag = Datum + Betrag (brutto, vom Konto abgebucht). Der letzte Eintrag startet den naechsten Zyklus.
  const [payouts, setPayouts] = useState(() => {
    try {
      const raw = localStorage.getItem("journal_funded_payouts");
      if (raw) { const v = JSON.parse(raw); if (Array.isArray(v)) return v; }
      // Uebernahme des frueheren Einzel-Datums "letzter Payout"
      const old = localStorage.getItem("journal_funded_last_payout");
      if (old) return [{ date: old, amount: null }];
    } catch {}

  });
  const savePayouts = useCallback((next) => {
    const sorted = [...next].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    try { localStorage.setItem("journal_funded_payouts", JSON.stringify(sorted)); } catch {}

  }, []);
  const addPayout = useCallback((date, amount) => {
    savePayouts([...payouts, { date, amount }]);

  }, [payouts, savePayouts, pushToast]);
  const deletePayout = useCallback((p) => {
    if (!window.confirm(T("Diesen Payout-Eintrag löschen?", "Delete this payout entry?"))) return;
    savePayouts(payouts.filter((x) => x !== p));
  }, [payouts, savePayouts]);
  const lastPayoutDate = payouts.length ? payouts[payouts.length - 1].date : "";
  const payoutCount = payouts.length;
  const payoutTotal = payouts.reduce((s, p) => s + (Number(p.amount) || 0), 0);

  const evalPassed = fundedStage;
  const evalPassedDate = fundedStartDate;

  const activateFundedStage = useCallback(() => {
    const d = localIsoToday();
    const dt = new Date().toISOString();
    try {
      localStorage.setItem("journal_funded_stage", "1");
      localStorage.setItem("journal_funded_start_date", d);
      localStorage.setItem("journal_funded_activated_at", dt);

    setFundedStage(true);
    setFundedStartDate(d);
    setFundedActivatedAt(dt);
    pushToast(T("Funded Stage aktiviert — Account startet neu auf $50.000", "Funded stage activated — account restarts at $50,000"));
  }, [pushToast]);

  // Pausiert die Funded Stage OHNE das urspruengliche Start-/Aktivierungsdatum zu
  // loeschen — so bleibt ein spaeteres "Zurueck zur Funded Stage" (reactivateFundedStage)
  // exakt und der Kalender wird durch ein versehentliches Umschalten nicht verfaelscht.
  const resetToEvalStage = useCallback(() => {
    try {
      localStorage.setItem("journal_funded_stage", "0");
    } catch {}
    setFundedStage(false);
    pushToast(T("Zurueck zur Eval Stage", "Back to eval stage"));
  }, [pushToast]);

  // Aktiviert die Funded Stage erneut MIT dem bereits gespeicherten Start-/
  // Aktivierungsdatum (kein neuer Zeitstempel) — dafuer muss kein neuer Trade
  // eingetragen werden und der Kalender bleibt akkurat.
  const reactivateFundedStage = useCallback(() => {
    try {
      localStorage.setItem("journal_funded_stage", "1");
    } catch {}
    setFundedStage(true);
    pushToast(T("Funded Stage wieder aktiv", "Funded stage active again"));
  }, [pushToast]);

  // Einmalige Wiederherstellung fuer den Fall, dass Start-/Aktivierungsdatum bereits
  // verloren gegangen sind (z. B. durch eine alte Version dieses Buttons). Nimmt ein
  // vom Nutzer eingetragenes Datum/Uhrzeit entgegen und setzt Funded Stage darauf.
  const restoreFundedStage = useCallback((dateTimeLocal) => {
    if (!dateTimeLocal) return;
    const dt = new Date(dateTimeLocal).toISOString();
    const d = dateTimeLocal.slice(0, 10); // lokales Datum aus dem datetime-local-Feld (nicht UTC)
    try {
      localStorage.setItem("journal_funded_stage", "1");
      localStorage.setItem("journal_funded_start_date", d);
      localStorage.setItem("journal_funded_activated_at", dt);
    } catch {}
    setFundedStage(true);
    setFundedStartDate(d);
    setFundedActivatedAt(dt);
    pushToast(T("Funded Stage wiederhergestellt", "Funded stage restored"));
  }, [pushToast]);

  // Funded-Stage-Schnitt: Eval-Trades (vor der Aktivierung) werden nur in der Ansicht "Aktueller Account" aus Stats/Kalender
  // herausgerechnet. In der All-time-Ansicht zaehlt alles.
  const fundedCut = scopeMode === "all" ? null : (fundedStage && fundedActivatedAt ? fundedActivatedAt : null);

  const updateAccounts = useCallback((fn) => {
    setAccounts((prev) => {
      const next = fn(prev);
      saveAccounts(next);
      return next;
    });
  }, []);

  // Neu angelegter XFA-Account: Funded Stage direkt aktivieren (einmalig beim ersten Oeffnen des Accounts).
  useEffect(() => {
    if (!activeAccount.init) return;
    if (activeAccount.init === "xfa") {
      const d = localIsoToday();
      const dt = new Date().toISOString();
      try {
        localStorage.setItem("journal_funded_stage", "1");
        localStorage.setItem("journal_funded_start_date", d);
        localStorage.setItem("journal_funded_activated_at", dt);
      } catch {}
      setFundedStage(true);
      setFundedStartDate(d);
      setFundedActivatedAt(dt);
    }
    updateAccounts((prev) => prev.map((a) => (a.id === ACTIVE_ACCOUNT_ID ? { ...a, init: null } : a)));
  }, []);

  // Typ-Label (Eval / XFA) des aktiven Accounts in der Account-Liste aktuell halten (fuer die Chips der anderen Accounts).
  useEffect(() => {
    if (activeAccount.init) return;
    const type = fundedStage ? "xfa" : "eval";
    const cur = accounts.find((a) => a.id === ACTIVE_ACCOUNT_ID);
    if (cur && cur.type === type) return;
    updateAccounts((prev) => {
      const base = prev.some((a) => a.id === ACTIVE_ACCOUNT_ID) ? prev : [...prev, { ...activeAccount }];
      return base.map((a) => (a.id === ACTIVE_ACCOUNT_ID ? { ...a, type } : a));
    });
  }, [fundedStage]);

  // Neuen Account anlegen. Bei "Account Reset" (archiveCurrent) wird der aktuelle Account archiviert; seine Trades

  const createAccount = useCallback(async ({ name, type, preset, rules, archiveCurrent }) => {
    if (archiveCurrent && !window.confirm(T(
      `Account "${activeAccount.name}" archivieren und mit einem neuen, leeren Account starten? Die alten Trades bleiben gespeichert und sind ueber "All time" weiter sichtbar.`,
      `Archive account "${activeAccount.name}" and start a new, empty account? The old trades stay saved and remain visible under "All time".`
    ))) return;
    setAccountBusy(true);
    const id = `acc_${Date.now().toString(36)}`;
    const now = new Date().toISOString();
    let list = accounts.some((a) => a.id === ACTIVE_ACCOUNT_ID) ? accounts : [...accounts, { ...activeAccount }];
    if (archiveCurrent) {
      list = list.map((a) => (a.id === ACTIVE_ACCOUNT_ID ? { ...a, archived: true, endedAt: now, type: fundedStage ? "xfa" : "eval" } : a));
    }

    saveAccounts(list);
    try {
      localStorage.setItem(ACTIVE_ACCOUNT_LS_KEY, id);
      localStorage.setItem("journal_scope_mode", "current");
    } catch {}
    // Kurz warten, bis die Account-Liste in der Datenbank angekommen ist (sonst gewinnt beim Neuladen der alte Stand).
    try { await Promise.race([window.__lastPush, new Promise((r) => setTimeout(r, 3000))]); } catch {}
    window.location.reload();
  }, [accounts, activeAccount, fundedStage]);

  // Aktiven Account loeschen (z. B. versehentlich angelegt). Der Hauptaccount bleibt immer erhalten. Seine Trades bleiben
  // gespeichert (nur in "All time" sichtbar). Entstand der Account durch einen Reset, wird der archivierte Vorgaenger

  const deleteAccount = useCallback(async () => {

    if (prev) list = list.map((a) => (a.id === prev.id ? { ...a, archived: false } : a));

    try { await Promise.race([window.__lastPush, new Promise((r) => setTimeout(r, 3000))]); } catch {}

  const filteredTrades = useMemo(() => {
    return trades.filter((t) => {
      // Symbol-Filter arbeitet auf Asset-Ebene: NQ = NQ + MNQ, ES = ES + MES, GC = GC + MGC
      if (filterSymbol !== "all" && marketOf(t.symbol) !== marketOf(filterSymbol)) return false;
      if (filterResult !== "all" && t.result !== filterResult) return false;

  const analysisTrades = useMemo(() => {
