            <span style={{ fontSize: "11px", color: "var(--muted-light)", marginTop: "10px", display: "block", lineHeight: 1.6 }}>
              {planStats.no.count > 0 && planStats.no.pnl < 0
                ? T(`Trades ohne Plan haben dich insgesamt ${fmtMoney(Math.abs(planStats.no.pnl))} gekostet. `, `Trades without a plan cost you ${fmtMoney(Math.abs(planStats.no.pnl))} in total. `)
                : ""}
              {planStats.unknown > 0 ? T(`${planStats.unknown} Trades ohne Plan-Angabe sind nicht enthalten. `, `${planStats.unknown} trades without a plan flag are not included. `) : ""}
              {planStats.yes.count < 10 || planStats.no.count < 10 ? T("Achtung: kleine Stichprobe (unter 10 Trades in einer Gruppe), mit Vorsicht interpretieren.", "Warning: small sample (under 10 trades in one group), interpret with caution.") : ""}
            </span>
          </React.Fragment>
        )}
      </section>

      <AnalysisPanel
        statsList={analysisTrades}
        fullList={filteredTrades}
        accountStats={accountStats}
        fundedStage={fundedStage}
        payoutCount={payoutCount}
      />

      <section className="cal-card">
        <div className="cal-head">
          <div className="cal-title">
            <span>{MONTHS[cursor.month]}</span>
            <span className="cal-year">{cursor.year}</span>
          </div>
          <div className="cal-nav">
            <span className={`cal-month-pnl ${calendar.monthTotal >= 0 ? "pos" : "neg"}`}>
              {fmtMoneyShort(calendar.monthTotal)} · {calendar.monthTradeCount} Trades
            </span>
            <button
              className="cal-navbtn"
              onClick={() =>
                setCursor((c) => {
                  const m = c.month === 0 ? 11 : c.month - 1;
                  const y = c.month === 0 ? c.year - 1 : c.year;
                  return { year: y, month: m };
                })
              }
              aria-label={T("Vorheriger Monat", "Previous month")}
            >
              <Icon.ChevL />
            </button>
            <button
              className="cal-navbtn"
              onClick={() =>
                setCursor((c) => {
                  const m = c.month === 11 ? 0 : c.month + 1;
                  const y = c.month === 11 ? c.year + 1 : c.year;
                  return { year: y, month: m };
                })
              }
              aria-label={T("Nächster Monat", "Next month")}
            >
              <Icon.ChevR />
            </button>
          </div>
        </div>

        <div className="cal-grid-header" style={{ "--cols": calendar.showWeekend ? 7 : 5 }}>
          {WEEKDAYS.slice(0, calendar.showWeekend ? 7 : 5).map((d) => (
            <div key={d} className="cal-dow">{d}</div>
          ))}
          <div className="cal-dow cal-dow-week">{T("Woche", "Week")}</div>
        </div>

        {loading ? (
          <div className="cal-loading">{T("Lade Trades…", "Loading trades…")}</div>
        ) : (
          calendar.weeks.map((week, wi) => {
            const visibleCols = calendar.showWeekend ? 7 : 5;
            if (week.cells.slice(0, visibleCols).every((c) => !c)) return null;
            return (
            <div className="cal-week" key={wi} style={{ "--cols": visibleCols }}>
              {week.cells.slice(0, visibleCols).map((cell, ci) => {
                if (!cell) return <div className="cal-cell cal-cell-empty" key={ci} />;
                const isToday = isCurrentMonthNow && cell.day === today.getDate();
                const hasTrades = cell.trades.length > 0;
                const displayPnl = cell.isHistoric ? cell.rawPnl : cell.pnl;
                return (
                  <button
                    key={ci}
                    className={`cal-cell ${hasTrades ? (displayPnl >= 0 ? "cal-win" : "cal-loss") : ""} ${isToday ? "cal-today" : ""} ${cell.isHistoric ? "cal-cell-historic" : ""} ${cell.isOther ? "cal-cell-other" : ""} ${ci >= 5 ? "cal-cell-weekend" : ""}`}
                    onClick={() => hasTrades && setDayDetail(cell.iso)}
                    disabled={!hasTrades}
                  >
                    <span className="cal-daynum">{cell.day}</span>
                    {hasTrades && (
                      <React.Fragment>
                        <span className="cal-pnl">{fmtMoneyShort(displayPnl)}</span>
                        <span className="cal-count">{cell.trades.length} Trade{cell.trades.length > 1 ? "s" : ""}</span>
                        {cell.isHistoric && <span className="cal-historic-badge">Eval</span>}
                        {cell.isOther && !cell.isHistoric && <span className="cal-historic-badge" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "100%" }}>{cell.otherName}</span>}
                      </React.Fragment>
                    )}
                  </button>
                );
              })}
              <div className="cal-cell cal-weeksum">
                <span className="cal-weeknum">{T("KW", "Wk")} {week.weekNum ?? "—"}</span>
                <span className={`cal-weekpnl ${week.weekPnl >= 0 ? "pos" : "neg"}`}>
                  {week.weekTradeCount ? fmtMoneyShort(week.weekPnl) : "—"}
                </span>
                {week.weekTradeCount > 0 && (
                  <span className="cal-weekcount">{week.weekTradeCount} Trade{week.weekTradeCount > 1 ? "s" : ""}</span>
                )}
              </div>
            </div>
            );
          })
        )}
      </section>

      {panelOpen && (
        <AddTradePanel
          onClose={() => setPanelOpen(false)}
          onSubmit={handleAddTrade}
          saving={saving}
          existingSetups={existingSetups}
          existingConfluences={confluenceOptions}
        />
      )}

      {editingTrade && (
        <AddTradePanel
          onClose={() => setEditingTrade(null)}
          onSubmit={(patch) => handleUpdateTrade(editingTrade.id, patch)}
          saving={saving}
          initialTrade={editingTrade}
          isEdit
          existingSetups={existingSetups}
          existingConfluences={confluenceOptions}
        />
      )}

      {accountPanel && (
        <AccountPanel
          mode={accountPanel}
          currentName={activeAccount.name}
          defaultName={`${T("Account", "Account")} ${accounts.length + 1}`}
          busy={accountBusy}
          onClose={() => !accountBusy && setAccountPanel(null)}
          onConfirm={(vals) => createAccount({ ...vals, archiveCurrent: accountPanel === "reset" })}
        />
      )}

      {friendsOpen && (
        <FriendsPanel onClose={() => setFriendsOpen(false)} myTrades={trades} />
      )}

      {forwardTestOpen && (
        <ForwardTestPanel
          onClose={() => setForwardTestOpen(false)}
          trades={trades}
          existingConfluences={confluenceOptions}
          realizedRRForTrade={realizedRRForTrade}
          realizedPointsForTrade={realizedPointsForTrade}
        />
      )}

      {dayDetailData && dayDetailData.trades.length > 0 && (
        <DayDetailModal
          day={dayDetailData}
          onClose={() => setDayDetail(null)}
          onDelete={handleDeleteTrade}
          onEdit={(trade) => { setDayDetail(null); setEditingTrade(trade); }}
        />
      )}

      <div className="toast-stack">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type === "error" ? "toast-error" : ""}`}>{t.message}</div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   ANALYSE-PANEL
   Edge-Kennzahlen, R-Verteilung, Verhaltensanalyse, Monte-Carlo-Chance,
   Perioden-Report und Jahres-Heatmap. Es wird nur der aktive Tab berechnet.
   ============================================================ */
const fmtPct = (x, d = 0) => (Number.isFinite(x) ? `${(x * 100).toFixed(d)}%` : "—");
const fmtR = (x) => (Number.isFinite(x) ? `${x >= 0 ? "+" : ""}${x.toFixed(2)}R` : "—");
const toneOf = (v) => (v > 0 ? "pos" : v < 0 ? "neg" : "");
const SMALL_SAMPLE = 30;

function Metric({ label, value, sub, tone = "" }) {
  return (
    <div className="insight-item">
      <span className="insight-label">{label}</span>
      <span className={`insight-value ${tone}`}>{value}</span>
      {sub ? <span className="insight-sub">{sub}</span> : null}
    </div>
  );
}

function EmptyNote({ children }) {
  return <span className="insight-sub">{children || T("Noch keine Daten in diesem Zeitraum.", "No data in this period yet.")}</span>;
}

function SampleNote({ n }) {
  if (n >= SMALL_SAMPLE) return null;
  return (
    <span className="an-note">
      {T(
        `Kleine Stichprobe (${n} Trades, unter ${SMALL_SAMPLE}): Die Kennzahlen schwanken stark, das Intervall ist wichtiger als die Zahl.`,
        `Small sample (${n} trades, under ${SMALL_SAMPLE}): the figures swing a lot, the interval matters more than the number.`
      )}
    </span>
  );
}

function EdgeTab({ list }) {
  const e = useMemo(() => computeEdgeStats(list), [list]);
  if (!e.n) return <EmptyNote />;
  const wins = list.filter((t) => t.result === "win").length;
  return (
    <>
      <div className="insights-grid">
        <Metric
          label="Winrate"
          value={e.decided ? fmtPct(e.winrate) : "—"}
          sub={e.decided ? T(`95%-Intervall ${fmtCI(wins, e.decided)} (${e.decided} Trades)`, `95% interval ${fmtCI(wins, e.decided)} (${e.decided} trades)`) : null}
        />
        <Metric
          label="Expectancy / Trade"
          value={e.decided ? fmtMoneyShort(e.expectancy) : "—"}
          tone={toneOf(e.expectancy)}
          sub={e.decided ? T(`Ø Win ${fmtMoneyShort(e.avgWin)} · Ø Loss ${fmtMoneyShort(e.avgLoss)}`, `Avg win ${fmtMoneyShort(e.avgWin)} · avg loss ${fmtMoneyShort(e.avgLoss)}`) : null}
        />
        <Metric
          label="Payoff Ratio"
          value={Number.isFinite(e.payoff) ? e.payoff.toFixed(2) : e.decided ? "∞" : "—"}
          sub={T("Ø Gewinn geteilt durch Ø Verlust", "Avg win divided by avg loss")}
        />
        <Metric
          label={T("Expectancy (R)", "Expectancy (R)")}
          value={e.sdR || e.expR ? fmtR(e.expR) : "—"}
          tone={toneOf(e.expR)}
          sub={e.sdR ? T(`Streuung ${e.sdR.toFixed(2)}R`, `Std dev ${e.sdR.toFixed(2)}R`) : null}
        />
        <Metric label="SQN" value={e.sqn === null ? "—" : e.sqn.toFixed(2)} tone={e.sqn === null ? "" : toneOf(e.sqn - 1.6)} sub={sqnLabel(e.sqn)} />
        <Metric
          label="Kelly"
          value={e.kelly === null ? "—" : fmtPct(e.kelly, 1)}
          tone={e.kelly === null ? "" : toneOf(e.kelly)}
          sub={e.kelly === null ? T("ab 10 Trades mit Win und Loss", "from 10 trades with wins and losses") : e.kelly > 0 ? T(`Halb-Kelly ${fmtPct(e.kelly / 2, 1)} als Obergrenze`, `Half Kelly ${fmtPct(e.kelly / 2, 1)} as ceiling`) : T("Kein Edge laut Kelly", "No edge according to Kelly")}
        />
        <Metric
          label="Recovery Factor"
          value={e.recovery === null ? "—" : e.recovery.toFixed(2)}
          tone={e.recovery === null ? "" : toneOf(e.recovery)}
          sub={T(`Netto ${fmtMoneyShort(e.net)} bei Max DD ${fmtMoneyShort(-e.maxDD)}`, `Net ${fmtMoneyShort(e.net)} at max DD ${fmtMoneyShort(-e.maxDD)}`)}
        />
        <Metric
          label={T("Risiko / Trade", "Risk / trade")}
          value={e.riskN ? fmtMoney(e.avgRisk) : "—"}
          sub={e.riskN ? T(`Maximum ${fmtMoney(e.maxRisk)}`, `Maximum ${fmtMoney(e.maxRisk)}`) : null}
        />
      </div>
      <SampleNote n={e.decided} />
    </>
  );
}

function DistTab({ list }) {
  const d = useMemo(() => rDistribution(list), [list]);
  if (!d.total) return <EmptyNote />;
  const maxShare = Math.max(...d.rows.map((r) => r.share), 0.0001);
  return (
    <>
      {d.rows.map((r) => (
        <div className="breakdown-row" key={r.label}>
          <span className="breakdown-label">{r.label}</span>
          <div className="breakdown-bar-track">
            <div className={`breakdown-bar-fill ${r.label === "Loss" ? "neg" : ""}`} style={{ width: `${(r.share / maxShare) * 100}%` }} />
          </div>
          <span className="breakdown-value">{fmtPct(r.share)}</span>
          <span className="breakdown-count">{r.count}x</span>
        </div>
      ))}
      <SampleNote n={d.total} />
    </>
  );
}

function BehaviorTab({ list }) {
  const b = useMemo(() => behaviorStats(list), [list]);
  if (!b.dayCount) return <EmptyNote />;
  const rows = [
    [T("Erster Trade des Tages", "First trade of the day"), b.first],
    [T("Nach einem Gewinn", "After a win"), b.afterWin],
    [T("Nach einem Verlust", "After a loss"), b.afterLoss],
    [T("… mit mehr Contracts", "… with more contracts"), b.bigger],
    [T("… mit gleich/weniger Contracts", "… with same/fewer contracts"), b.notBigger],
  ];
  const revenge = b.bigger.n >= 3 && b.notBigger.n >= 3 && b.bigger.avgPnl < b.notBigger.avgPnl;
  const maxHour = Math.max(...b.byHour.map((h) => Math.abs(h.pnl)), 1);
  return (
    <>
      <div className="an-scroll">
        <table className="an-table">
          <thead>
            <tr>
              <th>{T("Situation", "Situation")}</th>
              <th>Trades</th>
              <th>Winrate</th>
              <th>{T("Ø PnL", "Avg PnL")}</th>
              <th>{T("Ohne Plan", "No plan")}</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(([label, g]) => (
              <tr key={label}>
                <td>{label}</td>
                <td>{g.n}</td>
                <td>{g.wins + g.losses ? `${fmtPct(g.winrate)} (${fmtCI(g.wins, g.wins + g.losses)})` : "—"}</td>
                <td className={toneOf(g.avgPnl)}>{g.n ? fmtMoneyShort(g.avgPnl) : "—"}</td>
                <td>{g.planKnown ? fmtPct(g.noPlanShare) : "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {revenge && (
        <span className="an-note neg">
          {T(
            `Größer nach Verlust kostet: Ø ${fmtMoneyShort(b.bigger.avgPnl)} gegen Ø ${fmtMoneyShort(b.notBigger.avgPnl)} mit gleicher oder kleinerer Größe.`,
            `Sizing up after a loss costs you: avg ${fmtMoneyShort(b.bigger.avgPnl)} versus avg ${fmtMoneyShort(b.notBigger.avgPnl)} with the same or smaller size.`
          )}
        </span>
      )}

      <div className="insights-col-title" style={{ marginTop: 22 }}>{T("Trades pro Tag", "Trades per day")}</div>
      <div className="an-scroll">
        <table className="an-table">
          <thead>
            <tr>
              <th>{T("Trades", "Trades")}</th>
              <th>{T("Tage", "Days")}</th>
              <th>{T("Grüne Tage", "Green days")}</th>
              <th>{T("Ø PnL / Tag", "Avg PnL / day")}</th>
              <th>{T("Summe", "Total")}</th>
            </tr>
          </thead>
          <tbody>
            {b.dayGroups.map((g) => (
              <tr key={g.label}>
                <td>{g.label}</td>
                <td>{g.days}</td>
                <td>{g.days ? fmtPct(g.greenShare) : "—"}</td>
                <td className={toneOf(g.avgPnl)}>{g.days ? fmtMoneyShort(g.avgPnl) : "—"}</td>
                <td className={toneOf(g.pnl)}>{g.days ? fmtMoneyShort(g.pnl) : "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="insights-col-title" style={{ marginTop: 22 }}>{T("Nach Uhrzeit (Einstieg)", "By hour (entry)")}</div>
      {b.byHour.length === 0 ? (
        <EmptyNote>{T("Keine Trades mit erfasster Einstiegszeit.", "No trades with a recorded entry time.")}</EmptyNote>
      ) : (
        b.byHour.map((h) => (
          <div className="breakdown-row" key={h.hour}>
            <span className="breakdown-label">{String(h.hour).padStart(2, "0")}:00</span>
            <div className="breakdown-bar-track">
              <div className={`breakdown-bar-fill ${h.pnl < 0 ? "neg" : ""}`} style={{ width: `${(Math.abs(h.pnl) / maxHour) * 100}%` }} />
            </div>
            <span className={`breakdown-value ${h.pnl >= 0 ? "pos" : "neg"}`}>{fmtMoneyShort(h.pnl)}</span>
            <span className="breakdown-count">{h.n}x</span>
          </div>
        ))
      )}
      <SampleNote n={list.length} />
    </>
  );
}

function ChanceTab({ list, accountStats, fundedStage, payoutCount }) {
  const [maxDays, setMaxDays] = useState(40);
  const scenario = useMemo(() => {
    if (!fundedStage) {
      return {
        title: T("Eval bestehen", "Pass the eval"),
        target: ACCOUNT_PASS_TARGET,
        ddBuffer: EVAL_DD_BUFFER,
        peakCap: EVAL_DD_PEAK_CAP,
        staticMll: null,
      };
    }
    return {
      title: T("Nächsten Payout erreichen", "Reach the next payout"),
      target: payoutCount > 0
        ? accountStats.balance + PAYOUT_MIN_NET_PROFIT
        : STARTING_BALANCE + PAYOUT_BUFFER + PAYOUT_MIN_NET_PROFIT,
      ddBuffer: DD_BUFFER,
      peakCap: DD_PEAK_CAP,
      staticMll: payoutCount > 0 && PAYOUT_STATIC_AFTER ? MLL_AFTER_FIRST_PAYOUT : null,
    };
  }, [fundedStage, payoutCount, accountStats.balance]);

  const pnls = useMemo(() => list.filter((t) => t.result).map((t) => Number(t.pnl || 0)), [list]);
  const dayLens = useMemo(() => Array.from(dailyPnlMap(list).values()).map((d) => d.n), [list]);
  const sim = useMemo(
    () => monteCarlo({
      pnls, dayLens, balance: accountStats.balance, eodPeak: accountStats.eodPeak,
      target: scenario.target, ddBuffer: scenario.ddBuffer, peakCap: scenario.peakCap,
      staticMll: scenario.staticMll, maxDays,
    }),
    [pnls, dayLens, accountStats.balance, accountStats.eodPeak, scenario, maxDays]
  );

  if (!sim) return <EmptyNote>{T("Für die Simulation braucht es mindestens einen Trade.", "The simulation needs at least one trade.")}</EmptyNote>;
  const range = (a, b) => (a === null ? "—" : `${Math.round(a)}–${Math.round(b)}`);
  return (
    <>
      <div className="an-head" style={{ marginBottom: 14 }}>
        <span className="insight-sub">{scenario.title}: {fmtMoney(scenario.target)}</span>
        <div className="filter-group">
          {[20, 40, 60, 90].map((d) => (
            <button key={d} type="button" className={`filter-chip ${maxDays === d ? "active" : ""}`} onClick={() => setMaxDays(d)}>
              {d} {T("Tage", "days")}
            </button>
          ))}
        </div>
      </div>
      <div className="insights-grid">
        <Metric label={T("Chance Ziel", "Chance to hit")} value={fmtPct(sim.pass, 1)} tone={sim.pass >= 0.5 ? "pos" : ""} sub={T(`in ${sim.maxDays} Handelstagen`, `within ${sim.maxDays} trading days`)} />
        <Metric label={T("Chance Bust", "Chance to bust")} value={fmtPct(sim.bust, 1)} tone={sim.bust >= 0.25 ? "neg" : ""} sub={T("MLL wird gerissen", "MLL is breached")} />
        <Metric label={T("Noch offen", "Still open")} value={fmtPct(sim.open, 1)} sub={T("weder noch nach Ablauf", "neither by the end")} />
        <Metric label={T("Dauer bis Ziel", "Time to target")} value={sim.medianDays === null ? "—" : `${Math.round(sim.medianDays)} ${T("Tage", "days")}`} sub={T(`Mitte 50%: ${range(sim.p25Days, sim.p75Days)} Tage`, `Middle 50%: ${range(sim.p25Days, sim.p75Days)} days`)} />
        <Metric label={T("Endstand schlecht", "End balance, bad")} value={fmtMoney(sim.p10Final)} sub={T("10%-Quantil", "10th percentile")} />
        <Metric label={T("Endstand typisch", "End balance, typical")} value={fmtMoney(sim.p50Final)} sub={T("Median", "Median")} />
        <Metric label={T("Endstand gut", "End balance, good")} value={fmtMoney(sim.p90Final)} sub={T("90%-Quantil", "90th percentile")} />
        <Metric label={T("Datenbasis", "Data basis")} value={`${pnls.length}`} sub={T(`Trades, ${sim.sims.toLocaleString(LOCALE)} Simulationen`, `trades, ${sim.sims.toLocaleString(LOCALE)} simulations`)} />
      </div>
      <span className="an-note">
        {T(
          "Schätzung aus deiner eigenen Historie (Ziehen mit Zurücklegen), keine Prognose. Sie nimmt an, dass deine künftigen Trades so verteilt sind wie bisher.",
          "An estimate from your own history (sampling with replacement), not a forecast. It assumes your future trades are distributed like your past ones."
        )}
      </span>
      <SampleNote n={pnls.length} />
    </>
  );
}

function periodLabel(key, by) {
  if (by === "week") return T(`ab ${key.slice(8, 10)}.${key.slice(5, 7)}.${key.slice(2, 4)}`, `from ${key.slice(5, 7)}/${key.slice(8, 10)}/${key.slice(2, 4)}`);
  return `${MONTHS[Number(key.slice(5, 7)) - 1].slice(0, 3)} ${key.slice(0, 4)}`;
}

function ReportTab({ list }) {
  const [by, setBy] = useState("month");
  const [all, setAll] = useState(false);
  const rows = useMemo(() => periodReport(list, by), [list, by]);
  if (!list.length) return <EmptyNote />;
  const shown = all ? rows : rows.slice(0, 12);
  return (
    <>
      <div className="an-head" style={{ marginBottom: 14 }}>
        <span className="insight-sub">{T(`${rows.length} Perioden`, `${rows.length} periods`)}</span>
        <div className="filter-group">
          {[["month", T("Monate", "Months")], ["week", T("Wochen", "Weeks")]].map(([k, label]) => (
            <button key={k} type="button" className={`filter-chip ${by === k ? "active" : ""}`} onClick={() => setBy(k)}>{label}</button>
          ))}
        </div>
      </div>
      <div className="an-scroll">
        <table className="an-table">
          <thead>
            <tr>
              <th>{T("Zeitraum", "Period")}</th>
              <th>Trades</th>
              <th>Winrate</th>
              <th>PF</th>
              <th>Ø R</th>
              <th>{T("Grüne Tage", "Green days")}</th>
              <th>{T("Bester / schlechtester Tag", "Best / worst day")}</th>
              <th>PnL</th>
            </tr>
          </thead>
          <tbody>
            {shown.map((r) => (
              <tr key={r.key}>
                <td>{periodLabel(r.key, by)}</td>
                <td>{r.n}</td>
                <td>{r.wins + r.losses ? `${r.winrate.toFixed(0)}% (${fmtCI(r.wins, r.wins + r.losses)})` : "—"}</td>
                <td>{Number.isFinite(r.pf) ? r.pf.toFixed(2) : "∞"}</td>
                <td className={toneOf(r.avgR)}>{r.avgR || r.n ? fmtR(r.avgR) : "—"}</td>
                <td>{r.greenDays}/{r.days}</td>
                <td>{fmtMoneyShort(r.best)} / {fmtMoneyShort(r.worst)}</td>
                <td className={toneOf(r.pnl)}><b>{fmtMoneyShort(r.pnl)}</b></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {rows.length > 12 && (
        <button type="button" className="filter-clear" style={{ marginTop: 12 }} onClick={() => setAll((v) => !v)}>
          {all ? T("Weniger anzeigen", "Show less") : T(`Alle ${rows.length} anzeigen`, `Show all ${rows.length}`)}
        </button>
      )}
    </>
  );
}

function HeatTab({ list }) {
  const years = useMemo(() => {
    const set = new Set(list.map((t) => (t.trade_date || "").slice(0, 4)).filter(Boolean));
    set.add(String(new Date().getFullYear()));
    return Array.from(set).sort();
  }, [list]);
  const [year, setYear] = useState(() => years[years.length - 1]);
  const data = useMemo(() => {
    const map = dailyPnlMap(list);
    const y = Number(year);
    const first = new Date(y, 0, 1);
    const offset = mondayIndex(first);
    const total = daysInMonth(y, 1) === 29 ? 366 : 365;
    const cells = Array.from({ length: offset }, () => null);
    const monthStarts = [];
    let maxAbs = 0, net = 0, green = 0, red = 0, best = null;
    for (let i = 0; i < total; i++) {
      const dt = new Date(y, 0, 1 + i);
      const iso = isoDate(y, dt.getMonth(), dt.getDate());
      const e = map.get(iso) || null;
      if (dt.getDate() === 1) monthStarts.push({ month: dt.getMonth(), col: Math.floor((offset + i) / 7) });
      if (e) {
        maxAbs = Math.max(maxAbs, Math.abs(e.pnl));
        net += e.pnl;
        if (e.pnl > 0) green += 1; else if (e.pnl < 0) red += 1;
        if (!best || e.pnl > best.pnl) best = { iso, pnl: e.pnl };
      }
      cells.push({ iso, e });
    }
    return { cells, monthStarts, maxAbs, net, green, red, best, weeks: Math.ceil(cells.length / 7) };
  }, [list, year]);
  const color = (e) => {
    if (!e || e.pnl === 0) return e ? "rgba(255,255,255,0.08)" : null;
    const a = 0.18 + 0.82 * (Math.abs(e.pnl) / (data.maxAbs || 1));
    return e.pnl > 0 ? `rgba(255,255,255,${a.toFixed(2)})` : `rgba(224,0,26,${a.toFixed(2)})`;
  };
  return (
    <>
      <div className="an-head" style={{ marginBottom: 14 }}>
        <span className={`insight-sub ${toneOf(data.net)}`}>
          {T(`${year}: ${fmtMoneyShort(data.net)} · ${data.green} grüne / ${data.red} rote Tage`, `${year}: ${fmtMoneyShort(data.net)} · ${data.green} green / ${data.red} red days`)}
          {data.best ? T(` · bester Tag ${fmtMoneyShort(data.best.pnl)}`, ` · best day ${fmtMoneyShort(data.best.pnl)}`) : ""}
        </span>
        <div className="filter-group">
          {years.map((y) => (
            <button key={y} type="button" className={`filter-chip ${year === y ? "active" : ""}`} onClick={() => setYear(y)}>{y}</button>
          ))}
        </div>
      </div>
      <div className="an-scroll">
        <div className="heat-months" style={{ gridTemplateColumns: `repeat(${data.weeks}, 13px)` }}>
          {data.monthStarts.map((m) => (
            <span key={m.month} style={{ gridColumnStart: m.col + 1 }}>{MONTHS[m.month].slice(0, 3)}</span>
          ))}
        </div>
        <div className="heat-grid" style={{ gridTemplateColumns: `repeat(${data.weeks}, 13px)` }}>
          {data.cells.map((c, i) => c === null
            ? <span key={`o${i}`} />
            : (
              <span
                key={c.iso}
                className={`heat-cell ${c.e ? "has" : ""}`}
                style={color(c.e) ? { background: color(c.e) } : undefined}
                title={c.e ? `${c.iso}: ${fmtMoneyShort(c.e.pnl)} (${c.e.n} Trades)` : c.iso}
              />
            ))}
        </div>
      </div>
    </>
  );
}

function EquityCurve({ data }) {
  const w = 560;
  const h = 120;
  const pad = 6;

  if (data.length < 2) {
    return (
      <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg">
        <line x1={pad} y1={h / 2} x2={w - pad} y2={h / 2} stroke="var(--line)" strokeWidth="1.5" strokeDasharray="4 6" />
      </svg>
    );
  }

  const ys = data.map((d) => d.y);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const range = maxY - minY || 1;

  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.y - minY) / range) * (h - pad * 2);
    return [x, y];
  });

  const lineD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const areaD = `${lineD} L${points[points.length - 1][0]},${h - pad} L${points[0][0]},${h - pad} Z`;

  const last = data[data.length - 1].y;
  const first = data[0].y;
  const positive = last >= first;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0.22" />
          <stop offset="100%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaD} fill="url(#eqFill)" />
      <path d={lineD} fill="none" stroke={positive ? "var(--green)" : "var(--red)"} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r="3.5" fill={positive ? "var(--green)" : "var(--red)"} />
    </svg>
  );
}

// Feldvalidierung des Trade-Formulars (rein, ohne React). Liefert { feld: Fehlertext }.
function validateTradeForm(f, today = localIsoToday()) {
  const err = {};
  const num = (v) => (v === "" || v === null || v === undefined ? NaN : Number(v));
  if (!f.trade_date) err.trade_date = T("Datum fehlt", "Date is missing");
  else if (f.trade_date > today) err.trade_date = T("Datum liegt in der Zukunft", "Date is in the future");
  const c = num(f.contracts);
  if (!Number.isInteger(c) || c < 1) err.contracts = T("Ganze Zahl ab 1", "Whole number from 1");
  const sl = num(f.stop_loss);
  if (!Number.isFinite(sl) || sl === 0) err.stop_loss = T("Stop Loss in Punkten, nicht 0", "Stop loss in points, not 0");
  const tp = num(f.take_profit);
  if (!Number.isFinite(tp) || tp === 0) err.take_profit = T("Take Profit in Punkten, nicht 0", "Take profit in points, not 0");
  if (f.manual_pnl !== "") {
    const p = num(f.manual_pnl);
    if (!Number.isFinite(p)) err.manual_pnl = T("Keine gültige Zahl", "Not a valid number");
    else if (f.result === "win" && p < 0) err.manual_pnl = T("Win mit negativem PnL", "Win with negative PnL");
    else if (f.result === "loss" && p > 0) err.manual_pnl = T("Loss mit positivem PnL", "Loss with positive PnL");
  }
  return err;
}

function AddTradePanel({ onClose, onSubmit, saving, initialTrade = null, isEdit = false, existingSetups = [], existingConfluences = [] }) {
  const todayIso = localIsoToday();
  const [form, setForm] = useState(() => {
    if (initialTrade) {
      return {
        trade_date: initialTrade.trade_date,
        symbol: initialTrade.symbol,
        contracts: String(initialTrade.contracts),
        direction: initialTrade.direction,
        result: initialTrade.result,
        stop_loss: String(initialTrade.stop_loss ?? ""),
        take_profit: String(initialTrade.take_profit ?? ""),
        manual_pnl: initialTrade.pnl !== null && initialTrade.pnl !== undefined ? String(initialTrade.pnl) : "",
        note: initialTrade.note || "",
        screenshot: initialTrade.screenshot || "",
        setup: initialTrade.setup || "",
        confluences: Array.isArray(initialTrade.confluences) ? initialTrade.confluences : [],
        plan_followed: initialTrade.plan_followed === true ? "yes" : initialTrade.plan_followed === false ? "no" : "",
      };
    }
    return {
      trade_date: todayIso,
      symbol: "NQ",
      contracts: String(SYMBOLS.NQ.defaultContracts),
      direction: "long",
      result: "win",
      stop_loss: "10",
      take_profit: "",
      manual_pnl: "",
      note: "",
      screenshot: "",
      setup: "",
      confluences: [],
      plan_followed: "yes", // Standard: Mit Plan
    };
  });
  const [touched, setTouched] = useState(false);
  const [newConfluenceInput, setNewConfluenceInput] = useState("");
  const firstFieldRef = React.useRef(null);

  useEffect(() => {
    if (firstFieldRef.current) firstFieldRef.current.focus();
  }, []);

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const selectSymbol = (symbol) =>
    setForm((f) => ({ ...f, symbol, contracts: isEdit ? f.contracts : String(SYMBOLS[symbol].defaultContracts) }));

  // Markt (NQ/ES/GC) waehlen und dabei die aktuelle Variante (Mini/Micro) beibehalten
  const selectMarket = (market) =>
    selectSymbol(isMicroSymbol(form.symbol) ? MARKETS[market].micro : MARKETS[market].mini);
  const selectTier = (tier) => selectSymbol(MARKETS[marketOf(form.symbol)][tier]);

  const bumpContracts = (delta) =>
    setForm((f) => {
      const next = Math.max(1, (Number(f.contracts) || 0) + delta);
      return { ...f, contracts: String(next) };
    });

  const computed = useMemo(() => computeTrade(form), [form.symbol, form.contracts, form.stop_loss, form.take_profit, form.result]);

  // Screenshots vor dem Speichern verkleinern (max. 1600 px, JPEG 82 %): Handy-Fotos haben mehrere MB und
  // wuerden sonst bei jedem Laden mitgeladen. Bei jedem Problem wird das Original verwendet.
  const processFile = (file) => {
    if (!file) return;
    const useOriginal = () => {
      const reader = new FileReader();
      reader.onload = () => setForm((f) => ({ ...f, screenshot: reader.result }));
      reader.readAsDataURL(file);
    };
    const objUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      try {
        const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const out = canvas.toDataURL("image/jpeg", 0.82);
        if (out.length < file.size * 1.37) setForm((f) => ({ ...f, screenshot: out }));
        else useOriginal();
      } catch { useOriginal(); }
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); useOriginal(); };
    img.src = objUrl;
  };
  const handleFile = (e) => processFile(e.target.files && e.target.files[0]);

  // Bild aus der Zwischenablage (STRG+V / CMD+V) uebernehmen, solange das Formular offen ist.
  useEffect(() => {
    const onPaste = (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.kind === "file" && it.type.startsWith("image/")) {
          e.preventDefault();
          processFile(it.getAsFile());
          return;
        }
      }
    };
    document.addEventListener("paste", onPaste);
    return () => document.removeEventListener("paste", onPaste);
  }, []);

  const addNewConfluence = () => {
    const tag = newConfluenceInput.trim();
    if (!tag) return;
    setForm((f) => (f.confluences.includes(tag) ? f : { ...f, confluences: [...f.confluences, tag] }));
    setNewConfluenceInput("");
  };

  const handleConfluenceInputKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      addNewConfluence();
    }
  };

  const fieldErrors = useMemo(() => validateTradeForm(form), [form]);
  const isValid = Object.keys(fieldErrors).length === 0;
  const fieldError = (key) => (touched && fieldErrors[key] ? <span className="field-error">{fieldErrors[key]}</span> : null);

  const effectivePnl = form.manual_pnl !== ""
    ? Number(form.manual_pnl)
    : computed.pnl;

  const buildPayload = () => ({
    trade_date: form.trade_date,
    symbol: form.symbol,
    contracts: Number(form.contracts),
    direction: form.direction,
    result: form.result,
    stop_loss: Number(form.stop_loss),
    take_profit: Number(form.take_profit),
    rr: computed.rr,
    realized_rr: computed.realized_rr,
    risk_amount: computed.risk_amount,
    pnl: effectivePnl,
    note: form.note || null,
    screenshot: form.screenshot || null,
    setup: form.setup || null,
    confluences: form.confluences && form.confluences.length ? form.confluences : null,
    plan_followed: form.plan_followed === "yes" ? true : form.plan_followed === "no" ? false : null,
  });

  const submit = (e) => {
    e.preventDefault();
    setTouched(true);
    if (!isValid) return;
    onSubmit(buildPayload());
  };

  // Cmd/Ctrl + Enter zum schnellen Speichern, von überall im Formular
  const handleKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();

function ForwardTestPanel({ onClose, trades, existingConfluences, realizedRRForTrade, realizedPointsForTrade }) {
  const [selected, setSelected] = useState([]);

  const toggle = (tag) => {
    setSelected((s) => (s.includes(tag) ? s.filter((t) => t !== tag) : [...s, tag]));
  };

  // Alt-Tags aus der Historie, die zu keiner der festen Kategorien gehören (z. B.
  // frei eingetippte Confluences von vor der xN-Struktur) — werden als eigene
  // "Weitere"-Zeile unterhalb der Kategorien angezeigt.
  const categoryTagSet = useMemo(
    () => new Set(CONFLUENCE_CATEGORIES.flatMap((cat) => cat.levels.map((level) => `${cat.label} ${level}`))),
    []
  );
  const extraTags = useMemo(
    () => existingConfluences.filter((c) => !categoryTagSet.has(c)),
    [existingConfluences, categoryTagSet]
  );

  // Fuer jeden Trade: wie viele der ausgewaehlten Confluences sind vorhanden?
  // Danach nach Match-Anzahl gruppiert ("mindestens N von M getroffen"), damit
  // man sieht wie sich Winrate/Punkte verhalten, je naeher ein geplanter Trade
  // an eine vollstaendige Uebereinstimmung mit der Historie kommt.
  const result = useMemo(() => {
    if (selected.length === 0) return null;
    const scored = trades
      .map((t) => {
        const tags = Array.isArray(t.confluences) ? t.confluences : [];
        const matchCount = selected.filter((s) => tags.includes(s)).length;
        return { t, matchCount };
      })
      .filter((x) => x.matchCount > 0);

    const buildStats = (subset) => {
      const wins = subset.filter((t) => t.result === "win").length;
      const losses = subset.filter((t) => t.result === "loss").length;
      const bes = subset.filter((t) => t.result === "be").length;
      const decided = wins + losses;
      const rrVals = subset.map(realizedRRForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      const ptsVals = subset.map(realizedPointsForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      return {
        count: subset.length,
        wins, losses, bes,
        winrate: decided ? (wins / decided) * 100 : 0,
        avgRR: rrVals.length ? rrVals.reduce((s, v) => s + v, 0) / rrVals.length : 0,
        avgPoints: ptsVals.length ? ptsVals.reduce((s, v) => s + v, 0) / ptsVals.length : 0,
      };
    };

    const byThreshold = [];
    for (let n = selected.length; n >= 1; n--) {
      const subset = scored.filter((x) => x.matchCount >= n).map((x) => x.t);
      if (!subset.length) continue;
      byThreshold.push({ minMatch: n, ...buildStats(subset) });
    }

    const exact = scored.filter((x) => x.matchCount === selected.length).map((x) => x.t);

    return {
      totalSelected: selected.length,
      matchedTradeCount: scored.length,
      byThreshold,
      exactStats: buildStats(exact),
    };
  }, [selected, trades, realizedRRForTrade, realizedPointsForTrade]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="panel ft-panel" onClick={(e) => e.stopPropagation()}>
        <div className="panel-head">
          <span>Forward Test</span>
          <button type="button" className="icon-btn" onClick={onClose} aria-label={T("Schließen", "Close")}>
            <Icon.Close />
          </button>
        </div>

        <div>
          <div className="ft-section-title">{T("Confluences für diesen Trade", "Confluences for this trade")}</div>
          <div className="confluence-groups">
            {CONFLUENCE_CATEGORIES.map((cat) => (
              <div className="confluence-group" key={cat.label}>
                <span className="confluence-group-label">{tagText(cat.label)}</span>
                <div className="confluence-group-chips">
                  {cat.levels.map((level) => {
                    const tag = `${cat.label} ${level}`;
                    return (
                      <button
                        type="button"
                        key={tag}
                        className={`confluence-chip ${chipState(selected, cat, level)}`}
                        onClick={() => setSelected((s) => toggleConfluenceTag(s, cat, level))}
                        title={tagText(tag)}
                      >
                        {level}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
            {extraTags.length > 0 && (
              <div className="confluence-group">
                <span className="confluence-group-label">{T("Weitere", "Other")}</span>
                <div className="confluence-group-chips">
                  {extraTags.map((tag) => (
                    <button
                      type="button"
                      key={tag}
                      className={`confluence-chip ${selected.includes(tag) ? "active" : ""}`}
                      onClick={() => toggle(tag)}
                    >
                      {tag}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>

        {result && (
          <React.Fragment>
            <div className="ft-section-divider" />
            <div className="ft-results">
              <div className="ft-section-title">{T("Ergebnis bei exakter Übereinstimmung", "Result for exact match")}</div>
              <div className="computed-box" style={{ gridTemplateColumns: "1fr 1fr 1fr 1fr" }}>
                <div className="computed-item">
                  <span className="computed-label">{T("Exakte Treffer", "Exact matches")}</span>
                  <span className="computed-value">{result.exactStats.count}</span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">Winrate</span>
                  <span className={`computed-value ${result.exactStats.winrate >= 50 ? "pos" : "neg"}`}>
                    {result.exactStats.count ? `${result.exactStats.winrate.toFixed(0)}%` : "—"}
                  </span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">Ø RR</span>
                  <span className="computed-value">{result.exactStats.count ? `${result.exactStats.avgRR.toFixed(2)}R` : "—"}</span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">{T("Ø Punkte", "Ø Points")}</span>
                  <span className={`computed-value ${result.exactStats.avgPoints >= 0 ? "pos" : "neg"}`}>
                    {result.exactStats.count ? `${result.exactStats.avgPoints >= 0 ? "+" : ""}${result.exactStats.avgPoints.toFixed(1)}` : "—"}
                  </span>
                </div>
              </div>

              <div className="ft-section-title" style={{ marginTop: "14px" }}>
                {T(`Nach Match-Anzahl (mindestens N von ${result.totalSelected} Confluences)`, `By match count (at least N of ${result.totalSelected} confluences)`)}
              </div>
              <div className="trade-list">
                {result.byThreshold.map((row) => (
                  <div className="breakdown-row" key={row.minMatch} style={{ gap: "10px" }}>
                    <span className="breakdown-label" style={{ width: "70px" }}>≥ {row.minMatch}/{result.totalSelected}</span>
                    <div className="breakdown-bar-track">
                      <div
                        className={`breakdown-bar-fill ${row.winrate < 50 ? "neg" : ""}`}
                        style={{ width: `${Math.min(100, row.winrate)}%` }}
                      />
                    </div>
                    <span className={`breakdown-value ${row.winrate >= 50 ? "pos" : "neg"}`} style={{ width: "56px" }}>{row.winrate.toFixed(0)}%</span>
                    <span className="breakdown-value" style={{ width: "66px" }}>{row.avgRR.toFixed(2)}R</span>
                    <span className="breakdown-value" style={{ width: "78px" }}>{row.avgPoints >= 0 ? "+" : ""}{row.avgPoints.toFixed(1)} {T("Pkt", "pts")}</span>
                    <span className="breakdown-count">{row.count}x</span>
                  </div>
                ))}
              </div>
              <span style={{ fontSize: "11px", color: "var(--muted-light)" }}>
                {T(`${result.matchedTradeCount} Trade${result.matchedTradeCount === 1 ? "" : "s"} in der Historie mit mindestens 1 Übereinstimmung.`, `${result.matchedTradeCount} trade${result.matchedTradeCount === 1 ? "" : "s"} in the history with at least 1 match.`)}
                {result.exactStats.count > 0 && result.exactStats.count < 10 ? T(" Achtung: kleine Stichprobe, Ergebnis mit Vorsicht interpretieren.", " Warning: small sample size, interpret the result with caution.") : ""}
              </span>
            </div>
          </React.Fragment>
        )}

        {!result && (
          <span className="insight-sub">{T("Wähle mindestens eine Confluence aus, um die Auswertung zu sehen.", "Select at least one confluence to see the analysis.")}</span>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   FREUNDE — Vergleich mit anderen Journals (nur lesend!)
   Pro Freund werden Name, Supabase-URL und anon Key im localStorage
   dieses Browsers gespeichert. Es werden ausschliesslich GET-Requests
   auf die Tabelle "Trades" des Freundes gemacht — nie schreibend.
   ============================================================ */
const FRIENDS_LS_KEY = "journal_friends";
const FRIEND_COLOR = "#a8a8a8"; // Silbergrau: hebt sich von Weiss (ich) ab, ohne den schwarz/weiss/roten Stil zu brechen
const ME_COLOR = "#ffffff";
const ME_NAME = T("Ich", "Me");

// Alle anderen Profile aus PROFILES sind automatisch Freunde (fest, nicht entfernbar).
// Zusaetzlich koennen manuell weitere Freunde hinzugefuegt werden (im Browser gespeichert).
function builtInFriends() {
  return PROFILES
    .filter((p) => (!ACTIVE_PROFILE || p.id !== ACTIVE_PROFILE.id) && !String(p.url).includes("DEIN-PROJEKT") && !String(p.key).includes("DEIN-ANON-KEY"))
    .map((p) => ({ id: `profile_${p.id}`, name: p.name, url: p.url, key: p.key, builtIn: true }));
}
function loadFriendsLS() {

function normalizeSupabaseUrl(u) {
  return String(u || "").trim().replace(/\/rest\/v1.*$/, "").replace(/\/+$/, "");
}

function tradeRR(t) {
  if (t.result === "be") return 0;
  if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
  if (t.result === "loss") return t.rr !== null && t.rr !== undefined ? -1 : null;
  if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
  return null;
}

function summarizeTrades(list) {
  const wins = list.filter((t) => t.result === "win");
  const losses = list.filter((t) => t.result === "loss");
  const decided = wins.length + losses.length;
  const pnl = list.reduce((s, t) => s + Number(t.pnl || 0), 0);
  const grossProfit = wins.reduce((s, t) => s + Number(t.pnl || 0), 0);
  const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl || 0), 0));
  const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;
  const rrs = list.map(tradeRR).filter((v) => v !== null && !Number.isNaN(v));
  const avgRR = rrs.length ? rrs.reduce((s, r) => s + r, 0) / rrs.length : 0;

  const dayMap = new Map();
  list.forEach((t) => dayMap.set(t.trade_date, (dayMap.get(t.trade_date) || 0) + Number(t.pnl || 0)));
  const days = Array.from(dayMap.entries()).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  const greenDays = days.filter(([, v]) => v > 0).length;
  const dayVals = days.map(([, v]) => v);

  let run = 0, peak = 0, maxDD = 0;
  days.forEach(([, v]) => {
    run += v;
    if (run > peak) peak = run;
    if (peak - run > maxDD) maxDD = peak - run;
  });

  // Streaks (BE unterbricht keine Serie), Ø Gewinn/Verlust und Payoff
  const ordered = [...list].sort((x, y) => (x.trade_date < y.trade_date ? -1 : x.trade_date > y.trade_date ? 1 : Number(x.id || 0) - Number(y.id || 0)));
  let curW = 0, curL = 0, maxW = 0, maxL = 0;
  ordered.forEach((t) => {
    if (t.result === "win") { curW += 1; curL = 0; if (curW > maxW) maxW = curW; }
    else if (t.result === "loss") { curL += 1; curW = 0; if (curL > maxL) maxL = curL; }
  });
  const avgWin = wins.length ? grossProfit / wins.length : 0;
  const avgLoss = losses.length ? -grossLoss / losses.length : 0;
  const payoff = avgLoss < 0 ? avgWin / Math.abs(avgLoss) : avgWin > 0 ? Infinity : 0;

  return {
    count: list.length,
    winrate: decided ? (wins.length / decided) * 100 : 0,
    profitFactor,
    avgRR,
    pnl,
    expectancy: decided ? (grossProfit - grossLoss) / decided : 0,
    dayCount: days.length,
    greenDayPct: days.length ? (greenDays / days.length) * 100 : 0,
    bestDay: dayVals.length ? Math.max(...dayVals) : 0,
    worstDay: dayVals.length ? Math.min(...dayVals) : 0,
    maxDD,
    avgWin, avgLoss, payoff,
    maxWinStreak: maxW, maxLossStreak: maxL,
    tradesPerDay: days.length ? list.length / days.length : 0,
  };
}

function FriendsEquityChart({ mine, theirs, myName, theirName, unit = "usd" }) {
  const [hover, setHover] = useState(null);
  const W = 760, H = 230, PL = 64, PR = 16, PT = 14, PB = 28;
  const { dates, pa, pb } = useMemo(() => {
    const sum = (list) => {
      const m = new Map();
      list.forEach((t) => {
        const v = unit === "r" ? (Number.isFinite(tradeRR(t)) ? tradeRR(t) : 0) : Number(t.pnl || 0);
        m.set(t.trade_date, (m.get(t.trade_date) || 0) + v);
      });
      return m;
    };
    const a = sum(mine), b = sum(theirs);
    const ds = Array.from(new Set([...a.keys(), ...b.keys()])).sort();
    let ra = 0, rb = 0;
    const A = [], B = [];
    ds.forEach((d) => { ra += a.get(d) || 0; rb += b.get(d) || 0; A.push(ra); B.push(rb); });
    return { dates: ds, pa: A, pb: B };
  }, [mine, theirs, unit]);

  if (dates.length === 0) return <div className="notice">{T("Keine Trades im gewählten Zeitraum.", "No trades in the selected period.")}</div>;

  const all = [0, ...pa, ...pb];
  let min = Math.min(...all), max = Math.max(...all);
  if (max === min) { max += 1; min -= 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;
  const iw = W - PL - PR, ih = H - PT - PB;
  const n = dates.length;
  const x = (i) => (n === 1 ? PL + iw / 2 : PL + (i / (n - 1)) * iw);
  const y = (v) => PT + (1 - (v - min) / (max - min)) * ih;
  const line = (arr) => arr.map((v, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = (arr) => `${line(arr)} L${x(n - 1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const ticks = [0, 1, 2, 3, 4].map((k) => min + ((max - min) * k) / 4);
  const money = (v) => (unit === "r"
    ? `${v < 0 ? "-" : ""}${Math.abs(v).toFixed(1)}R`
    : `${v < 0 ? "-" : ""}$${Math.abs(Math.round(v)).toLocaleString(LOCALE)}`);
  const fmtU = unit === "r" ? (v) => `${v >= 0 ? "+" : ""}${v.toFixed(2)}R` : fmtMoneyShort;

  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    const i = n === 1 ? 0 : Math.round(((px - PL) / iw) * (n - 1));
    setHover(Math.max(0, Math.min(n - 1, i)));
  };
  const hi = hover !== null && hover < n ? hover : n - 1;

  return (
    <div>
      <div style={{ display: "flex", gap: "22px", flexWrap: "wrap", fontSize: "12px", color: "var(--muted-light)", marginBottom: "10px" }}>
        <span style={{ color: "#fff", fontWeight: 700 }}>{friendsDayLabel(dates[hi])}</span>
        <span><span style={{ color: ME_COLOR }}>●</span> {myName}: <b style={{ color: "#fff" }}>{fmtU(pa[hi])}</b></span>
        <span><span style={{ color: FRIEND_COLOR }}>●</span> {theirName}: <b style={{ color: "#fff" }}>{fmtU(pb[hi])}</b></span>
        <span style={{ marginLeft: "auto" }}>{unit === "r" ? T("kumulierte R pro Handelstag", "cumulative R per trading day") : T("kumulierter PnL pro Handelstag", "cumulative PnL per trading day")}</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", cursor: "crosshair" }} onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="fgMe" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={ME_COLOR} stopOpacity="0.16" />
            <stop offset="100%" stopColor={ME_COLOR} stopOpacity="0" />
          </linearGradient>
          <linearGradient id="fgThem" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={FRIEND_COLOR} stopOpacity="0.18" />
            <stop offset="100%" stopColor={FRIEND_COLOR} stopOpacity="0" />
          </linearGradient>
        </defs>
        {ticks.map((t, k) => (
          <g key={k}>
            <line x1={PL} x2={W - PR} y1={y(t)} y2={y(t)} stroke="#1c1c1c" />
            <text x={PL - 8} y={y(t) + 4} textAnchor="end" fontSize="10" fill="#666">{money(t)}</text>
          </g>
        ))}
        <line x1={PL} x2={W - PR} y1={y(0)} y2={y(0)} stroke="#444" strokeDasharray="4 4" />
        {n > 1 && <path d={area(pa)} fill="url(#fgMe)" />}
        {n > 1 && <path d={area(pb)} fill="url(#fgThem)" />}
        <path d={line(pa)} fill="none" stroke={ME_COLOR} strokeWidth="2.2" strokeLinejoin="round" />
        <path d={line(pb)} fill="none" stroke={FRIEND_COLOR} strokeWidth="2.2" strokeLinejoin="round" strokeDasharray="7 4" />
        <text x={PL} y={H - 8} fontSize="10" fill="#666">{dates[0]}</text>
        <text x={W - PR} y={H - 8} textAnchor="end" fontSize="10" fill="#666">{dates[n - 1]}</text>
        {hover !== null && <line x1={x(hi)} x2={x(hi)} y1={PT} y2={PT + ih} stroke="#555" />}
        <circle cx={x(hi)} cy={y(pa[hi])} r="4.5" fill={ME_COLOR} stroke="#000" strokeWidth="1.5" />
        <circle cx={x(hi)} cy={y(pb[hi])} r="4.5" fill={FRIEND_COLOR} stroke="#000" strokeWidth="1.5" />
      </svg>
    </div>
  );
}

      if (!t.trade_date) return;
      const e = m.get(t.trade_date) || { pnl: 0, n: 0 };
      e.pnl += Number(t.pnl || 0);
      e.n += 1;
      m.set(t.trade_date, e);
    });
    const offset = mondayIndex(new Date(year, month, 1));
    const dim = daysInMonth(year, month);
    const arr = [];
    for (let i = 0; i < offset; i++) arr.push(null);
    let tot = 0, cnt = 0;
    for (let d = 1; d <= dim; d++) {
      const iso = isoDate(year, month, d);
      const e = m.get(iso);
      if (e) { tot += e.pnl; cnt += e.n; }

// Geplantes RR in Buckets (Ziel-RR laut SL/TP, nicht das realisierte RR)
const FRIENDS_RR_ORDER = ["< 1R", "1–2R", "2–3R", "3–5R", "5R+"];
const friendsRRBucket = (t) => {
  if (t.rr === null || t.rr === undefined || t.rr === "") return null;
  const r = Number(t.rr);
  if (Number.isNaN(r)) return null;
  return r < 1 ? "< 1R" : r < 2 ? "1–2R" : r < 3 ? "2–3R" : r < 5 ? "3–5R" : "5R+";
};

const friendsWeekdayKey = (t) => {
  const d = new Date(`${t.trade_date}T00:00:00`);
  return isNaN(d.getTime()) ? null : WEEKDAY_FULL[mondayIndex(d)];
};

// XFA-/Eval-Zuordnung: Grenze ist entweder ein ISO-Datetime (wie fundedActivatedAt im Journal,
// Vergleich ueber created_at) oder ein reines Datum (Vergleich ueber trade_date).
function isXfaTrade(t, boundary) {
  if (!boundary) return false;
  if (boundary.length > 10) return t.created_at ? t.created_at >= boundary : t.trade_date >= boundary.slice(0, 10);
  return t.trade_date >= boundary;
}

function FriendsSelect({ value, onChange, allLabel, options }) {
  const on = value !== "all";
  return (
    <select
      value={value}
      onChange={(e) => onChange(e.target.value)}
      style={{
        background: "var(--panel)", border: `1px solid ${on ? "var(--muted-light)" : "var(--line)"}`,

}

// Gruppierter Vergleich (z. B. nach Wochentag, Setup, Symbol, Confluence).
// keyFn darf einen Schluessel oder ein Array von Schluesseln liefern (z. B. Confluence-Tags).
function FriendsBreakdown({ mine, theirs, myName, theirName, keyFn, order, limit = 12, chrono = false }) {
  const data = useMemo(() => {
    const agg = (list) => {
      const m = new Map();
      list.forEach((t) => {
        const ks = keyFn(t);
        (Array.isArray(ks) ? ks : [ks]).forEach((k) => {
          if (k === null || k === undefined || k === "") return;
          const e = m.get(k) || { n: 0, w: 0, l: 0, pnl: 0, rr: 0, rrN: 0 };
          e.n += 1;
          e.pnl += Number(t.pnl || 0);
          if (t.result === "win") e.w += 1;
          else if (t.result === "loss") e.l += 1;
          const rr = tradeRR(t);
          if (rr !== null && !Number.isNaN(rr)) { e.rr += rr; e.rrN += 1; }
          m.set(k, e);
        });
      });
      return m;
    };
    const a = agg(mine), b = agg(theirs);
    let keys = Array.from(new Set([...a.keys(), ...b.keys()]));
    if (order) keys = order.filter((k) => keys.includes(k));
    else if (chrono) keys = keys.sort();
    else keys = keys.sort((x, y) => ((b.get(y) ? b.get(y).n : 0) + (a.get(y) ? a.get(y).n : 0)) - ((b.get(x) ? b.get(x).n : 0) + (a.get(x) ? a.get(x).n : 0))).slice(0, limit);
    let max = 1e-9;
    keys.forEach((k) => { [a.get(k), b.get(k)].forEach((e) => { if (e && Math.abs(e.pnl) > max) max = Math.abs(e.pnl); }); });
    return { keys, a, b, max };
  }, [mine, theirs]);

  if (data.keys.length === 0) return <div className="notice">{T("Keine Daten für diese Auswahl.", "No data for this selection.")}</div>;

  const cell = (e, color) => {
    if (!e) return <span style={{ fontSize: "12px", color: "var(--muted)" }}>—</span>;
    const decided = e.w + e.l;
    return (
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", columnGap: "8px", marginBottom: "4px" }}>
          <b style={{ fontSize: "13px", color: e.pnl >= 0 ? "#fff" : "var(--red)" }}>{fmtMoneyShort(e.pnl)}</b>
          <span style={{ fontSize: "11px", color: "var(--muted-light)" }}>
            {e.n}x · WR {decided ? ((e.w / decided) * 100).toFixed(0) : "—"}% · Ø {e.rrN ? (e.rr / e.rrN).toFixed(2) : "—"}R
          </span>
        </div>
        <div style={{ height: "5px", background: "#1a1a1a", borderRadius: "3px", overflow: "hidden" }}>
          <div style={{ width: `${Math.min(100, (Math.abs(e.pnl) / data.max) * 100)}%`, height: "100%", background: color, borderRadius: "3px" }} />
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "112px 1fr 1fr", gap: "14px", paddingBottom: "6px", borderBottom: "1px solid var(--line)" }}>
        <span />
        <span style={{ color: ME_COLOR, fontWeight: 700, fontSize: "12px", letterSpacing: "0.1em", textTransform: "uppercase" }}>{myName}</span>
        <span style={{ color: FRIEND_COLOR, fontWeight: 700, fontSize: "12px", letterSpacing: "0.1em", textTransform: "uppercase" }}>{theirName}</span>
      </div>
      {data.keys.map((k) => (
        <div key={k} style={{ display: "grid", gridTemplateColumns: "112px 1fr 1fr", gap: "14px", alignItems: "center", padding: "7px 0", borderBottom: "1px solid var(--line)" }}>
          <span style={{ fontSize: "12px", color: "var(--muted-light)", wordBreak: "break-word" }}>{tagText(k)}</span>
          {cell(data.a.get(k), ME_COLOR)}
          {cell(data.b.get(k), FRIEND_COLOR)}
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   FREUNDE — Uebersicht
   Reihenfolge: Kennzahlen-Karten, automatisches Fazit, Tagesduell,
   Equity ($ oder R), Vergleichstabelle in Abschnitten, Aufschluesselungen.
   ============================================================ */
const fmtPFSafe = (v) => (Number.isNaN(v) ? "—" : fmtPFValue(v));
const nanIfNull = (v) => (v === null || v === undefined ? NaN : v);

// Kennzahlen je Person: Zusammenfassung, Edge-Werte, Netto-R und Plan-Disziplin.
function friendsMetrics(list) {
  const sum = summarizeTrades(list);
  const edge = computeEdgeStats(list);
  const rs = finiteNums(list.map(tradeRR));
  const planKnown = list.filter((t) => t.plan_followed === true || t.plan_followed === false);
  return {
    sum,
    edge,
    wins: list.filter((t) => t.result === "win").length,
    netR: rs.reduce((s, v) => s + v, 0),
    rN: rs.length,
    planN: planKnown.length,
    noPlanShare: planKnown.length ? planKnown.filter((t) => t.plan_followed === false).length / planKnown.length : null,
  };
}

// Automatisches Fazit. Jede Aussage nennt Zahlen, und Unterschiede werden nur dann als belastbar
// bezeichnet, wenn sich die 95%-Intervalle der Winrate nicht ueberlappen.
function friendsTakeaways(A, B, myName, theirName) {
  const out = [];
  if (!A.sum.count || !B.sum.count) return out;
  const who = (d) => (d > 0 ? myName : theirName);
  // Grammatik: "bei mir" / "für mich" statt "bei Ich" / "für Ich"; Namen bleiben unveraendert.
  const dat = (n) => (n === myName ? T("mir", "me") : n);
  const acc = (n) => (n === myName ? T("mich", "me") : n);

  const dUsd = A.sum.pnl - B.sum.pnl;
  if (dUsd !== 0) {
    out.push({
      key: "result",
      text: T(
        `Ergebnis: ${fmtMoney(Math.abs(dUsd))} Vorsprung für ${acc(who(dUsd))} (${myName} ${fmtMoneyShort(A.sum.pnl)}, ${theirName} ${fmtMoneyShort(B.sum.pnl)}). In R: ${fmtR(A.netR)} gegen ${fmtR(B.netR)}. Das ist der fairere Vergleich, falls ihr verschieden viele Contracts handelt.`,
        `Result: ${fmtMoney(Math.abs(dUsd))} lead for ${acc(who(dUsd))} (${myName} ${fmtMoneyShort(A.sum.pnl)}, ${theirName} ${fmtMoneyShort(B.sum.pnl)}). In R: ${fmtR(A.netR)} vs ${fmtR(B.netR)}. That is the fairer comparison if you trade different contract sizes.`
      ),
    });
  }

  if (A.rN >= 5 && B.rN >= 5 && A.edge.expR !== B.edge.expR) {
    const hi = A.edge.expR > B.edge.expR ? A : B;
    const lo = hi === A ? B : A;
    out.push({
      key: "edge",
      text: T(
        `Edge pro Trade: ${fmtR(hi.edge.expR)} bei ${dat(hi === A ? myName : theirName)}, ${fmtR(lo.edge.expR)} bei ${dat(hi === A ? theirName : myName)}.`,
        `Edge per trade: ${fmtR(hi.edge.expR)} for ${dat(hi === A ? myName : theirName)}, ${fmtR(lo.edge.expR)} for ${dat(hi === A ? theirName : myName)}.`
      ),
    });
  }

  const nA = A.edge.decided, nB = B.edge.decided;
  if (nA > 0 && nB > 0) {
    const wa = wilsonInterval(A.wins, nA), wb = wilsonInterval(B.wins, nB);
    const overlap = wa.low <= wb.high && wb.low <= wa.high;
    const pa = `${(wa.p * 100).toFixed(0)}%`, pb = `${(wb.p * 100).toFixed(0)}%`;
    out.push({
      key: "winrate",
      text: overlap
        ? T(`Winrate ${pa} gegen ${pb}: Die Intervalle überlappen, bei dieser Stichprobe ist der Unterschied nicht belastbar.`, `Win rate ${pa} vs ${pb}: the intervals overlap, so the difference is not reliable at this sample size.`)
        : T(`Winrate ${pa} gegen ${pb}: Die Intervalle überlappen nicht, der Unterschied ist belastbar.`, `Win rate ${pa} vs ${pb}: the intervals do not overlap, the difference is reliable.`),
    });
  }

  if ((A.sum.maxDD > 0 || B.sum.maxDD > 0) && A.sum.maxDD !== B.sum.maxDD) {
    const low = A.sum.maxDD < B.sum.maxDD ? A : B;
    const high = low === A ? B : A;
    out.push({
      key: "dd",
      text: T(
        `Risiko: kleinerer Max Drawdown bei ${dat(low === A ? myName : theirName)} (${fmtMoney(-low.sum.maxDD)} gegen ${fmtMoney(-high.sum.maxDD)}).`,
        `Risk: smaller max drawdown for ${dat(low === A ? myName : theirName)} (${fmtMoney(-low.sum.maxDD)} vs ${fmtMoney(-high.sum.maxDD)}).`
      ),
    });
  }

  if (A.noPlanShare !== null && B.noPlanShare !== null && A.planN >= 5 && B.planN >= 5 && Math.abs(A.noPlanShare - B.noPlanShare) >= 0.1) {
    out.push({
      key: "plan",
      text: T(
        `Disziplin: Trades ohne Plan machen bei ${dat(myName)} ${(A.noPlanShare * 100).toFixed(0)}% aus, bei ${theirName} ${(B.noPlanShare * 100).toFixed(0)}%.`,
        `Discipline: trades without a plan are ${(A.noPlanShare * 100).toFixed(0)}% for ${dat(myName)} and ${(B.noPlanShare * 100).toFixed(0)}% for ${theirName}.`
      ),
    });
  }

  if (Math.min(nA, nB) < SMALL_SAMPLE) {
    out.push({
      key: "sample",
      warn: true,
      text: T(
        `Kleine Stichprobe (${myName} ${nA}, ${theirName} ${nB} Trades mit Ergebnis, unter ${SMALL_SAMPLE}): Zahlen mit Vorsicht lesen.`,
        `Small sample (${myName} ${nA}, ${theirName} ${nB} decided trades, under ${SMALL_SAMPLE}): read the numbers with care.`
      ),
    });
  }
  return out;
}

function FriendsOverview({ myName, theirName, mine, theirs, duel }) {
  const [unit, setUnit] = useState("usd");
  const A = useMemo(() => friendsMetrics(mine), [mine]);
  const B = useMemo(() => friendsMetrics(theirs), [theirs]);
  const diff = A.sum.pnl - B.sum.pnl;
  const takeaways = useMemo(() => friendsTakeaways(A, B, myName, theirName), [A, B, myName, theirName]);
  const hasTime = useMemo(() => [...mine, ...theirs].some((t) => /^\d{1,2}:\d{2}/.test(t.entry_time || "")), [mine, theirs]);

  const pct = (v) => (Number.isFinite(v) ? `${v.toFixed(0)}%` : "—");
  const share = (v) => (Number.isFinite(v) ? `${(v * 100).toFixed(0)}%` : "—");
  const sections = [
    {
      title: T("Ergebnis", "Result"),
      rows: [
        { label: "Trades", a: A.sum.count, b: B.sum.count, fmt: String, better: null },
        { label: T("Netto PnL", "Net PnL"), a: A.sum.pnl, b: B.sum.pnl, fmt: fmtMoneyShort, better: "high" },
        { label: T("Netto R", "Net R"), a: A.rN ? A.netR : NaN, b: B.rN ? B.netR : NaN, fmt: fmtR, better: "high" },
        { label: T("Handelstage", "Trading days"), a: A.sum.dayCount, b: B.sum.dayCount, fmt: String, better: null },
        { label: T("Grüne Tage", "Green days"), a: A.sum.greenDayPct, b: B.sum.greenDayPct, fmt: pct, better: "high" },
        { label: T("Bester Tag", "Best day"), a: A.sum.bestDay, b: B.sum.bestDay, fmt: fmtMoneyShort, better: "high" },
        { label: T("Schlechtester Tag", "Worst day"), a: A.sum.worstDay, b: B.sum.worstDay, fmt: fmtMoneyShort, better: "high" },
      ],
    },
    {
      title: T("Qualität", "Quality"),
      rows: [
        {
          label: "Winrate", a: A.sum.winrate, b: B.sum.winrate, fmt: pct, better: "high",
          subA: A.edge.decided ? `95%: ${fmtCI(A.wins, A.edge.decided)}` : null,
          subB: B.edge.decided ? `95%: ${fmtCI(B.wins, B.edge.decided)}` : null,
        },
        { label: "Profit Factor", a: A.sum.profitFactor, b: B.sum.profitFactor, fmt: fmtPFSafe, better: "high" },
        { label: "Expectancy / Trade", a: A.sum.expectancy, b: B.sum.expectancy, fmt: fmtMoneyShort, better: "high" },
        { label: T("Expectancy (R)", "Expectancy (R)"), a: A.rN ? A.edge.expR : NaN, b: B.rN ? B.edge.expR : NaN, fmt: fmtR, better: "high" },
        { label: "SQN", a: nanIfNull(A.edge.sqn), b: nanIfNull(B.edge.sqn), fmt: (v) => (Number.isFinite(v) ? v.toFixed(2) : "—"), better: "high" },
        { label: T("Payoff (Ø Win / Ø Loss)", "Payoff (avg win / avg loss)"), a: A.sum.payoff, b: B.sum.payoff, fmt: fmtPFSafe, better: "high" },
        { label: T("Ø Gewinn / Win", "Avg profit / win"), a: A.sum.avgWin, b: B.sum.avgWin, fmt: fmtMoneyShort, better: "high" },
        { label: T("Ø Verlust / Loss", "Avg loss / loss"), a: A.sum.avgLoss, b: B.sum.avgLoss, fmt: fmtMoneyShort, better: "high" },
      ],
    },
    {
      title: T("Risiko", "Risk"),
      rows: [
        { label: "Max Drawdown (PnL)", a: A.sum.maxDD, b: B.sum.maxDD, fmt: (v) => fmtMoney(-v), better: "low" },
        { label: T("Längste Loss-Streak", "Longest loss streak"), a: A.sum.maxLossStreak, b: B.sum.maxLossStreak, fmt: (v) => `${v}×`, better: "low" },
        { label: T("Ø Risiko / Trade", "Avg risk / trade"), a: A.edge.riskN ? A.edge.avgRisk : NaN, b: B.edge.riskN ? B.edge.avgRisk : NaN, fmt: fmtMoney, better: null },
      ],
    },
    {
      title: T("Verhalten", "Behavior"),
      rows: [
        { label: T("Ohne-Plan-Anteil", "No-plan share"), a: nanIfNull(A.noPlanShare), b: nanIfNull(B.noPlanShare), fmt: share, better: "low" },
        { label: T("Längste Win-Streak", "Longest win streak"), a: A.sum.maxWinStreak, b: B.sum.maxWinStreak, fmt: (v) => `${v}×`, better: "high" },
        { label: T("Trades pro Handelstag", "Trades per trading day"), a: A.sum.tradesPerDay, b: B.sum.tradesPerDay, fmt: (v) => v.toFixed(1), better: null },
      ],
    },
  ];

  const cell = (r, side, color) => {
    const v = side === "a" ? r.a : r.b;
    const other = side === "a" ? r.b : r.a;
    const sub = side === "a" ? r.subA : r.subB;
    const none = Number.isNaN(v);
    const better = !none && !Number.isNaN(other) && (r.better === "high" ? v > other : r.better === "low" ? v < other : false);
    const finiteVals = [r.a, r.b].filter(Number.isFinite).map(Math.abs);
    const mx = Math.max(1e-9, ...finiteVals);

      {node}

  );
  const bd = (keyFn, extra = {}) => (
    <FriendsBreakdown mine={mine} theirs={theirs} myName={myName} theirName={theirName} keyFn={keyFn} {...extra} />
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
      <div style={{ display: "flex", gap: "16px", flexWrap: "wrap" }}>
        <FriendsHeroCard name={myName} color={ME_COLOR} sum={A.sum} leading={diff > 0} />
        <FriendsHeroCard name={theirName} color={FRIEND_COLOR} sum={B.sum} leading={diff < 0} />
      </div>

      {takeaways.length > 0 && (
        <div style={{ ...friendsCard, marginBottom: 0 }}>
          <div style={friendsSectionTitle}>{T("Fazit", "Takeaways")}</div>

              <div key={t.key} style={{ display: "flex", gap: "10px", fontSize: "12.5px", lineHeight: 1.6, color: t.warn ? "#ff6b78" : "var(--text)" }}>
                <span style={{ color: t.warn ? "var(--red)" : "var(--muted)", flexShrink: 0 }}>●</span>
                <span>{t.text}</span>
              </div>

        <div style={{ ...friendsCard, marginBottom: 0 }}>

          <div style={{ display: "flex", height: "10px", borderRadius: "5px", overflow: "hidden", background: "#1a1a1a" }}>
            <div style={{ width: `${(duel.w / duel.total) * 100}%`, background: ME_COLOR }} />
            <div style={{ width: `${(duel.t / duel.total) * 100}%`, background: "#444" }} />
            <div style={{ width: `${(duel.l / duel.total) * 100}%`, background: FRIEND_COLOR }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: "10px", fontSize: "12px" }}>
            <span style={{ color: ME_COLOR }}>{myName} {T("besser:", "ahead:")} <b>{duel.w}</b></span>
            <span style={{ color: "var(--muted-light)" }}>{T("Gleichstand:", "Tie:")} <b>{duel.t}</b></span>
            <span style={{ color: FRIEND_COLOR }}>{theirName} {T("besser:", "ahead:")} <b>{duel.l}</b></span>
          </div>
        </div>
      )}

      <div style={{ ...friendsCard, marginBottom: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px", flexWrap: "wrap", marginBottom: "10px" }}>
          <div style={{ ...friendsSectionTitle, marginBottom: 0 }}>{T("Equity-Vergleich", "Equity comparison")}</div>
          <div style={{ display: "flex", gap: "6px" }}>
            {[["usd", "$"], ["r", "R"]].map(([id, label]) => (
