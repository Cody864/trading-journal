function TradingJournal() {
  const [trades, setTrades] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [panelOpen, setPanelOpen] = useState(false);
  const [forwardTestOpen, setForwardTestOpen] = useState(false);
  const [friendsOpen, setFriendsOpen] = useState(false);
  const [saving, setSaving] = useState(false);
  const [cursor, setCursor] = useState(() => {
    const n = new Date();
    return { year: n.getFullYear(), month: n.getMonth() };
  });
  const [dayDetail, setDayDetail] = useState(null);
  const [editingTrade, setEditingTrade] = useState(null);
  const [filterSymbol, setFilterSymbol] = useState("all");
  const [filterResult, setFilterResult] = useState("all");
  const { toasts, push: pushToast } = useToasts();

  // ── Funded Stage: wird einmalig aktiviert sobald Balance >= 53k ──
  // Ab diesem Zeitpunkt startet der Account neu auf 50k.
  // Alte (Eval-)Trades bleiben im Kalender sichtbar, aber ihr PnL
  // fliesst nicht mehr in die neue Balance ein.
  // fundedActivatedAt: ISO-datetime des Klicks — Trades mit created_at DAVOR sind Eval.
  const [fundedStage, setFundedStage] = useState(() => {
    try { return localStorage.getItem("journal_funded_stage") === "1"; } catch { return false; }
  });
  const [fundedStartDate, setFundedStartDate] = useState(() => {
    try { return localStorage.getItem("journal_funded_start_date") || null; } catch { return null; }
  });
  const [fundedActivatedAt, setFundedActivatedAt] = useState(() => {
    try { return localStorage.getItem("journal_funded_activated_at") || null; } catch { return null; }
  });

  // Datum des letzten Payouts = Start des aktuellen Payout-Zyklus (pro Profil gespeichert)
  const [lastPayoutDate, setLastPayoutDate] = useState(() => {
    try { return localStorage.getItem("journal_funded_last_payout") || ""; } catch { return ""; }
  });
  const updateLastPayoutDate = useCallback((v) => {
    try { localStorage.setItem("journal_funded_last_payout", v || ""); } catch {}
    setLastPayoutDate(v || "");
  }, []);

  const evalPassed = fundedStage;
  const evalPassedDate = fundedStartDate;

  const activateFundedStage = useCallback(() => {
    const d = new Date().toISOString().slice(0, 10);
    const dt = new Date().toISOString();
    try {
      localStorage.setItem("journal_funded_stage", "1");
      localStorage.setItem("journal_funded_start_date", d);
      localStorage.setItem("journal_funded_activated_at", dt);
    } catch {}
    setFundedStage(true);
    setFundedStartDate(d);
    setFundedActivatedAt(dt);
    pushToast(T("Funded Stage aktiviert — Account startet neu auf $50.000", "Funded stage activated — account restarts at $50,000"));
  }, [pushToast]);

  // Pausiert die Funded Stage OHNE das urspruengliche Start-/Aktivierungsdatum zu
  // loeschen — so bleibt ein spaeteres "Zurueck zur Funded Stage" (reactivateFundedStage)
  // exakt und der Kalender wird durch ein versehentliches Umschalten nicht verfaelscht.
  const resetToEvalStage = useCallback(() => {
    try {
      localStorage.setItem("journal_funded_stage", "0");
    } catch {}
    setFundedStage(false);
    pushToast(T("Zurueck zur Eval Stage", "Back to eval stage"));
  }, [pushToast]);

  // Aktiviert die Funded Stage erneut MIT dem bereits gespeicherten Start-/
  // Aktivierungsdatum (kein neuer Zeitstempel) — dafuer muss kein neuer Trade
  // eingetragen werden und der Kalender bleibt akkurat.
  const reactivateFundedStage = useCallback(() => {
    try {
      localStorage.setItem("journal_funded_stage", "1");
    } catch {}
    setFundedStage(true);
    pushToast(T("Funded Stage wieder aktiv", "Funded stage active again"));
  }, [pushToast]);

  // Einmalige Wiederherstellung fuer den Fall, dass Start-/Aktivierungsdatum bereits
  // verloren gegangen sind (z. B. durch eine alte Version dieses Buttons). Nimmt ein
  // vom Nutzer eingetragenes Datum/Uhrzeit entgegen und setzt Funded Stage darauf.
  const restoreFundedStage = useCallback((dateTimeLocal) => {
    if (!dateTimeLocal) return;
    const dt = new Date(dateTimeLocal).toISOString();
    const d = dt.slice(0, 10);
    try {
      localStorage.setItem("journal_funded_stage", "1");
      localStorage.setItem("journal_funded_start_date", d);
      localStorage.setItem("journal_funded_activated_at", dt);
    } catch {}
    setFundedStage(true);
    setFundedStartDate(d);
    setFundedActivatedAt(dt);
    pushToast(T("Funded Stage wiederhergestellt", "Funded stage restored"));
  }, [pushToast]);

  const filteredTrades = useMemo(() => {
    return trades.filter((t) => {
      if (filterSymbol !== "all" && t.symbol !== filterSymbol) return false;
      if (filterResult !== "all" && t.result !== filterResult) return false;
      return true;
    });
  }, [trades, filterSymbol, filterResult]);

  const hasActiveFilters = filterSymbol !== "all" || filterResult !== "all";

  // Bereits verwendete Setup-Namen (für Autovervollständigung im Formular)
  const existingSetups = useMemo(() => {
    const set = new Set();
    trades.forEach((t) => { if (t.setup) set.add(t.setup); });
    return Array.from(set).sort();
  }, [trades]);

  // Bereits verwendete Confluence-Tags (für Mehrfachauswahl im Formular & Forward Test)
  const existingConfluences = useMemo(() => {
    const set = new Set();
    trades.forEach((t) => {
      (Array.isArray(t.confluences) ? t.confluences : []).forEach((c) => set.add(c));
    });
    return Array.from(set).sort();
  }, [trades]);

  // Confluence-Vorschläge im Formular: die vordefinierten Fib-/Zonen-Tags zuerst,
  // danach zusätzlich alle bereits manuell vergebenen Tags aus der Historie.
  const confluenceOptions = useMemo(() => {
    const combined = [...DEFAULT_CONFLUENCES];
    existingConfluences.forEach((c) => { if (!combined.includes(c)) combined.push(c); });
    return combined;
  }, [existingConfluences]);


  // Realisierter RR-Wert eines Trades (Win = geplantes RR, Loss = immer -1, BE = 0)
  const realizedRRForTrade = useCallback((t) => {
    if (t.result === "be") return 0;
    if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
    if (t.result === "loss") return t.rr !== null && t.rr !== undefined ? -1 : null;
    if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
    return null;
  }, []);

  // Realisierte Punkte eines Trades (Win = TP-Punkte, Loss = -SL-Punkte, BE = 0)
  const realizedPointsForTrade = useCallback((t) => {
    if (t.result === "win") return t.take_profit !== null && t.take_profit !== undefined ? Number(t.take_profit) : null;
    if (t.result === "loss") return t.stop_loss !== null && t.stop_loss !== undefined ? -Math.abs(Number(t.stop_loss)) : null;
    if (t.result === "be") return 0;
    return null;
  }, []);

  // ── Confluence-Auswertung ──
  // Über die GESAMTE Historie (nicht nur Funded-Stage), damit die statistische
  // Basis für die Strategie-Validierung möglichst groß bleibt. Respektiert aber
  // die Symbol-/Ergebnis-Filter aus der Filterleiste.
  const confluenceStats = useMemo(() => {
    const map = new Map();
    filteredTrades.forEach((t) => {
      const tags = Array.isArray(t.confluences) ? t.confluences : [];
      tags.forEach((tag) => {
        if (!map.has(tag)) {
          map.set(tag, { tag, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0, ptsSum: 0, ptsCount: 0, pnlSum: 0 });
        }
        const e = map.get(tag);
        e.count += 1;
        e.pnlSum += Number(t.pnl || 0);
        if (t.result === "win") e.wins += 1;
        else if (t.result === "loss") e.losses += 1;
        else if (t.result === "be") e.bes += 1;
        const rr = realizedRRForTrade(t);
        if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
        const pts = realizedPointsForTrade(t);
        if (pts !== null && !Number.isNaN(pts)) { e.ptsSum += pts; e.ptsCount += 1; }
      });
    });
    return Array.from(map.values())
      .map((e) => {
        const decided = e.wins + e.losses;
        return {
          ...e,
          winrate: decided ? (e.wins / decided) * 100 : 0,
          avgRR: e.rrCount ? e.rrSum / e.rrCount : 0,
          avgPoints: e.ptsCount ? e.ptsSum / e.ptsCount : 0,
        };
      })
      .sort((a, b) => b.count - a.count);
  }, [filteredTrades, realizedRRForTrade, realizedPointsForTrade]);
  const maxConfluenceCount = Math.max(1, ...confluenceStats.map((c) => c.count));

  // ── Setup-Auswertung ──
  // Analog zur Confluence-Analyse, aber nach dem (einzelnen) Setup-Feld gruppiert.
  // Respektiert ebenfalls die Symbol-/Ergebnis-Filter aus der Filterleiste.
  const setupStats = useMemo(() => {
    const map = new Map();
    filteredTrades.forEach((t) => {
      if (!t.setup) return;
      if (!map.has(t.setup)) {
        map.set(t.setup, { setup: t.setup, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0, pnlSum: 0 });
      }
      const e = map.get(t.setup);
      e.count += 1;
      e.pnlSum += Number(t.pnl || 0);
      if (t.result === "win") e.wins += 1;
      else if (t.result === "loss") e.losses += 1;
      else if (t.result === "be") e.bes += 1;
      const rr = realizedRRForTrade(t);
      if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
    });
    return Array.from(map.values())
      .map((e) => {
        const decided = e.wins + e.losses;
        return { ...e, winrate: decided ? (e.wins / decided) * 100 : 0, avgRR: e.rrCount ? e.rrSum / e.rrCount : 0 };
      })
      .sort((a, b) => b.count - a.count);
  }, [filteredTrades, realizedRRForTrade]);
  const maxSetupCount = Math.max(1, ...setupStats.map((s) => s.count));

  // ── Top Confluence-Kombinationen ──
  // Berechnet für jede 2er- und 3er-Kombination von Confluences, die in mindestens
  // MIN_COMBO_SAMPLE Trades gemeinsam vorkamen, Winrate und Ø RR — auf Basis der
  // KOMPLETTEN Historie (nicht gefiltert), damit z. B. ein blind genommener Einzel-Trigger
  // (nur 1 von mehreren Confluences) das Ranking der vollständigen Kombination nicht verwässert.
  const comboStats = useMemo(() => {
    const map = new Map();
    trades.forEach((t) => {
      const tags = Array.isArray(t.confluences) ? Array.from(new Set(t.confluences)).sort() : [];
      if (tags.length < 2) return;
      const combos = [];
      for (let i = 0; i < tags.length; i++) {
        for (let j = i + 1; j < tags.length; j++) {
          combos.push([tags[i], tags[j]]);
          for (let k = j + 1; k < tags.length; k++) {
            combos.push([tags[i], tags[j], tags[k]]);
          }
        }
      }
      combos.forEach((combo) => {
        const key = combo.join(" + ");
        if (!map.has(key)) {
          map.set(key, { key, size: combo.length, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0 });
        }
        const e = map.get(key);
        e.count += 1;
        if (t.result === "win") e.wins += 1;
        else if (t.result === "loss") e.losses += 1;
        else if (t.result === "be") e.bes += 1;
        const rr = realizedRRForTrade(t);
        if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
      });
    });
    return Array.from(map.values())
      .filter((e) => e.count >= MIN_COMBO_SAMPLE)
      .map((e) => {
        const decided = e.wins + e.losses;
        return { ...e, winrate: decided ? (e.wins / decided) * 100 : 0, avgRR: e.rrCount ? e.rrSum / e.rrCount : 0 };
      })
      .sort((a, b) => b.winrate - a.winrate || b.avgRR - a.avgRR)
      .slice(0, 8);
  }, [trades, realizedRRForTrade]);

  const dayDetailData = useMemo(() => {
    if (!dayDetail) return null;
    const dayTrades = filteredTrades.filter((t) => t.trade_date === dayDetail);
    const pnl = dayTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const isHistoric = fundedStage && fundedActivatedAt
      ? dayTrades.length > 0 && dayTrades.every((t) => !t.created_at || t.created_at < fundedActivatedAt)
      : false;
    return { iso: dayDetail, trades: dayTrades, pnl, isHistoric };
  }, [dayDetail, filteredTrades, fundedStage, fundedActivatedAt]);

  const loadTrades = useCallback(async () => {
    if (!isConfigured) {
      setLoading(false);
      return;
    }
    setError(null);
    try {
      const res = await fetch(`${REST_URL}?select=*&order=trade_date.asc`, {
        headers: sbHeaders,
      });
      if (!res.ok) throw new Error(T(`Supabase Fehler ${res.status}`, `Supabase error ${res.status}`));
      const data = await res.json();
      setTrades(data);
    } catch (e) {
      setError(e.message || T("Verbindung zu Supabase fehlgeschlagen", "Connection to Supabase failed"));
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    loadTrades();
  }, [loadTrades]);

  const stats = useMemo(() => {
    const sorted = [...filteredTrades].sort(
      (a, b) => new Date(a.trade_date) - new Date(b.trade_date) || a.id - b.id
    );

    // In der Funded Stage zaehlen nur Trades die NACH dem Aktivierungs-Zeitpunkt
    // gespeichert wurden. So werden Eval-Trades vom selben Tag korrekt ausgeschlossen.
    const fundedTrades = fundedStage && fundedActivatedAt
      ? sorted.filter((t) => t.created_at && t.created_at >= fundedActivatedAt)
      : sorted;
    const evalHistoricTrades = fundedStage && fundedActivatedAt
      ? sorted.filter((t) => !t.created_at || t.created_at < fundedActivatedAt)
      : [];

    // Alte-Strategie-Cutoff: fuer die Performance-Stats zaehlen nur Trades ab
    // STATS_CUTOFF_DATE. totalPnl/balance bleiben unten bewusst auf Basis ALLER
    // fundedTrades, damit sie (falls je referenziert) konsistent zum echten Konto bleiben.
    const statsTrades = fundedTrades.filter((t) => t.trade_date >= STATS_CUTOFF_DATE);

    const totalPnl = fundedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const balance = STARTING_BALANCE + totalPnl;

    const wins = statsTrades.filter((t) => t.result === "win" || (t.result !== "loss" && t.result !== "be" && Number(t.pnl) > 0));
    const losses = statsTrades.filter((t) => t.result === "loss" || (t.result !== "win" && t.result !== "be" && Number(t.pnl) < 0));
    const bes = statsTrades.filter((t) => t.result === "be");
    const decidedTrades = statsTrades.filter((t) => t.result !== "be");
    const winrate = decidedTrades.length ? (wins.length / decidedTrades.length) * 100 : 0;

    const grossProfit = wins.reduce((s, t) => s + Number(t.pnl), 0);
    const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl), 0));
    const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;

    // Avg. RR auf Basis des REALISIERTEN RR: Win = geplantes reward/risk, Loss = immer exakt -1
    const realizedRRValues = statsTrades
      .map((t) => {
        if (t.result === "be") return 0;
        if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
        if (t.result === "loss") return t.rr !== null && t.rr !== undefined ? -1 : null;
        if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
        return null;
      })
      .filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
    const avgRR = realizedRRValues.length
      ? realizedRRValues.reduce((s, r) => s + r, 0) / realizedRRValues.length
      : 0;

    // Expectancy: durchschnittlicher $-Ertrag pro entschiedenem Trade (Win/Loss, ohne BE).
    // Mathematisch identisch zu (Winrate * Ø-Gewinn) - (Verlustrate * Ø-Verlust), aber einfacher
    // zu berechnen: einfach der Netto-PnL aller entschiedenen Trades geteilt durch ihre Anzahl.
    const expectancy = decidedTrades.length
      ? decidedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0) / decidedTrades.length
      : 0;

    let running = STARTING_BALANCE;
    let peak = STARTING_BALANCE;
    let maxDrawdown = 0;
    let maxDrawdownPct = 0;
    const equityCurve = [{ x: 0, y: running }];
    statsTrades.forEach((t, i) => {
      running += Number(t.pnl || 0);
      equityCurve.push({ x: i + 1, y: running });
      if (running > peak) peak = running;
      const dd = peak - running;
      const ddPct = peak > 0 ? (dd / peak) * 100 : 0;
      if (dd > maxDrawdown) {
        maxDrawdown = dd;
        maxDrawdownPct = ddPct;
      }
    });

    // ── EOD-Trading-Tage (für Drawdown, Streaks pro Tag, Payout-Regeln) ──
    // Trades werden zu Kalendertagen aggregiert, dann chronologisch sortiert.
    const dayMap = new Map();
    statsTrades.forEach((t) => {
      const d = t.trade_date;
      if (!dayMap.has(d)) dayMap.set(d, { date: d, pnl: 0, count: 0 });
      const entry = dayMap.get(d);
      entry.pnl += Number(t.pnl || 0);
      entry.count += 1;
    });
    const tradingDays = Array.from(dayMap.values()).sort((a, b) => new Date(a.date) - new Date(b.date));

    // ── EOD Trailing Drawdown mit Equity-Cap ──
    // Die MLL (Minimum Loss Line) folgt dem höchsten je erreichten EOD-Stand,
    // deckelt aber bei DD_PEAK_CAP (52.000) — danach bleibt sie fix bei 50.000,
    // auch wenn die Equity weiter über den Cap steigt. Das bedeutet: der reale
    // Puffer (eodBalance - mll) kann dann größer als DD_BUFFER (2.000) werden.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = STARTING_BALANCE;
    tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const cappedPeak = Math.min(eodPeak, DD_PEAK_CAP);
    const mll = cappedPeak - DD_BUFFER;
    const ddBufferRemaining = balance - mll; // wie viel Puffer noch bis zur MLL übrig ist
    // Für die Balken-Visualisierung: wie nah ist die Equity an der MLL, bezogen auf die
    // größte sinnvolle Spanne (eodPeak - mll). Am Peak = 0% Risiko, an der MLL = 100%.
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    // ── Distanz zum Account-Pass-Ziel (53.000) ──
    const distanceToPass = Math.max(0, ACCOUNT_PASS_TARGET - balance);
    const passProgressPct = Math.max(0, Math.min(100, (balance / ACCOUNT_PASS_TARGET) * 100));
    const accountPassed = balance >= ACCOUNT_PASS_TARGET;

    // Streaks (aktuell & längste)
    let currentStreak = 0;
    let currentStreakType = null;
    let longestWinStreak = 0;
    let longestLossStreak = 0;
    let curWin = 0;
    let curLoss = 0;
    statsTrades.forEach((t) => {
      const pnl = Number(t.pnl || 0);
      if (pnl > 0) {
        curWin += 1;
        curLoss = 0;
        if (curWin > longestWinStreak) longestWinStreak = curWin;
      } else if (pnl < 0) {
        curLoss += 1;
        curWin = 0;
        if (curLoss > longestLossStreak) longestLossStreak = curLoss;
      }
    });
    if (statsTrades.length) {
      const lastPnl = Number(statsTrades[statsTrades.length - 1].pnl || 0);
      currentStreakType = lastPnl > 0 ? "win" : lastPnl < 0 ? "loss" : null;
      for (let i = statsTrades.length - 1; i >= 0; i--) {
        const p = Number(statsTrades[i].pnl || 0);
        if (currentStreakType === "win" && p > 0) currentStreak++;
        else if (currentStreakType === "loss" && p < 0) currentStreak++;
        else break;
      }
    }

    const bestTrade = wins.length ? wins.reduce((a, b) => (Number(a.pnl) > Number(b.pnl) ? a : b)) : null;
    const worstTrade = losses.length ? losses.reduce((a, b) => (Number(a.pnl) < Number(b.pnl) ? a : b)) : null;

    // Breakdown nach Symbol
    const bySymbol = {};
    statsTrades.forEach((t) => {
      const key = t.symbol || "—";
      if (!bySymbol[key]) bySymbol[key] = { pnl: 0, count: 0 };
      bySymbol[key].pnl += Number(t.pnl || 0);
      bySymbol[key].count += 1;
    });

    // Breakdown nach Wochentag
    const byWeekday = WEEKDAY_FULL.map((label) => ({ label, pnl: 0, count: 0 }));
    statsTrades.forEach((t) => {
      const d = new Date(t.trade_date + "T00:00:00");
      const idx = (d.getDay() + 6) % 7;
      byWeekday[idx].pnl += Number(t.pnl || 0);
      byWeekday[idx].count += 1;
    });

    const maxAbsSymbolPnl = Math.max(1, ...Object.values(bySymbol).map((v) => Math.abs(v.pnl)));
    const maxAbsWeekdayPnl = Math.max(1, ...byWeekday.map((v) => Math.abs(v.pnl)));

    return {
      totalPnl, balance, winrate, profitFactor, avgRR, expectancy, equityCurve, count: statsTrades.length,
      decidedTrades, bes,
      evalHistoricTrades,
      maxDrawdown, maxDrawdownPct, currentStreak, currentStreakType,
      longestWinStreak, longestLossStreak, bestTrade, worstTrade,
      bySymbol, byWeekday, maxAbsSymbolPnl, maxAbsWeekdayPnl,
      tradingDays, eodPeak, eodBalance, mll, ddBufferRemaining, ddRiskPct,
      distanceToPass, passProgressPct, accountPassed,
    };
  }, [filteredTrades, fundedStage, fundedActivatedAt]);

  // ── Account-Stats (IMMER auf Basis ALLER Trades, unabhängig von Symbol-/Ergebnis-Filtern) ──
  // Balance, Equity-Kurve, Drawdown/MLL und Pass-Status sind reale Kontokennzahlen.
  // Sie dürfen sich NICHT ändern, nur weil der Nutzer die Filterleiste (Symbol/Ergebnis)
  // zum Browsen des Kalenders/der Insights benutzt — sonst könnte z. B. ein aktiver
  // "Losses"-Filter fälschlich einen bestandenen Drawdown-Breach verstecken.
  const accountStats = useMemo(() => {
    const sorted = [...trades].sort(
      (a, b) => new Date(a.trade_date) - new Date(b.trade_date) || a.id - b.id
    );

    const fundedTrades = fundedStage && fundedActivatedAt
      ? sorted.filter((t) => t.created_at && t.created_at >= fundedActivatedAt)
      : sorted;

    // In der Funded Stage startet die Balance-/Drawdown-Rechnung ab FUNDED_BALANCE_OVERRIDE
    // (bekannter realer Kontostand zum Aktivierungszeitpunkt) statt STARTING_BALANCE, damit
    // vorherige (nicht einzeln erfasste) Funded-Trades die aktuelle Balance nicht verfaelschen.
    const fundedBase = fundedStage ? FUNDED_BALANCE_OVERRIDE : STARTING_BALANCE;

    const totalPnl = fundedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const balance = fundedBase + totalPnl;

    let running = fundedBase;
    let peak = fundedBase;
    let maxDrawdown = 0;
    let maxDrawdownPct = 0;
    const equityCurve = [{ x: 0, y: running }];
    fundedTrades.forEach((t, i) => {
      running += Number(t.pnl || 0);
      equityCurve.push({ x: i + 1, y: running });
      if (running > peak) peak = running;
      const dd = peak - running;
      const ddPct = peak > 0 ? (dd / peak) * 100 : 0;
      if (dd > maxDrawdown) {
        maxDrawdown = dd;
        maxDrawdownPct = ddPct;
      }
    });

    const dayMap = new Map();
    fundedTrades.forEach((t) => {
      const d = t.trade_date;
      if (!dayMap.has(d)) dayMap.set(d, { date: d, pnl: 0, count: 0 });
      const entry = dayMap.get(d);
      entry.pnl += Number(t.pnl || 0);
      entry.count += 1;
    });
    const tradingDays = Array.from(dayMap.values()).sort((a, b) => new Date(a.date) - new Date(b.date));

    // eodPeak startet bewusst bei STARTING_BALANCE (50.000) statt fundedBase: das
    // reale Konto ist tatsaechlich dort gestartet, der Peak fuer die MLL-Regel bleibt
    // also unveraendert, auch wenn die aktuelle Balance ueber FUNDED_BALANCE_OVERRIDE
    // (48.224) weiterlaeuft. eodBalance dagegen startet bei fundedBase, weil das der
    // bekannte reale Kontostand zum Aktivierungszeitpunkt ist.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = fundedBase;
    tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const activeDdBuffer = fundedStage ? DD_BUFFER : EVAL_DD_BUFFER;
    const activeDdPeakCap = fundedStage ? DD_PEAK_CAP : EVAL_DD_PEAK_CAP;
    const cappedPeak = Math.min(eodPeak, activeDdPeakCap);
    const mll = cappedPeak - activeDdBuffer;
    const ddBufferRemaining = balance - mll;
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    const distanceToPass = Math.max(0, ACCOUNT_PASS_TARGET - balance);
    const passProgressPct = Math.max(0, Math.min(100, (balance / ACCOUNT_PASS_TARGET) * 100));
    const accountPassed = balance >= ACCOUNT_PASS_TARGET;

    return {
      totalPnl, balance, equityCurve, maxDrawdown, maxDrawdownPct,
      tradingDays, eodPeak, eodBalance, mll, ddBufferRemaining, ddRiskPct,
      distanceToPass, passProgressPct, accountPassed,
    };
  }, [trades, fundedStage, fundedActivatedAt]);

  // ── Payout-Phase Stats ──
  // Aktiv sobald "Eval Passed" gesetzt ist. Zählt nur Trading-Tage ab dem
  // Pass-Datum und prüft die Payout-Regeln: 5 Tage à min. 250$, 50%-Consistency,
  // eigener DD-Cap (52.100) und Payout-Schwellen (ab 52.600 / 500$).
  const payoutStats = useMemo(() => {
    if (!evalPassed) return null;

    const baseDays = evalPassedDate
      ? accountStats.tradingDays.filter((d) => d.date >= evalPassedDate)
      : accountStats.tradingDays;
    // Payout-Zyklus: nur Tage NACH dem letzten Payout zaehlen
    const relevantDays = lastPayoutDate ? baseDays.filter((d) => d.date > lastPayoutDate) : baseDays;


    // Min. Handelstage pro Zyklus (Builder 50K): mind. 2 Tage mit Trades seit Start bzw. letztem Payout.
    const qualifyingDays = relevantDays; // jeder Handelstag im Zyklus zaehlt
    const effectiveQualifyingCount = qualifyingDays.length;
    const daysHit = Math.min(effectiveQualifyingCount, PAYOUT_MIN_DAYS);
    const daysPassed = effectiveQualifyingCount >= PAYOUT_MIN_DAYS;

    // Erster Payout: Gewinn ueber dem Buffer (Start + 1.600$). Danach: Netto-Gewinn seit letztem Payout.
    const cycleNetProfit = relevantDays.reduce((s, d) => s + d.pnl, 0);
    const profitAboveBuffer = lastPayoutDate ? cycleNetProfit : accountStats.balance - (STARTING_BALANCE + PAYOUT_BUFFER);
    const profitPassed = profitAboveBuffer >= PAYOUT_MIN_NET_PROFIT;
    const payoutAmount = Math.max(0, Math.min(profitAboveBuffer, PAYOUT_MAX_AMOUNT));

    // 50%-Consistency-Regel: kein einzelner Tag darf mehr als 50% des
    // gesamten Nettogewinns seit Eval-Passed ausmachen
    const netProfitSincePass = relevantDays.reduce((s, d) => s + d.pnl, 0);
    const biggestDay = relevantDays.length ? Math.max(...relevantDays.map((d) => d.pnl)) : 0;
    const consistencyPct = netProfitSincePass > 0 ? (biggestDay / netProfitSincePass) * 100 : 0;
    const consistencyPassed = netProfitSincePass <= 0 || consistencyPct <= PAYOUT_CONSISTENCY_PCT;

    // Payout-eigener Drawdown-Cap: identische Logik wie die Eval-MLL, aber
    // der Cap-Peak endet bereits bei 52.100 statt 52.000. eodPeak startet bei
    // STARTING_BALANCE (realer Kontostart), eodBalance bei FUNDED_BALANCE_OVERRIDE
    // (bekannter realer Stand zum Aktivierungszeitpunkt) — siehe accountStats.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = FUNDED_BALANCE_OVERRIDE;
    accountStats.tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const cappedPeak = Math.min(eodPeak, PAYOUT_DD_PEAK_CAP);
    const mll = cappedPeak - DD_BUFFER;
    const balance = accountStats.balance;
    const ddBufferRemaining = balance - mll;
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    const allRulesPassed = daysPassed && consistencyPassed && profitPassed;

    return {
      relevantDays, qualifyingDays, effectiveQualifyingCount, daysHit, daysPassed,
      netProfitSincePass, biggestDay, consistencyPct, consistencyPassed,
      eodPeak, mll, ddBufferRemaining, ddRiskPct,
      allRulesPassed, cycleNetProfit, profitAboveBuffer, profitPassed, payoutAmount,
    };
  }, [evalPassed, evalPassedDate, lastPayoutDate, accountStats.tradingDays, accountStats.balance, trades]);

  const calendar = useMemo(() => {
    const { year, month } = cursor;
    const byDay = new Map();
    filteredTrades.forEach((t) => {
      const d = t.trade_date;
      const [ty, tm] = d.split("-").map(Number);
      if (ty === year && tm - 1 === month) {
        if (!byDay.has(d)) byDay.set(d, []);
        byDay.get(d).push(t);
      }
    });

    const nDays = daysInMonth(year, month);
    const firstOffset = mondayIndex(startOfMonth(year, month));
    const cells = [];
    for (let i = 0; i < firstOffset; i++) cells.push(null);
    for (let day = 1; day <= nDays; day++) {
      const iso = isoDate(year, month, day);
      const dayTrades = byDay.get(iso) || [];
      // In funded stage: Eval-Trades (created_at vor Aktivierung) sind "historic"
      const isHistoric = fundedStage && fundedActivatedAt && iso < (fundedStartDate || "9999");
      // Ein Tag gilt als historic wenn ALLE seine Trades historic sind
      const allHistoric = isHistoric && dayTrades.every((t) => !t.created_at || t.created_at < fundedActivatedAt);
      const activeTrades = fundedStage && fundedActivatedAt
        ? dayTrades.filter((t) => t.created_at && t.created_at >= fundedActivatedAt)
        : dayTrades;
      const hasHistoricTrades = fundedStage && fundedActivatedAt
        ? dayTrades.some((t) => !t.created_at || t.created_at < fundedActivatedAt)
        : false;
      const pnl = activeTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
      const rawPnl = dayTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
      cells.push({ day, iso, trades: dayTrades, pnl, rawPnl, isHistoric: allHistoric && activeTrades.length === 0, hasHistoricTrades });
    }
    while (cells.length % 7 !== 0) cells.push(null);

    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) {
      const weekCells = cells.slice(i, i + 7);
      const realDates = weekCells.filter(Boolean);
      const weekPnl = realDates.reduce((s, c) => s + c.pnl, 0);
      const weekTradeCount = realDates.reduce((s, c) => s + c.trades.length, 0);
      const weekNum = realDates.length
        ? isoWeek(new Date(year, month, realDates[0].day))
        : null;
      weeks.push({ cells: weekCells, weekPnl, weekTradeCount, weekNum });
    }

    const monthTotal = Array.from(byDay.values())
      .flat()
      .filter((t) => !fundedStage || !fundedActivatedAt || (t.created_at && t.created_at >= fundedActivatedAt))
      .reduce((s, t) => s + Number(t.pnl || 0), 0);
    const monthTradeCount = Array.from(byDay.values()).flat().length;

    // Wochenenden werden ausgeblendet, ausser in diesem Monat wurde an einem Sa/So getradet
    const showWeekend = weeks.some((w) => w.cells.slice(5).some((c) => c && c.trades.length > 0));

    return { weeks, monthTotal, monthTradeCount, showWeekend };
  }, [filteredTrades, cursor, fundedStage, fundedActivatedAt, fundedStartDate]);

  // Postet einen Trade zu Supabase; fällt automatisch auf ein Payload ohne
  // "realized_rr" zurück, falls diese Spalte in der Tabelle noch nicht existiert
  // (z. B. bei einer Datenbank, die vor diesem Feature angelegt wurde).
  const postTradeWithFallback = async (trade) => {
    let payload = trade;
    let res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
    if (!res.ok) {
      let body = await res.text();
      if (/realized_rr/i.test(body) && payload.realized_rr !== undefined) {
        const { realized_rr, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok && /setup/i.test(body) && payload.setup !== undefined) {
        const { setup, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok && /confluences/i.test(body) && payload.confluences !== undefined) {
        const { confluences, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok) throw new Error(T(`Speichern fehlgeschlagen (${res.status}): ${body}`, `Saving failed (${res.status}): ${body}`));
    }
    return res;
  };

  const handleAddTrade = useCallback(
    async (trade) => {
      setSaving(true);
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => [
            ...prev,
            { ...trade, id: Math.max(0, ...prev.map((t) => t.id || 0)) + 1, created_at: new Date().toISOString() },
          ]);
          setPanelOpen(false);
          pushToast(T("Trade gespeichert (Demo-Modus)", "Trade saved (demo mode)"));
          return;
        }
        const res = await postTradeWithFallback(trade);
        if (!res.ok) {
          const body = await res.text();
          throw new Error(T(`Speichern fehlgeschlagen (${res.status}): ${body}`, `Saving failed (${res.status}): ${body}`));
        }
        const inserted = await res.json();
        setTrades((prev) => [...prev, ...inserted]);
        setPanelOpen(false);
        pushToast(T("Trade gespeichert", "Trade saved"));
      } catch (e) {
        setError(e.message || T("Trade konnte nicht gespeichert werden", "Trade could not be saved"));
        pushToast(e.message || T("Trade konnte nicht gespeichert werden", "Trade could not be saved"), "error");
      } finally {
        setSaving(false);
      }
    },
    [pushToast]
  );

  const handleUpdateTrade = useCallback(
    async (id, patch) => {
      setSaving(true);
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => prev.map((t) => (t.id === id ? { ...t, ...patch } : t)));
          setEditingTrade(null);
          pushToast(T("Trade aktualisiert (Demo-Modus)", "Trade updated (demo mode)"));
          return;
        }
        let patchPayload = patch;
        let res = await fetch(`${REST_URL}?id=eq.${id}`, {
          method: "PATCH",
          headers: sbHeaders,
          body: JSON.stringify(patchPayload),
        });
        if (!res.ok) {
          let body = await res.text();
          if (/realized_rr/i.test(body) && patchPayload.realized_rr !== undefined) {
            const { realized_rr, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok && /setup/i.test(body) && patchPayload.setup !== undefined) {
            const { setup, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok && /confluences/i.test(body) && patchPayload.confluences !== undefined) {
            const { confluences, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok) throw new Error(T(`Aktualisieren fehlgeschlagen (${res.status}): ${body}`, `Update failed (${res.status}): ${body}`));
        }
        const updated = await res.json();
        setTrades((prev) => prev.map((t) => (t.id === id ? { ...t, ...updated[0] } : t)));
        setEditingTrade(null);
        pushToast(T("Trade aktualisiert", "Trade updated"));
      } catch (e) {
        setError(e.message || T("Trade konnte nicht aktualisiert werden", "Trade could not be updated"));
        pushToast(e.message || T("Trade konnte nicht aktualisiert werden", "Trade could not be updated"), "error");
      } finally {
        setSaving(false);
      }
    },
    [pushToast]
  );

  const handleDeleteTrade = useCallback(
    async (tradeId) => {
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => prev.filter((t) => t.id !== tradeId));
          pushToast(T("Trade gelöscht (Demo-Modus)", "Trade deleted (demo mode)"));
          return;
        }
        const res = await fetch(`${REST_URL}?id=eq.${tradeId}`, {
          method: "DELETE",
          headers: sbHeaders,
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(T(`Löschen fehlgeschlagen (${res.status}): ${body}`, `Delete failed (${res.status}): ${body}`));
        }
        setTrades((prev) => prev.filter((t) => t.id !== tradeId));
        pushToast(T("Trade gelöscht", "Trade deleted"));
      } catch (e) {
        setError(e.message || T("Trade konnte nicht gelöscht werden", "Trade could not be deleted"));
        pushToast(e.message || T("Trade konnte nicht gelöscht werden", "Trade could not be deleted"), "error");
      }
    },
    [pushToast]
  );

  const today = new Date();
  const isCurrentMonthNow = cursor.year === today.getFullYear() && cursor.month === today.getMonth();

  useEffect(() => {
    if (dayDetailData && dayDetailData.trades.length === 0) {
      setDayDetail(null);
    }
  }, [dayDetailData]);

  // ── Tastatur-Shortcuts: N = neuer Trade, Esc = Modal schließen ──
  useEffect(() => {
    const handler = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      const typing = tag === "input" || tag === "textarea" || e.target.isContentEditable;

      if (e.key === "Escape") {
        if (panelOpen) setPanelOpen(false);
        else if (editingTrade) setEditingTrade(null);
        else if (dayDetail) setDayDetail(null);
        return;
      }
      if (typing) return;
      if ((e.key === "n" || e.key === "N") && !panelOpen && !editingTrade && !dayDetail) {
        e.preventDefault();
        setPanelOpen(true);
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [panelOpen, editingTrade, dayDetail]);

  return (
    <div className="journal-shell">
      <header className="topbar">
        <div className="brand">
            <img src="sharingan.png" alt="Logo" style={{ width: "220px", height: "100px", borderRadius: "10px" }} />
        </div>
        <div className="topbar-actions">
          {!fundedStage && accountStats.accountPassed && (
            <button
              className="btn-secondary active"
              onClick={() => {
                if (window.confirm(T("Eval bestanden — Funded Stage starten? Der Account wird auf $50.000 zurueckgesetzt. Deine bisherigen Trades bleiben im Kalender sichtbar.", "Eval passed — start funded stage? The account will be reset to $50,000. Your previous trades stay visible in the calendar."))) {
                  activateFundedStage();
                }
              }}
              title={T("Account auf 50k zuruecksetzen und Funded Stage beginnen", "Reset account to 50k and begin funded stage")}
            >
              Eval Passed ✓
            </button>
          )}
          <button className="btn-secondary" onClick={switchProfile} title={T("Profil wechseln", "Switch profile")}>
            {ACTIVE_PROFILE ? ACTIVE_PROFILE.name : T("Profil", "Profile")} ⇄
          </button>
          <button className="btn-secondary" onClick={() => setFriendsOpen(true)} title={T("Kalender, Stats & Equity mit Freunden vergleichen", "Compare calendar, stats & equity with friends")}>
            {T("Freunde", "Friends")}
          </button>
          <button className="btn-secondary" onClick={() => setForwardTestOpen(true)}>
            Forward Test
          </button>
          <button className="btn-primary" onClick={() => setPanelOpen(true)}>
            <Icon.Plus /> {T("Trade hinzufuegen", "Add trade")} <span className="kbd-hint">N</span>
          </button>
        </div>
      </header>

      {!isConfigured && (
        <div className="notice">
          {T("Supabase ist noch nicht verbunden — trage SUPABASE_URL und SUPABASE_ANON_KEY oben im Script-Tag ein. Bis dahin läuft das Dashboard im lokalen Demo-Modus (Daten gehen beim Neuladen verloren).", "Supabase is not connected yet — enter your project URL and anon key in the PROFILES list at the top of the script. Until then the dashboard runs in local demo mode (data is lost on reload).")}
        </div>
      )}
      {error && <div className="notice notice-error">{error}</div>}

      <section className="hero">
        <div className="hero-balance">
          <span className="hero-label">Account Balance</span>
          <span className="hero-value">{fmtMoney(accountStats.balance)}</span>
          <span className={`hero-delta ${accountStats.totalPnl >= 0 ? "pos" : "neg"}`}>
            {accountStats.totalPnl >= 0 ? <Icon.Up /> : <Icon.Down />}
            {fmtMoneyShort(accountStats.totalPnl)} {T("gesamt", "total")}
          </span>
        </div>
        <div className="hero-curve">
          <EquityCurve data={accountStats.equityCurve} />
        </div>
      </section>

      {fundedStage && (
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: "4px" }}>
          <button
            className="payout-banner-clear"
            style={{ fontSize: "11px", padding: "3px 8px" }}
            onClick={() => {
              if (window.confirm(T("Wirklich zurueck zur Eval Stage? Die Funded-Stage-Balance/Payout-Tracking wird pausiert, bis du sie wieder aktivierst.", "Really go back to the eval stage? Funded-stage balance/payout tracking is paused until you reactivate it."))) {
                resetToEvalStage();
              }
            }}
          >
            {T("Zurueck zur Eval Stage", "Back to eval stage")}
          </button>
        </div>
      )}

      {!fundedStage && fundedStartDate && (
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: "4px" }}>
          <button
            className="payout-banner-clear"
            style={{ fontSize: "11px", padding: "3px 8px" }}
            onClick={reactivateFundedStage}
            title={T(`Funded Stage war aktiv seit ${fundedStartDate} — ohne neuen Trade wiederherstellen`, `Funded stage was active since ${fundedStartDate} — restore without a new trade`)}
          >
            {T("Zurueck zur Funded Stage", "Back to funded stage")}
          </button>
        </div>
      )}

      {!fundedStage && !fundedStartDate && (
        <FundedStageRecovery onRestore={restoreFundedStage} />
      )}

      {!evalPassed ? (
        <div className="risk-row">
          <div className="risk-card">
            <div className="risk-head">
              <span className="risk-label">{T("Drawdown (EOD, Trailing)", "Drawdown (EOD, trailing)")}</span>
              <span className={`risk-value ${accountStats.ddBufferRemaining < EVAL_DD_BUFFER ? "warn" : "pos"}`}>
                {fmtMoneyShort(-Math.max(0, accountStats.eodPeak - accountStats.balance))}
              </span>
            </div>
            <div className="risk-track">
              <div className="risk-fill dd" style={{ width: `${accountStats.ddRiskPct}%` }} />
            </div>
            <div className="risk-meta">
              <span>MLL: {fmtMoney(accountStats.mll)} {T("(trailing, 1.500$ Abstand)", "(trailing, $1,500 distance)")}</span>
              <span>{T("Puffer zur MLL:", "Buffer to MLL:")} {fmtMoneyShort(accountStats.ddBufferRemaining)}</span>
            </div>
          </div>
          <div className="risk-card" style={{ gridColumn: "1 / -1" }}>
            <div className="risk-head">
              <span className="risk-label">{T("Fortschritt zur Funded Stage", "Progress to funded stage")}</span>
              <span className={`risk-value ${accountStats.accountPassed ? "pos" : ""}`}>
                {accountStats.accountPassed ? "Passed ✓" : fmtMoneyShort(-(ACCOUNT_PASS_TARGET - accountStats.balance))}
              </span>
            </div>
            {(() => {
              // Skala: von MLL (links) bis 53k (rechts)
              // MLL ist dynamisch (trailing), gecappt bei 50k wenn Peak >= 52k
              const scaleLeft = accountStats.mll;   // z.B. 49500 am Anfang, dann steigend, max 50000
              const scaleRight = ACCOUNT_PASS_TARGET; // 53000
              const scaleRange = scaleRight - scaleLeft;
              // Wie weit hat die Balance den Range gefuellt?
              const fillPct = Math.max(0, Math.min(100, ((accountStats.balance - scaleLeft) / scaleRange) * 100));
              // Wo liegt 50k auf der Skala?
              const startMarkerPct = Math.max(0, Math.min(100, ((STARTING_BALANCE - scaleLeft) / scaleRange) * 100));
              const passed = accountStats.accountPassed;
              // Farbe: rot wenn unter 50k, weiss wenn normal, gruen wenn passed
              const fillColor = accountStats.balance < STARTING_BALANCE ? "var(--red)" : passed ? "#2ecc71" : "var(--text)";
              return (
                <div style={{ position: "relative", marginTop: "6px" }}>
                  {/* Track */}
                  <div style={{ position: "relative", height: "10px", background: "var(--panel-2)", border: "1px solid var(--line)", borderRadius: "5px", overflow: "visible" }}>
                    {/* Rote DD-Zone links von 50k */}
                    <div style={{
                      position: "absolute", left: 0, top: 0, bottom: 0,
                      width: `${startMarkerPct}%`,
                      background: "rgba(224,0,26,0.15)",
                      borderRight: "1px solid rgba(224,0,26,0.4)",
                      borderRadius: "5px 0 0 5px",
                    }} />
                    {/* Fuellstand */}
                    <div style={{
                      position: "absolute", left: 0, top: 0, bottom: 0,
                      width: `${fillPct}%`,
                      background: fillColor,
                      borderRadius: "5px",
                      transition: "width .3s ease",
                      opacity: 0.9,
                    }} />
                    {/* 50k Marker-Linie */}
                    <div style={{
                      position: "absolute", left: `${startMarkerPct}%`, top: "-3px", bottom: "-3px",
                      width: "2px", background: "rgba(255,255,255,0.4)", borderRadius: "1px",
                    }} />
                  </div>
                  {/* Labels */}
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: "7px", fontSize: "11px" }}>
                    <span style={{ color: "rgba(224,0,26,0.8)" }}>{fmtMoney(scaleLeft)}</span>
                    <span style={{ color: "var(--muted-light)" }}>{fmtMoney(STARTING_BALANCE)}</span>
                    <span style={{ color: passed ? "#2ecc71" : "var(--muted-light)" }}>{fmtMoney(ACCOUNT_PASS_TARGET)} ✓</span>
                  </div>
                </div>
              );
            })()}
            <div className="risk-meta" style={{ marginTop: "2px" }}>
              <span>MLL: {fmtMoney(accountStats.mll)} · Balance: {fmtMoney(accountStats.balance)}</span>
              <span>{accountStats.accountPassed ? T("Ziel erreicht", "Target reached") : T(`Noch ${fmtMoneyShort(-(ACCOUNT_PASS_TARGET - accountStats.balance))} bis 53k`, `Still ${fmtMoneyShort(-(ACCOUNT_PASS_TARGET - accountStats.balance))} until 53k`)}</span>
            </div>
          </div>
        </div>
      ) : (
        <div className="payout-grid">
          <div className="payout-card">
            <div className="payout-card-title">
              <span className={`payout-status-dot ${payoutStats.daysPassed ? "ok" : ""}`} />
              {T("Mind. 2 Handelstage im Zyklus", "Min. 2 trading days per cycle")}
            </div>
            <span className="payout-main">{payoutStats.daysHit} / {PAYOUT_MIN_DAYS}</span>
            <div className="payout-days">
              {Array.from({ length: PAYOUT_MIN_DAYS }).map((_, i) => (
                <span key={i} className={`payout-day-pip ${i < payoutStats.daysHit ? "hit" : ""}`}>
                  {i < payoutStats.daysHit ? "✓" : ""}
                </span>
              ))}
            </div>
            <span className="payout-sub">{T(`Zyklus seit ${lastPayoutDate ? `letztem Payout (${lastPayoutDate})` : "Funded-Start"} — ${payoutStats.effectiveQualifyingCount} Handelstag${payoutStats.effectiveQualifyingCount === 1 ? "" : "e"} bisher.`, `Cycle since ${lastPayoutDate ? `last payout (${lastPayoutDate})` : "funded start"} — ${payoutStats.effectiveQualifyingCount} trading day${payoutStats.effectiveQualifyingCount === 1 ? "" : "s"} so far.`)}</span>
          </div>

          <div className="payout-card">
            <div className="payout-card-title">
              <span className={`payout-status-dot ${payoutStats.consistencyPassed ? "ok" : "fail"}`} />
              50% Consistency Rule
            </div>
            <span className="payout-main">{payoutStats.consistencyPct.toFixed(1)}%</span>
            <span className="payout-sub">
              {payoutStats.consistencyPassed
                ? T("Bester Tag bleibt unter 50% des Zyklus-Gewinns.", "Best day stays under 50% of the cycle profit.")
                : T("Achtung: ein Tag dominiert über 50% des Zyklus-Gewinns.", "Warning: one day makes up more than 50% of the cycle profit.")}
              {" "}{T("Größter Tag:", "Biggest day:")} {fmtMoneyShort(payoutStats.biggestDay)}
            </span>
          </div>

          <div className="payout-card">
            <div className="payout-card-title">
              <span className="payout-status-dot ok" />
              {T("Drawdown (Payout-Cap 51.600)", "Drawdown (payout cap 51,600)")}
            </div>
            <span className="payout-main">{fmtMoneyShort(-Math.max(0, payoutStats.eodPeak - accountStats.balance))}</span>
            <div className="risk-track">
              <div className="risk-fill dd" style={{ width: `${payoutStats.ddRiskPct}%` }} />
            </div>
            <span className="payout-sub">MLL: {fmtMoney(payoutStats.mll)} · {T("Puffer:", "Buffer:")} {fmtMoneyShort(payoutStats.ddBufferRemaining)}</span>
          </div>

          <div className="payout-card">
            <div className="payout-card-title">
              <span className={`payout-status-dot ${payoutStats.profitPassed ? "ok" : ""}`} />
              {lastPayoutDate ? T("Profit seit letztem Payout", "Profit since last payout") : T("Profit über Buffer (1.600$)", "Profit above buffer ($1,600)")}
            </div>
            <span className="payout-main">{fmtMoneyShort(payoutStats.profitAboveBuffer)}</span>
            <span className="payout-sub">
              {T("Min. $500 nötig · auszahlbar:", "Min. $500 required · payable:")} {payoutStats.profitPassed ? fmtMoney(payoutStats.payoutAmount) : "—"} {T("(max. $2.000, 80/20)", "(max. $2,000, 80/20)")}
            </span>
            <label className="payout-sub" style={{ display: "flex", alignItems: "center", gap: "8px" }}>
              {T("Letzter Payout", "Last payout")}
              <input type="date" style={friendsDateStyle} value={lastPayoutDate} onChange={(e) => updateLastPayoutDate(e.target.value)} />
            </label>
          </div>
        </div>
      )}

      <section className="stat-row">
        <StatCard label="Profit Factor" value={Number.isFinite(stats.profitFactor) ? stats.profitFactor.toFixed(2) : "∞"} />
        <StatCard label={`Winrate (excl. BE)`} value={`${stats.winrate.toFixed(1)}%`} />
        <StatCard label="Avg. RR" value={stats.avgRR ? stats.avgRR.toFixed(2) : "—"} />
        <StatCard label="Expectancy / Trade" value={stats.decidedTrades.length ? fmtMoneyShort(stats.expectancy) : "—"} />
        <StatCard label={T("Trades gesamt", "Total trades")} value={stats.count} />
      </section>

      <div className="filter-bar">
        <div className="filter-group">
          <button
            className={`filter-chip ${filterSymbol === "all" ? "active" : ""}`}
            onClick={() => setFilterSymbol("all")}
          >
            {T("Alle Symbole", "All symbols")}
          </button>
          {Object.keys(SYMBOLS).map((key) => (
            <button
              key={key}
              className={`filter-chip ${filterSymbol === key ? "active" : ""}`}
              onClick={() => setFilterSymbol(key)}
            >
              {key}
            </button>
          ))}
        </div>
        <div className="filter-group">
          <button
            className={`filter-chip ${filterResult === "all" ? "active" : ""}`}
            onClick={() => setFilterResult("all")}
          >
            {T("Alle", "All")}
          </button>
          <button
            className={`filter-chip win-chip ${filterResult === "win" ? "active" : ""}`}
            onClick={() => setFilterResult("win")}
          >
            Wins
          </button>
          <button
            className={`filter-chip be-chip ${filterResult === "be" ? "active" : ""}`}
            onClick={() => setFilterResult("be")}
          >
            BE
          </button>
          <button
            className={`filter-chip loss-chip ${filterResult === "loss" ? "active" : ""}`}
            onClick={() => setFilterResult("loss")}
          >
            Losses
          </button>
        </div>
        {hasActiveFilters && (
          <button className="filter-clear" onClick={() => { setFilterSymbol("all"); setFilterResult("all"); }}>
            {T("Filter zurücksetzen", "Reset filters")}
          </button>
        )}
        <div className="filter-spacer" />
        {hasActiveFilters && (
          <span className="filter-count">{filteredTrades.length} {T("von", "of")} {trades.length} Trades</span>
        )}
      </div>

      <section className="insights-card">
        <div className="insights-title">Insights</div>
        <div className="insights-grid">
          <div className="insight-item">
            <span className="insight-label">Max Drawdown</span>
            <span className="insight-value neg">{stats.maxDrawdown ? fmtMoneyShort(-stats.maxDrawdown) : "—"}</span>
            <span className="insight-sub">{stats.maxDrawdown ? T(`${stats.maxDrawdownPct.toFixed(1)}% vom Peak`, `${stats.maxDrawdownPct.toFixed(1)}% from peak`) : T("Kein Rückgang", "No decline")}</span>
          </div>
          <div className="insight-item">
            <span className="insight-label">{T("Aktuelle Streak", "Current streak")}</span>
            <span className={`insight-value ${stats.currentStreakType === "loss" ? "neg" : "pos"}`}>
              {stats.currentStreak ? `${stats.currentStreak}×` : "—"}
            </span>
            <span className="insight-sub">
              {stats.currentStreakType === "win" ? T("Wins in Folge", "Wins in a row") : stats.currentStreakType === "loss" ? T("Losses in Folge", "Losses in a row") : T("Noch keine Trades", "No trades yet")}
            </span>
          </div>
          <div className="insight-item">
            <span className="insight-label">{T("Bester Trade", "Best trade")}</span>
            <span className="insight-value pos">{stats.bestTrade ? fmtMoneyShort(Number(stats.bestTrade.pnl)) : "—"}</span>
            <span className="insight-sub">{stats.bestTrade ? `${stats.bestTrade.symbol} · ${stats.bestTrade.trade_date}` : "—"}</span>
          </div>
          <div className="insight-item">
            <span className="insight-label">{T("Schlechtester Trade", "Worst trade")}</span>
            <span className="insight-value neg">{stats.worstTrade ? fmtMoneyShort(Number(stats.worstTrade.pnl)) : "—"}</span>
            <span className="insight-sub">{stats.worstTrade ? `${stats.worstTrade.symbol} · ${stats.worstTrade.trade_date}` : "—"}</span>
          </div>
        </div>

        <div className="insights-cols" style={{ gridTemplateColumns: "1fr" }}>
          <div>
            <div className="insights-col-title">{T("Nach Wochentag", "By weekday")}</div>
            {stats.byWeekday.filter((d) => d.count > 0).length === 0 && <span className="insight-sub">{T("Keine Daten", "No data")}</span>}
            {stats.byWeekday.map((d) => d.count > 0 && (
              <div className="breakdown-row" key={d.label}>
                <span className="breakdown-label">{d.label.slice(0, 2)}</span>
                <div className="breakdown-bar-track">
                  <div
                    className={`breakdown-bar-fill ${d.pnl < 0 ? "neg" : ""}`}
                    style={{ width: `${Math.min(100, (Math.abs(d.pnl) / stats.maxAbsWeekdayPnl) * 100)}%` }}
                  />
                </div>
                <span className={`breakdown-value ${d.pnl >= 0 ? "pos" : "neg"}`}>{fmtMoneyShort(d.pnl)}</span>
                <span className="breakdown-count">{d.count}x</span>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="insights-card">
        <div className="insights-title">{T("Confluence-Analyse", "Confluence analysis")}</div>
        {confluenceStats.length === 0 ? (
          <span className="insight-sub">{T("Noch keine Trades mit Confluences erfasst. Füge beim nächsten Trade Confluences hinzu, um hier Statistiken zu sehen.", "No trades with confluences recorded yet. Add confluences to your next trade to see statistics here.")}</span>
        ) : (
          <div className="trade-list">
            {confluenceStats.map((c) => (
              <div className="breakdown-row" key={c.tag} style={{ gap: "12px" }}>
                <span className="breakdown-label" style={{ width: "140px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={tagText(c.tag)}>{tagText(c.tag)}</span>
                <div className="breakdown-bar-track">
                  <div
                    className={`breakdown-bar-fill ${c.winrate < 50 ? "neg" : ""}`}
                    style={{ width: `${Math.min(100, (c.count / maxConfluenceCount) * 100)}%` }}
                  />
                </div>
                <span className={`breakdown-value ${c.winrate >= 50 ? "pos" : "neg"}`} style={{ width: "64px" }}>{c.winrate.toFixed(0)}% WR</span>
                <span className="breakdown-value" style={{ width: "76px" }}>{c.avgRR ? `${c.avgRR.toFixed(2)}R` : "—"}</span>
                <span className="breakdown-value" style={{ width: "88px" }}>{c.avgPoints ? `${c.avgPoints >= 0 ? "+" : ""}${c.avgPoints.toFixed(1)} ${T("Pkt", "pts")}` : "—"}</span>
                <span className="breakdown-count">{c.count}x</span>
              </div>
            ))}
          </div>
        )}
      </section>

      <section className="insights-card">
        <div className="insights-title">{T(`Top Confluence-Kombinationen (ab ${MIN_COMBO_SAMPLE} Trades)`, `Top confluence combinations (from ${MIN_COMBO_SAMPLE} trades)`)}</div>
        {comboStats.length === 0 ? (
          <span className="insight-sub">{T(`Noch nicht genug Trades mit mehreren gemeinsamen Confluences, um Kombinationen zu ranken (mind. ${MIN_COMBO_SAMPLE} Trades je Kombination nötig).`, `Not enough trades with multiple shared confluences yet to rank combinations (at least ${MIN_COMBO_SAMPLE} trades per combination required).`)}</span>
        ) : (
          <div className="trade-list">
            {comboStats.map((c) => (
              <div className="breakdown-row" key={c.key} style={{ gap: "12px" }}>
                <span className="breakdown-label" style={{ width: "220px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={tagText(c.key)}>{tagText(c.key)}</span>
                <span className={`breakdown-value ${c.winrate >= 50 ? "pos" : "neg"}`} style={{ width: "64px" }}>{c.winrate.toFixed(0)}% WR</span>
                <span className="breakdown-value" style={{ width: "76px" }}>{c.avgRR ? `${c.avgRR.toFixed(2)}R` : "—"}</span>
                <span className="breakdown-count">{c.count}x</span>
              </div>
            ))}
          </div>
        )}
        <span style={{ fontSize: "11px", color: "var(--muted-light)", marginTop: "6px", display: "block" }}>
          {T("Basiert auf der kompletten Trade-Historie (nicht vom Filter oben betroffen), sortiert nach Winrate.", "Based on the full trade history (not affected by the filter above), sorted by win rate.")}
        </span>
      </section>

      <section className="cal-card">
        <div className="cal-head">
          <div className="cal-title">
            <span>{MONTHS[cursor.month]}</span>
            <span className="cal-year">{cursor.year}</span>
          </div>
          <div className="cal-nav">
            <span className={`cal-month-pnl ${calendar.monthTotal >= 0 ? "pos" : "neg"}`}>
              {fmtMoneyShort(calendar.monthTotal)} · {calendar.monthTradeCount} Trades
            </span>
            <button
              className="cal-navbtn"
              onClick={() =>
                setCursor((c) => {
                  const m = c.month === 0 ? 11 : c.month - 1;
                  const y = c.month === 0 ? c.year - 1 : c.year;
                  return { year: y, month: m };
                })
              }
              aria-label={T("Vorheriger Monat", "Previous month")}
            >
              <Icon.ChevL />
            </button>
            <button
              className="cal-navbtn"
              onClick={() =>
                setCursor((c) => {
                  const m = c.month === 11 ? 0 : c.month + 1;
                  const y = c.month === 11 ? c.year + 1 : c.year;
                  return { year: y, month: m };
                })
              }
              aria-label={T("Nächster Monat", "Next month")}
            >
              <Icon.ChevR />
            </button>
          </div>
        </div>

        <div className="cal-grid-header" style={{ "--cols": calendar.showWeekend ? 7 : 5 }}>
          {WEEKDAYS.slice(0, calendar.showWeekend ? 7 : 5).map((d) => (
            <div key={d} className="cal-dow">{d}</div>
          ))}
          <div className="cal-dow cal-dow-week">{T("Woche", "Week")}</div>
        </div>

        {loading ? (
          <div className="cal-loading">{T("Lade Trades…", "Loading trades…")}</div>
        ) : (
          calendar.weeks.map((week, wi) => {
            const visibleCols = calendar.showWeekend ? 7 : 5;
            if (week.cells.slice(0, visibleCols).every((c) => !c)) return null;
            return (
            <div className="cal-week" key={wi} style={{ "--cols": visibleCols }}>
              {week.cells.slice(0, visibleCols).map((cell, ci) => {
                if (!cell) return <div className="cal-cell cal-cell-empty" key={ci} />;
                const isToday = isCurrentMonthNow && cell.day === today.getDate();
                const hasTrades = cell.trades.length > 0;
                const displayPnl = cell.isHistoric ? cell.rawPnl : cell.pnl;
                return (
                  <button
                    key={ci}
                    className={`cal-cell ${hasTrades ? (displayPnl >= 0 ? "cal-win" : "cal-loss") : ""} ${isToday ? "cal-today" : ""} ${cell.isHistoric ? "cal-cell-historic" : ""} ${ci >= 5 ? "cal-cell-weekend" : ""}`}
                    onClick={() => hasTrades && setDayDetail(cell.iso)}
                    disabled={!hasTrades}
                  >
                    <span className="cal-daynum">{cell.day}</span>
                    {hasTrades && (
                      <React.Fragment>
                        <span className="cal-pnl">{fmtMoneyShort(displayPnl)}</span>
                        <span className="cal-count">{cell.trades.length} Trade{cell.trades.length > 1 ? "s" : ""}</span>
                        {cell.isHistoric && <span className="cal-historic-badge">Eval</span>}
                      </React.Fragment>
                    )}
                  </button>
                );
              })}
              <div className="cal-cell cal-weeksum">
                <span className="cal-weeknum">{T("KW", "Wk")} {week.weekNum ?? "—"}</span>
                <span className={`cal-weekpnl ${week.weekPnl >= 0 ? "pos" : "neg"}`}>
                  {week.weekTradeCount ? fmtMoneyShort(week.weekPnl) : "—"}
                </span>
                {week.weekTradeCount > 0 && (
                  <span className="cal-weekcount">{week.weekTradeCount} Trade{week.weekTradeCount > 1 ? "s" : ""}</span>
                )}
              </div>
            </div>
            );
          })
        )}
      </section>

      {panelOpen && (
        <AddTradePanel
          onClose={() => setPanelOpen(false)}
          onSubmit={handleAddTrade}
          saving={saving}
          existingSetups={existingSetups}
          existingConfluences={confluenceOptions}
        />
      )}

      {editingTrade && (
        <AddTradePanel
          onClose={() => setEditingTrade(null)}
          onSubmit={(patch) => handleUpdateTrade(editingTrade.id, patch)}
          saving={saving}
          initialTrade={editingTrade}
          isEdit
          existingSetups={existingSetups}
          existingConfluences={confluenceOptions}
        />
      )}

      {friendsOpen && (
        <FriendsPanel onClose={() => setFriendsOpen(false)} myTrades={trades} />
      )}

      {forwardTestOpen && (
        <ForwardTestPanel
          onClose={() => setForwardTestOpen(false)}
          trades={trades}
          existingConfluences={confluenceOptions}
          realizedRRForTrade={realizedRRForTrade}
          realizedPointsForTrade={realizedPointsForTrade}
        />
      )}

      {dayDetailData && dayDetailData.trades.length > 0 && (
        <DayDetailModal
          day={dayDetailData}
          onClose={() => setDayDetail(null)}
          onDelete={handleDeleteTrade}
          onEdit={(trade) => { setDayDetail(null); setEditingTrade(trade); }}
        />
      )}

      <div className="toast-stack">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type === "error" ? "toast-error" : ""}`}>{t.message}</div>
        ))}
      </div>
    </div>
  );
}

function StatCard({ label, value }) {
  return (
    <div className="stat-card">
      <span className="stat-label">{label}</span>
      <span className="stat-value">{value}</span>
    </div>
  );
}

// Einmalige manuelle Wiederherstellung, falls Start-/Aktivierungsdatum der Funded

function EquityCurve({ data }) {
  const w = 560;
  const h = 120;
  const pad = 6;

  if (data.length < 2) {
    return (
      <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg">
        <line x1={pad} y1={h / 2} x2={w - pad} y2={h / 2} stroke="var(--line)" strokeWidth="1.5" strokeDasharray="4 6" />
      </svg>
    );
  }

  const ys = data.map((d) => d.y);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const range = maxY - minY || 1;

  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.y - minY) / range) * (h - pad * 2);
    return [x, y];
  });

  const lineD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const areaD = `${lineD} L${points[points.length - 1][0]},${h - pad} L${points[0][0]},${h - pad} Z`;

  const last = data[data.length - 1].y;
  const first = data[0].y;
  const positive = last >= first;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0.22" />
          <stop offset="100%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaD} fill="url(#eqFill)" />
      <path d={lineD} fill="none" stroke={positive ? "var(--green)" : "var(--red)"} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r="3.5" fill={positive ? "var(--green)" : "var(--red)"} />
    </svg>
  );
}

  const todayIso = new Date().toISOString().slice(0, 10);
  const [form, setForm] = useState(() => {

        trade_date: initialTrade.trade_date,

        result: initialTrade.result,
        stop_loss: String(initialTrade.stop_loss ?? ""),
        take_profit: String(initialTrade.take_profit ?? ""),
        manual_pnl: initialTrade.pnl !== null && initialTrade.pnl !== undefined ? String(initialTrade.pnl) : "",
        note: initialTrade.note || "",

        setup: initialTrade.setup || "",

    }
    return {
      trade_date: todayIso,
      symbol: "NQ",
      contracts: String(SYMBOLS.NQ.defaultContracts),
      direction: "long",
      result: "win",
      stop_loss: "10",
      take_profit: "",
      manual_pnl: "",

      confluences: [],
    };
  });
  const [touched, setTouched] = useState(false);
  const [newConfluenceInput, setNewConfluenceInput] = useState("");
  const firstFieldRef = React.useRef(null);

  useEffect(() => {
    if (firstFieldRef.current) firstFieldRef.current.focus();

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const selectSymbol = (symbol) =>

  // Markt (NQ/ES/GC) waehlen und dabei die aktuelle Variante (Mini/Micro) beibehalten

  const bumpContracts = (delta) =>

  const computed = useMemo(() => computeTrade(form), [form.symbol, form.contracts, form.stop_loss, form.take_profit, form.result]);

  const handleFile = (e) => {

    setForm((f) => {

    });

function ForwardTestPanel({ onClose, trades, existingConfluences, realizedRRForTrade, realizedPointsForTrade }) {
  const [selected, setSelected] = useState([]);

  const toggle = (tag) => {
    setSelected((s) => (s.includes(tag) ? s.filter((t) => t !== tag) : [...s, tag]));
  };

  // Alt-Tags aus der Historie, die zu keiner der festen Kategorien gehören (z. B.
  // frei eingetippte Confluences von vor der xN-Struktur) — werden als eigene
  // "Weitere"-Zeile unterhalb der Kategorien angezeigt.
  const categoryTagSet = useMemo(
    () => new Set(CONFLUENCE_CATEGORIES.flatMap((cat) => cat.levels.map((level) => `${cat.label} ${level}`))),
    []
  );
  const extraTags = useMemo(
    () => existingConfluences.filter((c) => !categoryTagSet.has(c)),
    [existingConfluences, categoryTagSet]
  );

  // Fuer jeden Trade: wie viele der ausgewaehlten Confluences sind vorhanden?
  // Danach nach Match-Anzahl gruppiert ("mindestens N von M getroffen"), damit
  // man sieht wie sich Winrate/Punkte verhalten, je naeher ein geplanter Trade
  // an eine vollstaendige Uebereinstimmung mit der Historie kommt.
  const result = useMemo(() => {
    if (selected.length === 0) return null;
    const scored = trades
      .map((t) => {
        const tags = Array.isArray(t.confluences) ? t.confluences : [];
        const matchCount = selected.filter((s) => tags.includes(s)).length;
        return { t, matchCount };
      })
      .filter((x) => x.matchCount > 0);

    const buildStats = (subset) => {
      const wins = subset.filter((t) => t.result === "win").length;
      const losses = subset.filter((t) => t.result === "loss").length;
      const bes = subset.filter((t) => t.result === "be").length;
      const decided = wins + losses;
      const rrVals = subset.map(realizedRRForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      const ptsVals = subset.map(realizedPointsForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      return {
        count: subset.length,
        wins, losses, bes,
        winrate: decided ? (wins / decided) * 100 : 0,
        avgRR: rrVals.length ? rrVals.reduce((s, v) => s + v, 0) / rrVals.length : 0,
        avgPoints: ptsVals.length ? ptsVals.reduce((s, v) => s + v, 0) / ptsVals.length : 0,
      };
    };

    const byThreshold = [];
    for (let n = selected.length; n >= 1; n--) {
      const subset = scored.filter((x) => x.matchCount >= n).map((x) => x.t);
      if (!subset.length) continue;
      byThreshold.push({ minMatch: n, ...buildStats(subset) });
    }

    const exact = scored.filter((x) => x.matchCount === selected.length).map((x) => x.t);

    return {
      totalSelected: selected.length,
      matchedTradeCount: scored.length,
      byThreshold,
      exactStats: buildStats(exact),
    };
  }, [selected, trades, realizedRRForTrade, realizedPointsForTrade]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="panel ft-panel" onClick={(e) => e.stopPropagation()}>
        <div className="panel-head">

/* ============================================================
   FREUNDE — Vergleich mit anderen Journals (nur lesend!)
   Pro Freund werden Name, Supabase-URL und anon Key im localStorage
   dieses Browsers gespeichert. Es werden ausschliesslich GET-Requests
   auf die Tabelle "Trades" des Freundes gemacht — nie schreibend.
   ============================================================ */
const FRIENDS_LS_KEY = "journal_friends";
const FRIEND_COLOR = "#4da3ff";
const ME_COLOR = "#ffffff";
const ME_NAME = T("Ich", "Me");

// Alle anderen Profile aus PROFILES sind automatisch Freunde (fest, nicht entfernbar).
// Zusaetzlich koennen manuell weitere Freunde hinzugefuegt werden (im Browser gespeichert).
function builtInFriends() {
  return PROFILES
    .filter((p) => (!ACTIVE_PROFILE || p.id !== ACTIVE_PROFILE.id) && !String(p.url).includes("DEIN-PROJEKT") && !String(p.key).includes("DEIN-ANON-KEY"))
    .map((p) => ({ id: `profile_${p.id}`, name: p.name, url: p.url, key: p.key, builtIn: true }));
}
function loadFriendsLS() {
  let manual = [];
  try {
    const v = JSON.parse(localStorage.getItem(FRIENDS_LS_KEY) || "[]");
    manual = Array.isArray(v) ? v.filter((f) => !f.builtIn) : [];
  } catch {}
  // Manuell hinzugefügte Freunde, die bereits als Profil existieren (gleiche Datenbank-URL), nicht doppelt anzeigen
  const builtIn = builtInFriends();
  const known = new Set([...builtIn.map((f) => normalizeSupabaseUrl(f.url)), normalizeSupabaseUrl(SUPABASE_URL)]);
  const seen = new Set();
  const manualUnique = manual.filter((f) => {
    const u = normalizeSupabaseUrl(f.url);
    if (known.has(u) || seen.has(u)) return false;
    seen.add(u);
    return true;
  });
  return [...builtIn, ...manualUnique];
}
function saveFriendsLS(list) {
  try { localStorage.setItem(FRIENDS_LS_KEY, JSON.stringify(list.filter((f) => !f.builtIn))); } catch {}
}

function normalizeSupabaseUrl(u) {
  return String(u || "").trim().replace(/\/rest\/v1.*$/, "").replace(/\/+$/, "");
}

function tradeRR(t) {
  if (t.result === "be") return 0;
  if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
  if (t.result === "loss") return t.rr !== null && t.rr !== undefined ? -1 : null;
  if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
  return null;
}

function summarizeTrades(list) {
  const wins = list.filter((t) => t.result === "win");
  const losses = list.filter((t) => t.result === "loss");
  const decided = wins.length + losses.length;
  const pnl = list.reduce((s, t) => s + Number(t.pnl || 0), 0);
  const grossProfit = wins.reduce((s, t) => s + Number(t.pnl || 0), 0);
  const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl || 0), 0));
  const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;
  const rrs = list.map(tradeRR).filter((v) => v !== null && !Number.isNaN(v));
  const avgRR = rrs.length ? rrs.reduce((s, r) => s + r, 0) / rrs.length : 0;

  const dayMap = new Map();
  list.forEach((t) => dayMap.set(t.trade_date, (dayMap.get(t.trade_date) || 0) + Number(t.pnl || 0)));
  const days = Array.from(dayMap.entries()).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  const greenDays = days.filter(([, v]) => v > 0).length;
  const dayVals = days.map(([, v]) => v);

  let run = 0, peak = 0, maxDD = 0;
  days.forEach(([, v]) => {
    run += v;
    if (run > peak) peak = run;
    if (peak - run > maxDD) maxDD = peak - run;
  });

  // Streaks (BE unterbricht keine Serie), Ø Gewinn/Verlust und Payoff
  const ordered = [...list].sort((x, y) => (x.trade_date < y.trade_date ? -1 : x.trade_date > y.trade_date ? 1 : Number(x.id || 0) - Number(y.id || 0)));
  let curW = 0, curL = 0, maxW = 0, maxL = 0;
  ordered.forEach((t) => {
    if (t.result === "win") { curW += 1; curL = 0; if (curW > maxW) maxW = curW; }
    else if (t.result === "loss") { curL += 1; curW = 0; if (curL > maxL) maxL = curL; }
  });
  const avgWin = wins.length ? grossProfit / wins.length : 0;
  const avgLoss = losses.length ? -grossLoss / losses.length : 0;
  const payoff = avgLoss < 0 ? avgWin / Math.abs(avgLoss) : avgWin > 0 ? Infinity : 0;

  return {
    count: list.length,
    winrate: decided ? (wins.length / decided) * 100 : 0,
    profitFactor,
    avgRR,
    pnl,
    expectancy: decided ? (grossProfit - grossLoss) / decided : 0,
    dayCount: days.length,
    greenDayPct: days.length ? (greenDays / days.length) * 100 : 0,
    bestDay: dayVals.length ? Math.max(...dayVals) : 0,
    worstDay: dayVals.length ? Math.min(...dayVals) : 0,
    maxDD,
    avgWin, avgLoss, payoff,
    maxWinStreak: maxW, maxLossStreak: maxL,
    tradesPerDay: days.length ? list.length / days.length : 0,
  };
}
