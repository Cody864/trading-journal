/* ============================================================
   BACKTEST — gebacktestete Trades, getrennt vom Account
   Die Trades liegen im localStorage und werden (wie Notizen und Konten) ueber die Settings-Tabelle in Supabase gesichert,
   die Screenshots in IndexedDB (Cache) plus Supabase (Key bt_shot_<id>). So sind sie in jedem Browser und auf jedem
   Geraet da. Nie in den Account-Statistiken. Dient dazu, aus Confluences Setups zu finden.
   ============================================================ */
const BT_LS_KEY = `journal_backtest__${ACTIVE_PROFILE ? ACTIVE_PROFILE.id : "x"}`;
const btRR = (t) => (t.result === "be" ? 0 : t.result === "loss" ? -1 : t.sl > 0 && t.tp > 0 ? t.tp / t.sl : null);
const btPts = (t) => (t.result === "be" ? 0 : t.result === "loss" ? -Math.abs(t.sl) : t.tp);
function btStats(list) {
  const wins = list.filter((t) => t.result === "win").length;
  const losses = list.filter((t) => t.result === "loss").length;
  const bes = list.filter((t) => t.result === "be").length;
  const rr = list.map(btRR).filter((v) => v !== null && !Number.isNaN(v));
  const pts = list.map(btPts).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
  const sum = (a) => a.reduce((s, v) => s + v, 0);
  return {
    count: list.length, wins, losses, bes,
    winrate: wins + losses ? (wins / (wins + losses)) * 100 : 0,
    avgRR: rr.length ? sum(rr) / rr.length : 0,
    totalRR: sum(rr),
    avgPoints: pts.length ? sum(pts) / pts.length : 0,
  };
}

/* Screenshots liegen in IndexedDB (localStorage waere mit ~5 MB schnell voll) */
const BT_DB_NAME = `journal_backtest_shots__${ACTIVE_PROFILE ? ACTIVE_PROFILE.id : "x"}`;
const btDb = () => new Promise((res, rej) => {
  const r = indexedDB.open(BT_DB_NAME, 1);
  r.onupgradeneeded = () => r.result.createObjectStore("shots");
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const btLocal = {
  put: (id, v) => btDb().then((db) => new Promise((res, rej) => { const tx = db.transaction("shots", "readwrite"); tx.objectStore("shots").put(v, id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); })),
  get: (id) => btDb().then((db) => new Promise((res, rej) => { const q = db.transaction("shots").objectStore("shots").get(id); q.onsuccess = () => res(q.result || ""); q.onerror = () => rej(q.error); })),
  del: (id) => btDb().then((db) => new Promise((res) => { const tx = db.transaction("shots", "readwrite"); tx.objectStore("shots").delete(id); tx.oncomplete = () => res(); tx.onerror = () => res(); })).catch(() => {}),
};
/* Screenshots zusaetzlich in der Datenbank sichern (Tabelle "Settings", Key bt_shot_<id>), damit sie in jedem Browser und auf
   jedem Geraet verfuegbar sind. IndexedDB bleibt als schneller lokaler Cache. Der Marker "<id>#v" im Cache merkt sich, welche
   Version (shotV) lokal liegt und dass sie in der Datenbank ist. */
const BT_SHOT_PREFIX = "bt_shot_";
const btRemote = (() => {
  const url = ACTIVE_PROFILE ? `${String(ACTIVE_PROFILE.url).replace(/\/+$/, "")}/rest/v1/Settings` : "";
  const h = ACTIVE_PROFILE ? { apikey: ACTIVE_PROFILE.key, Authorization: `Bearer ${ACTIVE_PROFILE.key}`, "Content-Type": "application/json" } : {};
  const ok = (r) => { if (!r.ok) throw new Error("http " + r.status); return r; };
  return {
    put: (id, v) => fetch(`${url}?on_conflict=key`, { method: "POST", headers: { ...h, Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ key: BT_SHOT_PREFIX + id, value: v, updated_at: new Date().toISOString() }) }).then(ok),
    get: (id) => fetch(`${url}?key=eq.${BT_SHOT_PREFIX}${encodeURIComponent(id)}&select=value`, { headers: h }).then(ok).then((r) => r.json()).then((d) => (d[0] && d[0].value) || ""),
    del: (id) => fetch(`${url}?key=eq.${BT_SHOT_PREFIX}${encodeURIComponent(id)}`, { method: "DELETE", headers: h }).catch(() => {}),
  };
})();
const btShot = {
  // Lokal speichern, dann in die Datenbank hochladen. Schlaegt der Upload fehl, wird der Fehler an den Aufrufer gegeben.
  put: async (id, v, ver) => {
    try { await btLocal.del(id + "#v"); await btLocal.put(id, v); } catch {}
    await btRemote.put(id, v);
    try { await btLocal.put(id + "#v", String(ver || 0)); } catch {}
  },
  // Erst der lokale Cache (wenn die Version passt), sonst aus der Datenbank holen und lokal merken.
  get: async (id, ver) => {
    try {
      const [d, lv] = await Promise.all([btLocal.get(id), btLocal.get(id + "#v")]);
      if (d && (!lv || ver === undefined || String(lv) === String(ver || 0))) return d;
    } catch {}
    try {
      const r = await btRemote.get(id);
      if (r) {
        btLocal.put(id, r).then(() => btLocal.put(id + "#v", String(ver || 0))).catch(() => {});
        return r;
      }
    } catch {}
    try { return await btLocal.get(id); } catch { return ""; }
  },
  del: (id) => Promise.all([btLocal.del(id), btLocal.del(id + "#v"), btRemote.del(id)]).then(() => {}),
};
// Screenshots, die bisher nur in diesem Browser liegen, einmalig in die Datenbank hochladen.
async function btMigrateShots(trades) {
  for (const t of trades) {
    if (!t.hasShot) continue;
    try {
      if (await btLocal.get(t.id + "#v")) continue; // schon in der Datenbank
      const d = await btLocal.get(t.id);
      if (!d) continue;
      await btRemote.put(t.id, d);
      await btLocal.put(t.id + "#v", String(t.shotV || 0));
    } catch { /* beim naechsten Oeffnen erneut versuchen */ }
  }
}
function useBtSrc(id, has, ver) {
  const [src, setSrc] = useState("");
  useEffect(() => { let on = true; if (has) btShot.get(id, ver || 0).then((v) => { if (on) setSrc(v); }).catch(() => {}); return () => { on = false; }; }, [id, has, ver]);
  return src;
}
function BtCard({ t, rr, onOpen }) {

    } catch { return { trades: [], tags: [] }; }
  });
  const [saveErr, setSaveErr] = useState(false);

  useEffect(() => {
    // Der Anfangszustand stammt aus dem localStorage, beim Öffnen muss nichts geschrieben (und nicht in die Datenbank gepusht) werden.
    if (btFirst.current) { btFirst.current = false; return; }
    try { localStorage.setItem(BT_LS_KEY, JSON.stringify(data)); setSaveErr(false); } catch { setSaveErr(true); }

  const [editId, setEditId] = useState(null);
  const [touched, setTouched] = useState(false);
  const [viewShot, setViewShot] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [shotErr, setShotErr] = useState("");
  const [shotDirty, setShotDirty] = useState(false);

  const categoryTagSet = useMemo(() => new Set(CONFLUENCE_CATEGORIES.flatMap((cat) => cat.levels.map((l) => `${cat.label} ${l}`))), []);
  const extraTags = useMemo(() => {
    const s = new Set(data.tags);
    data.trades.forEach((t) => (t.confluences || []).forEach((c) => { if (!categoryTagSet.has(c)) s.add(c); }));
    return [...s];
  }, [data, categoryTagSet]);

  const err = {};
  if (!(Number(form.sl) > 0)) err.sl = T("SL in Punkten, größer 0", "SL in points, above 0");
  if (!(Number(form.tp) > 0)) err.tp = T("TP in Punkten, größer 0", "TP in points, above 0");
  const fe = (k) => (touched && err[k] ? <span className="field-error">{err[k]}</span> : null);

  const save = (e) => {
    e.preventDefault();
    setTouched(true);
    if (Object.keys(err).length) return;
    const prev = editId ? data.trades.find((x) => x.id === editId) : null;
    const id = editId || `${Date.now()}${Math.floor(Math.random() * 1000)}`;
    const shotV = shotDirty ? Date.now() : (prev && prev.shotV) || 0;
    if (shotDirty) {
      if (form.shot) btShot.put(id, form.shot, shotV).catch(() => setShotErr(T("Screenshot konnte nicht in der Datenbank gespeichert werden, liegt aber lokal vor.", "Screenshot could not be saved to the database, but is stored locally.")));
      else btShot.del(id);
    }
    const t = {
      ...(prev || {}),
      id, direction: form.direction, result: (prev && prev.result) || "win",
      sl: Number(form.sl), tp: Number(form.tp),
      confluences: form.confluences, hasShot: !!form.shot,
      shotV,
    };
    setData((d) => ({ ...d, trades: editId ? d.trades.map((x) => (x.id === editId ? t : x)) : [...d.trades, t] }));
    // Richtung und SL bleiben stehen, damit man mehrere ähnliche Trades schnell hintereinander erfassen kann
    setForm((f) => ({ ...emptyForm(), direction: f.direction, sl: f.sl }));
    setEditId(null); setTouched(false); setShotDirty(false);
  };
  const edit = (t) => {
    setForm({ direction: t.direction, sl: String(t.sl ?? ""), tp: String(t.tp ?? ""), confluences: t.confluences || [], shot: "" });
    setShotDirty(false); setShotErr("");
    if (t.hasShot) btShot.get(t.id, t.shotV || 0).then((v) => setForm((f) => ({ ...f, shot: v || "" }))).catch(() => {});
    setEditId(t.id); setTab("trades"); setTouched(false);
  };
  const del = (id) => { if (window.confirm(T("Backtest-Trade löschen?", "Delete backtest trade?"))) { btShot.del(id); setData((d) => ({ ...d, trades: d.trades.filter((t) => t.id !== id) })); } };
  // Screenshot: wird auf max. 1600 px verkleinert und als JPEG gespeichert
  const loadShot = (file) => {
    if (!file || !file.type || !file.type.startsWith("image/")) return;
    setShotErr("");
    const fail = () => setShotErr(T("Bild konnte nicht gelesen werden.", "Could not read image."));
    const reader = new FileReader();
    reader.onerror = fail;
    reader.onload = () => {
      const img = new Image();
      img.onerror = fail;
      img.onload = () => {
        const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        setForm((f) => ({ ...f, shot: c.toDataURL("image/jpeg", 0.8) }));
        setShotDirty(true);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  const onPaste = (e) => {
    const item = Array.from((e.clipboardData && e.clipboardData.items) || []).find((i) => i.type.startsWith("image/"));
    if (item) { e.preventDefault(); loadShot(item.getAsFile()); }
  };
  const removeTag = (tag) => {
    if (data.trades.some((t) => (t.confluences || []).includes(tag))) { window.alert(T("Diese Confluence wird noch in Trades verwendet.", "This confluence is still used in trades.")); return; }
    setData((d) => ({ ...d, tags: d.tags.filter((x) => x !== tag) }));
  };

  // Gemeinsame Confluence-Auswahl (Formular + Analyse)
  const picker = (list, setList, withRemove = false) => (
    <div className="confluence-groups">
      {CONFLUENCE_CATEGORIES.map((cat) => (
        <div className="confluence-group" key={cat.label}>
          <span className="confluence-group-label">{tagText(cat.label)}</span>
          <div className="confluence-group-chips">
            {cat.levels.map((level) => (
              <button type="button" key={level} className={`confluence-chip ${chipState(list, cat, level)}`} onClick={() => setList((l) => toggleConfluenceTag(l, cat, level))} title={tagText(`${cat.label} ${level}`)}>{level}</button>
            ))}
          </div>
        </div>
      ))}
      {extraTags.length > 0 && (
        <div className="confluence-group">
          <span className="confluence-group-label">{T("Eigene", "Custom")}</span>
          <div className="confluence-group-chips">
            {extraTags.map((tag) => (
              <button type="button" key={tag} className={`confluence-chip ${list.includes(tag) ? "active" : ""}`}
                onClick={() => setList((l) => (l.includes(tag) ? l.filter((x) => x !== tag) : [...l, tag]))}
                onContextMenu={withRemove ? (e) => { e.preventDefault(); removeTag(tag); } : undefined}
                title={withRemove ? T("Rechtsklick: Confluence entfernen (wenn ungenutzt)", "Right-click: remove confluence (if unused)") : tag}>{tag}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );

  const sortedTrades = useMemo(() => [...data.trades].reverse(), [data.trades]);
  const fmtR = (v) => `${v >= 0 ? "+" : ""}${v.toFixed(2)}R`;
  const rrText = (t) => (btRR(t) !== null ? fmtR(btRR(t)) : "—");
  const detailTrade = detailId ? data.trades.find((x) => x.id === detailId) : null;
  const detailIdx = detailTrade ? sortedTrades.findIndex((x) => x.id === detailTrade.id) : -1;
  const goDetail = (d) => { const n = sortedTrades[detailIdx + d]; if (n) setDetailId(n.id); };

  return (
    <React.Fragment>
    <div className="overlay" onClick={onClose}>
      <div className="panel ft-panel" style={{ width: "1400px", maxWidth: "97vw" }} onClick={(e) => e.stopPropagation()}>
        <div className="panel-head">
          <span>Backtest</span>
          <button type="button" className="icon-btn" onClick={onClose} aria-label={T("Schließen", "Close")}><Icon.Close /></button>
        </div>
        <span className="insight-sub">{T("Nur lokal in diesem Browser gespeichert – nicht im Account und nicht in den Statistiken.", "Stored only locally in this browser – not in the account or in the stats.")}</span>
        {saveErr && <div className="notice notice-error">{T("Speichern im Browser fehlgeschlagen (Speicher voll?).", "Saving in the browser failed (storage full?).")}</div>}

        <div className="filter-group">
          <button type="button" className={`filter-chip ${tab === "trades" ? "active" : ""}`} onClick={() => setTab("trades")}>{T("Hinzufügen", "Add")}</button>
          <button type="button" className={`filter-chip ${tab === "galerie" ? "active" : ""}`} onClick={() => setTab("galerie")}>{T(`Galerie (${data.trades.length})`, `Gallery (${data.trades.length})`)}</button>
        </div>

        {tab === "galerie" && (
          sortedTrades.length === 0 ? (
            <span className="insight-sub">{T("Noch keine Backtest-Trades. Erfasse sie im Tab „Hinzufügen“.", "No backtest trades yet. Add them in the “Add” tab.")}</span>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(360px, 1fr))", gap: "10px" }}>
              {sortedTrades.map((t) => (
                <BtCard key={`${t.id}-${t.shotV || 0}`} t={t} rr={rrText(t)} onOpen={() => setDetailId(t.id)} />
              ))}
            </div>
          )
        )}

        {tab === "trades" && (
          <React.Fragment>
            <form onSubmit={save} onPaste={onPaste} style={{ display: "flex", flexDirection: "column", gap: "14px", maxWidth: "720px" }}>
              <div className="ft-section-title">{editId ? T("Backtest-Trade bearbeiten", "Edit backtest trade") : T("Backtest-Trade hinzufügen", "Add backtest trade")}</div>
              <div className="field-grid">
                <div className="field">
                  <label>{T("Richtung", "Direction")}</label>
                  <div className="dir-toggle">
                    <button type="button" className={`dir-btn dir-long ${form.direction === "long" ? "active" : ""}`} onClick={() => setForm((f) => ({ ...f, direction: "long" }))}>Long</button>
                    <button type="button" className={`dir-btn dir-short ${form.direction === "short" ? "active" : ""}`} onClick={() => setForm((f) => ({ ...f, direction: "short" }))}>Short</button>
                  </div>
                </div>
              </div>
              <div className="field-grid">
                <div className="field"><label>{T("Stop Loss (Punkte)", "Stop loss (points)")}</label><input type="number" step="any" placeholder={T("z. B. 12.5", "e.g. 12.5")} value={form.sl} onChange={(e) => setForm((f) => ({ ...f, sl: e.target.value }))} />{fe("sl")}</div>
                <div className="field"><label>{T("Take Profit (Punkte)", "Take profit (points)")}</label><input type="number" step="any" placeholder={T("z. B. 30", "e.g. 30")} value={form.tp} onChange={(e) => setForm((f) => ({ ...f, tp: e.target.value }))} />{fe("tp")}</div>
              </div>
              <div className="field">
                <label>Confluences</label>
                {picker(form.confluences, (fn) => setForm((f) => ({ ...f, confluences: typeof fn === "function" ? fn(f.confluences) : fn })), true)}
              </div>
              <div className="field">
                <label>Screenshot</label>
                {form.shot ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: "8px", alignItems: "flex-start" }}>
                    <img src={form.shot} alt="" onClick={() => setViewShot(form.shot)} style={{ maxWidth: "100%", maxHeight: "220px", borderRadius: "6px", border: "1px solid var(--line)", cursor: "zoom-in" }} />
                    <button type="button" className="btn-secondary" onClick={() => { setForm((f) => ({ ...f, shot: "" })); setShotDirty(true); }}>{T("Screenshot entfernen", "Remove screenshot")}</button>
                  </div>
                ) : (
                  <div tabIndex={0} onClick={() => document.getElementById("bt-shot-input").click()} style={{ border: "1px dashed var(--line)", borderRadius: "6px", padding: "22px 12px", textAlign: "center", cursor: "pointer", color: "var(--muted-light)", fontSize: "12px" }}>
                    {T("Screenshot mit Strg+V einfügen oder hier klicken, um eine Datei zu wählen", "Paste a screenshot with Ctrl+V or click here to choose a file")}
                    <input id="bt-shot-input" type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => { loadShot(e.target.files && e.target.files[0]); e.target.value = ""; }} />
                  </div>
                )}
                {shotErr && <span className="field-error">{shotErr}</span>}
              </div>
              <div style={{ display: "flex", gap: "10px" }}>
                <button type="submit" className="btn-primary">{editId ? T("Speichern", "Save") : T("Hinzufügen", "Add")}</button>
                {editId && <button type="button" className="btn-secondary" onClick={() => { setEditId(null); setForm(emptyForm()); setTouched(false); setShotDirty(false); }}>{T("Abbrechen", "Cancel")}</button>}
              </div>
            </form>
          </React.Fragment>
        )}
      </div>
    </div>
    {detailTrade && (
      <BtDetail key={`${detailTrade.id}-${detailTrade.shotV || 0}`} t={detailTrade} rr={rrText(detailTrade)} conf={(detailTrade.confluences || []).map(tagText).join(", ")}
        pos={`${detailIdx + 1} / ${sortedTrades.length}`}
        onPrev={detailIdx > 0 ? () => goDetail(-1) : null}
        onNext={detailIdx >= 0 && detailIdx < sortedTrades.length - 1 ? () => goDetail(1) : null}
        onClose={() => setDetailId(null)}
        onEdit={() => { setDetailId(null); edit(detailTrade); }}
        onDelete={() => del(detailTrade.id)} />
    )}
    {viewShot && (
      <div onClick={() => setViewShot(null)} style={{ position: "fixed", inset: 0, zIndex: 10000, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px", cursor: "zoom-out" }}>
        <img src={viewShot} alt="" style={{ maxWidth: "100%", maxHeight: "100%", borderRadius: "6px" }} />
      </div>
    )}
    </React.Fragment>
  );
}

function ForwardTestPanel({ onClose, trades, existingConfluences, realizedRRForTrade, realizedPointsForTrade }) {
  const [selected, setSelected] = useState([]);

  const toggle = (tag) => {
    setSelected((s) => (s.includes(tag) ? s.filter((t) => t !== tag) : [...s, tag]));
  };

  // Alt-Tags aus der Historie, die zu keiner der festen Kategorien gehören (z. B.
  // frei eingetippte Confluences von vor der xN-Struktur) — werden als eigene
  // "Weitere"-Zeile unterhalb der Kategorien angezeigt.
  const categoryTagSet = useMemo(
    () => new Set(CONFLUENCE_CATEGORIES.flatMap((cat) => cat.levels.map((level) => `${cat.label} ${level}`))),
    []
  );
  const extraTags = useMemo(
    () => existingConfluences.filter((c) => !categoryTagSet.has(c)),
    [existingConfluences, categoryTagSet]
  );

  // Fuer jeden Trade: wie viele der ausgewaehlten Confluences sind vorhanden?
  // Danach nach Match-Anzahl gruppiert ("mindestens N von M getroffen"), damit
  // man sieht wie sich Winrate/Punkte verhalten, je naeher ein geplanter Trade
  // an eine vollstaendige Uebereinstimmung mit der Historie kommt.
  const result = useMemo(() => {
    if (selected.length === 0) return null;
    const scored = trades
      .map((t) => {
        const tags = Array.isArray(t.confluences) ? t.confluences : [];
        const matchCount = selected.filter((s) => tags.includes(s)).length;
        return { t, matchCount };
      })
      .filter((x) => x.matchCount > 0);

    const buildStats = (subset) => {
      const wins = subset.filter((t) => t.result === "win").length;
      const losses = subset.filter((t) => t.result === "loss").length;
      const bes = subset.filter((t) => t.result === "be").length;
      const decided = wins + losses;
      const rrVals = subset.map(realizedRRForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      const ptsVals = subset.map(realizedPointsForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      return {
        count: subset.length,
        wins, losses, bes,
        winrate: decided ? (wins / decided) * 100 : 0,
        avgRR: rrVals.length ? rrVals.reduce((s, v) => s + v, 0) / rrVals.length : 0,
        avgPoints: ptsVals.length ? ptsVals.reduce((s, v) => s + v, 0) / ptsVals.length : 0,
      };
    };

    const byThreshold = [];
    for (let n = selected.length; n >= 1; n--) {
      const subset = scored.filter((x) => x.matchCount >= n).map((x) => x.t);
      if (!subset.length) continue;
      byThreshold.push({ minMatch: n, ...buildStats(subset) });
    }

    const exact = scored.filter((x) => x.matchCount === selected.length).map((x) => x.t);

    return {
      totalSelected: selected.length,
      matchedTradeCount: scored.length,
      byThreshold,
      exactStats: buildStats(exact),
    };
  }, [selected, trades, realizedRRForTrade, realizedPointsForTrade]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="panel ft-panel" onClick={(e) => e.stopPropagation()}>
        <div className="panel-head">
          <span>Forward Test</span>
          <button type="button" className="icon-btn" onClick={onClose} aria-label={T("Schließen", "Close")}>
            <Icon.Close />
          </button>
        </div>

        <div>
          <div className="ft-section-title">{T("Confluences für diesen Trade", "Confluences for this trade")}</div>
          <div className="confluence-groups">
            {CONFLUENCE_CATEGORIES.map((cat) => (
              <div className="confluence-group" key={cat.label}>
                <span className="confluence-group-label">{tagText(cat.label)}</span>
                <div className="confluence-group-chips">
                  {cat.levels.map((level) => {
                    const tag = `${cat.label} ${level}`;
                    return (
                      <button
                        type="button"
                        key={tag}
                        className={`confluence-chip ${chipState(selected, cat, level)}`}
                        onClick={() => setSelected((s) => toggleConfluenceTag(s, cat, level))}
                        title={tagText(tag)}
                      >
                        {level}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
            {extraTags.length > 0 && (
              <div className="confluence-group">
                <span className="confluence-group-label">{T("Weitere", "Other")}</span>
                <div className="confluence-group-chips">
                  {extraTags.map((tag) => (
                    <button
                      type="button"
                      key={tag}
                      className={`confluence-chip ${selected.includes(tag) ? "active" : ""}`}
                      onClick={() => toggle(tag)}
                    >
                      {tag}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>

        {result && (
          <React.Fragment>
            <div className="ft-section-divider" />
            <div className="ft-results">
              <div className="ft-section-title">{T("Ergebnis bei exakter Übereinstimmung", "Result for exact match")}</div>
              <div className="computed-box" style={{ gridTemplateColumns: "1fr 1fr 1fr 1fr" }}>
                <div className="computed-item">
                  <span className="computed-label">{T("Exakte Treffer", "Exact matches")}</span>
                  <span className="computed-value">{result.exactStats.count}</span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">Winrate</span>
                  <span className={`computed-value ${result.exactStats.winrate >= 50 ? "pos" : "neg"}`}>
                    {result.exactStats.count ? `${result.exactStats.winrate.toFixed(0)}%` : "—"}
                  </span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">Ø RR</span>
                  <span className="computed-value">{result.exactStats.count ? `${result.exactStats.avgRR.toFixed(2)}R` : "—"}</span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">{T("Ø Punkte", "Ø Points")}</span>
                  <span className={`computed-value ${result.exactStats.avgPoints >= 0 ? "pos" : "neg"}`}>
                    {result.exactStats.count ? `${result.exactStats.avgPoints >= 0 ? "+" : ""}${result.exactStats.avgPoints.toFixed(1)}` : "—"}
                  </span>
                </div>
              </div>

              <div className="ft-section-title" style={{ marginTop: "14px" }}>
                {T(`Nach Match-Anzahl (mindestens N von ${result.totalSelected} Confluences)`, `By match count (at least N of ${result.totalSelected} confluences)`)}
              </div>
              <div className="trade-list">
                {result.byThreshold.map((row) => (
                  <div className="breakdown-row" key={row.minMatch} style={{ gap: "10px" }}>
                    <span className="breakdown-label" style={{ width: "70px" }}>≥ {row.minMatch}/{result.totalSelected}</span>
                    <div className="breakdown-bar-track">
                      <div
                        className={`breakdown-bar-fill ${row.winrate < 50 ? "neg" : ""}`}
                        style={{ width: `${Math.min(100, row.winrate)}%` }}
                      />
                    </div>
                    <span className={`breakdown-value ${row.winrate >= 50 ? "pos" : "neg"}`} style={{ width: "56px" }}>{row.winrate.toFixed(0)}%</span>
                    <span className="breakdown-value" style={{ width: "66px" }}>{row.avgRR.toFixed(2)}R</span>
                    <span className="breakdown-value" style={{ width: "78px" }}>{row.avgPoints >= 0 ? "+" : ""}{row.avgPoints.toFixed(1)} {T("Pkt", "pts")}</span>
                    <span className="breakdown-count">{row.count}x</span>
                  </div>
                ))}
              </div>
              <span style={{ fontSize: "11px", color: "var(--muted-light)" }}>
                {T(`${result.matchedTradeCount} Trade${result.matchedTradeCount === 1 ? "" : "s"} in der Historie mit mindestens 1 Übereinstimmung.`, `${result.matchedTradeCount} trade${result.matchedTradeCount === 1 ? "" : "s"} in the history with at least 1 match.`)}
                {result.exactStats.count > 0 && result.exactStats.count < 10 ? T(" Achtung: kleine Stichprobe, Ergebnis mit Vorsicht interpretieren.", " Warning: small sample size, interpret the result with caution.") : ""}
              </span>
            </div>
          </React.Fragment>
        )}

        {!result && (
          <span className="insight-sub">{T("Wähle mindestens eine Confluence aus, um die Auswertung zu sehen.", "Select at least one confluence to see the analysis.")}</span>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   FREUNDE — Vergleich mit anderen Journals (nur lesend!)
   Pro Freund werden Name, Supabase-URL und anon Key im localStorage
   dieses Browsers gespeichert. Es werden ausschliesslich GET-Requests
   auf die Tabelle "Trades" des Freundes gemacht — nie schreibend.
   ============================================================ */
const FRIENDS_LS_KEY = "journal_friends";
const FRIEND_COLOR = "#a8a8a8"; // Silbergrau: hebt sich von Weiss (ich) ab, ohne den schwarz/weiss/roten Stil zu brechen
const ME_COLOR = "#ffffff";
const ME_NAME = T("Ich", "Me");

// Alle anderen Profile aus PROFILES sind automatisch Freunde (fest, nicht entfernbar).
// Zusaetzlich koennen manuell weitere Freunde hinzugefuegt werden (im Browser gespeichert).
function builtInFriends() {
  return PROFILES
    .filter((p) => (!ACTIVE_PROFILE || p.id !== ACTIVE_PROFILE.id) && !String(p.url).includes("DEIN-PROJEKT") && !String(p.key).includes("DEIN-ANON-KEY"))
    .map((p) => ({ id: `profile_${p.id}`, name: p.name, url: p.url, key: p.key, builtIn: true }));
}
function loadFriendsLS() {
  let manual = [];
  try {
    const v = JSON.parse(localStorage.getItem(FRIENDS_LS_KEY) || "[]");
    manual = Array.isArray(v) ? v.filter((f) => !f.builtIn) : [];
  } catch {}
  // Manuell hinzugefügte Freunde, die bereits als Profil existieren (gleiche Datenbank-URL), nicht doppelt anzeigen
  const builtIn = builtInFriends();
  const known = new Set([...builtIn.map((f) => normalizeSupabaseUrl(f.url)), normalizeSupabaseUrl(SUPABASE_URL)]);
  const seen = new Set();
  const manualUnique = manual.filter((f) => {
    const u = normalizeSupabaseUrl(f.url);
    if (known.has(u) || seen.has(u)) return false;
    seen.add(u);
    return true;
  });
  return [...builtIn, ...manualUnique];
}
function saveFriendsLS(list) {
  try { localStorage.setItem(FRIENDS_LS_KEY, JSON.stringify(list.filter((f) => !f.builtIn))); } catch {}
}

function ProfilePicker() {
  const [locking, setLocking] = useState(null);
  const choose = (p) => {
    try { localStorage.setItem(PROFILE_LS_KEY, p.id); } catch {}

}
/* ===== PROFIL-SPERRE (Profile mit lock: true): Passwort wie beim Portfolio =====
   Die Abfrage kommt erst, wenn man in der Profilauswahl auf das Profil klickt. Beim ersten Mal wird ein Passwort
   festgelegt, danach gilt die Entsperrung pro Browser-Tab. Gespeichert wird nur der SHA-256-Hash, in der
   Settings-Tabelle des Profils (Key profile_pw_<id>). */
const profHash = async (pw) => {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("prof:" + pw));
  return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join("");
};

function ProfileLock({ profile, onUnlock, onCancel }) {
  const p = profile;
  const base = `${String(p.url).replace(/\/+$/, "")}/rest/v1/Settings`;
  const H = { apikey: p.key, Authorization: `Bearer ${p.key}`, "Content-Type": "application/json" };
  const rowKey = `profile_pw_${p.id}`;
  const [hash, setHash] = useState(undefined); // undefined = lädt, null = noch kein Passwort gesetzt
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const loadHash = useCallback(() => {
    setHash(undefined);
    setMsg(null);
    fetch(`${base}?key=eq.${rowKey}&select=value`, { headers: H })
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((d) => setHash(d[0] ? d[0].value : null))
      .catch(() => setMsg("Settings-Tabelle nicht erreichbar."));
  }, []);
  useEffect(() => { loadHash(); }, [loadHash]);

  const submit = async (e) => {
    e.preventDefault();
    // Wert aus dem Formular lesen, damit auch ein Autofill des Browsers (z. B. Touch ID) ankommt.
    const val = String(new FormData(e.currentTarget).get("password") || pw);
    if (busy || hash === undefined) return;
    setBusy(true);
    try {
      const h = await profHash(val);
      if (hash === null) {
        if (val.length < 4) { setMsg("Mindestens 4 Zeichen."); return; }
        const r = await fetch(`${base}?on_conflict=key`, {
          method: "POST",
          headers: { ...H, Prefer: "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify({ key: rowKey, value: h, updated_at: new Date().toISOString() }),
        });
        if (!r.ok) { setMsg("Passwort konnte nicht gespeichert werden."); return; }
      } else if (h !== hash) {
        setMsg("Falsches Passwort.");
        return;
      }
      try { sessionStorage.setItem(`${PROF_OK_KEY}__${p.id}`, "1"); } catch {}
      onUnlock();
    } catch {
      setMsg("Verbindung fehlgeschlagen.");
    } finally {
      setBusy(false);
    }
  };

  const inp = { background: "var(--panel-2)", border: "1px solid var(--line)", borderRadius: "6px", color: "var(--text)", padding: "9px 10px", fontSize: "13px", fontFamily: "'JetBrains Mono', monospace", minWidth: 0 };
  const loadFailed = hash === undefined && !!msg;

  return (
    <div className="overlay">
      <form className="panel" style={{ width: "360px", maxWidth: "95vw" }} method="post" autoComplete="on" onSubmit={submit}>
        <div className="panel-head"><span>{p.name}</span></div>
        {hash === undefined && !msg ? <div className="cal-loading">Lade…</div> : loadFailed ? (
          <React.Fragment>
            <div className="notice notice-error">{msg}</div>
            <button type="button" className="btn-primary" onClick={loadHash}>Erneut versuchen</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: "13px", color: "var(--muted-light)" }}>{hash === null ? `Neues Passwort für das Profil ${p.name} festlegen:` : "Passwort eingeben:"}</div>
            {/* Benutzername + Passwort mit autocomplete: dadurch bietet der Browser das Speichern an (iCloud-Schlüsselbund, Chrome, ...) und füllt es später selbst aus. */}
            <input type="text" id="journal-username" name="username" autoComplete="username" value={p.name} readOnly style={{ ...inp, opacity: 0.7 }} />
            <input type="password" id="journal-password" name="password" autoComplete={hash === null ? "new-password" : "current-password"} autoFocus style={inp} value={pw} onChange={(e) => setPw(e.target.value)} />
            {msg && <div className="notice notice-error">{msg}</div>}
            <button type="submit" className="btn-primary" disabled={busy}>{hash === null ? "Festlegen" : "Entsperren"}</button>
          </React.Fragment>
        )}
        <button type="button" className="btn-secondary" onClick={onCancel}>Zurück</button>
      </form>
    </div>
  );
}
function normalizeSupabaseUrl(u) {
  return String(u || "").trim().replace(/\/rest\/v1.*$/, "").replace(/\/+$/, "");
}

function tradeRR(t) {
  if (t.result === "be") return 0;
  if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
  if (t.result === "loss") return -1;
  if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
  return null;
}

function summarizeTrades(list) {
  const wins = list.filter((t) => t.result === "win");
  const losses = list.filter((t) => t.result === "loss");
  const decided = wins.length + losses.length;
  const pnl = list.reduce((s, t) => s + Number(t.pnl || 0), 0);
  const grossProfit = wins.reduce((s, t) => s + Number(t.pnl || 0), 0);
  const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl || 0), 0));
  const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;
  const rrs = list.map(tradeRR).filter((v) => v !== null && !Number.isNaN(v));
  const avgRR = rrs.length ? rrs.reduce((s, r) => s + r, 0) / rrs.length : 0;

  const dayMap = new Map();
  list.forEach((t) => dayMap.set(t.trade_date, (dayMap.get(t.trade_date) || 0) + Number(t.pnl || 0)));
  const days = Array.from(dayMap.entries()).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  const greenDays = days.filter(([, v]) => v > 0).length;
  const dayVals = days.map(([, v]) => v);

  let run = 0, peak = 0, maxDD = 0;
  days.forEach(([, v]) => {
    run += v;
    if (run > peak) peak = run;
    if (peak - run > maxDD) maxDD = peak - run;
  });

  // Streaks (BE unterbricht keine Serie), Ø Gewinn/Verlust und Payoff
  const ordered = [...list].sort((x, y) => (x.trade_date < y.trade_date ? -1 : x.trade_date > y.trade_date ? 1 : Number(x.id || 0) - Number(y.id || 0)));
  let curW = 0, curL = 0, maxW = 0, maxL = 0;
  ordered.forEach((t) => {
    if (t.result === "win") { curW += 1; curL = 0; if (curW > maxW) maxW = curW; }
    else if (t.result === "loss") { curL += 1; curW = 0; if (curL > maxL) maxL = curL; }
  });
  const avgWin = wins.length ? grossProfit / wins.length : 0;
  const avgLoss = losses.length ? -grossLoss / losses.length : 0;
  const payoff = avgLoss < 0 ? avgWin / Math.abs(avgLoss) : avgWin > 0 ? Infinity : 0;

  return {
    count: list.length,
    winrate: decided ? (wins.length / decided) * 100 : 0,
    profitFactor,
    avgRR,
    pnl,
    expectancy: decided ? (grossProfit - grossLoss) / decided : 0,
    dayCount: days.length,
    greenDayPct: days.length ? (greenDays / days.length) * 100 : 0,
    bestDay: dayVals.length ? Math.max(...dayVals) : 0,
    worstDay: dayVals.length ? Math.min(...dayVals) : 0,
    maxDD,
    avgWin, avgLoss, payoff,
    maxWinStreak: maxW, maxLossStreak: maxL,
    tradesPerDay: days.length ? list.length / days.length : 0,
  };
}

function FriendsEquityChart({ mine, theirs, myName, theirName, unit = "usd" }) {
  const [hover, setHover] = useState(null);
  const W = 760, H = 230, PL = 64, PR = 16, PT = 14, PB = 28;
  const { dates, pa, pb } = useMemo(() => {
    const sum = (list) => {
      const m = new Map();
      list.forEach((t) => {
        const v = unit === "r" ? (Number.isFinite(tradeRR(t)) ? tradeRR(t) : 0) : Number(t.pnl || 0);
        m.set(t.trade_date, (m.get(t.trade_date) || 0) + v);
      });
      return m;
    };
    const a = sum(mine), b = sum(theirs);
    const ds = Array.from(new Set([...a.keys(), ...b.keys()])).sort();
    let ra = 0, rb = 0;
    const A = [], B = [];
    ds.forEach((d) => { ra += a.get(d) || 0; rb += b.get(d) || 0; A.push(ra); B.push(rb); });
    return { dates: ds, pa: A, pb: B };
  }, [mine, theirs, unit]);

  if (dates.length === 0) return <div className="notice">{T("Keine Trades im gewählten Zeitraum.", "No trades in the selected period.")}</div>;

  const all = [0, ...pa, ...pb];
  let min = Math.min(...all), max = Math.max(...all);
  if (max === min) { max += 1; min -= 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;
  const iw = W - PL - PR, ih = H - PT - PB;
  const n = dates.length;
  const x = (i) => (n === 1 ? PL + iw / 2 : PL + (i / (n - 1)) * iw);
  const y = (v) => PT + (1 - (v - min) / (max - min)) * ih;
  const line = (arr) => arr.map((v, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = (arr) => `${line(arr)} L${x(n - 1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;
  const ticks = [0, 1, 2, 3, 4].map((k) => min + ((max - min) * k) / 4);
  const money = (v) => (unit === "r"
    ? `${v < 0 ? "-" : ""}${Math.abs(v).toFixed(1)}R`
    : `${v < 0 ? "-" : ""}$${Math.abs(Math.round(v)).toLocaleString(LOCALE)}`);
  const fmtU = unit === "r" ? (v) => `${v >= 0 ? "+" : ""}${v.toFixed(2)}R` : fmtMoneyShort;

  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    const i = n === 1 ? 0 : Math.round(((px - PL) / iw) * (n - 1));
    setHover(Math.max(0, Math.min(n - 1, i)));
  };
  const hi = hover !== null && hover < n ? hover : n - 1;

  return (
    <div>
      <div style={{ display: "flex", gap: "22px", flexWrap: "wrap", fontSize: "12px", color: "var(--muted-light)", marginBottom: "10px" }}>
        <span style={{ color: "#fff", fontWeight: 700 }}>{friendsDayLabel(dates[hi])}</span>
        <span><span style={{ color: ME_COLOR }}>●</span> {myName}: <b style={{ color: "#fff" }}>{fmtU(pa[hi])}</b></span>
        <span><span style={{ color: FRIEND_COLOR }}>●</span> {theirName}: <b style={{ color: "#fff" }}>{fmtU(pb[hi])}</b></span>
        <span style={{ marginLeft: "auto" }}>{unit === "r" ? T("kumulierte R pro Handelstag", "cumulative R per trading day") : T("kumulierter PnL pro Handelstag", "cumulative PnL per trading day")}</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", cursor: "crosshair" }} onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="fgMe" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={ME_COLOR} stopOpacity="0.16" />
            <stop offset="100%" stopColor={ME_COLOR} stopOpacity="0" />
          </linearGradient>
          <linearGradient id="fgThem" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={FRIEND_COLOR} stopOpacity="0.18" />
            <stop offset="100%" stopColor={FRIEND_COLOR} stopOpacity="0" />
          </linearGradient>
        </defs>
        {ticks.map((t, k) => (
          <g key={k}>
            <line x1={PL} x2={W - PR} y1={y(t)} y2={y(t)} stroke="#1c1c1c" />
            <text x={PL - 8} y={y(t) + 4} textAnchor="end" fontSize="10" fill="#666">{money(t)}</text>
          </g>
        ))}
        <line x1={PL} x2={W - PR} y1={y(0)} y2={y(0)} stroke="#444" strokeDasharray="4 4" />
        {n > 1 && <path d={area(pa)} fill="url(#fgMe)" />}
        {n > 1 && <path d={area(pb)} fill="url(#fgThem)" />}
        <path d={line(pa)} fill="none" stroke={ME_COLOR} strokeWidth="2.2" strokeLinejoin="round" />
        <path d={line(pb)} fill="none" stroke={FRIEND_COLOR} strokeWidth="2.2" strokeLinejoin="round" strokeDasharray="7 4" />
        <text x={PL} y={H - 8} fontSize="10" fill="#666">{dates[0]}</text>
        <text x={W - PR} y={H - 8} textAnchor="end" fontSize="10" fill="#666">{dates[n - 1]}</text>
        {hover !== null && <line x1={x(hi)} x2={x(hi)} y1={PT} y2={PT + ih} stroke="#555" />}
        <circle cx={x(hi)} cy={y(pa[hi])} r="4.5" fill={ME_COLOR} stroke="#000" strokeWidth="1.5" />
        <circle cx={x(hi)} cy={y(pb[hi])} r="4.5" fill={FRIEND_COLOR} stroke="#000" strokeWidth="1.5" />
      </svg>
    </div>
  );
}

  const { cells, total, count } = useMemo(() => {
    const m = new Map();
    trades.forEach((t) => {
      if (!t.trade_date) return;
      const e = m.get(t.trade_date) || { pnl: 0, n: 0 };
      e.pnl += Number(t.pnl || 0);
      e.n += 1;
      m.set(t.trade_date, e);
    });
    const offset = mondayIndex(new Date(year, month, 1));
    const dim = daysInMonth(year, month);
    const arr = [];
    for (let i = 0; i < offset; i++) arr.push(null);
    let tot = 0, cnt = 0;
    for (let d = 1; d <= dim; d++) {
      const iso = isoDate(year, month, d);
      const e = m.get(iso);
      if (e) { tot += e.pnl; cnt += e.n; }
      arr.push({ day: d, iso, e });
    }
    return { cells: arr, total: tot, count: cnt };
  }, [trades, year, month]);

  return (
    <div style={{ ...friendsCard, flex: 1, minWidth: "340px", borderTop: `3px solid ${color}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "14px" }}>
        <FriendAvatar name={name} color={color} size={28} />
        <span style={{ fontWeight: 700, fontSize: "13px", letterSpacing: "0.1em", textTransform: "uppercase" }}>{name}</span>
        <span style={{ marginLeft: "auto", fontSize: "12px", color: "var(--muted-light)" }}>
          <b style={{ color: total >= 0 ? "#fff" : "var(--red)" }}>{fmtMoneyShort(total)}</b> · {count} Trade{count === 1 ? "" : "s"}
        </span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "5px" }}>
        {WEEKDAYS.map((d) => (
          <div key={d} style={{ fontSize: "10px", color: "var(--muted)", textAlign: "center", letterSpacing: "0.1em", paddingBottom: "2px" }}>{d}</div>
        ))}
        {cells.map((c, i) => {
          if (!c) return <div key={i} />;
          const pnl = c.e ? c.e.pnl : null;
          const selected = selectedDay === c.iso;
          const bg = pnl === null ? "transparent" : pnl > 0 ? "rgba(255,255,255,0.10)" : pnl < 0 ? "rgba(224,0,26,0.18)" : "rgba(255,255,255,0.05)";
          return (
            <button
              type="button"
              key={i}
              disabled={!c.e}
              onClick={() => onSelect(selected ? null : c.iso)}
              style={{
                background: bg, border: `1px solid ${selected ? color : "var(--line)"}`, borderRadius: "6px",
                minHeight: "62px", padding: "6px 7px", display: "flex", flexDirection: "column", textAlign: "left",
                justifyContent: "space-between", fontSize: "10px", color: "var(--muted-light)",
                cursor: c.e ? "pointer" : "default", opacity: i % 7 >= 5 && !c.e ? 0.4 : 1,
                fontFamily: "'JetBrains Mono', monospace", boxShadow: selected ? `0 0 0 1px ${color}` : "none",
              }}
            >
              <span>{c.day}</span>
              {c.e && (
                <span style={{ display: "flex", flexDirection: "column", gap: "1px" }}>
                  <span style={{ fontSize: "12px", fontWeight: 700, color: pnl >= 0 ? "#fff" : "var(--red)" }}>{fmtMoneyShort(pnl)}</span>
                  <span style={{ fontSize: "9px" }}>{c.e.n} Trade{c.e.n === 1 ? "" : "s"}</span>
                </span>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// Geplantes RR in Buckets (Ziel-RR laut SL/TP, nicht das realisierte RR)
const FRIENDS_RR_ORDER = ["< 1R", "1–2R", "2–3R", "3–5R", "5R+"];
const friendsRRBucket = (t) => {
  if (t.rr === null || t.rr === undefined || t.rr === "") return null;
  const r = Number(t.rr);
  if (Number.isNaN(r)) return null;
  return r < 1 ? "< 1R" : r < 2 ? "1–2R" : r < 3 ? "2–3R" : r < 5 ? "3–5R" : "5R+";
};

const friendsWeekdayKey = (t) => {
  const d = new Date(`${t.trade_date}T00:00:00`);
  return isNaN(d.getTime()) ? null : WEEKDAY_FULL[mondayIndex(d)];
};

// XFA-/Eval-Zuordnung: Grenze ist entweder ein ISO-Datetime (wie fundedActivatedAt im Journal,
// Vergleich ueber created_at) oder ein reines Datum (Vergleich ueber trade_date).
function isXfaTrade(t, boundary) {
  if (!boundary) return false;
  if (boundary.length > 10) return t.created_at ? t.created_at >= boundary : t.trade_date >= boundary.slice(0, 10);
  return t.trade_date >= boundary;
}

// Gruppierter Vergleich (z. B. nach Wochentag, Setup, Symbol, Confluence).
// keyFn darf einen Schluessel oder ein Array von Schluesseln liefern (z. B. Confluence-Tags).
function FriendsBreakdown({ mine, theirs, myName, theirName, keyFn, order, limit = 12, chrono = false }) {
  const data = useMemo(() => {
    const agg = (list) => {
      const m = new Map();
      list.forEach((t) => {
        const ks = keyFn(t);
        (Array.isArray(ks) ? ks : [ks]).forEach((k) => {
          if (k === null || k === undefined || k === "") return;
          const e = m.get(k) || { n: 0, w: 0, l: 0, pnl: 0, rr: 0, rrN: 0 };
          e.n += 1;
          e.pnl += Number(t.pnl || 0);
          if (t.result === "win") e.w += 1;
          else if (t.result === "loss") e.l += 1;
          const rr = tradeRR(t);
          if (rr !== null && !Number.isNaN(rr)) { e.rr += rr; e.rrN += 1; }
          m.set(k, e);
        });
      });
      return m;
    };
    const a = agg(mine), b = agg(theirs);
    let keys = Array.from(new Set([...a.keys(), ...b.keys()]));
    if (order) keys = order.filter((k) => keys.includes(k));
    else if (chrono) keys = keys.sort();
    else keys = keys.sort((x, y) => ((b.get(y) ? b.get(y).n : 0) + (a.get(y) ? a.get(y).n : 0)) - ((b.get(x) ? b.get(x).n : 0) + (a.get(x) ? a.get(x).n : 0))).slice(0, limit);
    let max = 1e-9;
    keys.forEach((k) => { [a.get(k), b.get(k)].forEach((e) => { if (e && Math.abs(e.pnl) > max) max = Math.abs(e.pnl); }); });
    return { keys, a, b, max };
  }, [mine, theirs]);

  if (data.keys.length === 0) return <div className="notice">{T("Keine Daten für diese Auswahl.", "No data for this selection.")}</div>;

  const cell = (e, color) => {
    if (!e) return <span style={{ fontSize: "12px", color: "var(--muted)" }}>—</span>;
    const decided = e.w + e.l;
    return (
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", columnGap: "8px", marginBottom: "4px" }}>
          <b style={{ fontSize: "13px", color: e.pnl >= 0 ? "#fff" : "var(--red)" }}>{fmtMoneyShort(e.pnl)}</b>
          <span style={{ fontSize: "11px", color: "var(--muted-light)" }}>
            {e.n}x · WR {decided ? ((e.w / decided) * 100).toFixed(0) : "—"}% · Ø {e.rrN ? (e.rr / e.rrN).toFixed(2) : "—"}R
          </span>
        </div>
        <div style={{ height: "5px", background: "#1a1a1a", borderRadius: "3px", overflow: "hidden" }}>
          <div style={{ width: `${Math.min(100, (Math.abs(e.pnl) / data.max) * 100)}%`, height: "100%", background: color, borderRadius: "3px" }} />
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "112px 1fr 1fr", gap: "14px", paddingBottom: "6px", borderBottom: "1px solid var(--line)" }}>
        <span />
        <span style={{ color: ME_COLOR, fontWeight: 700, fontSize: "12px", letterSpacing: "0.1em", textTransform: "uppercase" }}>{myName}</span>
        <span style={{ color: FRIEND_COLOR, fontWeight: 700, fontSize: "12px", letterSpacing: "0.1em", textTransform: "uppercase" }}>{theirName}</span>
      </div>
      {data.keys.map((k) => (
        <div key={k} style={{ display: "grid", gridTemplateColumns: "112px 1fr 1fr", gap: "14px", alignItems: "center", padding: "7px 0", borderBottom: "1px solid var(--line)" }}>
          <span style={{ fontSize: "12px", color: "var(--muted-light)", wordBreak: "break-word" }}>{tagText(k)}</span>
          {cell(data.a.get(k), ME_COLOR)}
          {cell(data.b.get(k), FRIEND_COLOR)}
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   FREUNDE — Uebersicht
   Reihenfolge: Kennzahlen-Karten, automatisches Fazit, Tagesduell,
   Equity ($ oder R), Vergleichstabelle in Abschnitten, Aufschluesselungen.
   ============================================================ */
const fmtPFSafe = (v) => (Number.isNaN(v) ? "—" : fmtPFValue(v));
const nanIfNull = (v) => (v === null || v === undefined ? NaN : v);

// Kennzahlen je Person: Zusammenfassung, Edge-Werte, Netto-R und Plan-Disziplin.
function friendsMetrics(list) {
  const sum = summarizeTrades(list);
  const edge = computeEdgeStats(list);
  const rs = finiteNums(list.map(tradeRR));
  const planKnown = list.filter((t) => t.plan_followed === true || t.plan_followed === false);
  return {
    sum,
    edge,
    wins: list.filter((t) => t.result === "win").length,
    netR: rs.reduce((s, v) => s + v, 0),
    rN: rs.length,
    planN: planKnown.length,
    noPlanShare: planKnown.length ? planKnown.filter((t) => t.plan_followed === false).length / planKnown.length : null,
  };
}

// Automatisches Fazit. Jede Aussage nennt Zahlen, und Unterschiede werden nur dann als belastbar
// bezeichnet, wenn sich die 95%-Intervalle der Winrate nicht ueberlappen.
function friendsTakeaways(A, B, myName, theirName) {
  const out = [];
  if (!A.sum.count || !B.sum.count) return out;
  const who = (d) => (d > 0 ? myName : theirName);
  // Grammatik: "bei mir" / "für mich" statt "bei Ich" / "für Ich"; Namen bleiben unveraendert.
  const dat = (n) => (n === myName ? T("mir", "me") : n);
  const acc = (n) => (n === myName ? T("mich", "me") : n);

  const dUsd = A.sum.pnl - B.sum.pnl;
  if (dUsd !== 0) {
    out.push({
      key: "result",
      text: T(
        `Ergebnis: ${fmtMoney(Math.abs(dUsd))} Vorsprung für ${acc(who(dUsd))} (${myName} ${fmtMoneyShort(A.sum.pnl)}, ${theirName} ${fmtMoneyShort(B.sum.pnl)}). In R: ${fmtR(A.netR)} gegen ${fmtR(B.netR)}. Das ist der fairere Vergleich, falls ihr verschieden viele Contracts handelt.`,
        `Result: ${fmtMoney(Math.abs(dUsd))} lead for ${acc(who(dUsd))} (${myName} ${fmtMoneyShort(A.sum.pnl)}, ${theirName} ${fmtMoneyShort(B.sum.pnl)}). In R: ${fmtR(A.netR)} vs ${fmtR(B.netR)}. That is the fairer comparison if you trade different contract sizes.`
      ),
    });
  }

  if (A.rN >= 5 && B.rN >= 5 && A.edge.expR !== B.edge.expR) {
    const hi = A.edge.expR > B.edge.expR ? A : B;
    const lo = hi === A ? B : A;
    out.push({
      key: "edge",
      text: T(
        `Edge pro Trade: ${fmtR(hi.edge.expR)} bei ${dat(hi === A ? myName : theirName)}, ${fmtR(lo.edge.expR)} bei ${dat(hi === A ? theirName : myName)}.`,
        `Edge per trade: ${fmtR(hi.edge.expR)} for ${dat(hi === A ? myName : theirName)}, ${fmtR(lo.edge.expR)} for ${dat(hi === A ? theirName : myName)}.`
      ),
    });
  }

  const nA = A.edge.decided, nB = B.edge.decided;
  if (nA > 0 && nB > 0) {
    const wa = wilsonInterval(A.wins, nA), wb = wilsonInterval(B.wins, nB);
    const overlap = wa.low <= wb.high && wb.low <= wa.high;
    const pa = `${(wa.p * 100).toFixed(0)}%`, pb = `${(wb.p * 100).toFixed(0)}%`;
    out.push({
      key: "winrate",
      text: overlap
        ? T(`Winrate ${pa} gegen ${pb}: Die Intervalle überlappen, bei dieser Stichprobe ist der Unterschied nicht belastbar.`, `Win rate ${pa} vs ${pb}: the intervals overlap, so the difference is not reliable at this sample size.`)
        : T(`Winrate ${pa} gegen ${pb}: Die Intervalle überlappen nicht, der Unterschied ist belastbar.`, `Win rate ${pa} vs ${pb}: the intervals do not overlap, the difference is reliable.`),
    });
  }

  if ((A.sum.maxDD > 0 || B.sum.maxDD > 0) && A.sum.maxDD !== B.sum.maxDD) {
    const low = A.sum.maxDD < B.sum.maxDD ? A : B;
    const high = low === A ? B : A;
    out.push({
      key: "dd",
      text: T(
        `Risiko: kleinerer Max Drawdown bei ${dat(low === A ? myName : theirName)} (${fmtMoney(-low.sum.maxDD)} gegen ${fmtMoney(-high.sum.maxDD)}).`,
        `Risk: smaller max drawdown for ${dat(low === A ? myName : theirName)} (${fmtMoney(-low.sum.maxDD)} vs ${fmtMoney(-high.sum.maxDD)}).`
      ),
    });
  }

  if (A.noPlanShare !== null && B.noPlanShare !== null && A.planN >= 5 && B.planN >= 5 && Math.abs(A.noPlanShare - B.noPlanShare) >= 0.1) {
    out.push({
      key: "plan",
      text: T(
        `Disziplin: Trades ohne Plan machen bei ${dat(myName)} ${(A.noPlanShare * 100).toFixed(0)}% aus, bei ${theirName} ${(B.noPlanShare * 100).toFixed(0)}%.`,
        `Discipline: trades without a plan are ${(A.noPlanShare * 100).toFixed(0)}% for ${dat(myName)} and ${(B.noPlanShare * 100).toFixed(0)}% for ${theirName}.`
      ),
    });
  }

  if (Math.min(nA, nB) < SMALL_SAMPLE) {
    out.push({
      key: "sample",
      warn: true,
      text: T(
        `Kleine Stichprobe (${myName} ${nA}, ${theirName} ${nB} Trades mit Ergebnis, unter ${SMALL_SAMPLE}): Zahlen mit Vorsicht lesen.`,
        `Small sample (${myName} ${nA}, ${theirName} ${nB} decided trades, under ${SMALL_SAMPLE}): read the numbers with care.`
      ),
    });
  }
  return out;
}

          <div style={{ display: "flex", gap: "6px" }}>
            {[["usd", "$"], ["r", "R"]].map(([id, label]) => (
              <button key={id} type="button" style={friendsSeg(unit === id)} onClick={() => setUnit(id)}>{label}</button>
            ))}
          </div>
        </div>
        <FriendsEquityChart mine={mine} theirs={theirs} myName={myName} theirName={theirName} unit={unit} />
      </div>
      {(takeaways.length > 0 || duel.total > 0) && (
        <div style={{ flex: "1 1 340px", minWidth: 0, display: "flex", flexDirection: "column", gap: "14px" }}>
          {takeaways.length > 0 && (
            <div style={{ ...friendsCard, marginBottom: 0 }}>
              <div style={friendsSectionTitle}>{T("Fazit", "Takeaways")}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: "9px" }}>
                {takeaways.map((t) => (
                  <div key={t.key} style={{ display: "flex", gap: "10px", fontSize: "12.5px", lineHeight: 1.6, color: t.warn ? "#ff6b78" : "var(--text)" }}>
                    <span style={{ color: t.warn ? "var(--red)" : "var(--muted)", flexShrink: 0 }}>●</span>
                    <span>{t.text}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {duel.total > 0 && (
            <div style={{ ...friendsCard, marginBottom: 0 }}>
              <div style={friendsSectionTitle}>{T(`Tagesduell · ${duel.total} gemeinsame Handelstage`, `Daily duel · ${duel.total} shared trading days`)}</div>
              <div style={{ display: "flex", height: "10px", borderRadius: "5px", overflow: "hidden", background: "#1a1a1a" }}>
                <div style={{ width: `${(duel.w / duel.total) * 100}%`, background: ME_COLOR }} />
                <div style={{ width: `${(duel.t / duel.total) * 100}%`, background: "#444" }} />
                <div style={{ width: `${(duel.l / duel.total) * 100}%`, background: FRIEND_COLOR }} />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: "10px", fontSize: "12px" }}>
                <span style={{ color: ME_COLOR }}>{myName} {T("besser:", "ahead:")} <b>{duel.w}</b></span>
                <span style={{ color: "var(--muted-light)" }}>{T("Gleichstand:", "Tie:")} <b>{duel.t}</b></span>
                <span style={{ color: FRIEND_COLOR }}>{theirName} {T("besser:", "ahead:")} <b>{duel.l}</b></span>
              </div>
            </div>
          )}
        </div>
      )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(600px, 100%), 1fr))", gap: "14px", alignItems: "start" }}>
        {sections.map((sec) => (
          <div key={sec.title} style={{ ...friendsCard, marginBottom: 0 }}>
            <div style={friendsSectionTitle}>{sec.title}</div>
            {namesHead}
            {sec.rows.map((r) => (
              <div key={r.label} style={{ display: "grid", gridTemplateColumns: "190px 1fr 1fr", gap: "22px", alignItems: "center", padding: "9px 0", borderBottom: "1px solid var(--line)" }}>
                <span style={{ fontSize: "12px", color: "var(--muted-light)" }}>{r.label}</span>
                {cell(r, "a", ME_COLOR)}
                {cell(r, "b", FRIEND_COLOR)}
              </div>
            ))}
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(440px, 1fr))", gap: "14px", alignItems: "start" }}>
        {card(T("Nach Wochentag", "By weekday"), bd(friendsWeekdayKey, { order: WEEKDAY_FULL }))}
        {card(T("Nach Setup", "By setup"), bd((t) => t.setup || null))}
        {card(T("Nach Confluence (Top 8)", "By confluence (top 8)"), bd((t) => (Array.isArray(t.confluences) ? t.confluences : []), { limit: 8 }))}
        {card(T("Nach Markt (Mini + Micro zusammen)", "By market (mini + micro combined)"), bd((t) => (t.symbol ? marketOf(t.symbol) : null)))}
        {card(T("Nach Richtung", "By direction"), bd((t) => (t.direction === "long" ? "Long" : t.direction === "short" ? "Short" : null)))}
        {hasTime && card(T("Nach Uhrzeit (Einstieg)", "By hour (entry)"), bd((t) => { const m = /^(\d{1,2}):/.exec(t.entry_time || ""); return m ? `${m[1].padStart(2, "0")}:00` : null; }, { chrono: true }))}
        {card(T("Nach Monat", "By month"), bd((t) => (t.trade_date ? t.trade_date.slice(0, 7) : null), { chrono: true }))}
      </div>
    </div>
  );
}

function FriendsPanel({ onClose, myTrades }) {
  const [friends, setFriends] = useState(loadFriendsLS);
  const [activeId, setActiveId] = useState(() => { const l = loadFriendsLS(); return l[0] ? l[0].id : null; });
  const [adding, setAdding] = useState(() => loadFriendsLS().length === 0);
  const [form, setForm] = useState({ name: "", url: "", key: "" });
  const [formErr, setFormErr] = useState(null);
  const [theirTrades, setTheirTrades] = useState([]);
  const [fLoading, setFLoading] = useState(false);
  const [fErr, setFErr] = useState(null);
  const [period, setPeriod] = useState("all");
  const [cur, setCur] = useState(() => { const n = new Date(); return { year: n.getFullYear(), month: n.getMonth() }; });
  const [tab, setTab] = useState("overview");
  const [who, setWho] = useState("both");
  const [resFilter, setResFilter] = useState("all");
  const [selDay, setSelDay] = useState(null);
  const [shot, setShot] = useState(null);
  const [custom, setCustom] = useState({ from: "", to: "" });
  const [stage, setStage] = useState("all");
  const [symbolF, setSymbolF] = useState("all");
  const [dirF, setDirF] = useState("all");
  const [setupF, setSetupF] = useState("all");
  const [confF, setConfF] = useState("all");
  const [wdF, setWdF] = useState([]);
  const [commonOnly, setCommonOnly] = useState(false);
  const [lastN, setLastN] = useState("all");
  const [curAcc, setCurAcc] = useState(false);
  const [filtersOpen, setFiltersOpen] = useState(false);
  // Gespeicherte Filter-Ansichten (pro Profil im Browser)
  const viewsKey = `journal_friends_views__${ACTIVE_PROFILE ? ACTIVE_PROFILE.id : "x"}`;
  const [views, setViews] = useState(() => {
    try { const v = JSON.parse(localStorage.getItem(viewsKey) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; }
  });
  const xfaKey = `journal_friends_xfa__${ACTIVE_PROFILE ? ACTIVE_PROFILE.id : "x"}`;
  const [xfa, setXfa] = useState(() => {
    try { return JSON.parse(localStorage.getItem(xfaKey) || "{}") || {}; } catch { return {}; }
  });

  const active = friends.find((f) => f.id === activeId) || null;

  // Nur GET — es wird nie etwas in die Datenbank des Freundes geschrieben.
  useEffect(() => {
    if (!active) { setTheirTrades([]); return; }
    let cancelled = false;
    setFLoading(true);
    setFErr(null);
    fetch(`${active.url}/rest/v1/Trades?select=*&order=trade_date.asc`, {
      method: "GET",
      headers: { apikey: active.key, Authorization: `Bearer ${active.key}` },
    })
      .then((res) => {
        if (!res.ok) throw new Error(T(`Fehler ${res.status} — URL, Key oder Lese-Policy (RLS) prüfen`, `Error ${res.status} — check URL, key or read policy (RLS)`));
        return res.json();
      })
      .then((data) => { if (!cancelled) setTheirTrades(Array.isArray(data) ? data : []); })
      .catch((e) => { if (!cancelled) { setTheirTrades([]); setFErr(e.message || T("Verbindung fehlgeschlagen", "Connection failed")); } })
      .finally(() => { if (!cancelled) setFLoading(false); });
    return () => { cancelled = true; };
  }, [active ? active.id : null]);

  const addFriend = () => {
    const name = form.name.trim();
    const url = normalizeSupabaseUrl(form.url);
    const key = form.key.trim();
    if (!name || !url || !key) { setFormErr(T("Name, Supabase-URL und anon Key ausfüllen.", "Fill in name, Supabase URL and anon key.")); return; }
    if (!/^https:\/\/[^\s/]+$/i.test(url)) { setFormErr(T("URL muss so aussehen: https://xxxx.supabase.co", "URL must look like this: https://xxxx.supabase.co")); return; }
    if (url === SUPABASE_URL) { setFormErr(T("Das ist deine eigene Datenbank.", "That is your own database.")); return; }
    const f = { id: Math.random().toString(36).slice(2), name, url, key };
    const next = [...friends, f];
    setFriends(next);
    saveFriendsLS(next);
    setActiveId(f.id);
    setForm({ name: "", url: "", key: "" });
    setFormErr(null);
    setAdding(false);
  };

  const removeFriend = (f) => {
    if (!window.confirm(T(`${f.name} aus der Freundesliste entfernen? (Die Datenbank selbst bleibt unberührt.)`, `Remove ${f.name} from your friends list? (The database itself is not touched.)`))) return;
    const next = friends.filter((x) => x.id !== f.id);
    setFriends(next);
    saveFriendsLS(next);
    if (activeId === f.id) setActiveId(next[0] ? next[0].id : null);
    if (next.length === 0) setAdding(true);
  };

  // ── Filter ──
  // XFA-Start: fuer dich standardmaessig das Aktivierungsdatum der Funded Stage aus deinem Journal,
  // fuer Freunde einmalig manuell einzutragen (liegt in deren Browser, nicht in der Datenbank).
  const myDefaultXfa = useMemo(() => {
    try { return localStorage.getItem("journal_funded_activated_at") || localStorage.getItem("journal_funded_start_date") || ""; } catch { return ""; }
  }, []);
  const setXfaFor = (k, v) => setXfa((prev) => {
    const next = { ...prev, [k]: v };
    try { localStorage.setItem(xfaKey, JSON.stringify(next)); } catch {}
    return next;
  });
  const boundaryMe = xfa.me !== undefined ? xfa.me : myDefaultXfa;
  const boundaryThem = xfa[activeId] || "";
  // "Aktuelles Konto": jede Person wird nur mit der Phase verglichen, in der sie JETZT ist.
  // Ich: kommt aus dem Journal (Funded Stage aktiv = XFA, sonst Eval). Freund: manuell wählbar.
  const myIsXfa = (() => { try { return localStorage.getItem("journal_funded_stage") === "1"; } catch { return false; } })();
  const themPhase = xfa[`${activeId}__phase`] || (boundaryThem ? "xfa" : "eval");
  const themIsXfa = themPhase === "xfa";

  const bothTrades = useMemo(() => [...myTrades, ...theirTrades], [myTrades, theirTrades]);
  const symbolOptions = useMemo(() => Array.from(new Set(bothTrades.map((t) => (t.symbol ? marketOf(t.symbol) : null)).filter(Boolean))).sort(), [bothTrades]);
  const setupOptions = useMemo(() => Array.from(new Set(bothTrades.map((t) => t.setup).filter(Boolean))).sort(), [bothTrades]);
  const confOptions = useMemo(() => {
    const s = new Set();
    bothTrades.forEach((t) => (Array.isArray(t.confluences) ? t.confluences : []).forEach((c) => s.add(c)));
    return Array.from(s).sort();
  }, [bothTrades]);

  const filtered = useMemo(() => {
    let from = null, to = null;
    const n = new Date();
    const iso = (d) => isoDate(d.getFullYear(), d.getMonth(), d.getDate());
    const ago = (days) => iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() - days));
    if (period === "week") from = ago(mondayIndex(n));
    else if (period === "lastmonth") {
      const lm = new Date(n.getFullYear(), n.getMonth() - 1, 1);
      from = isoDate(lm.getFullYear(), lm.getMonth(), 1);
      to = isoDate(lm.getFullYear(), lm.getMonth(), daysInMonth(lm.getFullYear(), lm.getMonth()));
    }
    else if (period === "cutoff") from = STATS_CUTOFF_DATE;
    else if (period === "7d") from = ago(6);
    else if (period === "30d") from = ago(29);
    else if (period === "90d") from = ago(89);
    else if (period === "ytd") from = `${n.getFullYear()}-01-01`;
    else if (period === "month") { from = isoDate(cur.year, cur.month, 1); to = isoDate(cur.year, cur.month, daysInMonth(cur.year, cur.month)); }
    else if (period === "custom") { from = custom.from || null; to = custom.to || null; }

    const matches = (t, who, ignorePeriod) => {
      const d = t.trade_date;
      if (!d) return false;
      if (!ignorePeriod) {
        if (from && d < from) return false;
        if (to && d > to) return false;
      }
      if (stage !== "all") {
        const x = isXfaTrade(t, who === "me" ? boundaryMe : boundaryThem);
        if (stage === "xfa" ? !x : x) return false;
      }
      if (curAcc) {
        if (who === "me") {
          if (myIsXfa && !isXfaTrade(t, boundaryMe)) return false;
        } else if (themIsXfa ? !isXfaTrade(t, boundaryThem) : (boundaryThem && isXfaTrade(t, boundaryThem))) return false;
      }
      if (symbolF !== "all" && (!t.symbol || marketOf(t.symbol) !== symbolF)) return false;
      if (dirF !== "all" && t.direction !== dirF) return false;
      if (setupF !== "all" && t.setup !== setupF) return false;
      if (confF !== "all" && !(Array.isArray(t.confluences) && t.confluences.includes(confF))) return false;
      if (resFilter !== "all" && t.result !== resFilter) return false;
      if (wdF.length > 0 && !wdF.includes(mondayIndex(new Date(`${d}T00:00:00`)))) return false;
      return true;
    };

    let a = myTrades.filter((t) => matches(t, "me", false));
    let b = theirTrades.filter((t) => matches(t, "them", false));
    if (commonOnly) {
      const da = new Set(a.map((t) => t.trade_date));
      const db = new Set(b.map((t) => t.trade_date));
      a = a.filter((t) => db.has(t.trade_date));
      b = b.filter((t) => da.has(t.trade_date));
    }
    // Form-Check: nur die letzten N Trades je Person (nach allen anderen Filtern)
    if (lastN !== "all") {
      const N = Number(lastN);
      const latest = (list) => [...list]
        .sort((x, y) => (x.trade_date < y.trade_date ? 1 : x.trade_date > y.trade_date ? -1 : Number(y.id || 0) - Number(x.id || 0)))
        .slice(0, N);
      a = latest(a);
      b = latest(b);
    }
    return {
      a, b,
      calA: myTrades.filter((t) => matches(t, "me", true)),
      calB: theirTrades.filter((t) => matches(t, "them", true)),
    };
  }, [myTrades, theirTrades, period, custom, cur, stage, symbolF, dirF, setupF, confF, resFilter, wdF, commonOnly, lastN, curAcc, myIsXfa, themIsXfa, boundaryMe, boundaryThem]);

  const myFiltered = filtered.a;
  const theirFiltered = filtered.b;
  const calMine = filtered.calA;
  const calTheirs = filtered.calB;

  // Tagesduell: an Tagen, an denen beide gehandelt haben — wer hatte den besseren Tag?
  const duel = useMemo(() => {
    const dayMap = (list) => {
      const m = new Map();
      list.forEach((t) => m.set(t.trade_date, (m.get(t.trade_date) || 0) + Number(t.pnl || 0)));
      return m;
    };
    const a = dayMap(myFiltered), b = dayMap(theirFiltered);
    let w = 0, l = 0, t = 0;
    a.forEach((v, k) => {
      if (!b.has(k)) return;
      const o = b.get(k);
      if (v > o) w += 1; else if (v < o) l += 1; else t += 1;
    });
    return { w, l, t, total: w + l + t };
  }, [myFiltered, theirFiltered]);

  const activeFilterCount =
    (period !== "all" ? 1 : 0) + (stage !== "all" ? 1 : 0) + (symbolF !== "all" ? 1 : 0) + (dirF !== "all" ? 1 : 0) +
    (setupF !== "all" ? 1 : 0) + (confF !== "all" ? 1 : 0) + (resFilter !== "all" ? 1 : 0) + (wdF.length > 0 ? 1 : 0) + (commonOnly ? 1 : 0) + (lastN !== "all" ? 1 : 0) + (curAcc ? 1 : 0);
  const resetFilters = () => {
    setPeriod("all"); setCustom({ from: "", to: "" }); setStage("all"); setSymbolF("all"); setDirF("all");
    setSetupF("all"); setConfF("all"); setResFilter("all"); setWdF([]); setCommonOnly(false); setLastN("all"); setCurAcc(false);
  };

  const currentViewState = () => ({ period, custom, stage, symbolF, dirF, setupF, confF, resFilter, wdF, commonOnly, lastN, curAcc });
  const persistViews = (next) => {
    setViews(next);
    try { localStorage.setItem(viewsKey, JSON.stringify(next)); } catch {}
  };
  const saveView = () => {
    const name = (window.prompt(T("Name für diese Filter-Ansicht:", "Name for this filter view:")) || "").trim();
    if (!name) return;
    persistViews([...views.filter((v) => v.name !== name), { name, state: currentViewState() }]);
  };
  const loadView = (v) => {
    const s = v.state || {};
    setPeriod(s.period || "all"); setCustom(s.custom || { from: "", to: "" }); setStage(s.stage || "all");
    setSymbolF(s.symbolF || "all"); setDirF(s.dirF || "all"); setSetupF(s.setupF || "all"); setConfF(s.confF || "all");
    setResFilter(s.resFilter || "all"); setWdF(Array.isArray(s.wdF) ? s.wdF : []); setCommonOnly(!!s.commonOnly); setLastN(s.lastN || "all"); setCurAcc(!!s.curAcc);
  };
  const deleteView = (v) => persistViews(views.filter((x) => x.name !== v.name));

  // CSV-Export der aktuell gefilterten Trades beider Personen (Excel-kompatibel, Semikolon-getrennt)
  const exportCsv = () => {
    const esc = (v) => {
      const s = v === null || v === undefined ? "" : String(v);
      return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const head = T(["Person", "Datum", "Symbol", "Richtung", "Contracts", "Ergebnis", "SL", "TP", "RR", "PnL", "Setup", "Confluences", "Notiz"], ["Person", "Date", "Symbol", "Direction", "Contracts", "Result", "SL", "TP", "RR", "PnL", "Setup", "Confluences", "Note"]);
    const body = [[ME_NAME, myFiltered], [active ? active.name : T("Freund", "Friend"), theirFiltered]].flatMap(([nm, list]) =>
      list.map((t) => [nm, t.trade_date, t.symbol, t.direction, t.contracts, t.result, t.stop_loss, t.take_profit, t.rr, t.pnl, t.setup, Array.isArray(t.confluences) ? t.confluences.join(" | ") : "", t.note])
    );
    const csv = [head, ...body].map((r) => r.map(esc).join(";")).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `journal-${T("vergleich", "comparison")}-${localIsoToday()}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const mySum = useMemo(() => summarizeTrades(myFiltered), [myFiltered]);
  const theirSum = useMemo(() => summarizeTrades(theirFiltered), [theirFiltered]);

  const shiftMonth = (delta) => {
    setCur((c) => {
      const d = new Date(c.year, c.month + delta, 1);
      return { year: d.getFullYear(), month: d.getMonth() };
    });
  };

  const inputStyle = {
    background: "var(--panel-2)", border: "1px solid var(--line)", borderRadius: "6px", color: "var(--text)",
    padding: "10px 12px", fontSize: "13px", fontFamily: "'JetBrains Mono', monospace", width: "100%",
  };
  const monthLabel = `${MONTHS[cur.month]} ${cur.year}`;

  // Trades-Tab: zusaetzlich nach Ergebnis filtern; Kalender-Tab: Details des gewaehlten Tages.
  const myList = myFiltered;
  const theirList = theirFiltered;
  const myDay = selDay ? calMine.filter((t) => t.trade_date === selDay) : [];
  const theirDay = selDay ? calTheirs.filter((t) => t.trade_date === selDay) : [];
  const diff = mySum.pnl - theirSum.pnl;

  const monthNav = (
    <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
      <button type="button" className="icon-btn" onClick={() => shiftMonth(-1)} aria-label={T("Vorheriger Monat", "Previous month")}><Icon.ChevL /></button>
      <span style={{ fontSize: "13px", minWidth: "140px", textAlign: "center", fontWeight: 700 }}>{monthLabel}</span>
      <button type="button" className="icon-btn" onClick={() => shiftMonth(1)} aria-label={T("Nächster Monat", "Next month")}><Icon.ChevR /></button>
    </div>
  );

  const pillStyle = (sel) => ({
    display: "flex", alignItems: "center", gap: "8px",
    background: sel ? "rgba(255,255,255,0.08)" : "transparent",
    border: `1px solid ${sel ? FRIEND_COLOR : "var(--line)"}`,
    color: sel ? "#fff" : "var(--muted-light)",
    borderRadius: "999px", padding: "6px 16px 6px 6px", cursor: "pointer",
    fontFamily: "'JetBrains Mono', monospace", fontSize: "12px", fontWeight: 700,
  });

  return (
    <React.Fragment>
      <div className="overlay" onClick={onClose}>
        <div className="panel" style={{ width: "1700px", maxWidth: "97vw", maxHeight: "95vh" }} onClick={(e) => e.stopPropagation()}>
          <div className="panel-head">
            <span>{T("Freunde — Vergleich", "Friends — comparison")}</span>
            <button type="button" className="icon-btn" onClick={onClose} aria-label={T("Schließen", "Close")}>
              <Icon.Close />
            </button>
          </div>

          <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", alignItems: "center" }}>
            {friends.map((f) => (
              <button key={f.id} type="button" style={pillStyle(f.id === activeId && !adding)} onClick={() => { setActiveId(f.id); setAdding(false); setSelDay(null); }}>
                <FriendAvatar name={f.name} color={FRIEND_COLOR} size={24} /> {f.name}
              </button>
            ))}
            <button type="button" style={{ ...pillStyle(adding), padding: "9px 16px" }} onClick={() => setAdding((v) => !v)}>
              <Icon.Plus /> {T("Freund hinzufügen", "Add friend")}
            </button>
            {active && !active.builtIn && !adding && (
              <button type="button" className="btn-secondary" style={{ padding: "8px 14px", marginLeft: "auto" }} onClick={() => removeFriend(active)}>
                {T("Entfernen", "Remove")}
              </button>
            )}
          </div>

          {adding && (
            <div style={{ ...friendsCard, display: "flex", flexDirection: "column", gap: "10px" }}>
              <div className="notice">
                {IS_EN ? (
                  <React.Fragment>Your friend sends you their <b>Supabase Project URL</b> and their <b>anon / publishable key</b> (Supabase → Project Settings → API). Both are stored only in your browser. Data is only ever read, never written. Important: their <b>Trades</b> table must allow read access with the anon key via an RLS policy.</React.Fragment>
                ) : (
                  <React.Fragment>Dein Freund schickt dir seine <b>Supabase Project URL</b> und seinen <b>anon / publishable Key</b> (Supabase → Project Settings → API). Beides wird nur in deinem Browser gespeichert. Es wird ausschließlich gelesen, nie geschrieben. Wichtig: Seine Tabelle <b>Trades</b> muss per RLS-Policy für Lesezugriff mit dem anon Key freigegeben sein.</React.Fragment>
