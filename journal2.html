function EquityCurve({ data }) {
  const w = 560;
  const h = 120;
  const pad = 6;

  if (data.length < 2) {
    return (
      <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg">
        <line x1={pad} y1={h / 2} x2={w - pad} y2={h / 2} stroke="var(--line)" strokeWidth="1.5" strokeDasharray="4 6" />
      </svg>
    );
  }

  const ys = data.map((d) => d.y);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const range = maxY - minY || 1;

  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.y - minY) / range) * (h - pad * 2);
    return [x, y];
  });

  const lineD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const areaD = `${lineD} L${points[points.length - 1][0]},${h - pad} L${points[0][0]},${h - pad} Z`;

  const last = data[data.length - 1].y;
  const first = data[0].y;
  const positive = last >= first;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="equity-svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0.22" />
          <stop offset="100%" stopColor={positive ? "var(--green)" : "var(--red)"} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaD} fill="url(#eqFill)" />
      <path d={lineD} fill="none" stroke={positive ? "var(--green)" : "var(--red)"} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r="3.5" fill={positive ? "var(--green)" : "var(--red)"} />
    </svg>
  );
}

function AddTradePanel({ onClose, onSubmit, saving, initialTrade = null, isEdit = false, existingSetups = [], existingConfluences = [] }) {
  const todayIso = new Date().toISOString().slice(0, 10);
  const [form, setForm] = useState(() => {
    if (initialTrade) {
      return {
        trade_date: initialTrade.trade_date,
        symbol: initialTrade.symbol,
        contracts: String(initialTrade.contracts),
        direction: initialTrade.direction,
        result: initialTrade.result,
        stop_loss: String(initialTrade.stop_loss ?? ""),
        take_profit: String(initialTrade.take_profit ?? ""),
        manual_pnl: initialTrade.pnl !== null && initialTrade.pnl !== undefined ? String(initialTrade.pnl) : "",
        note: initialTrade.note || "",
        screenshot: initialTrade.screenshot || "",
        setup: initialTrade.setup || "",
        confluences: Array.isArray(initialTrade.confluences) ? initialTrade.confluences : [],
      };
    }
    return {
      trade_date: todayIso,
      symbol: "NQ",
      contracts: String(SYMBOLS.NQ.defaultContracts),
      direction: "long",
      result: "win",
      stop_loss: "10",
      take_profit: "",
      manual_pnl: "",
      note: "",
      screenshot: "",
      setup: "",
      confluences: [],
    };
  });
  const [touched, setTouched] = useState(false);
  const [newConfluenceInput, setNewConfluenceInput] = useState("");
  const firstFieldRef = React.useRef(null);

  useEffect(() => {
    if (firstFieldRef.current) firstFieldRef.current.focus();
  }, []);

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const selectSymbol = (symbol) =>
    setForm((f) => ({ ...f, symbol, contracts: isEdit ? f.contracts : String(SYMBOLS[symbol].defaultContracts) }));

  const bumpContracts = (delta) =>
    setForm((f) => {
      const next = Math.max(1, (Number(f.contracts) || 0) + delta);
      return { ...f, contracts: String(next) };
    });

  const computed = useMemo(() => computeTrade(form), [form.symbol, form.contracts, form.stop_loss, form.take_profit, form.result]);

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setForm((f) => ({ ...f, screenshot: reader.result }));
    reader.readAsDataURL(file);
  };

  const toggleConfluence = (tag) => {
    setForm((f) => {
      const has = f.confluences.includes(tag);
      return { ...f, confluences: has ? f.confluences.filter((c) => c !== tag) : [...f.confluences, tag] };
    });
  };

  const addNewConfluence = () => {
    const tag = newConfluenceInput.trim();
    if (!tag) return;
    setForm((f) => (f.confluences.includes(tag) ? f : { ...f, confluences: [...f.confluences, tag] }));
    setNewConfluenceInput("");
  };

  const handleConfluenceInputKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      addNewConfluence();
    }
  };

  const isValid =
    form.trade_date &&
    form.stop_loss !== "" &&
    form.take_profit !== "" &&
    form.contracts !== "" &&
    Number(form.contracts) > 0;

  const effectivePnl = form.manual_pnl !== ""
    ? Number(form.manual_pnl)
    : computed.pnl;

  const buildPayload = () => ({
    trade_date: form.trade_date,
    symbol: form.symbol,
    contracts: Number(form.contracts),
    direction: form.direction,
    result: form.result,
    stop_loss: Number(form.stop_loss),
    take_profit: Number(form.take_profit),
    rr: computed.rr,
    realized_rr: computed.realized_rr,
    risk_amount: computed.risk_amount,
    pnl: effectivePnl,
    note: form.note || null,
    screenshot: form.screenshot || null,
    setup: form.setup || null,
    confluences: form.confluences && form.confluences.length ? form.confluences : null,
  });

  const submit = (e) => {
    e.preventDefault();
    setTouched(true);
    if (!isValid) return;
    onSubmit(buildPayload());
  };

  // Cmd/Ctrl + Enter zum schnellen Speichern, von überall im Formular
  const handleKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      submit(e);
    }
  };

  return (
    <div className="overlay">
      <form className="panel panel-trade-form" onSubmit={submit} onKeyDown={handleKeyDown}>
        <div className="panel-head">
          <span>{isEdit ? "Trade bearbeiten" : "Neuer Trade"}</span>
          <button type="button" className="icon-btn" onClick={onClose} aria-label="Schließen">
            <Icon.Close />
          </button>
        </div>

        <div className="trade-form-columns">
          <div className="trade-form-col">
            <div className="field">
              <label>Symbol</label>
              <div className="symbol-toggle">
                {Object.entries(SYMBOLS).map(([key, cfg]) => (
                  <button
                    type="button"
                    key={key}
                    className={`symbol-btn ${form.symbol === key ? "active" : ""}`}
                    onClick={() => selectSymbol(key)}
                  >
                    <span className="sym-name">{cfg.label}</span>
                    <span className="sym-sub">{cfg.sub}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="field">
              <label>Setup</label>
              <input
                type="text"
                list="setup-suggestions"
                placeholder="z. B. Bias (leer lassen = kein Setup)"
                value={form.setup}
                onChange={set("setup")}
              />
              <datalist id="setup-suggestions">
                {existingSetups.map((s) => (
                  <option key={s} value={s} />
                ))}
              </datalist>
            </div>

            <div className="field-grid">
              <div className="field">
                <label>Datum</label>
                <input type="date" ref={firstFieldRef} value={form.trade_date} onChange={set("trade_date")} />
              </div>
              <div className="field">
                <label>Contracts</label>
                <div className="stepper">
                  <button type="button" onClick={() => bumpContracts(-1)} aria-label="Weniger">−</button>
                  <input type="number" min="1" step="1" value={form.contracts} onChange={set("contracts")} />
                  <button type="button" onClick={() => bumpContracts(1)} aria-label="Mehr">+</button>
                </div>
              </div>
            </div>

            <div className="field-grid">
              <div className="field">
                <label>Richtung</label>
                <div className="dir-toggle">
                  <button
                    type="button"
                    className={`dir-btn dir-long ${form.direction === "long" ? "active" : ""}`}
                    onClick={() => setForm((f) => ({ ...f, direction: "long" }))}
                  >
                    Long
                  </button>
                  <button
                    type="button"
                    className={`dir-btn dir-short ${form.direction === "short" ? "active" : ""}`}
                    onClick={() => setForm((f) => ({ ...f, direction: "short" }))}
                  >
                    Short
                  </button>
                </div>
              </div>
              <div className="field">
                <label>Ergebnis</label>
                <div className="dir-toggle" style={{ gridTemplateColumns: "1fr 1fr 1fr" }}>
                  <button
                    type="button"
                    className={`dir-btn res-win ${form.result === "win" ? "active" : ""}`}
                    onClick={() => setForm((f) => ({ ...f, result: "win" }))}
                  >
                    Win
                  </button>
                  <button
                    type="button"
                    className={`dir-btn res-be ${form.result === "be" ? "active" : ""}`}
                    onClick={() => setForm((f) => ({ ...f, result: "be" }))}
                  >
                    BE
                  </button>
                  <button
                    type="button"
                    className={`dir-btn res-loss ${form.result === "loss" ? "active" : ""}`}
                    onClick={() => setForm((f) => ({ ...f, result: "loss" }))}
                  >
                    Loss
                  </button>
                </div>
              </div>
            </div>

            <div className="field-grid">
              <div className="field">
                <label>Stop Loss (Punkte)</label>
                <input type="number" step="any" placeholder="z. B. 12.5" value={form.stop_loss} onChange={set("stop_loss")} />
              </div>
              <div className="field">
                <label>Take Profit (Punkte)</label>
                <input type="number" step="any" placeholder="z. B. 30" value={form.take_profit} onChange={set("take_profit")} />
              </div>
            </div>

            <div className="computed-box">
              <div className="computed-item">
                <span className="computed-label">Risk</span>
                <span className="computed-value">{computed.risk_amount !== null ? fmtMoneyShort(-computed.risk_amount) : "—"}</span>
              </div>
              <div className="computed-item">
                <span className="computed-label">RR</span>
                <span className="computed-value">{computed.rr !== null ? computed.rr.toFixed(2) : "—"}</span>
              </div>
              <div className="computed-item">
                <span className="computed-label">PnL</span>
                <span className={`computed-value ${effectivePnl !== null && effectivePnl >= 0 ? "pos" : "neg"}`}>
                  {effectivePnl !== null ? fmtMoneyShort(effectivePnl) : "—"}
                </span>
              </div>
            </div>

            <div className="field">
              <label>Finaler PnL (optional — inkl. Fees/Spread)</label>
              <input
                type="number"
                step="any"
                placeholder={computed.pnl !== null ? `${computed.pnl.toFixed(2)} (berechnet)` : "z. B. -14.5"}
                value={form.manual_pnl}
                onChange={set("manual_pnl")}
              />
              <span style={{ fontSize: "11px", color: "var(--muted-light)", marginTop: "-2px" }}>
                Leer lassen übernimmt den berechneten PnL. Trage hier den exakten Betrag ein, wenn Fees, Spread oder Slippage dazukommen.
              </span>
            </div>
          </div>

          <div className="trade-form-col">
            <div className="field">
              <label>Confluences</label>
              <div className="confluence-groups">
                {CONFLUENCE_CATEGORIES.map((cat) => (
                  <div className="confluence-group" key={cat.label}>
                    <span className="confluence-group-label">{cat.label}</span>
                    <div className="confluence-group-chips">
                      {cat.levels.map((level) => {
                        const tag = `${cat.label} ${level}`;
                        return (
                          <button
                            type="button"
                            key={tag}
                            className={`confluence-chip ${form.confluences.includes(tag) ? "active" : ""}`}
                            onClick={() => toggleConfluence(tag)}
                            title={tag}
                          >
                            {level}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
              <div className="confluence-add-row">
                <input
                  type="text"
                  placeholder="Neue Confluence, falls nicht oben vorhanden…"
                  value={newConfluenceInput}
                  onChange={(e) => setNewConfluenceInput(e.target.value)}
                  onKeyDown={handleConfluenceInputKeyDown}
                />
                <button type="button" className="confluence-add-btn" onClick={addNewConfluence}>
                  <Icon.Plus />
                </button>
              </div>
              {form.confluences.length > 0 && (
                <span style={{ fontSize: "11px", color: "var(--muted-light)" }}>
                  {form.confluences.length} ausgewählt: {form.confluences.join(", ")}
                </span>
              )}
            </div>

            <div className="field">
              <label>Notiz</label>
              <textarea placeholder="Setup, Begründung, Lessons Learned…" value={form.note} onChange={set("note")} />
            </div>

            <div className="field">
              <label>Screenshot</label>
              {form.screenshot ? (
                <div className="upload-preview">
                  <img src={form.screenshot} alt="Screenshot Vorschau" />
                  <button
                    type="button"
                    className="upload-remove"
                    onClick={() => setForm((f) => ({ ...f, screenshot: "" }))}
                    aria-label="Screenshot entfernen"
                  >
                    <Icon.Close />
                  </button>
                </div>
              ) : (
                <label className="upload-box">
                  <Icon.Upload />
                  <span>Screenshot hochladen</span>
                  <input type="file" accept="image/*" onChange={handleFile} />
                </label>
              )}
            </div>
          </div>
        </div>

        {touched && !isValid && (
          <span className="field-error">Stop Loss, Take Profit und Contracts sind erforderlich</span>
        )}

        <button type="submit" className="btn-primary btn-block" disabled={saving}>
          {saving ? "Speichert…" : isEdit ? "Änderungen speichern" : "Trade speichern"}
          {!saving && <span className="kbd-hint">⌘⏎</span>}
        </button>
      </form>
    </div>
  );
}

function DayDetailModal({ day, onClose, onDelete, onEdit }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="panel daydetail" onClick={(e) => e.stopPropagation()}>
        <div className="panel-head">
          <span>{day.iso}{day.isHistoric ? " · Eval (historisch)" : ""}</span>
          <button type="button" className="icon-btn" onClick={onClose} aria-label="Schliessen">
            <Icon.Close />
          </button>
        </div>
        {day.isHistoric && (
          <div style={{ fontSize: "11px", color: "var(--muted)", background: "var(--panel-2)", border: "1px solid var(--line)", borderRadius: "4px", padding: "8px 12px", lineHeight: "1.5" }}>
            Eval-Tag — Trades sind sichtbar, zaehlen aber nicht mehr zur Funded-Stage-Balance.
          </div>
        )}
        <div className="daydetail-summary">
          <span className={day.pnl >= 0 ? "pos" : "neg"} style={day.isHistoric ? { opacity: 0.5, textDecoration: "line-through" } : {}}>
            {fmtMoney(day.pnl)}
          </span>
          <span className="muted">{day.trades.length} Trade{day.trades.length > 1 ? "s" : ""}</span>
        </div>
        <div className="trade-list">
          {day.trades.map((t) => (
            <TradeRow key={t.id} trade={t} onDelete={onDelete} onEdit={onEdit} />
          ))}
        </div>
      </div>
    </div>
  );
}

function TradeRow({ trade, onDelete, onEdit }) {
  const [confirming, setConfirming] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [showShot, setShowShot] = useState(false);

  const handleDelete = async () => {
    setDeleting(true);
    await onDelete(trade.id);
    setDeleting(false);
  };

  if (confirming) {
    return (
      <div className="trade-row trade-row-confirm">
        <span className="trade-meta">Trade wirklich löschen?</span>
        <button type="button" className="confirm-btn confirm-no" onClick={() => setConfirming(false)} disabled={deleting}>
          Abbrechen
        </button>
        <button type="button" className="confirm-btn confirm-yes" onClick={handleDelete} disabled={deleting}>
          {deleting ? "Löscht…" : "Löschen"}
        </button>
      </div>
    );
  }

  return (
    <React.Fragment>
      <div className="trade-row">
        <span className={`dir-tag ${trade.direction === "long" ? "dir-long" : "dir-short"}`}>
          {trade.direction === "long" ? "Long" : "Short"}
        </span>
        <span className="trade-meta">
          {trade.symbol ?? ""} {trade.contracts ? `x${trade.contracts}` : ""} · SL {trade.stop_loss ?? "—"} · TP {trade.take_profit ?? "—"} · RR {trade.rr ? Number(trade.rr).toFixed(2) : "—"}{trade.setup ? ` · ${trade.setup}` : ""}
        </span>
        {trade.screenshot && (
          <button type="button" className="trade-shot-btn" onClick={() => setShowShot(true)}>
            <Icon.Image /> Foto
          </button>
        )}
        <span className={`trade-pnl ${Number(trade.pnl) >= 0 ? "pos" : "neg"}`}>{fmtMoneyShort(Number(trade.pnl))}</span>
        <div className="trade-row-actions">
          <button type="button" className="icon-btn" onClick={() => onEdit(trade)} aria-label="Trade bearbeiten">
            <Icon.Edit />
          </button>
          <button type="button" className="icon-btn delete-btn" onClick={() => setConfirming(true)} aria-label="Trade löschen">
            <Icon.Trash />
          </button>
        </div>
        {Array.isArray(trade.confluences) && trade.confluences.length > 0 && (
          <div className="confluence-tags">
            {trade.confluences.map((c) => (
              <span key={c} className="confluence-chip-sm">{c}</span>
            ))}
          </div>
        )}
        {trade.note && <div className="trade-note">{trade.note}</div>}
      </div>
      {showShot && (
        <div className="overlay" onClick={() => setShowShot(false)}>
          <div className="panel" onClick={(e) => e.stopPropagation()} style={{ width: "auto" }}>
            <div className="panel-head">
              <span>Screenshot</span>
              <button type="button" className="icon-btn" onClick={() => setShowShot(false)} aria-label="Schließen">
                <Icon.Close />
              </button>
            </div>
            <img className="shot-overlay-img" src={trade.screenshot} alt="Trade Screenshot" />
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function ForwardTestPanel({ onClose, trades, existingConfluences, realizedRRForTrade, realizedPointsForTrade }) {
  const [selected, setSelected] = useState([]);

  const toggle = (tag) => {
    setSelected((s) => (s.includes(tag) ? s.filter((t) => t !== tag) : [...s, tag]));
  };

  // Alt-Tags aus der Historie, die zu keiner der festen Kategorien gehören (z. B.
  // frei eingetippte Confluences von vor der xN-Struktur) — werden als eigene
  // "Weitere"-Zeile unterhalb der Kategorien angezeigt.
  const categoryTagSet = useMemo(
    () => new Set(CONFLUENCE_CATEGORIES.flatMap((cat) => cat.levels.map((level) => `${cat.label} ${level}`))),
    []
  );
  const extraTags = useMemo(
    () => existingConfluences.filter((c) => !categoryTagSet.has(c)),
    [existingConfluences, categoryTagSet]
  );

  // Fuer jeden Trade: wie viele der ausgewaehlten Confluences sind vorhanden?
  // Danach nach Match-Anzahl gruppiert ("mindestens N von M getroffen"), damit
  // man sieht wie sich Winrate/Punkte verhalten, je naeher ein geplanter Trade
  // an eine vollstaendige Uebereinstimmung mit der Historie kommt.
  const result = useMemo(() => {
    if (selected.length === 0) return null;
    const scored = trades
      .map((t) => {
        const tags = Array.isArray(t.confluences) ? t.confluences : [];
        const matchCount = selected.filter((s) => tags.includes(s)).length;
        return { t, matchCount };
      })
      .filter((x) => x.matchCount > 0);

    const buildStats = (subset) => {
      const wins = subset.filter((t) => t.result === "win").length;
      const losses = subset.filter((t) => t.result === "loss").length;
      const bes = subset.filter((t) => t.result === "be").length;
      const decided = wins + losses;
      const rrVals = subset.map(realizedRRForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      const ptsVals = subset.map(realizedPointsForTrade).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      return {
        count: subset.length,
        wins, losses, bes,
        winrate: decided ? (wins / decided) * 100 : 0,
        avgRR: rrVals.length ? rrVals.reduce((s, v) => s + v, 0) / rrVals.length : 0,
        avgPoints: ptsVals.length ? ptsVals.reduce((s, v) => s + v, 0) / ptsVals.length : 0,
      };
    };

    const byThreshold = [];
    for (let n = selected.length; n >= 1; n--) {
      const subset = scored.filter((x) => x.matchCount >= n).map((x) => x.t);
      if (!subset.length) continue;
      byThreshold.push({ minMatch: n, ...buildStats(subset) });
    }

    const exact = scored.filter((x) => x.matchCount === selected.length).map((x) => x.t);

    return {
      totalSelected: selected.length,
      matchedTradeCount: scored.length,
      byThreshold,
      exactStats: buildStats(exact),
    };
  }, [selected, trades, realizedRRForTrade, realizedPointsForTrade]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="panel ft-panel" onClick={(e) => e.stopPropagation()}>
        <div className="panel-head">
          <span>Forward Test</span>
          <button type="button" className="icon-btn" onClick={onClose} aria-label="Schließen">
            <Icon.Close />
          </button>
        </div>

        <div className="notice">
          Wähle die Confluences, die dein geplanter Trade erfüllt. Das System berechnet aus deiner Trade-Historie, wie sich Setups mit den gleichen (oder teilweise gleichen) Confluences bisher geschlagen haben.
        </div>

        <div>
          <div className="ft-section-title">Confluences für diesen Trade</div>
          <div className="confluence-groups">
            {CONFLUENCE_CATEGORIES.map((cat) => (
              <div className="confluence-group" key={cat.label}>
                <span className="confluence-group-label">{cat.label}</span>
                <div className="confluence-group-chips">
                  {cat.levels.map((level) => {
                    const tag = `${cat.label} ${level}`;
                    return (
                      <button
                        type="button"
                        key={tag}
                        className={`confluence-chip ${selected.includes(tag) ? "active" : ""}`}
                        onClick={() => toggle(tag)}
                        title={tag}
                      >
                        {level}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
            {extraTags.length > 0 && (
              <div className="confluence-group">
                <span className="confluence-group-label">Weitere</span>
                <div className="confluence-group-chips">
                  {extraTags.map((tag) => (
                    <button
                      type="button"
                      key={tag}
                      className={`confluence-chip ${selected.includes(tag) ? "active" : ""}`}
                      onClick={() => toggle(tag)}
                    >
                      {tag}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>

        {result && (
          <React.Fragment>
            <div className="ft-section-divider" />
            <div className="ft-results">
              <div className="ft-section-title">Ergebnis bei exakter Übereinstimmung</div>
              <div className="computed-box" style={{ gridTemplateColumns: "1fr 1fr 1fr 1fr" }}>
                <div className="computed-item">
                  <span className="computed-label">Exakte Treffer</span>
                  <span className="computed-value">{result.exactStats.count}</span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">Winrate</span>
                  <span className={`computed-value ${result.exactStats.winrate >= 50 ? "pos" : "neg"}`}>
                    {result.exactStats.count ? `${result.exactStats.winrate.toFixed(0)}%` : "—"}
                  </span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">Ø RR</span>
                  <span className="computed-value">{result.exactStats.count ? `${result.exactStats.avgRR.toFixed(2)}R` : "—"}</span>
                </div>
                <div className="computed-item">
                  <span className="computed-label">Ø Punkte</span>
                  <span className={`computed-value ${result.exactStats.avgPoints >= 0 ? "pos" : "neg"}`}>
                    {result.exactStats.count ? `${result.exactStats.avgPoints >= 0 ? "+" : ""}${result.exactStats.avgPoints.toFixed(1)}` : "—"}
                  </span>
                </div>
              </div>

              <div className="ft-section-title" style={{ marginTop: "14px" }}>
                Nach Match-Anzahl (mindestens N von {result.totalSelected} Confluences)
              </div>
              <div className="trade-list">
                {result.byThreshold.map((row) => (
                  <div className="breakdown-row" key={row.minMatch} style={{ gap: "10px" }}>
                    <span className="breakdown-label" style={{ width: "70px" }}>≥ {row.minMatch}/{result.totalSelected}</span>
                    <div className="breakdown-bar-track">
                      <div
                        className={`breakdown-bar-fill ${row.winrate < 50 ? "neg" : ""}`}
                        style={{ width: `${Math.min(100, row.winrate)}%` }}
                      />
                    </div>
                    <span className={`breakdown-value ${row.winrate >= 50 ? "pos" : "neg"}`} style={{ width: "56px" }}>{row.winrate.toFixed(0)}%</span>
                    <span className="breakdown-value" style={{ width: "66px" }}>{row.avgRR.toFixed(2)}R</span>
                    <span className="breakdown-value" style={{ width: "78px" }}>{row.avgPoints >= 0 ? "+" : ""}{row.avgPoints.toFixed(1)} Pkt</span>
                    <span className="breakdown-count">{row.count}x</span>
                  </div>
                ))}
              </div>
              <span style={{ fontSize: "11px", color: "var(--muted-light)" }}>
                {result.matchedTradeCount} Trade{result.matchedTradeCount === 1 ? "" : "s"} in der Historie mit mindestens 1 Übereinstimmung.
                {result.exactStats.count > 0 && result.exactStats.count < 10 ? " Achtung: kleine Stichprobe, Ergebnis mit Vorsicht interpretieren." : ""}
              </span>
            </div>
          </React.Fragment>
        )}

        {!result && (
          <span className="insight-sub">Wähle mindestens eine Confluence aus, um die Auswertung zu sehen.</span>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TradingJournal />);
</script>
