<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trading Journal</title>
<link rel="icon" type="image/x-icon" href="sharingan.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --bg: #000000;
    --panel: #0d0d0d;
    --panel-2: #141414;
    --line: #222222;
    --text: #ffffff;
    --muted: #555555;
    --muted-light: #888888;
    --green: #ffffff;
    --red: #e0001a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    min-height: 100vh;
  }
  #root { min-height: 100vh; }

  .journal-shell { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; padding: 36px; font-size: 1.05em; }

  /* ── Topbar ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); }
  .brand-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.22em; font-size: 13px; color: var(--muted-light); text-transform: uppercase; }

  /* ── Buttons ── */
  .btn-primary {
    display: flex; align-items: center; gap: 8px;
    background: var(--red); color: #fff;
    border: none; border-radius: 6px;
    padding: 12px 20px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity .15s ease, transform .1s ease;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-block { width: 100%; justify-content: center; margin-top: 8px; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Notice ── */
  .notice {
    background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--muted);
    border-radius: 4px; padding: 14px 18px; font-size: 13px; color: var(--muted-light); line-height: 1.6;
  }
  .notice-error { border-left-color: var(--red); color: #ff6b78; }

  /* ── Hero ── */
  .hero {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 32px 34px; display: flex; align-items: center; justify-content: space-between; gap: 28px;
    flex-wrap: wrap;
  }
  .hero-balance { display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
  .hero-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; }
  .hero-value { font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .hero-delta { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .hero-delta.pos { color: var(--text); }
  .hero-delta.neg { color: var(--red); }
  .hero-curve { flex: 1; min-width: 280px; max-width: 700px; }
  .equity-svg { width: 100%; height: 130px; display: block; }

  /* ── Stat Row ── */
  .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; }

  /* ── Calendar ── */
  .cal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 26px 28px 18px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .cal-title { font-size: 20px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; letter-spacing: -0.01em; }
  .cal-year { color: var(--muted); font-weight: 400; font-size: 16px; }
  .cal-nav { display: flex; align-items: center; gap: 12px; }
  .cal-month-pnl { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted-light); }
  .cal-month-pnl.pos { color: var(--text); }
  .cal-month-pnl.neg { color: var(--red); }
  .cal-navbtn {
    background: transparent; border: 1px solid var(--line); color: var(--muted-light);
    border-radius: 4px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .cal-navbtn:hover { border-color: var(--muted-light); color: var(--text); }

  .cal-grid-header { display: grid; grid-template-columns: repeat(7, 1fr) 130px; gap: 6px; margin-bottom: 6px; }
  .cal-dow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; text-align: center; padding-bottom: 8px; }
  .cal-dow-week { text-align: left; padding-left: 4px; }

  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr) 130px; gap: 6px; margin-bottom: 6px; }
  .cal-cell {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    min-height: 80px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px;
    text-align: left; cursor: default; font-family: inherit; color: var(--text);
  }
  .cal-cell-empty { background: transparent; border: none; }
  .cal-daynum { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .cal-pnl { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; margin-top: auto; }
  .cal-count { font-size: 11px; color: var(--muted); }
  .cal-win { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.03); }
  .cal-win .cal-pnl { color: var(--text); }
  .cal-loss { border-color: rgba(224,0,26,0.4); background: rgba(224,0,26,0.06); }
  .cal-loss .cal-pnl { color: var(--red); }
  .cal-cell:not(.cal-cell-empty):not(:disabled) { cursor: pointer; transition: border-color .1s ease; }
  .cal-cell:not(.cal-cell-empty):not(:disabled):hover { border-color: var(--muted-light); }
  .cal-today { box-shadow: 0 0 0 1px var(--red) inset; }
  .cal-cell-historic { opacity: 0.38; }
  .cal-cell-historic .cal-pnl { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.3); }
  .cal-historic-badge { font-size: 9px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 1px; }

  .cal-weeksum { background: transparent; border: 1px solid var(--line); border-style: dashed; justify-content: center; gap: 3px; }
  .cal-weeknum { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }
  .cal-weekpnl { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
  .cal-weekpnl.pos { color: var(--text); }
  .cal-weekpnl.neg { color: var(--red); }
  .cal-weekcount { font-size: 11px; color: var(--muted); }

  .cal-loading { padding: 30px 0; text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }

  /* ── Filter Bar ── */
  .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
  .filter-chip {
    background: transparent; border: none; color: var(--muted-light); border-radius: 3px;
    padding: 7px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all .12s ease;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
  }
  .filter-chip:hover { color: var(--text); }
  .filter-chip.active { background: var(--line); color: var(--text); }
  .filter-chip.active.win-chip { background: rgba(255,255,255,0.1); }
  .filter-chip.active.loss-chip { background: rgba(224,0,26,0.18); color: var(--red); }
  .filter-chip.active.be-chip { background: rgba(255,176,0,0.15); color: #ffb000; }
  .filter-clear {
    background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px;
    padding: 7px 11px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em; text-transform: uppercase; transition: all .12s ease;
  }
  .filter-clear:hover { color: var(--text); border-color: var(--muted-light); }
  .filter-spacer { flex: 1; }
  .filter-count { font-size: 11.5px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  /* ── Insights Grid ── */
  .insights-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px; }
  .insights-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 16px; }
  .insights-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 720px) { .insights-grid { grid-template-columns: repeat(2, 1fr); } }
  .insight-item { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
  .insight-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .insight-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
  .insight-value.pos { color: var(--text); }
  .insight-value.neg { color: var(--red); }
  .insight-sub { font-size: 11px; color: var(--muted-light); }

  .breakdown-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-label { width: 56px; flex-shrink: 0; font-size: 12.5px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--muted-light); }
  .breakdown-bar-track { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; border-radius: 3px; background: var(--text); }
  .breakdown-bar-fill.neg { background: var(--red); }
  .breakdown-value { width: 84px; flex-shrink: 0; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; }
  .breakdown-value.pos { color: var(--text); }
  .breakdown-value.neg { color: var(--red); }
  .breakdown-count { width: 50px; flex-shrink: 0; text-align: right; font-size: 11px; color: var(--muted); }
  .insights-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 18px; }
  @media (max-width: 720px) { .insights-cols { grid-template-columns: 1fr; } }
  .insights-col-title { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }

  /* ── Toast ── */
  .toast-stack { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
  .toast {
    background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--text);
    border-radius: 4px; padding: 12px 18px; font-size: 13px; color: var(--text);
    box-shadow: 0 12px 32px rgba(0,0,0,0.6); animation: toast-in .18s ease; min-width: 200px;
  }
  .toast.toast-error { border-left-color: var(--red); color: #ff6b78; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Edit mode tweaks ── */
  .panel-head-actions { display: flex; align-items: center; gap: 14px; }
  .edit-trade-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted-light); border-radius: 4px;
    padding: 5px 11px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; transition: all .12s ease;
  }
  .edit-trade-btn:hover { border-color: var(--muted-light); color: var(--text); }
  .trade-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ── kbd hint ── */
  .kbd-hint { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; margin-left: 8px; font-family: 'JetBrains Mono', monospace; }
  .btn-primary .kbd-hint { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.3); }

  /* ── Risk Bars (Drawdown / Target) ── */
  .risk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .risk-row { grid-template-columns: 1fr; } }
  .risk-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .risk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .risk-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  .risk-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .risk-value.pos { color: var(--text); }
  .risk-value.neg { color: var(--red); }
  .risk-value.warn { color: #ffb020; }
  .risk-track { height: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; position: relative; }
  .risk-fill { height: 100%; border-radius: 5px; transition: width .3s ease; }
  .risk-fill.dd { background: var(--red); }
  .risk-fill.target { background: var(--text); }
  .risk-fill.target.passed { background: #2ecc71; }
  .risk-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-light); }
  .risk-marker { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.35); }

  /* ── Eval toggle button ── */
  .btn-secondary {
    display: flex; align-items: center; gap: 8px;
    background: transparent; color: var(--muted-light);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 18px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s ease;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .btn-secondary:hover { border-color: var(--muted-light); color: var(--text); }
  .btn-secondary.active { background: rgba(46,204,113,0.12); border-color: #2ecc71; color: #2ecc71; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }

  /* ── Payout mode ── */
  .payout-banner {
    background: rgba(46,204,113,0.07); border: 1px solid rgba(46,204,113,0.3); border-left: 2px solid #2ecc71;
    border-radius: 4px; padding: 12px 18px; font-size: 12.5px; color: #6fdb9a; line-height: 1.6;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .funded-banner {
    background: rgba(46,204,113,0.05); border: 1px solid rgba(46,204,113,0.25); border-left: 2px solid #2ecc71;
    border-radius: 4px; padding: 12px 18px; font-size: 12.5px; color: #6fdb9a; line-height: 1.6;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .funded-banner-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px rgba(46,204,113,0.7); flex-shrink: 0; }
  .payout-banner-clear {
    background: none; border: 1px solid var(--line); color: var(--muted-light); border-radius: 4px;
    padding: 6px 12px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0;
  }
  .payout-banner-clear:hover { border-color: var(--muted-light); color: var(--text); background: var(--panel-2); }
  .payout-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 720px) { .payout-grid { grid-template-columns: 1fr; } }
  .payout-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .payout-card-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 8px; }
  .payout-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .payout-status-dot.ok { background: #2ecc71; box-shadow: 0 0 8px rgba(46,204,113,0.6); }
  .payout-status-dot.fail { background: var(--red); box-shadow: 0 0 8px rgba(224,0,26,0.5); }
  .payout-main { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
  .payout-sub { font-size: 11.5px; color: var(--muted-light); line-height: 1.5; }
  .payout-days { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .payout-day-pip { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); }
  .payout-day-pip.hit { background: rgba(46,204,113,0.15); border-color: #2ecc71; color: #2ecc71; }

  /* ── Overlay & Panel ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82); backdrop-filter: blur(4px);
    display: flex; justify-content: center; align-items: center; z-index: 50; padding: 24px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.8);
    width: 460px; max-width: 92vw; max-height: 88vh; padding: 28px; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 18px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-light); }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: flex; }
  .icon-btn:hover { color: var(--text); }

  /* ── Trade-Formular: breiteres 2-Spalten-Layout statt schmaler Scroll-Box ── */
  .panel-trade-form { width: 800px; max-width: 95vw; }
  .trade-form-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
  .trade-form-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  @media (max-width: 780px) {
    .trade-form-columns { grid-template-columns: 1fr; gap: 18px; }
  }

  /* ── Form fields ── */
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .field input {
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; color: var(--text); font-size: 15px; font-family: 'JetBrains Mono', monospace;
    outline: none; transition: border-color .15s ease; width: 100%; min-width: 0;
  }
  .field input:focus { border-color: var(--red); }
  .field-error { font-size: 12px; color: var(--red); }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
  .field-grid .field { min-width: 0; }

  /* ── Direction Toggle ── */
  .dir-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dir-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 4px; padding: 13px; font-weight: 700; font-size: 13px; cursor: pointer;
    transition: all .15s ease; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .dir-btn.dir-long.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); color: var(--text); }
  .dir-btn.dir-short.active { background: rgba(224,0,26,0.1); border-color: var(--red); color: var(--red); }
  .dir-btn.res-win.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); color: var(--text); }
  .dir-btn.res-loss.active { background: rgba(224,0,26,0.1); border-color: var(--red); color: var(--red); }
  .dir-btn.res-be.active { background: rgba(255,176,0,0.12); border-color: #ffb000; color: #ffb000; }

  /* ── Symbol Toggle ── */
  .symbol-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .symbol-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 4px; padding: 13px 10px; cursor: pointer;
    transition: all .15s ease; font-family: 'JetBrains Mono', monospace;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .symbol-btn .sym-name { font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
  .symbol-btn .sym-sub { font-size: 10.5px; color: var(--muted); letter-spacing: 0.03em; }
  .symbol-btn.active { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); color: var(--text); }
  .symbol-btn.active .sym-sub { color: var(--muted-light); }

  /* ── Stepper (contracts) ── */
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); width: 100%; min-width: 0; }
  .stepper button {
    background: var(--panel-2); border: none; color: var(--muted-light); width: 40px; flex-shrink: 0; cursor: pointer;

const SYMBOLS = {
  NQ: { label: "NQ", sub: "20$ / Punkt / Contract", perPoint: 20, defaultContracts: 1 },
  MNQ: { label: "MNQ", sub: "2$ / Punkt / Contract", perPoint: 2, defaultContracts: 5 },
};

function computeTrade({ symbol, contracts, stop_loss, take_profit, result }) {
  const cfg = SYMBOLS[symbol] || SYMBOLS.NQ;
  const c = Number(contracts) || 0;
  const sl = stop_loss === "" || stop_loss === null ? null : Number(stop_loss);
  const tp = take_profit === "" || take_profit === null ? null : Number(take_profit);

  const risk_amount = sl !== null ? Math.abs(sl) * cfg.perPoint * c : null;
  const reward_amount = tp !== null ? Math.abs(tp) * cfg.perPoint * c : null;
  const rr = risk_amount && reward_amount ? reward_amount / risk_amount : null;

  let pnl = null;
  if (result === "win" && reward_amount !== null) pnl = reward_amount;
  if (result === "loss" && risk_amount !== null) pnl = -risk_amount;
  if (result === "be") pnl = 0;

  // realized_rr: Der TATSÄCHLICH erzielte RR-Wert für die Statistik.
  // Win  -> geplantes RR (reward/risk), wie gewohnt
  // Loss -> immer exakt -1, unabhängig davon wie groß das geplante RR war
  //         (ein Trade, der für 30RR geplant war aber in den SL läuft, zählt als -1RR, nicht -30RR)
  let realized_rr = null;
  if (result === "win") realized_rr = rr;
  else if (result === "loss") realized_rr = rr !== null ? -1 : null;
  else if (result === "be") realized_rr = 0;

  return { risk_amount, reward_amount, rr, realized_rr, pnl };
}

function startOfMonth(year, month) {

function mondayIndex(date) {

function isoDate(year, month, day) {
  const m = String(month + 1).padStart(2, "0");
  const d = String(day).padStart(2, "0");
  return `${year}-${m}-${d}`;
}
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const week =
    1 +
    Math.round(
      ((d.getTime() - firstThursday.getTime()) / 86400000 -
        3 +
        ((firstThursday.getUTCDay() + 6) % 7)) /
        7
    );
  return week;
}

function useToasts() {

    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);
  return { toasts, push };
}

  const evalPassedDate = fundedStartDate;

  const activateFundedStage = useCallback(() => {
    const d = new Date().toISOString().slice(0, 10);
    const dt = new Date().toISOString();
    try {
      localStorage.setItem("journal_funded_stage", "1");
      localStorage.setItem("journal_funded_start_date", d);
      localStorage.setItem("journal_funded_activated_at", dt);
    } catch {}
    setFundedStage(true);
    setFundedStartDate(d);
    setFundedActivatedAt(dt);
    pushToast("Funded Stage aktiviert — Account startet neu auf $50.000");
  }, [pushToast]);

  // Pausiert die Funded Stage OHNE das urspruengliche Start-/Aktivierungsdatum zu
  // loeschen — so bleibt ein spaeteres "Zurueck zur Funded Stage" (reactivateFundedStage)
  // exakt und der Kalender wird durch ein versehentliches Umschalten nicht verfaelscht.
  const resetToEvalStage = useCallback(() => {
    try {
      localStorage.setItem("journal_funded_stage", "0");
    } catch {}
    setFundedStage(false);
    pushToast("Zurueck zur Eval Stage");
  }, [pushToast]);

  // Aktiviert die Funded Stage erneut MIT dem bereits gespeicherten Start-/
  // Aktivierungsdatum (kein neuer Zeitstempel) — dafuer muss kein neuer Trade
  // eingetragen werden und der Kalender bleibt akkurat.
  const reactivateFundedStage = useCallback(() => {
    try {
      localStorage.setItem("journal_funded_stage", "1");
    } catch {}
    setFundedStage(true);
    pushToast("Funded Stage wieder aktiv");
  }, [pushToast]);

  // Einmalige Wiederherstellung fuer den Fall, dass Start-/Aktivierungsdatum bereits
  // verloren gegangen sind (z. B. durch eine alte Version dieses Buttons). Nimmt ein
  // vom Nutzer eingetragenes Datum/Uhrzeit entgegen und setzt Funded Stage darauf.
  const restoreFundedStage = useCallback((dateTimeLocal) => {
    if (!dateTimeLocal) return;
    const dt = new Date(dateTimeLocal).toISOString();
    const d = dt.slice(0, 10);
    try {
      localStorage.setItem("journal_funded_stage", "1");
      localStorage.setItem("journal_funded_start_date", d);
      localStorage.setItem("journal_funded_activated_at", dt);
    } catch {}
    setFundedStage(true);
    setFundedStartDate(d);
    setFundedActivatedAt(dt);
    pushToast("Funded Stage wiederhergestellt");
  }, [pushToast]);

  const filteredTrades = useMemo(() => {
    return trades.filter((t) => {
      if (filterSymbol !== "all" && t.symbol !== filterSymbol) return false;
      if (filterResult !== "all" && t.result !== filterResult) return false;
      return true;
    });
  }, [trades, filterSymbol, filterResult]);

  const hasActiveFilters = filterSymbol !== "all" || filterResult !== "all";

  // Bereits verwendete Setup-Namen (für Autovervollständigung im Formular)
  const existingSetups = useMemo(() => {
    const set = new Set();
    trades.forEach((t) => { if (t.setup) set.add(t.setup); });
    return Array.from(set).sort();
  }, [trades]);

  // Bereits verwendete Confluence-Tags (für Mehrfachauswahl im Formular & Forward Test)
  const existingConfluences = useMemo(() => {
    const set = new Set();
    trades.forEach((t) => {
      (Array.isArray(t.confluences) ? t.confluences : []).forEach((c) => set.add(c));
    });
    return Array.from(set).sort();
  }, [trades]);

  // Confluence-Vorschläge im Formular: die vordefinierten Fib-/Zonen-Tags zuerst,
  // danach zusätzlich alle bereits manuell vergebenen Tags aus der Historie.
  const confluenceOptions = useMemo(() => {
    const combined = [...DEFAULT_CONFLUENCES];
    existingConfluences.forEach((c) => { if (!combined.includes(c)) combined.push(c); });
    return combined;
  }, [existingConfluences]);


  // Realisierter RR-Wert eines Trades (Win = geplantes RR, Loss = immer -1, BE = 0)
  const realizedRRForTrade = useCallback((t) => {
    if (t.result === "be") return 0;
    if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
    if (t.result === "loss") return t.rr !== null && t.rr !== undefined ? -1 : null;
    if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
    return null;
  }, []);

  // Realisierte Punkte eines Trades (Win = TP-Punkte, Loss = -SL-Punkte, BE = 0)
  const realizedPointsForTrade = useCallback((t) => {
    if (t.result === "win") return t.take_profit !== null && t.take_profit !== undefined ? Number(t.take_profit) : null;
    if (t.result === "loss") return t.stop_loss !== null && t.stop_loss !== undefined ? -Math.abs(Number(t.stop_loss)) : null;
    if (t.result === "be") return 0;
    return null;
  }, []);

  // ── Confluence-Auswertung ──
  // Über die GESAMTE Historie (nicht nur Funded-Stage), damit die statistische
  // Basis für die Strategie-Validierung möglichst groß bleibt. Respektiert aber
  // die Symbol-/Ergebnis-Filter aus der Filterleiste.
  const confluenceStats = useMemo(() => {
    const map = new Map();
    filteredTrades.forEach((t) => {
      const tags = Array.isArray(t.confluences) ? t.confluences : [];
      tags.forEach((tag) => {
        if (!map.has(tag)) {
          map.set(tag, { tag, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0, ptsSum: 0, ptsCount: 0, pnlSum: 0 });
        }
        const e = map.get(tag);
        e.count += 1;
        e.pnlSum += Number(t.pnl || 0);
        if (t.result === "win") e.wins += 1;
        else if (t.result === "loss") e.losses += 1;
        else if (t.result === "be") e.bes += 1;
        const rr = realizedRRForTrade(t);
        if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
        const pts = realizedPointsForTrade(t);
        if (pts !== null && !Number.isNaN(pts)) { e.ptsSum += pts; e.ptsCount += 1; }
      });
    });
    return Array.from(map.values())
      .map((e) => {
        const decided = e.wins + e.losses;
        return {
          ...e,
          winrate: decided ? (e.wins / decided) * 100 : 0,
          avgRR: e.rrCount ? e.rrSum / e.rrCount : 0,
          avgPoints: e.ptsCount ? e.ptsSum / e.ptsCount : 0,
        };
      })
      .sort((a, b) => b.count - a.count);
  }, [filteredTrades, realizedRRForTrade, realizedPointsForTrade]);
  const maxConfluenceCount = Math.max(1, ...confluenceStats.map((c) => c.count));

  // ── Setup-Auswertung ──
  // Analog zur Confluence-Analyse, aber nach dem (einzelnen) Setup-Feld gruppiert.
  // Respektiert ebenfalls die Symbol-/Ergebnis-Filter aus der Filterleiste.
  const setupStats = useMemo(() => {
    const map = new Map();
    filteredTrades.forEach((t) => {
      if (!t.setup) return;
      if (!map.has(t.setup)) {
        map.set(t.setup, { setup: t.setup, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0, pnlSum: 0 });
      }
      const e = map.get(t.setup);
      e.count += 1;
      e.pnlSum += Number(t.pnl || 0);
      if (t.result === "win") e.wins += 1;
      else if (t.result === "loss") e.losses += 1;
      else if (t.result === "be") e.bes += 1;
      const rr = realizedRRForTrade(t);
      if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
    });
    return Array.from(map.values())
      .map((e) => {
        const decided = e.wins + e.losses;
        return { ...e, winrate: decided ? (e.wins / decided) * 100 : 0, avgRR: e.rrCount ? e.rrSum / e.rrCount : 0 };
      })
      .sort((a, b) => b.count - a.count);
  }, [filteredTrades, realizedRRForTrade]);
  const maxSetupCount = Math.max(1, ...setupStats.map((s) => s.count));

  // ── Top Confluence-Kombinationen ──
  // Berechnet für jede 2er- und 3er-Kombination von Confluences, die in mindestens
  // MIN_COMBO_SAMPLE Trades gemeinsam vorkamen, Winrate und Ø RR — auf Basis der
  // KOMPLETTEN Historie (nicht gefiltert), damit z. B. ein blind genommener Einzel-Trigger
  // (nur 1 von mehreren Confluences) das Ranking der vollständigen Kombination nicht verwässert.
  const comboStats = useMemo(() => {
    const map = new Map();
    trades.forEach((t) => {
      const tags = Array.isArray(t.confluences) ? Array.from(new Set(t.confluences)).sort() : [];
      if (tags.length < 2) return;
      const combos = [];
      for (let i = 0; i < tags.length; i++) {
        for (let j = i + 1; j < tags.length; j++) {
          combos.push([tags[i], tags[j]]);
          for (let k = j + 1; k < tags.length; k++) {
            combos.push([tags[i], tags[j], tags[k]]);
          }
        }
      }
      combos.forEach((combo) => {
        const key = combo.join(" + ");
        if (!map.has(key)) {
          map.set(key, { key, size: combo.length, count: 0, wins: 0, losses: 0, bes: 0, rrSum: 0, rrCount: 0 });
        }
        const e = map.get(key);
        e.count += 1;
        if (t.result === "win") e.wins += 1;
        else if (t.result === "loss") e.losses += 1;
        else if (t.result === "be") e.bes += 1;
        const rr = realizedRRForTrade(t);
        if (rr !== null && !Number.isNaN(rr)) { e.rrSum += rr; e.rrCount += 1; }
      });
    });
    return Array.from(map.values())
      .filter((e) => e.count >= MIN_COMBO_SAMPLE)
      .map((e) => {
        const decided = e.wins + e.losses;
        return { ...e, winrate: decided ? (e.wins / decided) * 100 : 0, avgRR: e.rrCount ? e.rrSum / e.rrCount : 0 };
      })
      .sort((a, b) => b.winrate - a.winrate || b.avgRR - a.avgRR)
      .slice(0, 8);
  }, [trades, realizedRRForTrade]);

  const dayDetailData = useMemo(() => {
    if (!dayDetail) return null;
    const dayTrades = filteredTrades.filter((t) => t.trade_date === dayDetail);
    const pnl = dayTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const isHistoric = fundedStage && fundedActivatedAt
      ? dayTrades.length > 0 && dayTrades.every((t) => !t.created_at || t.created_at < fundedActivatedAt)
      : false;
    return { iso: dayDetail, trades: dayTrades, pnl, isHistoric };
  }, [dayDetail, filteredTrades, fundedStage, fundedActivatedAt]);

  const loadTrades = useCallback(async () => {
    if (!isConfigured) {
      setLoading(false);
      return;
    }
    setError(null);
    try {
      const res = await fetch(`${REST_URL}?select=*&order=trade_date.asc`, {
        headers: sbHeaders,
      });
      if (!res.ok) throw new Error(`Supabase Fehler ${res.status}`);
      const data = await res.json();
      setTrades(data);
    } catch (e) {
      setError(e.message || "Verbindung zu Supabase fehlgeschlagen");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    loadTrades();
  }, [loadTrades]);

  const stats = useMemo(() => {
    const sorted = [...filteredTrades].sort(
      (a, b) => new Date(a.trade_date) - new Date(b.trade_date) || a.id - b.id
    );

    // In der Funded Stage zaehlen nur Trades die NACH dem Aktivierungs-Zeitpunkt
    // gespeichert wurden. So werden Eval-Trades vom selben Tag korrekt ausgeschlossen.
    const fundedTrades = fundedStage && fundedActivatedAt
      ? sorted.filter((t) => t.created_at && t.created_at >= fundedActivatedAt)
      : sorted;
    const evalHistoricTrades = fundedStage && fundedActivatedAt
      ? sorted.filter((t) => !t.created_at || t.created_at < fundedActivatedAt)
      : [];

    // Alte-Strategie-Cutoff: fuer die Performance-Stats zaehlen nur Trades ab
    // STATS_CUTOFF_DATE. totalPnl/balance bleiben unten bewusst auf Basis ALLER
    // fundedTrades, damit sie (falls je referenziert) konsistent zum echten Konto bleiben.
    const statsTrades = fundedTrades.filter((t) => t.trade_date >= STATS_CUTOFF_DATE);

    const totalPnl = fundedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const balance = STARTING_BALANCE + totalPnl;

    const wins = statsTrades.filter((t) => t.result === "win" || (t.result !== "loss" && t.result !== "be" && Number(t.pnl) > 0));
    const losses = statsTrades.filter((t) => t.result === "loss" || (t.result !== "win" && t.result !== "be" && Number(t.pnl) < 0));
    const bes = statsTrades.filter((t) => t.result === "be");
    const decidedTrades = statsTrades.filter((t) => t.result !== "be");
    const winrate = decidedTrades.length ? (wins.length / decidedTrades.length) * 100 : 0;

    const grossProfit = wins.reduce((s, t) => s + Number(t.pnl), 0);
    const grossLoss = Math.abs(losses.reduce((s, t) => s + Number(t.pnl), 0));
    const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;

    // Avg. RR auf Basis des REALISIERTEN RR: Win = geplantes reward/risk, Loss = immer exakt -1
    const realizedRRValues = statsTrades
      .map((t) => {
        if (t.result === "be") return 0;
        if (t.realized_rr !== null && t.realized_rr !== undefined) return Number(t.realized_rr);
        if (t.result === "loss") return t.rr !== null && t.rr !== undefined ? -1 : null;
        if (t.result === "win") return t.rr !== null && t.rr !== undefined ? Number(t.rr) : null;
        return null;
      })
      .filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
    const avgRR = realizedRRValues.length
      ? realizedRRValues.reduce((s, r) => s + r, 0) / realizedRRValues.length
      : 0;

    // Expectancy: durchschnittlicher $-Ertrag pro entschiedenem Trade (Win/Loss, ohne BE).
    // Mathematisch identisch zu (Winrate * Ø-Gewinn) - (Verlustrate * Ø-Verlust), aber einfacher
    // zu berechnen: einfach der Netto-PnL aller entschiedenen Trades geteilt durch ihre Anzahl.
    const expectancy = decidedTrades.length
      ? decidedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0) / decidedTrades.length
      : 0;

    let running = STARTING_BALANCE;
    let peak = STARTING_BALANCE;
    let maxDrawdown = 0;
    let maxDrawdownPct = 0;
    const equityCurve = [{ x: 0, y: running }];
    statsTrades.forEach((t, i) => {
      running += Number(t.pnl || 0);
      equityCurve.push({ x: i + 1, y: running });
      if (running > peak) peak = running;
      const dd = peak - running;
      const ddPct = peak > 0 ? (dd / peak) * 100 : 0;
      if (dd > maxDrawdown) {
        maxDrawdown = dd;
        maxDrawdownPct = ddPct;
      }
    });

    // ── EOD-Trading-Tage (für Drawdown, Streaks pro Tag, Payout-Regeln) ──
    // Trades werden zu Kalendertagen aggregiert, dann chronologisch sortiert.
    const dayMap = new Map();
    statsTrades.forEach((t) => {
      const d = t.trade_date;
      if (!dayMap.has(d)) dayMap.set(d, { date: d, pnl: 0, count: 0 });
      const entry = dayMap.get(d);
      entry.pnl += Number(t.pnl || 0);
      entry.count += 1;
    });
    const tradingDays = Array.from(dayMap.values()).sort((a, b) => new Date(a.date) - new Date(b.date));

    // ── EOD Trailing Drawdown mit Equity-Cap ──
    // Die MLL (Minimum Loss Line) folgt dem höchsten je erreichten EOD-Stand,
    // deckelt aber bei DD_PEAK_CAP (52.000) — danach bleibt sie fix bei 50.000,
    // auch wenn die Equity weiter über den Cap steigt. Das bedeutet: der reale
    // Puffer (eodBalance - mll) kann dann größer als DD_BUFFER (2.000) werden.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = STARTING_BALANCE;
    tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const cappedPeak = Math.min(eodPeak, DD_PEAK_CAP);
    const mll = cappedPeak - DD_BUFFER;
    const ddBufferRemaining = balance - mll; // wie viel Puffer noch bis zur MLL übrig ist
    // Für die Balken-Visualisierung: wie nah ist die Equity an der MLL, bezogen auf die
    // größte sinnvolle Spanne (eodPeak - mll). Am Peak = 0% Risiko, an der MLL = 100%.
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    // ── Distanz zum Account-Pass-Ziel (53.000) ──
    const distanceToPass = Math.max(0, ACCOUNT_PASS_TARGET - balance);
    const passProgressPct = Math.max(0, Math.min(100, (balance / ACCOUNT_PASS_TARGET) * 100));
    const accountPassed = balance >= ACCOUNT_PASS_TARGET;

    // Streaks (aktuell & längste)
    let currentStreak = 0;
    let currentStreakType = null;
    let longestWinStreak = 0;
    let longestLossStreak = 0;
    let curWin = 0;
    let curLoss = 0;
    statsTrades.forEach((t) => {
      const pnl = Number(t.pnl || 0);
      if (pnl > 0) {
        curWin += 1;
        curLoss = 0;
        if (curWin > longestWinStreak) longestWinStreak = curWin;
      } else if (pnl < 0) {
        curLoss += 1;
        curWin = 0;
        if (curLoss > longestLossStreak) longestLossStreak = curLoss;
      }
    });
    if (statsTrades.length) {
      const lastPnl = Number(statsTrades[statsTrades.length - 1].pnl || 0);
      currentStreakType = lastPnl > 0 ? "win" : lastPnl < 0 ? "loss" : null;
      for (let i = statsTrades.length - 1; i >= 0; i--) {
        const p = Number(statsTrades[i].pnl || 0);
        if (currentStreakType === "win" && p > 0) currentStreak++;
        else if (currentStreakType === "loss" && p < 0) currentStreak++;
        else break;
      }
    }

    const bestTrade = wins.length ? wins.reduce((a, b) => (Number(a.pnl) > Number(b.pnl) ? a : b)) : null;
    const worstTrade = losses.length ? losses.reduce((a, b) => (Number(a.pnl) < Number(b.pnl) ? a : b)) : null;

    // Breakdown nach Symbol
    const bySymbol = {};
    statsTrades.forEach((t) => {
      const key = t.symbol || "—";
      if (!bySymbol[key]) bySymbol[key] = { pnl: 0, count: 0 };
      bySymbol[key].pnl += Number(t.pnl || 0);
      bySymbol[key].count += 1;
    });

    // Breakdown nach Wochentag
    const byWeekday = WEEKDAY_FULL.map((label) => ({ label, pnl: 0, count: 0 }));
    statsTrades.forEach((t) => {
      const d = new Date(t.trade_date + "T00:00:00");
      const idx = (d.getDay() + 6) % 7;
      byWeekday[idx].pnl += Number(t.pnl || 0);
      byWeekday[idx].count += 1;
    });

    const maxAbsSymbolPnl = Math.max(1, ...Object.values(bySymbol).map((v) => Math.abs(v.pnl)));
    const maxAbsWeekdayPnl = Math.max(1, ...byWeekday.map((v) => Math.abs(v.pnl)));

    return {
      totalPnl, balance, winrate, profitFactor, avgRR, expectancy, equityCurve, count: statsTrades.length,
      decidedTrades, bes,
      evalHistoricTrades,
      maxDrawdown, maxDrawdownPct, currentStreak, currentStreakType,
      longestWinStreak, longestLossStreak, bestTrade, worstTrade,
      bySymbol, byWeekday, maxAbsSymbolPnl, maxAbsWeekdayPnl,
      tradingDays, eodPeak, eodBalance, mll, ddBufferRemaining, ddRiskPct,
      distanceToPass, passProgressPct, accountPassed,
    };
  }, [filteredTrades, fundedStage, fundedActivatedAt]);

  // ── Account-Stats (IMMER auf Basis ALLER Trades, unabhängig von Symbol-/Ergebnis-Filtern) ──
  // Balance, Equity-Kurve, Drawdown/MLL und Pass-Status sind reale Kontokennzahlen.
  // Sie dürfen sich NICHT ändern, nur weil der Nutzer die Filterleiste (Symbol/Ergebnis)
  // zum Browsen des Kalenders/der Insights benutzt — sonst könnte z. B. ein aktiver
  // "Losses"-Filter fälschlich einen bestandenen Drawdown-Breach verstecken.
  const accountStats = useMemo(() => {
    const sorted = [...trades].sort(
      (a, b) => new Date(a.trade_date) - new Date(b.trade_date) || a.id - b.id
    );

    const fundedTrades = fundedStage && fundedActivatedAt
      ? sorted.filter((t) => t.created_at && t.created_at >= fundedActivatedAt)
      : sorted;

    // In der Funded Stage startet die Balance-/Drawdown-Rechnung ab FUNDED_BALANCE_OVERRIDE
    // (bekannter realer Kontostand zum Aktivierungszeitpunkt) statt STARTING_BALANCE, damit
    // vorherige (nicht einzeln erfasste) Funded-Trades die aktuelle Balance nicht verfaelschen.
    const fundedBase = fundedStage ? FUNDED_BALANCE_OVERRIDE : STARTING_BALANCE;

    const totalPnl = fundedTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
    const balance = fundedBase + totalPnl;

    let running = fundedBase;
    let peak = fundedBase;
    let maxDrawdown = 0;
    let maxDrawdownPct = 0;
    const equityCurve = [{ x: 0, y: running }];
    fundedTrades.forEach((t, i) => {
      running += Number(t.pnl || 0);
      equityCurve.push({ x: i + 1, y: running });
      if (running > peak) peak = running;
      const dd = peak - running;
      const ddPct = peak > 0 ? (dd / peak) * 100 : 0;
      if (dd > maxDrawdown) {
        maxDrawdown = dd;
        maxDrawdownPct = ddPct;
      }
    });

    const dayMap = new Map();
    fundedTrades.forEach((t) => {
      const d = t.trade_date;
      if (!dayMap.has(d)) dayMap.set(d, { date: d, pnl: 0, count: 0 });
      const entry = dayMap.get(d);
      entry.pnl += Number(t.pnl || 0);
      entry.count += 1;
    });
    const tradingDays = Array.from(dayMap.values()).sort((a, b) => new Date(a.date) - new Date(b.date));

    // eodPeak startet bewusst bei STARTING_BALANCE (50.000) statt fundedBase: das
    // reale Konto ist tatsaechlich dort gestartet, der Peak fuer die MLL-Regel bleibt
    // also unveraendert, auch wenn die aktuelle Balance ueber FUNDED_BALANCE_OVERRIDE
    // (48.224) weiterlaeuft. eodBalance dagegen startet bei fundedBase, weil das der
    // bekannte reale Kontostand zum Aktivierungszeitpunkt ist.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = fundedBase;
    tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const cappedPeak = Math.min(eodPeak, DD_PEAK_CAP);
    const mll = cappedPeak - DD_BUFFER;
    const ddBufferRemaining = balance - mll;
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    const distanceToPass = Math.max(0, ACCOUNT_PASS_TARGET - balance);
    const passProgressPct = Math.max(0, Math.min(100, (balance / ACCOUNT_PASS_TARGET) * 100));
    const accountPassed = balance >= ACCOUNT_PASS_TARGET;

    return {
      totalPnl, balance, equityCurve, maxDrawdown, maxDrawdownPct,
      tradingDays, eodPeak, eodBalance, mll, ddBufferRemaining, ddRiskPct,
      distanceToPass, passProgressPct, accountPassed,
    };
  }, [trades, fundedStage, fundedActivatedAt]);

  // ── Payout-Phase Stats ──
  // Aktiv sobald "Eval Passed" gesetzt ist. Zählt nur Trading-Tage ab dem
  // Pass-Datum und prüft die Payout-Regeln: 5 Tage à min. 250$, 50%-Consistency,
  // eigener DD-Cap (52.100) und Payout-Schwellen (ab 52.600 / 500$).
  const payoutStats = useMemo(() => {
    if (!evalPassed) return null;

    const relevantDays = evalPassedDate
      ? accountStats.tradingDays.filter((d) => d.date >= evalPassedDate)
      : accountStats.tradingDays;

    // Tage VOR dem aktuellen Funded-Stage-Start (evalPassedDate), die aus der
    // KOMPLETTEN Trade-Historie (nicht nur den seit der Aktivierung gezaehlten
    // fundedTrades) berechnet werden. So zaehlen bereits erzielte Winning-Days von
    // vor dem Neustart automatisch mit — aus echten Trade-Daten, nicht aus einer
    // manuell eingetragenen Zahl.
    const preActivationDayMap = new Map();
    if (evalPassedDate) {
      trades.forEach((t) => {
        if (t.trade_date >= evalPassedDate) return;
        if (!preActivationDayMap.has(t.trade_date)) preActivationDayMap.set(t.trade_date, 0);
        preActivationDayMap.set(t.trade_date, preActivationDayMap.get(t.trade_date) + Number(t.pnl || 0));
      });
    }
    const preActivationQualifyingDays = Array.from(preActivationDayMap.values())
      .filter((pnl) => pnl >= PAYOUT_MIN_DAY_PROFIT).length;

    // 5-Tage-Regel: Tage mit min. 250$ Gewinn, müssen nicht aufeinanderfolgen.
    const qualifyingDays = relevantDays.filter((d) => d.pnl >= PAYOUT_MIN_DAY_PROFIT);
    const effectiveQualifyingCount = qualifyingDays.length + preActivationQualifyingDays;
    const daysHit = Math.min(effectiveQualifyingCount, PAYOUT_MIN_DAYS);
    const daysPassed = effectiveQualifyingCount >= PAYOUT_MIN_DAYS;

    // 50%-Consistency-Regel: kein einzelner Tag darf mehr als 50% des
    // gesamten Nettogewinns seit Eval-Passed ausmachen
    const netProfitSincePass = relevantDays.reduce((s, d) => s + d.pnl, 0);
    const biggestDay = relevantDays.length ? Math.max(...relevantDays.map((d) => d.pnl)) : 0;
    const consistencyPct = netProfitSincePass > 0 ? (biggestDay / netProfitSincePass) * 100 : 0;
    const consistencyPassed = netProfitSincePass <= 0 || consistencyPct <= PAYOUT_CONSISTENCY_PCT;

    // Payout-eigener Drawdown-Cap: identische Logik wie die Eval-MLL, aber
    // der Cap-Peak endet bereits bei 52.100 statt 52.000. eodPeak startet bei
    // STARTING_BALANCE (realer Kontostart), eodBalance bei FUNDED_BALANCE_OVERRIDE
    // (bekannter realer Stand zum Aktivierungszeitpunkt) — siehe accountStats.
    let eodPeak = STARTING_BALANCE;
    let eodBalance = FUNDED_BALANCE_OVERRIDE;
    accountStats.tradingDays.forEach((d) => {
      eodBalance += d.pnl;
      if (eodBalance > eodPeak) eodPeak = eodBalance;
    });
    const cappedPeak = Math.min(eodPeak, PAYOUT_DD_PEAK_CAP);
    const mll = cappedPeak - DD_BUFFER;
    const balance = accountStats.balance;
    const ddBufferRemaining = balance - mll;
    const ddMaxSpan = Math.max(1, eodPeak - mll);
    const ddRiskPct = Math.max(0, Math.min(100, 100 - (ddBufferRemaining / ddMaxSpan) * 100));

    const allRulesPassed = daysPassed && consistencyPassed;

    return {
      relevantDays, qualifyingDays, effectiveQualifyingCount, daysHit, daysPassed,
      netProfitSincePass, biggestDay, consistencyPct, consistencyPassed,
      eodPeak, mll, ddBufferRemaining, ddRiskPct,
      allRulesPassed,
    };
  }, [evalPassed, evalPassedDate, accountStats.tradingDays, accountStats.balance, trades]);

  const calendar = useMemo(() => {
    const { year, month } = cursor;
    const byDay = new Map();
    filteredTrades.forEach((t) => {
      const d = t.trade_date;
      const [ty, tm] = d.split("-").map(Number);
      if (ty === year && tm - 1 === month) {
        if (!byDay.has(d)) byDay.set(d, []);
        byDay.get(d).push(t);
      }
    });

    const nDays = daysInMonth(year, month);
    const firstOffset = mondayIndex(startOfMonth(year, month));
    const cells = [];
    for (let i = 0; i < firstOffset; i++) cells.push(null);
    for (let day = 1; day <= nDays; day++) {
      const iso = isoDate(year, month, day);
      const dayTrades = byDay.get(iso) || [];
      // In funded stage: Eval-Trades (created_at vor Aktivierung) sind "historic"
      const isHistoric = fundedStage && fundedActivatedAt && iso < (fundedStartDate || "9999");
      // Ein Tag gilt als historic wenn ALLE seine Trades historic sind
      const allHistoric = isHistoric && dayTrades.every((t) => !t.created_at || t.created_at < fundedActivatedAt);
      const activeTrades = fundedStage && fundedActivatedAt
        ? dayTrades.filter((t) => t.created_at && t.created_at >= fundedActivatedAt)
        : dayTrades;
      const hasHistoricTrades = fundedStage && fundedActivatedAt
        ? dayTrades.some((t) => !t.created_at || t.created_at < fundedActivatedAt)
        : false;
      const pnl = activeTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
      const rawPnl = dayTrades.reduce((s, t) => s + Number(t.pnl || 0), 0);
      cells.push({ day, iso, trades: dayTrades, pnl, rawPnl, isHistoric: allHistoric && activeTrades.length === 0, hasHistoricTrades });
    }
    while (cells.length % 7 !== 0) cells.push(null);

    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) {
      const weekCells = cells.slice(i, i + 7);
      const realDates = weekCells.filter(Boolean);
      const weekPnl = realDates.reduce((s, c) => s + c.pnl, 0);
      const weekTradeCount = realDates.reduce((s, c) => s + c.trades.length, 0);
      const weekNum = realDates.length
        ? isoWeek(new Date(year, month, realDates[0].day))
        : null;
      weeks.push({ cells: weekCells, weekPnl, weekTradeCount, weekNum });
    }

    const monthTotal = Array.from(byDay.values())
      .flat()
      .filter((t) => !fundedStage || !fundedActivatedAt || (t.created_at && t.created_at >= fundedActivatedAt))
      .reduce((s, t) => s + Number(t.pnl || 0), 0);
    const monthTradeCount = Array.from(byDay.values()).flat().length;

    return { weeks, monthTotal, monthTradeCount };
  }, [filteredTrades, cursor, fundedStage, fundedActivatedAt, fundedStartDate]);

  // Postet einen Trade zu Supabase; fällt automatisch auf ein Payload ohne
  // "realized_rr" zurück, falls diese Spalte in der Tabelle noch nicht existiert
  // (z. B. bei einer Datenbank, die vor diesem Feature angelegt wurde).
  const postTradeWithFallback = async (trade) => {
    let payload = trade;
    let res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
    if (!res.ok) {
      let body = await res.text();
      if (/realized_rr/i.test(body) && payload.realized_rr !== undefined) {
        const { realized_rr, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok && /setup/i.test(body) && payload.setup !== undefined) {
        const { setup, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok && /confluences/i.test(body) && payload.confluences !== undefined) {
        const { confluences, ...rest } = payload;
        payload = rest;
        res = await fetch(REST_URL, { method: "POST", headers: sbHeaders, body: JSON.stringify(payload) });
        if (!res.ok) body = await res.text();
      }
      if (!res.ok) throw new Error(`Speichern fehlgeschlagen (${res.status}): ${body}`);
    }
    return res;
  };

  const handleAddTrade = useCallback(
    async (trade) => {
      setSaving(true);
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => [
            ...prev,
            { ...trade, id: Math.max(0, ...prev.map((t) => t.id || 0)) + 1, created_at: new Date().toISOString() },
          ]);
          setPanelOpen(false);
          pushToast("Trade gespeichert (Demo-Modus)");
          return;
        }
        const res = await postTradeWithFallback(trade);
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`Speichern fehlgeschlagen (${res.status}): ${body}`);
        }
        const inserted = await res.json();
        setTrades((prev) => [...prev, ...inserted]);
        setPanelOpen(false);
        pushToast("Trade gespeichert");
      } catch (e) {
        setError(e.message || "Trade konnte nicht gespeichert werden");
        pushToast(e.message || "Trade konnte nicht gespeichert werden", "error");
      } finally {
        setSaving(false);
      }
    },
    [pushToast]
  );

  const handleUpdateTrade = useCallback(
    async (id, patch) => {
      setSaving(true);
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => prev.map((t) => (t.id === id ? { ...t, ...patch } : t)));
          setEditingTrade(null);
          pushToast("Trade aktualisiert (Demo-Modus)");
          return;
        }
        let patchPayload = patch;
        let res = await fetch(`${REST_URL}?id=eq.${id}`, {
          method: "PATCH",
          headers: sbHeaders,
          body: JSON.stringify(patchPayload),
        });
        if (!res.ok) {
          let body = await res.text();
          if (/realized_rr/i.test(body) && patchPayload.realized_rr !== undefined) {
            const { realized_rr, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok && /setup/i.test(body) && patchPayload.setup !== undefined) {
            const { setup, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok && /confluences/i.test(body) && patchPayload.confluences !== undefined) {
            const { confluences, ...rest } = patchPayload;
            patchPayload = rest;
            res = await fetch(`${REST_URL}?id=eq.${id}`, {
              method: "PATCH",
              headers: sbHeaders,
              body: JSON.stringify(patchPayload),
            });
            if (!res.ok) body = await res.text();
          }
          if (!res.ok) throw new Error(`Aktualisieren fehlgeschlagen (${res.status}): ${body}`);
        }
        const updated = await res.json();
        setTrades((prev) => prev.map((t) => (t.id === id ? { ...t, ...updated[0] } : t)));
        setEditingTrade(null);
        pushToast("Trade aktualisiert");
      } catch (e) {
        setError(e.message || "Trade konnte nicht aktualisiert werden");
        pushToast(e.message || "Trade konnte nicht aktualisiert werden", "error");
      } finally {
        setSaving(false);
      }
    },
    [pushToast]
  );

  const handleDeleteTrade = useCallback(
    async (tradeId) => {
      setError(null);
      try {
        if (!isConfigured) {
          setTrades((prev) => prev.filter((t) => t.id !== tradeId));
          pushToast("Trade gelöscht (Demo-Modus)");
          return;
        }
        const res = await fetch(`${REST_URL}?id=eq.${tradeId}`, {
          method: "DELETE",
          headers: sbHeaders,
        });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`Löschen fehlgeschlagen (${res.status}): ${body}`);
        }
        setTrades((prev) => prev.filter((t) => t.id !== tradeId));
        pushToast("Trade gelöscht");
      } catch (e) {
        setError(e.message || "Trade konnte nicht gelöscht werden");
        pushToast(e.message || "Trade konnte nicht gelöscht werden", "error");
      }
    },
    [pushToast]
  );

  const today = new Date();
  const isCurrentMonthNow = cursor.year === today.getFullYear() && cursor.month === today.getMonth();

  useEffect(() => {
    if (dayDetailData && dayDetailData.trades.length === 0) {
      setDayDetail(null);
    }
  }, [dayDetailData]);

  // ── Tastatur-Shortcuts: N = neuer Trade, Esc = Modal schließen ──
  useEffect(() => {
    const handler = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      const typing = tag === "input" || tag === "textarea" || e.target.isContentEditable;

      if (e.key === "Escape") {
        if (panelOpen) setPanelOpen(false);
        else if (editingTrade) setEditingTrade(null);
        else if (dayDetail) setDayDetail(null);
        return;
      }
      if (typing) return;
      if ((e.key === "n" || e.key === "N") && !panelOpen && !editingTrade && !dayDetail) {
        e.preventDefault();
        setPanelOpen(true);
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [panelOpen, editingTrade, dayDetail]);

  return (
    <div className="journal-shell">
      <header className="topbar">
        <div className="brand">
            <img src="sharingan.png" alt="Logo" style={{ width: "220px", height: "100px", borderRadius: "10px" }} />
        </div>
        <div className="topbar-actions">
          {!fundedStage && accountStats.accountPassed && (
            <button
              className="btn-secondary active"
              onClick={() => {
                if (window.confirm("Eval bestanden — Funded Stage starten? Der Account wird auf $50.000 zurueckgesetzt. Deine bisherigen Trades bleiben im Kalender sichtbar.")) {
                  activateFundedStage();
                }
              }}
              title="Account auf 50k zuruecksetzen und Funded Stage beginnen"
            >
              Eval Passed ✓
            </button>
          )}
          <button className="btn-secondary" onClick={() => setForwardTestOpen(true)}>
            Forward Test
          </button>
          <button className="btn-primary" onClick={() => setPanelOpen(true)}>
            <Icon.Plus /> Trade hinzufuegen <span className="kbd-hint">N</span>
          </button>
        </div>
      </header>

      {!isConfigured && (
        <div className="notice">
          Supabase ist noch nicht verbunden — trage SUPABASE_URL und SUPABASE_ANON_KEY oben im Script-Tag ein. Bis dahin läuft das Dashboard im lokalen Demo-Modus (Daten gehen beim Neuladen verloren).
        </div>
      )}
      {error && <div className="notice notice-error">{error}</div>}

      <section className="hero">
        <div className="hero-balance">
          <span className="hero-label">Account Balance</span>
          <span className="hero-value">{fmtMoney(accountStats.balance)}</span>
          <span className={`hero-delta ${accountStats.totalPnl >= 0 ? "pos" : "neg"}`}>
            {accountStats.totalPnl >= 0 ? <Icon.Up /> : <Icon.Down />}
            {fmtMoneyShort(accountStats.totalPnl)} gesamt
          </span>
        </div>
        <div className="hero-curve">
          <EquityCurve data={accountStats.equityCurve} />
        </div>
      </section>

      {fundedStage && (
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: "4px" }}>
          <button
            className="payout-banner-clear"
            style={{ fontSize: "11px", padding: "3px 8px" }}
            onClick={resetToEvalStage}
          >
            Zurueck zur Eval Stage
          </button>
        </div>
      )}

      {!fundedStage && fundedStartDate && (
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: "4px" }}>
          <button
            className="payout-banner-clear"
            style={{ fontSize: "11px", padding: "3px 8px" }}
            onClick={reactivateFundedStage}
            title={`Funded Stage war aktiv seit ${fundedStartDate} — ohne neuen Trade wiederherstellen`}
          >
            Zurueck zur Funded Stage
          </button>
        </div>
      )}

      {!fundedStage && !fundedStartDate && (
        <FundedStageRecovery onRestore={restoreFundedStage} />
      )}

      {!evalPassed ? (
        <div className="risk-row">
          <div className="risk-card">
            <div className="risk-head">
              <span className="risk-label">Drawdown (EOD, Trailing)</span>
              <span className={`risk-value ${accountStats.ddBufferRemaining < DD_BUFFER ? "warn" : "pos"}`}>
                {fmtMoneyShort(-Math.max(0, accountStats.eodPeak - accountStats.balance))}
              </span>
            </div>
            <div className="risk-track">
              <div className="risk-fill dd" style={{ width: `${accountStats.ddRiskPct}%` }} />
            </div>
            <div className="risk-meta">
              <span>MLL: {fmtMoney(accountStats.mll)} (fix ab 52k Peak)</span>
              <span>Puffer zur MLL: {fmtMoneyShort(accountStats.ddBufferRemaining)}</span>
            </div>
          </div>
          <div className="risk-card" style={{ gridColumn: "1 / -1" }}>
            <div className="risk-head">
              <span className="risk-label">Fortschritt zur Funded Stage</span>
              <span className={`risk-value ${accountStats.accountPassed ? "pos" : ""}`}>
                {accountStats.accountPassed ? "Passed ✓" : fmtMoneyShort(-(ACCOUNT_PASS_TARGET - accountStats.balance))}
              </span>
            </div>
            {(() => {
              // Skala: von MLL (links) bis 53k (rechts)
              // MLL ist dynamisch (trailing), gecappt bei 50k wenn Peak >= 52k
              const scaleLeft = accountStats.mll;   // z.B. 49500 am Anfang, dann steigend, max 50000
              const scaleRight = ACCOUNT_PASS_TARGET; // 53000
              const scaleRange = scaleRight - scaleLeft;
              // Wie weit hat die Balance den Range gefuellt?
              const fillPct = Math.max(0, Math.min(100, ((accountStats.balance - scaleLeft) / scaleRange) * 100));
              // Wo liegt 50k auf der Skala?
              const startMarkerPct = Math.max(0, Math.min(100, ((STARTING_BALANCE - scaleLeft) / scaleRange) * 100));
              const passed = accountStats.accountPassed;
              // Farbe: rot wenn unter 50k, weiss wenn normal, gruen wenn passed
              const fillColor = accountStats.balance < STARTING_BALANCE ? "var(--red)" : passed ? "#2ecc71" : "var(--text)";
              return (
                <div style={{ position: "relative", marginTop: "6px" }}>
                  {/* Track */}
                  <div style={{ position: "relative", height: "10px", background: "var(--panel-2)", border: "1px solid var(--line)", borderRadius: "5px", overflow: "visible" }}>
                    {/* Rote DD-Zone links von 50k */}
                    <div style={{
                      position: "absolute", left: 0, top: 0, bottom: 0,
                      width: `${startMarkerPct}%`,
                      background: "rgba(224,0,26,0.15)",
                      borderRight: "1px solid rgba(224,0,26,0.4)",
                      borderRadius: "5px 0 0 5px",
                    }} />
                    {/* Fuellstand */}
                    <div style={{
                      position: "absolute", left: 0, top: 0, bottom: 0,
                      width: `${fillPct}%`,
                      background: fillColor,
                      borderRadius: "5px",
                      transition: "width .3s ease",
                      opacity: 0.9,
                    }} />
                    {/* 50k Marker-Linie */}
                    <div style={{
                      position: "absolute", left: `${startMarkerPct}%`, top: "-3px", bottom: "-3px",
                      width: "2px", background: "rgba(255,255,255,0.4)", borderRadius: "1px",
                    }} />
                  </div>
                  {/* Labels */}
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: "7px", fontSize: "11px" }}>
                    <span style={{ color: "rgba(224,0,26,0.8)" }}>{fmtMoney(scaleLeft)}</span>
                    <span style={{ color: "var(--muted-light)" }}>{fmtMoney(STARTING_BALANCE)}</span>
                    <span style={{ color: passed ? "#2ecc71" : "var(--muted-light)" }}>{fmtMoney(ACCOUNT_PASS_TARGET)} ✓</span>
                  </div>
                </div>
              );
            })()}
            <div className="risk-meta" style={{ marginTop: "2px" }}>
              <span>MLL: {fmtMoney(accountStats.mll)} · Balance: {fmtMoney(accountStats.balance)}</span>
              <span>{accountStats.accountPassed ? "Ziel erreicht" : `Noch ${fmtMoneyShort(-(ACCOUNT_PASS_TARGET - accountStats.balance))} bis 53k`}</span>
            </div>
          </div>
        </div>
      ) : (
        <div className="payout-grid">
          <div className="payout-card">
            <div className="payout-card-title">
              <span className={`payout-status-dot ${payoutStats.daysPassed ? "ok" : ""}`} />
              5 Trading-Tage à 250$+
            </div>
            <span className="payout-main">{payoutStats.daysHit} / {PAYOUT_MIN_DAYS}</span>
            <div className="payout-days">
              {Array.from({ length: PAYOUT_MIN_DAYS }).map((_, i) => (
                <span key={i} className={`payout-day-pip ${i < payoutStats.daysHit ? "hit" : ""}`}>
                  {i < payoutStats.daysHit ? "✓" : ""}
                </span>
              ))}
            </div>
            <span className="payout-sub">Müssen nicht aufeinanderfolgen — {payoutStats.effectiveQualifyingCount} Tag{payoutStats.effectiveQualifyingCount === 1 ? "" : "e"} bisher qualifiziert.</span>
          </div>

          <div className="payout-card">
            <div className="payout-card-title">
              <span className={`payout-status-dot ${payoutStats.consistencyPassed ? "ok" : "fail"}`} />
              50% Consistency Rule
            </div>
            <span className="payout-main">{payoutStats.consistencyPct.toFixed(1)}%</span>
            <span className="payout-sub">
              {payoutStats.consistencyPassed
                ? "Bester Tag bleibt unter 50% des Gesamtgewinns."
                : "Achtung: ein Tag dominiert über 50% des Gesamtgewinns seit Pass."}
              {" "}Größter Tag: {fmtMoneyShort(payoutStats.biggestDay)}
            </span>
          </div>

          <div className="payout-card">
            <div className="payout-card-title">
              <span className="payout-status-dot ok" />
              Drawdown (Payout-Cap 52.100)
            </div>
            <span className="payout-main">{fmtMoneyShort(-Math.max(0, payoutStats.eodPeak - accountStats.balance))}</span>
            <div className="risk-track">
              <div className="risk-fill dd" style={{ width: `${payoutStats.ddRiskPct}%` }} />
            </div>
            <span className="payout-sub">MLL: {fmtMoney(payoutStats.mll)} · Puffer: {fmtMoneyShort(payoutStats.ddBufferRemaining)}</span>
          </div>
        </div>
      )}

      <section className="stat-row">
        <StatCard label="Profit Factor" value={Number.isFinite(stats.profitFactor) ? stats.profitFactor.toFixed(2) : "∞"} />
        <StatCard label={`Winrate (excl. BE)`} value={`${stats.winrate.toFixed(1)}%`} />
        <StatCard label="Avg. RR" value={stats.avgRR ? stats.avgRR.toFixed(2) : "—"} />
        <StatCard label="Expectancy / Trade" value={stats.decidedTrades.length ? fmtMoneyShort(stats.expectancy) : "—"} />
        <StatCard label="Trades gesamt" value={stats.count} />
      </section>

      <div className="filter-bar">
        <div className="filter-group">
          <button
            className={`filter-chip ${filterSymbol === "all" ? "active" : ""}`}
            onClick={() => setFilterSymbol("all")}
          >
            Alle Symbole
          </button>
          {Object.keys(SYMBOLS).map((key) => (
            <button
              key={key}
              className={`filter-chip ${filterSymbol === key ? "active" : ""}`}
              onClick={() => setFilterSymbol(key)}
            >
              {key}
            </button>
          ))}
        </div>
        <div className="filter-group">
          <button
            className={`filter-chip ${filterResult === "all" ? "active" : ""}`}
            onClick={() => setFilterResult("all")}
          >
            Alle
          </button>
          <button
            className={`filter-chip win-chip ${filterResult === "win" ? "active" : ""}`}
            onClick={() => setFilterResult("win")}
          >
            Wins
          </button>
          <button
            className={`filter-chip be-chip ${filterResult === "be" ? "active" : ""}`}
            onClick={() => setFilterResult("be")}

                setCursor((c) => {

                  const y = c.month === 0 ? c.year - 1 : c.year;
                  return { year: y, month: m };

              aria-label="Vorheriger Monat"
            >
              <Icon.ChevL />
            </button>
            <button
              className="cal-navbtn"
              onClick={() =>
                setCursor((c) => {
                  const m = c.month === 11 ? 0 : c.month + 1;
                  const y = c.month === 11 ? c.year + 1 : c.year;
                  return { year: y, month: m };
                })
              }
              aria-label="Nächster Monat"
            >
              <Icon.ChevR />
            </button>
          </div>
        </div>

        <div className="cal-grid-header">
          {WEEKDAYS.map((d) => (
            <div key={d} className="cal-dow">{d}</div>
          ))}
          <div className="cal-dow cal-dow-week">Woche</div>
        </div>

        {loading ? (
          <div className="cal-loading">Lade Trades…</div>
        ) : (
          calendar.weeks.map((week, wi) => (
            <div className="cal-week" key={wi}>
              {week.cells.map((cell, ci) => {
                if (!cell) return <div className="cal-cell cal-cell-empty" key={ci} />;
                const isToday = isCurrentMonthNow && cell.day === today.getDate();
                const hasTrades = cell.trades.length > 0;
                const displayPnl = cell.isHistoric ? cell.rawPnl : cell.pnl;
                return (
                  <button
                    key={ci}
                    className={`cal-cell ${hasTrades ? (displayPnl >= 0 ? "cal-win" : "cal-loss") : ""} ${isToday ? "cal-today" : ""} ${cell.isHistoric ? "cal-cell-historic" : ""}`}
                    onClick={() => hasTrades && setDayDetail(cell.iso)}
                    disabled={!hasTrades}
                  >
                    <span className="cal-daynum">{cell.day}</span>
                    {hasTrades && (
                      <React.Fragment>
                        <span className="cal-pnl">{fmtMoneyShort(displayPnl)}</span>
                        <span className="cal-count">{cell.trades.length} Trade{cell.trades.length > 1 ? "s" : ""}</span>
                        {cell.isHistoric && <span className="cal-historic-badge">Eval</span>}
                      </React.Fragment>
                    )}
                  </button>

              })}
              <div className="cal-cell cal-weeksum">
                <span className="cal-weeknum">KW {week.weekNum ?? "—"}</span>
                <span className={`cal-weekpnl ${week.weekPnl >= 0 ? "pos" : "neg"}`}>
                  {week.weekTradeCount ? fmtMoneyShort(week.weekPnl) : "—"}
                </span>
                {week.weekTradeCount > 0 && (
                  <span className="cal-weekcount">{week.weekTradeCount} Trade{week.weekTradeCount > 1 ? "s" : ""}</span>
                )}
              </div>
            </div>
          ))
        )}
      </section>

      {panelOpen && (
        <AddTradePanel
          onClose={() => setPanelOpen(false)}
          onSubmit={handleAddTrade}
          saving={saving}
          existingSetups={existingSetups}
          existingConfluences={confluenceOptions}
        />
      )}

      {editingTrade && (
        <AddTradePanel
          onClose={() => setEditingTrade(null)}
          onSubmit={(patch) => handleUpdateTrade(editingTrade.id, patch)}
          saving={saving}
          initialTrade={editingTrade}
          isEdit
          existingSetups={existingSetups}
          existingConfluences={confluenceOptions}
        />
      )}

      {forwardTestOpen && (
        <ForwardTestPanel
          onClose={() => setForwardTestOpen(false)}
          trades={trades}
          existingConfluences={confluenceOptions}
          realizedRRForTrade={realizedRRForTrade}
          realizedPointsForTrade={realizedPointsForTrade}
        />
      )}

      {dayDetailData && dayDetailData.trades.length > 0 && (
        <DayDetailModal
          day={dayDetailData}
          onClose={() => setDayDetail(null)}
          onDelete={handleDeleteTrade}
          onEdit={(trade) => { setDayDetail(null); setEditingTrade(trade); }}
        />
      )}

      <div className="toast-stack">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type === "error" ? "toast-error" : ""}`}>{t.message}</div>
        ))}
      </div>
    </div>
  );
}
